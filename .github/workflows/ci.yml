name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows 上路径与编码最容易出问题，单独跑一遍
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装（含开发依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 命令行入口可用
        run: pdfquiz --version

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 端到端冒烟（离线跑一遍 CLI）
        run: python tests/smoke_cli.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
