<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="tcMeta" content="#f3f1ec">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="先进材料研究进展C · 术语与概念">
<title>先进材料研究进展C · 术语与概念 · 复习题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b5a'/%3E%3Cpath d='M11 22V10h5a4 4 0 0 1 0 8h-5m5 0 4 4' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --sans: system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif: "Iowan Old Style","Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  --mono: ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;

  --paper:#f3f1ec;
  --surface:#fffefc;
  --surface2:#f7f4ee;
  --ink:#1b201e;
  --ink2:#49524f;
  --muted:#8a938f;
  --line:#e6e1d6;
  --line2:#d3ccbd;
  --accent:#1f6b5a;
  --accent-ink:#175246;
  --accent-soft:#e7f1ed;
  --ok:#187a55;
  --ok-soft:#e6f4ee;
  --bad:#b23a30;
  --bad-soft:#fbeae7;
  --shadow-sm:0 1px 2px rgba(27,32,30,.05);
  --shadow:0 1px 2px rgba(27,32,30,.04),0 14px 32px -20px rgba(27,32,30,.35);
  --r:16px;
  /* 可调字号：题干与选项、输入框跟随，正文其它元素保持不变 */
  --stem:18.5px;
  --body:15px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-fs="sm"]{--stem:16.5px;--body:13.8px}
html[data-fs="md"]{--stem:18.5px;--body:15px}
html[data-fs="lg"]{--stem:21px;--body:17px}
[data-theme="dark"]{
  --paper:#0f1214;
  --surface:#171b1e;
  --surface2:#1d2226;
  --ink:#e9edeb;
  --ink2:#b8c1be;
  --muted:#7d8885;
  --line:#272f33;
  --line2:#374247;
  --accent:#5ec0a5;
  --accent-ink:#8ad8c2;
  --accent-soft:#13302a;
  --ok:#57c496;
  --ok-soft:#122f29;
  --bad:#f08a7e;
  --bad-soft:#321a1a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
/* 横滑翻页不能被浏览器当成「后退」手势吃掉 */
html{overscroll-behavior-x:none}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb, var(--accent) 22%, transparent)}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh;min-height:100dvh}

/* ---------------------------------------------------------------- side */
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  padding:26px 18px 20px;
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:22px;
  backdrop-filter:blur(8px);
}
.brand{display:flex;gap:12px;align-items:flex-start;padding:0 4px}
.mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 2px 8px -2px color-mix(in srgb, var(--accent) 55%, transparent);
}
.brand-t h1{
  margin:0;font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.45;
  letter-spacing:.01em;
}
.brand-t p{margin:3px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.02em}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-sm);
}
.ring{position:relative;width:72px;height:72px;flex:0 0 72px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--line2);opacity:.55}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring-t{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1;
}
.ring-t b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ring-t span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.ring-meta{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2)}
.ring-meta div{display:flex;align-items:center;gap:6px}
.ring-meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.mut{background:var(--line2)}

.filters{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.seg{
  display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;
}
.seg button{
  flex:1;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--ink2);
  transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{
  background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);
}
.seg.small button{padding:4px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px}
.chips button{
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink2);
  background:var(--surface);transition:all .16s;
}
.chips button:hover{border-color:var(--line2);color:var(--ink)}
.chips button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;
}

.chapters{display:flex;flex-direction:column;gap:12px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.grp-t{
  font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  padding:0 8px 6px;text-transform:none;
}
.nav-item{
  width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:12.5px;color:var(--ink2);text-align:left;transition:background .15s,color .15s;
  border-left:2px solid transparent;
}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item[aria-current="true"]{
  background:var(--accent-soft);color:var(--accent-ink);font-weight:600;border-left-color:var(--accent);
}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item[aria-current="true"] .cnt{color:var(--accent-ink);opacity:.75}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.side-foot button,.side-foot .hub-link{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:12.5px;color:var(--ink2);text-align:left;transition:background .15s,color .15s;
}
.side-foot button:hover,.side-foot .hub-link:hover{background:var(--surface2);color:var(--ink)}
.side-foot svg{width:14px;height:14px;opacity:.7}
.side-foot .hub-link{margin-bottom:2px;color:var(--accent);font-weight:600}
.side-foot .hub-link:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}

/* ---------------------------------------------------------------- main */
.main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative}
.progress{position:sticky;top:0;height:2px;background:transparent;z-index:30}
.progress i{
  display:block;height:100%;width:0;background:var(--accent);
  transition:width .4s cubic-bezier(.2,.8,.2,1);
}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;min-width:0;white-space:nowrap}
.crumb span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:180px}
.crumb span:last-child{color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .sep{opacity:.45}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.timer{
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line);
}
.icon-btn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 15px;border-radius:9px;font-size:13px;font-weight:500;
  transition:all .16s;white-space:nowrap;
}
.btn.ghost{border:1px solid var(--line2);color:var(--ink2);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink2);color:var(--ink)}
.btn.primary{
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  box-shadow:0 1px 2px color-mix(in srgb, var(--accent) 40%, transparent);
}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--accent);border-color:var(--accent)}
.only-mobile{display:none}

/* ---------------------------------------------------------------- stage */
.stage{
  flex:1;width:100%;max-width:860px;margin:0 auto;
  padding:38px 26px 28px;
}
.q{display:none;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
.q.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.num{
  font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;line-height:1;margin-right:2px;font-variant-numeric:tabular-nums;
}
.tag{
  font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.02em;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
}
.tag.t{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:500}
.tag.lv-easy{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%, transparent)}
.tag.lv-hard{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%, transparent)}
.mark-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--muted);padding:4px 8px;border-radius:7px;
  transition:all .15s;
}
.mark-btn:hover{background:var(--surface2);color:var(--ink2)}
.mark-btn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.mark-btn svg{width:13px;height:13px}

.stem{
  font-size:var(--stem);line-height:1.85;font-weight:500;letter-spacing:.005em;color:var(--ink);
  margin:0 0 26px;max-width:64ch;overflow-wrap:break-word;
}
.stem code,.ans code{
  font-family:var(--mono);font-size:.88em;background:var(--surface2);
  padding:1px 5px;border-radius:5px;border:1px solid var(--line);
}
.blank{display:inline-block;width:3.4em;border-bottom:1.5px solid var(--line2);vertical-align:-.12em;margin:0 .18em}
/* 上下标：题干、选项、解析里都可能出现化学式与指数 */
.stem sup,.opt .txt sup,.ans-row .v sup,.key-row sup,.sheet sup,.wrong-item .qt sup{font-size:.72em;line-height:0;vertical-align:super}
.stem sub,.opt .txt sub,.ans-row .v sub,.key-row sub,.sheet sub,.wrong-item .qt sub{font-size:.72em;line-height:0;vertical-align:sub}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);
  font-size:var(--body);line-height:1.65;
  transition:border-color .16s,background .16s,transform .16s,box-shadow .16s;
  box-shadow:var(--shadow-sm);
}
.opt:hover:not(.locked){border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.opt:active:not(.locked){transform:translateY(0) scale(.995);border-color:var(--accent)}
.opt .ltr{
  flex:0 0 24px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
  transition:all .16s;margin-top:1px;
}
.opt .txt{flex:1;min-width:0}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.opt .flag{font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap;align-self:center}
.opt.is-ok .flag{color:var(--ok);font-weight:600}
.opt.is-bad .flag{color:var(--bad);font-weight:600}

/* text inputs */
.field{
  width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:var(--body);line-height:1.7;
  transition:border-color .16s,box-shadow .16s;resize:vertical;
}
/* 多行作答区按 rows 给初始高度；单行填空框保持一行高，别撑成大方块 */
textarea.field{min-height:calc(var(--rows,3) * 1.7em + 28px)}
.field::placeholder{color:var(--muted)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field[readonly]{background:var(--surface2);color:var(--ink2)}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0;display:flex;gap:6px;align-items:center}

/* actions under question */
.q-actions{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.q-actions .spacer{flex:1}
.self-grade{display:flex;gap:8px}
.self-grade button{
  padding:7px 14px;border-radius:9px;font-size:13px;border:1px solid var(--line2);
  color:var(--ink2);transition:all .16s;
}
.self-grade button:hover{border-color:var(--ink2);color:var(--ink)}
.self-grade button[data-self="yes"]:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.self-grade button[data-self="no"]:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

/* verdict + answer */
.verdict{
  display:none;align-items:center;gap:9px;margin-top:22px;
  font-size:14px;font-weight:600;
}
.q.graded .verdict{display:flex}
.verdict .ico{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;color:#fff;flex:0 0 20px;
}
.verdict.ok{color:var(--ok)}
.verdict.ok .ico{background:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict.bad .ico{background:var(--bad)}
.verdict.info{color:var(--ink2)}
.verdict.info .ico{background:var(--ink2)}
.verdict .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.verdict .redo{
  margin-left:auto;flex:0 0 auto;padding:4px 10px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
}
.verdict .redo:hover{border-color:var(--line2);color:var(--ink)}

.ans{display:none;margin-top:14px;padding:18px 20px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.q.graded .ans{display:block}
.ans-row{display:flex;gap:10px;font-size:13.5px;line-height:1.8;margin-bottom:8px}
.ans-row:last-child{margin-bottom:0}
.ans-row .k{
  flex:0 0 auto;min-width:46px;white-space:nowrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.06em;padding-top:2px;
}
.ans-row .v{flex:1;color:var(--ink);min-width:0}
.ans-row .v b{color:var(--accent-ink);font-weight:600}

/* 翻译题：输入框下的操作提示 */
.typeline{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.7}

/* 采分点：英文术语与中文释义分开排版，别挤成一串 */
.keys{margin:12px 0 10px;padding:11px 13px;border-radius:9px;background:var(--surface2)}
.keys-h{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
.key-row{display:flex;gap:8px;align-items:baseline;line-height:2}
.key-row .ke{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);font-weight:600}
.key-row .kc{font-size:12.5px;color:var(--ink2)}
.key-row .kc::before{content:"·";margin-right:8px;color:var(--muted)}
/* 出处 */
.src{margin-top:10px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
blockquote.ev{
  margin:10px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--accent);
  font-size:12.5px;line-height:1.85;color:var(--ink2);
}
blockquote.ev::before{
  content:"原文依据";display:block;font-size:10px;letter-spacing:.12em;
  color:var(--muted);margin-bottom:2px;
}
.alt{display:block;margin-top:3px;color:var(--ink2);font-size:13px}
.alt i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

/* navbar */
.navbar{
  position:sticky;bottom:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 26px 30px;
  background:linear-gradient(to top, var(--paper) 62%, transparent);
}
.kbd-hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);white-space:nowrap;display:flex;gap:12px;align-items:center;
}
.kbd-hint kbd{
  font-family:var(--mono);font-size:10px;padding:0 4px;border:1px solid var(--line);
  border-radius:4px;background:var(--surface);color:var(--ink2);
}
@media (max-width:1100px){.kbd-hint{display:none}}
.pos{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.pos b{color:var(--ink);font-weight:600}

/* ---------------------------------------------------------------- result */
.result{display:none;flex:1;max-width:860px;width:100%;margin:0 auto;padding:44px 26px 60px}
.result.show{display:block;animation:rise .3s ease}
.res-head{display:flex;gap:34px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.big-ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.big-ring svg{transform:rotate(-90deg);display:block}
.big-ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big-ring .t b{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.big-ring .t span{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.res-title h2{margin:0 0 6px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.01em}
.res-title p{margin:0;color:var(--ink2);font-size:13.5px}
.res-title p.res-meta{margin-top:3px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.res-title p b.sc{font-family:var(--mono);font-size:19px;color:var(--accent-ink);font-weight:600;margin:0 1px}
.res-stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.res-stats div{font-size:12.5px;color:var(--muted)}
.res-stats b{display:block;font-size:21px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:1px}
.res-sec{margin-top:30px}
.res-sec h3{
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 12px;font-weight:600;
}
.bars{display:flex;flex-direction:column;gap:13px;max-width:640px}
/* 单元名长短悬殊（最长 60 字符），单行三段式必然截断，改成上下两行 */
.bar-row{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.bar-row .top{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.bar-row .lbl{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .frac{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 轨道用可见的浅色：surface2 与纸底几乎同色，0% 的行看上去会像没有轨道 */
.bar-row .track{display:block;width:100%;height:6px;border-radius:99px;background:color-mix(in srgb,var(--line2) 62%,transparent);overflow:hidden}
.bar-row .fill{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.wrong-list{display:flex;flex-direction:column;gap:8px}
.wrong-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;
  transition:border-color .16s,transform .16s;
}
.wrong-item:hover{border-color:var(--line2);transform:translateX(2px)}
.wrong-item .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:0 0 26px;padding-top:2px}
.wrong-item .qt{font-size:13.5px;line-height:1.6;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wrong-item .qt .tk{font-style:normal;font-size:10.5px;letter-spacing:.04em;color:var(--accent-ink);
  background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px}
.res-actions{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600}

.scrim{display:none}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:100;
  background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px 16px;border-radius:99px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------------------------------------------------------- 题号跳转 */
.pos-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:1px;
  min-width:66px;padding:7px 10px;border-radius:9px;border:1px solid transparent;
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,color .15s;
}
.pos-btn:hover{background:var(--surface2);border-color:var(--line);color:var(--ink2)}
.pos-btn b{color:var(--ink);font-weight:600;font-size:13px}
.pos-btn svg{width:13px;height:13px;flex:0 0 13px;opacity:.5;margin-right:5px}
.pos-btn:hover svg{opacity:.75}

.sheet-scrim{
  display:none;position:fixed;inset:0;z-index:70;
  background:rgba(12,14,13,.38);backdrop-filter:blur(2px);
}
.sheet-scrim.show{display:block;animation:fade .18s ease}
.sheet{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:75;
  max-height:76vh;max-height:76dvh;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  box-shadow:0 -14px 44px -14px rgba(0,0,0,.45);
  padding-bottom:var(--safe-b);
}
.sheet.show{display:flex;animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{
  display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line);
}
.sheet-h b{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.sheet-h .legend{margin-left:auto;display:flex;gap:11px;font-size:10.5px;color:var(--muted)}
.sheet-h .legend span{display:inline-flex;align-items:center;gap:4px}
.sheet-h .legend i{width:8px;height:8px;border-radius:2.5px;background:var(--line2)}
.sheet-h .legend i.ok{background:var(--ok)}
.sheet-h .legend i.bad{background:var(--bad)}
.sheet-tools{padding:11px 16px 0;display:flex;align-items:center}
.sheet-tools .seg{max-width:210px;width:100%}
.sheet-body{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(20px + var(--safe-b));
}
.qgrid-grp{margin-bottom:15px}
.qgrid-grp:last-child{margin-bottom:0}
.qgrid-t{
  font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px 2px;
  display:flex;align-items:center;gap:8px;line-height:1.5;
}
.qgrid-t i{flex:1 1 12px;height:1px;background:var(--line);font-style:normal}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.qcell{
  position:relative;height:44px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  display:grid;place-items:center;transition:transform .12s,border-color .12s;
}
.qcell:active{transform:scale(.94)}
.qcell.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok);font-weight:600}
.qcell.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 42%,transparent);color:var(--bad);font-weight:600}
.qcell.pending{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.qcell.cur{outline:2px solid var(--accent);outline-offset:1px}
.qcell.marked::after{
  content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);
}
.qcell.cur.marked::after{background:var(--accent-ink)}

/* 翻页方向：左滑进入新题从右侧滑入，右滑返回从左侧 */
.stage[data-dir="l"] .q.active{animation:slideL .28s cubic-bezier(.2,.8,.2,1)}
.stage[data-dir="r"] .q.active{animation:slideR .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* 桌面端别让面板横贯整屏，收成居中浮层 */
@media (min-width:981px){
  .sheet{
    left:0;right:0;margin:0 auto;width:min(680px,92vw);
    bottom:28px;border:1px solid var(--line);border-radius:18px;
    padding-bottom:0;max-height:72vh;
  }
  .sheet-body{padding-bottom:18px}
  .sheet-scrim{background:rgba(12,14,13,.26)}
}

/* 超长英文单词（化学名）在窄屏会顶破容器 */
.stem,.opt .txt,.ans-row .v,blockquote.ev,.key-row,.wrong-item .qt{overflow-wrap:break-word}

/* ---------------------------------------------------------------- responsive */
@media (max-width:980px){
  /* 小屏上直接放大字号会溢出，按断点重算三档 */
  html[data-fs="sm"]{--stem:15.8px;--body:13.6px}
  html[data-fs="md"]{--stem:17.4px;--body:15.4px}
  html[data-fs="lg"]{--stem:20px;--body:17.4px}

  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;left:0;top:0;z-index:60;
    width:min(86vw,318px);height:100vh;height:100dvh;
    padding:calc(20px + var(--safe-t)) 16px calc(16px + var(--safe-b));
    transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    background:var(--surface);box-shadow:var(--shadow);
  }
  .side.open{transform:none}
  .scrim.show{
    display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.34);
    animation:fade .2s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .only-mobile{display:grid}

  .topbar{
    padding:calc(8px + var(--safe-t)) 14px 8px;gap:10px;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(14px) saturate(1.15);
  }
  .stage{padding:20px 16px calc(94px + var(--safe-b))}

  /* 底栏贴住视口底部：长页面滚动时始终可点，且不遮住正文末段 */
  .navbar{
    position:fixed;left:0;right:0;bottom:0;
    justify-content:space-between;gap:10px;
    padding:10px 14px calc(10px + var(--safe-b));
    background:color-mix(in srgb, var(--surface) 93%, transparent);
    backdrop-filter:blur(14px) saturate(1.15);
    border-top:1px solid var(--line);
    box-shadow:0 -10px 28px -22px rgba(0,0,0,.55);
  }
  .nav-prev{min-height:44px;padding:10px 16px;font-size:13.5px}
  .nav-next{min-height:44px;padding:10px 16px;font-size:13.5px;flex:1;max-width:200px}
  .pos-btn{min-height:44px;min-width:60px}

  /* 键盘弹出时收起底栏，别压在输入框上 */
  body.kbd .navbar{display:none}
  body.kbd .stage{padding-bottom:32px}
  .toast{bottom:calc(84px + var(--safe-b))}

  /* 抽屉整体滚动，章节列表别再套一层滚动区，否则手机上只剩三行可视 */
  .chapters{overflow:visible;flex:0 0 auto}
  .side-foot{margin-top:12px}
  .result{padding:26px 16px calc(48px + var(--safe-b))}
  .res-head{gap:20px}
}

@media (max-width:640px){
  #mode{display:none}
  .topbar{gap:8px}
  .crumb{font-size:11.5px}
  .crumb span:first-child,.crumb .sep{display:none}
  .timer{display:block;font-size:11px;padding:3px 7px}
  .btn{padding:8px 12px;font-size:13px;min-height:40px}
  .icon-btn{width:40px;height:40px}
  .icon-btn svg{width:18px;height:18px}

  .qhead{gap:7px;margin-bottom:16px}
  .num{font-size:22px}
  .tag{font-size:10.5px;padding:3px 7px}
  .mark-btn{padding:6px 4px}

  .stem{line-height:1.9;margin-bottom:18px}
  .opts{gap:10px}
  .opt{padding:14px;border-radius:13px;min-height:54px;flex-wrap:wrap}
  .opt .ltr{width:26px;height:26px;flex-basis:26px;margin-top:0}
  /* 判定标注换行到正文下方，避免把选项文字挤成窄条 */
  .opt .flag{flex:1 1 100%;margin:5px 0 0 38px;font-size:11px}
  .opt .flag:empty{display:none}

  .field{padding:13px 14px;font-size:max(16px, var(--body))}
  .q-actions{gap:8px;margin-top:16px}
  .q-actions .btn{flex:1;min-height:44px}
  .q-actions .hint{flex:1 1 100%;margin:0}
  .self-grade{display:flex;gap:8px;width:100%}
  .self-grade button{flex:1;min-height:46px;font-size:13.5px}

  .verdict{margin-top:18px;font-size:13.5px}
  .ans{padding:15px 14px;border-radius:13px;margin-top:12px}
  .ans-row{font-size:13px;gap:8px}
  .ans-row .k{min-width:42px;font-size:11px}
  .keys{padding:10px 12px}
  .key-row{line-height:1.9}
  blockquote.ev{font-size:12.5px;line-height:1.9;padding-left:12px}

  /* 结果页：环形缩小、数据两列、按钮整宽堆叠 */
  .res-head{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:26px}
  .big-ring{width:104px;height:104px;flex-basis:104px}
  .big-ring svg{width:104px;height:104px}
  .big-ring .t b{font-size:27px}
  .res-title h2{font-size:20px}
  .res-title p{font-size:12.5px;line-height:1.8}
  .res-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;width:100%;margin-top:14px}
  .res-stats b{font-size:19px}
  .res-actions{flex-direction:column;gap:8px;margin-top:24px}
  .res-actions .btn{width:100%;min-height:46px}
  .wrong-item{padding:11px 12px}
  .wrong-item .qt{-webkit-line-clamp:3}
  .bar-row .lbl{white-space:normal;line-height:1.5}
}

@media (max-width:400px){
  .topbar{padding-left:10px;padding-right:10px;gap:6px}
  .crumb{max-width:96px}
  .num{font-size:20px}
  .qgrid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
  .qcell{height:42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---------------------------------------------------------------- print */
@media print{
  body{background:#fff}
  .side,.topbar,.navbar,.scrim,.toast,.progress,.q-actions,.mark-btn,
  .sheet,.sheet-scrim,.pos-btn{display:none!important}
  .app{display:block}
  .stage{max-width:none;padding:0}
  .q{display:block!important;page-break-inside:avoid;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid #ddd}
  .ans,.verdict{display:block!important}
  .opt{box-shadow:none;break-inside:avoid}
  .result{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">Q</div>
      <div class="brand-t">
        <h1>先进材料研究进展C · 术语与概念</h1>
        <p>解析器 课件转录稿 + 逐字回查 · 100 题</p>
      </div>
    </div>

    <div class="panel">
      <div class="ring">
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="track" cx="36" cy="36" r="30" fill="none" stroke-width="5"/>
          <circle class="bar" id="ringBar" cx="36" cy="36" r="30" fill="none" stroke-width="5"
                  stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="ring-t"><b id="ringNum">0</b><span id="ringAll">/ 0</span></div>
      </div>
      <div class="ring-meta">
        <div><span class="dot ok"></span><b id="okNum">0</b> 答对</div>
        <div><span class="dot bad"></span><b id="badNum">0</b> 答错</div>
        <div><span class="dot mut"></span><b id="leftNum">0</b> 未做</div>
      </div>
    </div>

    <div class="filters">
      <div class="flabel">范围</div>
      <div class="seg" id="scope">
        <button data-scope="all" aria-pressed="true">全部</button>
        <button data-scope="todo" aria-pressed="false">未做</button>
        <button data-scope="wrong" aria-pressed="false">错题</button>
        <button data-scope="marked" aria-pressed="false">标记</button>
      </div>
      <div class="flabel" style="margin-top:6px">题型</div>
      <div class="chips" id="types"></div>
      <div class="flabel" style="margin-top:10px">模式</div>
      <div class="seg small" id="mode2">
        <button data-mode="practice">练习</button>
        <button data-mode="exam">考试</button>
      </div>
      <div class="flabel" style="margin-top:10px">正文字号</div>
      <div class="seg small" id="fsSeg">
        <button data-fs-btn="sm">小</button>
        <button data-fs-btn="md">标准</button>
        <button data-fs-btn="lg">大</button>
      </div>
    </div>

    <nav class="chapters" id="chapters" aria-label="章节导航"></nav>

    <div class="side-foot">
      <a class="hub-link" href="amc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回课程</a>
      <button id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
        打印 / 存为 PDF
      </button>
      <button id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        清空答题记录
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="progress"><i id="progBar"></i></div>
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="打开目录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="crumb">
        <span id="crumbCh">—</span><span class="sep">/</span><span id="crumbSec">—</span>
      </div>
      <div class="top-right">
        <div class="timer" id="timer">00:00</div>
        <div class="seg small" id="mode">
          <button data-mode="practice">练习</button>
          <button data-mode="exam">考试</button>
        </div>
        <button class="btn ghost" id="submitBtn">交卷</button>
        <button class="icon-btn" id="themeBtn" aria-label="切换深浅色"></button>
      </div>
    </header>

    <div class="stage" id="stage"></div>

    <div class="result" id="result"></div>

    <footer class="navbar" id="navbar">
      <button class="btn ghost nav-prev" id="prevBtn" disabled>上一题</button>
      <button class="pos-btn" id="posBtn" aria-label="打开题目列表，快速跳转" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
        </svg>
        <b id="posNow">1</b><span>/</span><span id="posAll">0</span>
      </button>
      <button class="btn primary nav-next" id="nextBtn">下一题</button>
      <div class="kbd-hint">
        <span><kbd>1</kbd>–<kbd>4</kbd> 选择</span>
        <span><kbd>←</kbd><kbd>→</kbd> 翻页</span>
        <span><kbd>M</kbd> 标记</span>
        <span><kbd>T</kbd> 主题</span>
      </div>
    </footer>
  </main>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="题目列表">
  <header class="sheet-h">
    <b>题目列表</b>
    <div class="legend">
      <span><i class="ok"></i>对</span>
      <span><i class="bad"></i>错</span>
      <span><i></i>未做</span>
    </div>
    <button class="icon-btn" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="sheet-tools">
    <div class="seg small" id="sheetScope">
      <button data-sheet-scope="unit" aria-pressed="true">按单元</button>
      <button data-sheet-scope="type" aria-pressed="false">按题型</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>

medium","q":"碳达峰","o":[],"a":["指在某个时间点二氧化碳排放不再增长、达到峰值，之后逐步回落，是排放量由增转降的历史拐点。"],"exp":"关键词是拐点：达峰不是排放最低，而是由增转降的转折。原文同时用美英法的下降阶段、中国的平台期和印度的增长阶段说明不同大国所处位置不同。","ev":"碳达峰是指在某一个时间点，二氧化碳的排放不再增长、达到峰值，之后逐步回落，是二氧化碳排放量由增转降的历史拐点。","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":5,"n":6,"ch":"第一章 先进材料研究进展概论","sec":"第二节 先进能源材料发展的必要性","code":"","id":"ch01-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"碳中和","o":[],"a":["指人为排放量（化石燃料利用和土地利用）被人为作用（木材蓄积量、土壤有机碳、工程封存等）和自然过程（海洋吸收、侵蚀-沉积过程的碳埋藏、碱性土壤的固碳等）所吸收，即净零排放。"],"exp":"定义落在净零排放这一平衡关系上，吸收侧同时包括人为作用和自然过程两条途径，因此碳中和并不等于零排放，而是排放与吸收相抵。","ev":"碳中和是指人为排放量（化石燃料利用和土地利用）被人为作用（木材蓄积量、土壤有机碳、工程封存等）和自然过程（海洋吸收、侵蚀-沉积过程的碳埋藏、碱性土壤的固碳等）所吸收，即净零排放。","keys":[],"ref":"第 14 页","hint":"","score":2},{"i":6,"n":7,"ch":"第一章 先进材料研究进展概论","sec":"第三节 发展历程与趋势","code":"","id":"ch01-term-008","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"碳材料","o":[],"a":["从传统结构材料走向纳米功能材料的重要代表，从富勒烯、碳纳米管到石墨烯，推动储能器件、柔性电子和复合材料发展。"],"exp":"原文把碳定为本课主要核心材料，理由是它在电子、能源、环境三个方向都有对应角色，如碳纳米管与石墨烯基后硅器件、多孔碳与石墨负极、吸附分离与污染物转化。","ev":"碳材料是从传统结构材料走向纳米功能材料的重要代表；从富勒烯、碳纳米管到石墨烯，推动储能器件、柔性电子和复合材料发展。","keys":[],"ref":"第 24 页","hint":"","score":2},{"i":7,"n":8,"ch":"第一章 先进材料研究进展概论","sec":"第四节 生物质资源与先进能源材料","code":"","id":"ch01-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"生物质","o":[],"a":["一般指除化石燃料及其衍生物之外任何形式的有机物质，包括动物、植物、微生物以及由这些生命体派生、排泄和代谢出的各种有机物质。"],"exp":"定义用排除法把化石燃料及其衍生物划在生物质之外，这是它区别于煤、石油的关键；范围涵盖农林作物残体、水生植物、人畜粪便和城市与工业有机废弃物。","ev":"定义：一般是指任何形式（除化石燃料及其衍生物）的有机物质，包括所有的动物、植物和微生物，以及由这些生命体所派生、排泄和代谢出来的各种有机物质，如农林作物及其残体、水生植物、人畜粪便、城市生活和工业有机废弃物等","keys":[],"ref":"第 32 页","hint":"","score":2},{"i":8,"n":9,"ch":"第一章 先进材料研究进展概论","sec":"第四节 生物质资源与先进能源材料","code":"","id":"ch01-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"生物质能","o":[],"a":["太阳能以化学能形式贮存在生物质中的能量形式，即以生物质为载体的能量，直接或间接来源于绿色植物的光合作用，可转化为常规固态、液态和气态燃料。"],"exp":"定义强调能量来源是光合作用固定的太阳能，载体是生物质，并且它是唯一一种可再生的碳源；这也解释了生物质能通过光合作用把低密度太阳能富集起来的优点。","ev":"定义：就是太阳能以化学能形式贮存在生物质中的能量形式，即以生物质为载体的能量。它直接或间接地来源于绿色植物的光合作用，可转化为常规的固态、液态和气态燃料，取之不尽、用之不竭，是一种可再生能源，同时也是唯一一种可再生的碳源。","keys":[],"ref":"第 33 页","hint":"","score":2},{"i":9,"n":10,"ch":"第一章 先进材料研究进展概论","sec":"第四节 生物质资源与先进能源材料","code":"","id":"ch01-term-010","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"硬碳","o":[],"a":["一种不追求完全石墨化的无序碳负极材料，具有较大的层间距、闭孔和缺陷结构，便于半径较大的钠离子嵌入和存储。生物质硬碳常用于钠离子电池负极，评价指标包括可逆容量、首圈库仑效率、倍率性能、循环稳定性和低温表现。"],"exp":"第 39 页指出钠离子半径较大，传统石墨层间嵌钠困难；无序层状、闭孔和缺陷结构使生物质硬碳成为钠离子电池负极候选。层间距影响嵌入能力，闭孔贡献低电位平台，表面官能团影响首圈效率。","ev":"无序层状、闭孔和缺陷结构让生物质硬碳成为钠离子电池负极候选","keys":[],"ref":"第 39 页","hint":"","score":2},{"i":10,"n":11,"ch":"第二章 仿生智能材料的设计与制备","sec":"第二节 仿生的诞生","code":"","id":"ch02-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"仿生学","o":[],"a":["研究生物系统的结构、性状、原理、行为以及相互作用，为工程技术提供新的设计思想、工作原理和系统构成的技术科学，需要生命科学、物质科学、信息科学与工程技术等交叉。"],"exp":"关键词是「生物系统的结构、性状、原理、行为」和「为工程技术提供设计思想」。只答「模仿生物」漏掉了学科的服务对象。","ev":"研究生物系统的结构、性状、原理、行为以及相互作用","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":11,"n":12,"ch":"第二章 仿生智能材料的设计与制备","sec":"第四节 仿生学基本要素","code":"","id":"ch02-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"仿生模本","o":[],"a":["供仿生研究模仿的生物对象，动物、植物、微生物都可以充当；人类自身的生活原理、文化行为与思维哲理，以及生境中的自然现象，也属于仿生模本。"],"exp":"仿生模本是供仿生研究模仿的生物对象。范围不止动物、植物、微生物，还包括人类自身的生活原理、文化行为与思维哲理，以及生境中的自然现象。判断的关键是「被模仿的对象」；把仿生制品或人工材料当成模本，就把模仿者与被模仿者颠倒了。","ev":"都可以作为仿生模本供各行各业进行仿生研究","keys":[],"ref":"第 29 页","hint":"","score":2},{"i":12,"n":13,"ch":"第二章 仿生智能材料的设计与制备","sec":"第四节 仿生学基本要素","code":"","id":"ch02-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"形似模拟","o":[],"a":["模仿生物形态（形貌）、结构、材料、形体（形状、构形）等因素开展的仿生设计，着眼点在外观与构造这些可见可测的因素。"],"exp":"形似模拟是模仿生物形态（形貌）、结构、材料、形体（形状、构形）等因素开展的仿生设计。四个「形」——形态、结构、材料、形体——是定义要点；它着眼外观与构造，回答「像不像」，但不追问功能原理，因此与神似模拟区分。","ev":"形似模拟是指模仿生物形态（形貌）、结构、材料、形体（形状、构形）等因素而开展的仿生设计","keys":[],"ref":"第 32 页","hint":"","score":2},{"i":13,"n":14,"ch":"第二章 仿生智能材料的设计与制备","sec":"第四节 仿生学基本要素","code":"","id":"ch02-term-004","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"神似模拟","o":[],"a":["模仿生物多因素相互耦合、相互协同作用的原理开展的仿生，在形似模拟基础上更注重对生物功能原理与规律的探究。"],"exp":"神似模拟是模仿生物多因素相互耦合、相互协同作用的原理开展的仿生，在形似模拟基础上更注重对生物功能原理与规律的探究。它与形似的分界不在「像不像」，而在是否迁移了生物实现功能的原理；只把外形做得更像生物，仍然属于形似。","ev":"神似模拟是指模仿生物多因素相互耦合、相互协同作用的原理而开展的仿生","keys":[],"ref":"第 33 页","hint":"","score":2},{"i":14,"n":15,"ch":"第二章 仿生智能材料的设计与制备","sec":"第四节 仿生学基本要素","code":"","id":"ch02-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"非生命仿生制品","o":[],"a":["应用于科学、技术、工程以及人文、社科等领域的传统仿生产品，是纯人工技术制品，不含生命体或生命零部件。它与具有完整生命的仿生制品、包含生命零部件的仿生制品共同构成仿生制品的三类。"],"exp":"第 34 页把非生命仿生制品定义为应用于科学技术、工程以及人文社科等领域的传统仿生产品，是纯人工技术制品；并与另两类仿生制品并列，构成仿生制品的分类。","ev":"非生命仿生制品是指应用于科学、技术、工程以及人\n文、社科等领域的传统仿生产品，是纯人工技术制品。","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":15,"n":16,"ch":"第二章 仿生智能材料的设计与制备","sec":"第五节 仿生材料的设计及举例","code":"","id":"ch02-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"荷叶效应","o":[],"a":["1997 年德国波恩大学植物学家巴夫洛特提出的术语，指荷叶表面微米突起叠加纳米蜡质结晶带来的超疏水与自清洁现象：水珠接触面积只有 2～3%，倾斜时滚动并带走污泥。"],"exp":"荷叶效应指荷叶表面微米突起叠加纳米蜡质结晶带来的超疏水与自清洁现象：水珠接触面积只有 2～3%，倾斜时滚动并带走污泥。该术语由德国波恩大学植物学家巴夫洛特于 1997 年提出。答题要抓住提出者与年份、两级结构、低黏附自清洁三层；只写「荷叶不沾水」过于笼统。","ev":"提出了「 荷叶效应」 (Lotus effect)一词","keys":[],"ref":"第 40 页","hint":"","score":2},{"i":16,"n":17,"ch":"第二章 仿生智能材料的设计与制备","sec":"第五节 仿生材料的设计及举例","code":"","id":"ch02-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"花瓣效应","o":[],"a":["玫瑰花瓣同时具有微米乳突与纳米折叠的双层结构，因而表现出高黏附力的超疏水性，我国学者据此提出的术语。它与荷叶的低黏附自清洁形成对照。"],"exp":"花瓣效应指玫瑰花瓣依靠微米乳突加纳米折叠的双层结构获得高黏附力的超疏水性，由我国学者提出。它与荷叶效应同样利用微纳两级结构，但结果相反：荷叶低黏附、水珠易滚落自清洁；花瓣高黏附、水珠不易滚落。把两者当成同义词，或只答「花瓣不沾水」，都没有抓住黏附力差异。","ev":"这种微纳双层结构使其具有高黏附力的超疏水性","keys":[],"ref":"第 47 页","hint":"","score":2},{"i":17,"n":18,"ch":"第二章 仿生智能材料的设计与制备","sec":"第五节 仿生材料的设计及举例","code":"","id":"ch02-term-010","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"范德华力","o":[],"a":["分子与分子、原子与原子之间的一种弱相互作用力。壁虎脚掌的刚毛末端分叉成大量纳米绒毛，形成微纳米多级结构，使刚毛与物体表面分子充分接触，从而产生范德华力，实现贴附。"],"exp":"第 48 页把壁虎贴附归因于范德华力：每只脚底约 50 万根刚毛，每根末端再分 400-1000 根纳米绒毛，直径 0.2-0.5 μm；多级结构增加接触，使刚毛与表面分子接近到足以产生范德华力。","ev":"这种微纳米多级结构使得刚毛与物体表面分子接触，从而产生“ 范德华力”","keys":[],"ref":"第 48 页","hint":"","score":2},{"i":18,"n":19,"ch":"第二章 仿生智能材料的设计与制备","sec":"第六节 天然生物及其仿生材料","code":"","id":"ch02-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"天然生物材料","o":[],"a":["由生物过程形成的材料，包括结构蛋白（胶原纤维、蚕丝等）、生物矿物（骨、牙、贝壳等）和复合纤维（木材、竹等）三类。"],"exp":"天然生物材料是由生物过程形成的材料，包括结构蛋白（胶原纤维、蚕丝等）、生物矿物（骨、牙、贝壳等）和复合纤维（木材、竹等）三类。定义的关键是「生物过程形成」，因此人工合成的仿生制品不算；贝壳虽以碳酸钙为主，但经过生物矿化调控，仍属天然生物材料。","ev":"结构蛋白（胶原纤维、蚕丝等)、生物矿物（骨、牙、贝壳等）和复合纤维（木材，竹等）","keys":[],"ref":"第 49 页","hint":"","score":2},{"i":19,"n":20,"ch":"第二章 仿生智能材料的设计与制备","sec":"第六节 天然生物及其仿生材料","code":"","id":"ch02-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"管胞","o":[],"a":["针叶树早材中细胞壁薄且有很多瓣的细胞，负责从树根向树叶输送树液；晚材的管胞细胞壁厚，承担木材的机械强度。"],"exp":"管胞是针叶树木材中承担输导和支撑的厚壁细胞。早材管胞细胞壁薄、腔大，负责从树根向树叶输送树液；晚材管胞细胞壁厚、腔小，承担机械强度。同一树种早材与晚材的分工，使木材同时具备输导和承载功能，这也是木材作为天然纤维增强材料的体现。","ev":"早材细胞的细胞壁薄而且有很多瓣，称管胞","keys":[],"ref":"第 53 页","hint":"","score":2},{"i":20,"n":21,"ch":"第三章 木材的科技创新","sec":"2 功能性实体木材","code":"2","id":"ch03-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"乙酰化木材","o":[],"a":["用乙酰基置换木材中亲水性羟基而得到的改性木材。疏水性乙酰基取代亲水羟基后降低吸湿性，同时产生增容效果，提高尺寸稳定性；增重一般 20%-25%，抗张缩系数可达 70%，且非毒、抗腐、抗虫。"],"exp":"第 7 页以乙酰化木材为例说明化学法：疏水性乙酰基置换亲水性羟基降低吸湿性，增容效果提高尺寸稳定性；并给出增重 20%-25%、抗张缩系数可达 70%、非毒抗腐抗虫。","ev":"疏水性的乙酰基置换亲水性的羟基降低吸湿性","keys":[],"ref":"第 7 页","hint":"","score":2},{"i":21,"n":22,"ch":"第三章 木材的科技创新","sec":"2 功能性实体木材","code":"2","id":"ch03-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"炭化木","o":[],"a":["即热处理木材，以木材为原料，在150-260℃温度下用蒸汽、空气（缺氧）、氮气等气体或植物油为介质，经高温加热制得。"],"exp":"炭化木即热处理木材：以木材为原料，在 150-260℃ 下用蒸汽、缺氧空气、氮气等气体或植物油为介质高温加热制得。它与燃烧炭化的区别在于温度较低且限制氧气，只使半纤维素热解、降低平衡含水率，保留木材骨架；温度过高或供氧充足就会真正燃烧成木炭。","ev":"炭化木—即热处理木材，以木材为原料，在150-260℃温度下用蒸汽，空气（缺氧）、氮气等气体或植物油为介质，经高温加热制得。","keys":[],"ref":"第 8 页","hint":"","score":2},{"i":22,"n":23,"ch":"第三章 木材的科技创新","sec":"2 功能性实体木材","code":"2","id":"ch03-term-010","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"满细胞法","o":[],"a":["一种木材阻燃处理工艺：依次经过前真空、加药剂、加压、浸入药剂、排除内压、后真空和解除真空，使药剂充满细胞、渗透深度大，保留最大药剂量，适用于难处理木材。"],"exp":"第 16 页按 a—h 列出满细胞法流程：前真空、加药剂、加压、浸入药剂、排除内压、后真空、解除真空；特点是药剂充满细胞、渗透深度大、保留最大药剂量，适用于难处理木材。","ev":"药剂充满细胞，渗透深度大","keys":[],"ref":"第 16 页","hint":"","score":2},{"i":23,"n":24,"ch":"第三章 木材的科技创新","sec":"3 新型木质复合材料","code":"3","id":"ch03-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"木塑复合材料","o":[],"a":["以木质纤维材料和塑料为原料，添加化学制剂，经挤出、压制或注射成型等加工工艺制成的一种新型绿色材料。"],"exp":"依据 S19 的定义句，注意原料是木质纤维材料加塑料，成型方式包含挤出、压制或注射成型。易与木质-无机质复合材料的搅拌、铺装、加压成型工序混淆。","ev":"木塑复合材料 — 以木质纤维材料和塑料为原料，添加化学制剂，经挤出、压制或注射成型等加工工艺制成的一种新型绿色材料。","keys":[],"ref":"第 19 页","hint":"","score":2},{"i":24,"n":25,"ch":"第三章 木材的科技创新","sec":"3 新型木质复合材料","code":"3","id":"ch03-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"木质-金属复合材料","o":[],"a":["木质单元与不同形态的金属单元通过复合界面特性处理技术制造的一种新型木质复合材料，处理形式有金属化木材、金属覆盖木板和木材表面金属化。"],"exp":"依据 S21 的定义与处理形式两栏，关键词是复合界面特性处理技术，三种形式分别为金属化木材、金属覆盖木板、木材表面金属化。","ev":"木质-金属复合材料 — 木质单元与不同形态的金属单元通过复合界面特性处理技术，制造的一种新型木质复合材料。","keys":[],"ref":"第 21 页","hint":"","score":2},{"i":25,"n":26,"ch":"第三章 木材的科技创新","sec":"3 新型木质复合材料","code":"3","id":"ch03-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"木质-无机质复合材料","o":[],"a":["以木材或木质原料为基质，经一定处理或添加化学试剂，与其他无机质经搅拌、铺装、加压成型等工序制成的一种建筑类复合材料。"],"exp":"以木材或木质原料为基质，经一定处理或添加化学试剂，与其他无机质经搅拌、铺装、加压成型等工序制成的建筑类复合材料。定义要抓住三要素：木质基质、无机质增强/填充、搅拌—铺装—加压成型；它属于建筑类复合材料，不要与木塑（木质—高分子）混淆。","ev":"木质-无机质复合材料 — 是以木材或木质原料为基质，经一定处理或添加化学试剂与其他无机质经搅拌、铺装、加压成型等工序制成的一种建筑类复合材料。","keys":[],"ref":"第 23 页","hint":"","score":2},{"i":26,"n":27,"ch":"第三章 木材的科技创新","sec":"3 新型木质复合材料","code":"3","id":"ch03-term-004","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"木质纳米纤维素","o":[],"a":["将木质纤维原料通过可控的工艺方法，从大纤维素中分离出具有带状、网状缠结结构的微纤丝，直径小于 100 nm 的纳米级纤丝单元。"],"exp":"依据 S25 的定义句，要点是可控工艺分离、带状网状缠结结构、直径小于 100 nm。易把尺寸写成大于 100 nm 或漏掉纳米级单元这一限定。","ev":"木质纳米纤维素 — 将木质纤维原料通过可控的工艺方法，从大纤维素中分离出具有带状、网状缠结结构的微纤丝，直径小于\n100 nm的纳米级纤丝单元。","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":27,"n":28,"ch":"第三章 木材的科技创新","sec":"5 木材科学与创新发展","code":"5","id":"ch03-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"木材多元共溶连续修饰法","o":[],"a":["把各步反应的反应物混合在一起，在一个容器中发生连续多步反应，上一步的产物马上参与到下一步反应中，通过连续反应得到最终所需产品的方法；具有时间短、易调控、效率高等特点。"],"exp":"把各步反应的反应物混合在一起，在同一容器中连续进行多步反应，上一步产物直接参与下一步，最终得到目标产品的方法。关键词是「各步反应物混合」「同一容器」「连续反应」；由此带来时间短、易调控、效率高的优点，区别于每步分离提纯的分步法。","ev":"“木材多元共溶连续修饰法”就是把各步反应的反应物混合在一起，在一个容器中发生连续多步反应，上一步的产物马上参与到下一步反应中，通过连续反应得到最终所需的产品，具有时间短，易调控，效率高等特点。","keys":[],"ref":"第 35 页","hint":"","score":2},{"i":28,"n":29,"ch":"第三章 木材的科技创新","sec":"5 木材科学与创新发展","code":"5","id":"ch03-term-005","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"石墨烯量子点","o":[],"a":["一层或者多层边缘连接有修饰基团的石墨烯或者氧化石墨烯片层，具有各向异性，其横向尺寸明显大于厚度。"],"exp":"依据 S48 的并列定义，石墨烯量子点是片层结构、横向尺寸明显大于厚度；球状纳米颗粒那一条是碳纳米点，二者不能互换。","ev":"一层或者多层边缘连接有修饰基团的石墨烯或者氧化石墨烯片层。具有各向异性，其横向尺寸明显大于厚度","keys":[],"ref":"第 48 页","hint":"","score":2},{"i":29,"n":30,"ch":"第三章 木材的科技创新","sec":"5 木材科学与创新发展","code":"5","id":"ch03-term-006","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"碳纳米点","o":[],"a":["通常是球状纳米颗粒，可以分为具有晶格结构的碳纳米点（碳量子点）和不具有晶格结构的碳纳米点。"],"exp":"依据 S48 的并列定义，碳纳米点的形态是球状纳米颗粒，并按有无晶格结构分为两类，其中具晶格结构者即碳量子点。由纳米碳核与钝化聚合物链组装的是聚合物点，不是碳纳米点。","ev":"通常是球状纳米颗粒，其可以分为具有晶格结构的碳纳米点（碳量子点）和不具有晶格结构的碳纳米点","keys":[],"ref":"第 48 页","hint":"","score":2},{"i":30,"n":31,"ch":"第四章 电催化材料","sec":"背景与析氢机理","code":"","id":"ch04-term-001","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"火山图","o":[],"a":["以氢吸附自由能 ΔG_H* 为横坐标、交换电流密度或催化活性为纵坐标得到的「火山形」关系图，用来比较 HER 催化材料的活性强弱。火山顶点对应 ΔG_H*≈0、中间体吸附既不太强也不太弱的最佳平衡；Pt 位于顶点附近，Ru 等材料的改性目标就是把 ΔG_H* 调到适中。它不仅适用于纯金属，也适用于合金、酶和过渡金属化合物。"],"exp":"火山图把 Sabatier 原则可视化：横坐标是氢吸附自由能 ΔG_H*，纵坐标是交换电流密度或催化活性。ΔG_H* 太负表示中间体吸附过强、难脱附，太正表示吸附过弱、难活化，两端活性都低，只有接近零的中间值活性最高，于是形成火山形。Pt 靠近顶点，因此常作为 HER 基准；合金、酶和过渡金属化合物也服从这一描述符。","ev":"量子化学计算表明，∆G_H 是能够催化HER材料的良好描述符，它不仅适用于纯金属，还适用于合金、酶以及过渡金属化合物。","keys":[],"ref":"第 9 页","hint":"","score":2},{"i":31,"n":32,"ch":"第四章 电催化材料","sec":"评价指标与测试基础","code":"","id":"ch04-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"三电极体系","o":[],"a":["由工作电极、参比电极和对电极组成的电化学测试体系；工作电极发生目标反应，参比电极提供稳定已知的电位基准，对电极构成电流回路，从而把被研究电极的反应与回路的反向反应解耦，单独测准其电位与电流。"],"exp":"依据 S11：三电极由 WE、RE、CE 组成，WE 承载催化剂并发生目标反应，RE 提供稳定电位基准且几乎不通过电流，CE 承担反向反应并构成回路；三电极的目的就是解耦目标反应与回路反向反应。","ev":"三电极体系：催化剂性能评价的测试基础\n为什么必须用三电极：把被研究电极的反应与回路的反向反应解耦，单独测准其电位与电流。\n电极 | 常用体系 | 作用\n工作电极 WE | 玻碳 / 碳纸等负载催化剂 | 发生目标反应（HER / OER），是被研究的对象；催化剂滴涂或生长在其表面\n参比电极 RE | Ag/AgCl、Hg/HgO、饱和甘汞 | 提供稳定且已知的电位基准，测量时几乎不通过电流，保证工作电极电位准确；测得电位需换算成 vs RHE 便于比较\n对电极 CE | Pt 片、石墨棒 / 碳棒 | 与工作电极构成电流回路，承担与之相反的电极反应；面积应远大于工作电极，避免其极化干扰测量","keys":[],"ref":"第 11 页","hint":"","score":2},{"i":32,"n":33,"ch":"第四章 电催化材料","sec":"评价指标与测试基础","code":"","id":"ch04-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"可逆氢电极（RHE）","o":[],"a":["电化学中用于统一电位基准的参比电极体系。不同文献使用 Ag/AgCl、Hg/HgO、饱和甘汞等参比电极时电位不一致，需按 E(vs RHE)=E(vs Ag/AgCl)+0.197 V+0.059×pH（25℃）换算到可逆氢电极下，才能比较不同催化剂的 HER/OER 活性。"],"exp":"第 11 页三电极体系表指出，参比电极提供稳定且已知的电位基准，测得电位需换算成 vs RHE 便于比较；页末给出 25℃ 的换算公式。不同文献参比电极不同，不统一到 RHE 就无法横向比较催化剂。","ev":"测得电位需换算成 vs RHE 便于比较","keys":[],"ref":"第 11 页","hint":"","score":2},{"i":33,"n":34,"ch":"第四章 电催化材料","sec":"评价指标与测试基础","code":"","id":"ch04-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"塔菲尔斜率","o":[],"a":["记作 b，是 HER 催化剂评估中「过电位和塔菲尔曲线」方法的核心参数。Tafel 斜率是催化剂的本征属性，反映电流随过电位增长的快慢，与 HER 反应速率密切相关；b 越小，增大同样电流所需过电位越小，动力学越好。Pt 通常具有较小的 Tafel 斜率。"],"exp":"由 η = a + b log j 可见，b 是 Tafel 曲线的斜率，单位 mV·dec⁻¹；它由反应机理中的决速步决定，因此是催化剂的本征属性。b 越小，每提高一个数量级电流所需的过电位越小，动力学越好，Pt 通常具有较小的 Tafel 斜率。它与过电位、交换电流密度相互关联但不是一个量：过电位是同一电流下的电压损失，j₀ 是平衡时的电流密度。","ev":"Tafel斜率（b）是催化剂的本征属性，与HER的反应速率密切相关。交换电流密度（j₀）是一个重要的动力学参数，用于描述电催化剂在可逆条件下的本征催化活性，并且可以通过假设过电位（η）为零来确定（或外推得到）。","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":34,"n":35,"ch":"第四章 电催化材料","sec":"评价指标与测试基础","code":"","id":"ch04-term-008","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"电化学阻抗谱","o":[],"a":["HER 催化剂评估的第二类方法。Rct 与电极界面电荷转移过程有关，较小的 Rct 意味着较快的反应速率和较小的过电位；在 Nyquist 图低频区，半圆对应的吸附电阻 Rad 指氧化物种在电极表面的吸附，反映 HER 起始电位，Rad 越小起始电位越正。"],"exp":"EIS 用小幅交流信号分离不同时间尺度的过程：高频区对应溶液电阻与界面电容，半圆直径对应电荷转移电阻 Rct；Rct 越小，电荷转移越快、过电位越低。低频区半圆对应吸附电阻 Rad，反映氧化物种在电极表面的吸附，Rad 越小起始电位越正。把 Rct 与 Rad 混为一个电阻，是本题常见错误。","ev":"Rct 与电极的界面电荷转移过程有关。就HER而言，较小的Rct值意味着较快的反应速率，从而导致较小的过电位。此外，在EIS奈奎斯特图的低频区，半圆对应的吸附电阻（Rad） 是指氧化物种在电极表面的吸附，它反映了HER的起始电位。Rad越小，起始电位越正。","keys":[],"ref":"第 13 页","hint":"","score":2},{"i":35,"n":36,"ch":"第四章 电催化材料","sec":"评价指标与测试基础","code":"","id":"ch04-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"法拉第效率","o":[],"a":["在 HER 中定义为实验产氢量与理论产氢量的比值。理论产氢量按恒电流或恒电位电解条件由法拉第定律计算，实际氢气量用气相色谱在同一电解过程中监测，两者比较即得法拉第效率。效率接近 100% 说明电子几乎都用于产氢，副反应很少。"],"exp":"法拉第效率衡量「电子是否都用于目标反应」。理论产氢量由通入电量按法拉第定律算出，实际产氢量由气相色谱定量；两者比值越接近 100%，说明副反应越少、电子利用率越高。它不同于能量效率：后者还要考虑过电位造成的电压损失，因此法拉第效率高不代表能量效率一定高。","ev":"在HER中，法拉第效率被定义为实验产氢量与理论产氢量的比值。理论产氢量根据恒电流或恒电位电解的条件计算得出。通过气相色谱监测同一恒电流或恒电位电解过程中产生的实际氢气量，并将其与理论值进行比较，即可确定法拉第效率。","keys":[],"ref":"第 15 页","hint":"","score":2},{"i":36,"n":37,"ch":"第四章 电催化材料","sec":"CO₂还原的热力学与路径","code":"","id":"ch04-term-004","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"析氢反应","o":[],"a":["即HER，反应式为2H⁺ + 2e⁻ → H₂，是电催化水分解制氢对应的反应，其过电位η_c需靠高活性的析氢催化剂来最小化。在CO₂电化学还原中它作为竞争反应始终伴随发生，是影响选择性的关键因素，平衡电位为0 V vs RHE。"],"exp":"HER 是水分解的阴极半反应：酸性下 2H⁺ + 2e⁻ → H₂，碱性下 2H₂O + 2e⁻ → H₂ + 2OH⁻。它的过电位 η_c 要靠高活性析氢催化剂压低；在 CO₂RR 中 HER 始终伴随发生，且 0 V vs RHE 的平衡电位夹在多数 CO₂ 还原产物电位之间，热力学上分不开，只能靠动力学（稳定 COOH/OCHO、抑制 *H）提高选择性。","ev":"竞争反应：析氢反应（HER, 2H⁺ + 2e⁻ → H₂）始终伴随发生，是影响选择性的关键因素。","keys":[],"ref":"第 56 页","hint":"","score":2},{"i":37,"n":38,"ch":"第四章 电催化材料","sec":"CO₂还原的热力学与路径","code":"","id":"ch04-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"萨巴捷原则（Sabatier principle）","o":[],"a":["反应中间体与催化剂的结合既不能太强，也不能太弱的原则。结合过强，中间体难以脱附、占据活性位；结合过弱，反应物难以活化。最优催化活性出现在中间结合强度，对应火山图顶点。"],"exp":"Sabatier 原则指出，中间体与催化剂的结合存在最优值：过强则中间体难脱附、活性位被占据，过弱则反应物难活化；只有接近最优结合强度时，火山图顶点附近才出现最高活性。HER 中常用 ΔG_H*≈0 作为判据，Pt 正因接近这一最优值而活性高。","ev":"萨巴捷原则（Sabatier principle）：即反应中间体与催化剂的结合既不能太强，也不能太弱的概念。","keys":[],"ref":"第 65 页","hint":"","score":2},{"i":38,"n":39,"ch":"第四章 电催化材料","sec":"CO₂还原装置与传质","code":"","id":"ch04-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"气体扩散流动池","o":[],"a":["一种 CO₂ 还原装置，核心是气体扩散层——能把气相 CO₂ 输送至电催化界面的疏水性多孔材料，用于克服 CO₂ 在水中溶解度低的传质限制。它可在碱性、高 pH 电解质中运行 CO₂RR，因为这类介质显著抑制氢气生成，并可把 C₁、C₂ 产物的电流密度提高到通常 200-400 mA·cm⁻²。"],"exp":"CO₂ 在水中溶解度低，传统液相电解的传质受限；气体扩散层让气相 CO₂ 直接到达催化剂界面，缩短扩散路径。碱性、高 pH 介质还能抑制 HER，使更多电子用于 CO₂RR；流动池结构则支持高电流密度运行。三点合起来，才是气体扩散流动池适合 CO₂RR 的原因。","ev":"包含一个气体扩散层——一种疏水性多孔材料——能够将气相CO₂输送至电催化界面。","keys":[],"ref":"第 69 页","hint":"","score":2},{"i":39,"n":40,"ch":"第四章 电催化材料","sec":"铜基与掺杂催化剂","code":"","id":"ch04-term-006","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"氧化物衍生铜（OD-Cu）","o":[],"a":["先对铜进行可控氧化、随后在电化学条件下原位还原制得的一类铜催化剂，过程使表面粗糙度增加。其 C₂₊ 活性提升可归因于晶界及配位不饱和 Cu 原子，这些位点充当增强的活性中心。"],"exp":"OD-Cu 的关键在「先氧化、后原位还原」：氧化形成含氧物种，还原时被移除并留下粗糙表面、晶界和配位不饱和 Cu 位点。这些低配位位点增强 CO 中间体的吸附与二聚，从而提高 C₂₊ 选择性。若只说「铜被还原」，就漏掉了表面结构重构这一关键。","ev":"通常，OD-Cu（氧化物衍生铜）催化剂是通过先进行可控氧化、随后在电化学条件下原位还原而制得的，这一过程会导致其表面粗糙度增加。这种催化活性的提升——特别是在生成C₂₊（多碳）产物方面——可进一步归因于晶界及配位不饱和Cu原子的存在，这些位点充当了增强的活性中心。","keys":[],"ref":"第 76 页","hint":"","score":2},{"i":40,"n":41,"ch":"第五章 锂离子电池材料","sec":"3.1 正极材料","code":"3.1","id":"ch05-term-001","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"摇椅式电池","o":[],"a":["充放电时 Li⁺ 在正极与负极之间往返嵌入/脱出，形如摇椅来回摆动，故称“摇椅式电池”（rocking-chair battery）。正负极均为可嵌锂的“锂库”，锂始终以离子态存在、不析出金属锂，这是与锂金属电池的本质区别；其本质是 Li⁺ 在两个锂库间做浓度迁移的浓差电池。"],"exp":"定义取自新增的摇椅式电池专页：Li⁺ 往返嵌入/脱出、形如摇椅；要点还包括正负极都是可嵌锂的“锂库”、锂不析出，以及浓差电池本质。不要把它理解成外形像摇椅的电池结构。","ev":"定义：充放电时 Li⁺ 在正极与负极之间往返嵌入 / 脱出，像摇椅来回摆动，故称“摇椅式电池”（rocking-chair battery）。","keys":[],"ref":"第 23 页","hint":"","score":2},{"i":41,"n":42,"ch":"第五章 锂离子电池材料","sec":"3.1 正极材料","code":"3.1","id":"ch05-term-004","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"钴酸锂","o":[],"a":["一种层状结构的正极材料，容量为理论 274mAh/g、实际 140—155 mAh/g。优点是高电压（4.0V）、放电平稳、适合大电流放电、循环性能好；缺点是 Co 资源有限、价格高，并存在污染与安全问题。"],"exp":"释义由容量、优点、缺点三部分构成。4.0V 高电压与循环性能好属于钴酸锂，制备条件苛刻与循环性能差属于镍酸锂，两者常被互换；其理论容量与镍酸锂同为 274，实际容量却明显更低。","ev":"容量：理论 274mAh/g ， 实际140—155 mAh/g 。\n优点：高电压（4.0V），放电平稳 ，适合大电流放电，循环性能好。\n缺点  ：Co资源有限，价格高，污染、安全问题。","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":42,"n":43,"ch":"第五章 锂离子电池材料","sec":"3.1 正极材料","code":"3.1","id":"ch05-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"三元材料（LiNixCoyMnzO4）","o":[],"a":["一类同时含镍、钴、锰的正极材料，具有与 LiCoO₂ 一样的层状结构（R-3m 空间群），常见的有三种配方：LiNi₁/₃Co₁/₃Mn₁/₃O₄、LiNi₀.₄Co₀.₂Mn₀.₄O₄ 和 LiNi₀.₅Co₀.₂Mn₀.₃O₄。"],"exp":"释义取自该页的标题行、三种配方行与结构说明行。它是层状结构（R-3m 空间群），不要与 LiMn₂O₄ 和 Li₄Ti₅O₁₂ 的尖晶石结构混在一起，也不要把它当作负极材料。","ev":"三元材料--LiNixCoyMnzO4\nLiNi1/3Co1/3Mn1/3O4\nLiNi0.4Co0.2Mn0.4O4\nLiNi0.5Co0.2Mn0.3O4\nLiNixCoyMnzO4具有与LiCoO2一样的层状结构（R-3m空间群）,常见的有三种配方:","keys":[],"ref":"第 29 页","hint":"","score":2},{"i":43,"n":44,"ch":"第五章 锂离子电池材料","sec":"3.2 负极材料","code":"3.2","id":"ch05-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"石墨层间化合物（GIC）","o":[],"a":["碳基负极材料的典型代表，工作原理是 Li⁺ 嵌入-脱嵌反应。锂嵌入后形成 Li-GIC，LiₓC 中 0<x<1，x=1 时对应完整晶态石墨，理论容量为 372 mAh/g；多数碳材料 x 处于 0-0.5，与碳素种类结构、电解质组成、电极结构及嵌入速率有关。"],"exp":"定义取自该页的典型例子与取值范围两句，注意 x=1 才有 372 mAh/g，多数碳材料只能到 0-0.5。此处的 372 mAh/g 与按 LiC₆ 算出的 372.07 mAh/g 是两个不同写法，不能混用。","ev":"典型：石墨层间化合物GIC，嵌入Li形成Li-GIC，LixC中0<x<1。x=1时完整晶态石墨，理论容量为372mAh/g\n多数C材料x=0-0.5，与碳素种类结构、电解质组成、电极结构及嵌入速率有关。","keys":[],"ref":"第 38 页","hint":"","score":2},{"i":44,"n":45,"ch":"第五章 锂离子电池材料","sec":"3.2 负极材料","code":"3.2","id":"ch05-term-009","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"SEI 膜","o":[],"a":["固体电解质界面膜。首次充电时电解液在负极表面达到还原电位（约 1.0 V 以下）而分解，产物（Li₂CO₃、LiF、Li₂O、烷基锂及有机低聚物等）沉积成膜。它电子绝缘、离子导通，允许 Li⁺ 通过而阻止电子与溶剂分子穿越，从而抑制电解液持续分解与溶剂共嵌入；但成膜消耗活性 Li⁺，使首次库仑效率仅约 90%。"],"exp":"释义按形成过程、组成、两项作用与首效代价组织。核心是“电子绝缘、离子导通”，不要写成电子导电；首效约 90% 的原因是不可回收的活性 Li⁺ 被消耗。","ev":"作用① 电子绝缘、离子导通：允许 Li⁺ 通过而阻止电子与溶剂分子穿越 → 电解液不再被持续还原","keys":[],"ref":"第 41 页","hint":"","score":2},{"i":45,"n":46,"ch":"第五章 锂离子电池材料","sec":"3.2 负极材料","code":"3.2","id":"ch05-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"钛酸锂","o":[],"a":["氧化钛与锂的复合氧化物，具有尖晶石结构 Li₄Ti₅O₁₂，工作原理是可以嵌入 Li⁺，反应为 3Li + Li₄Ti₅O₁₂ → Li₇Ti₅O₁₂（岩盐结构），充电结束时在尖晶石和岩盐结构两相区出现电压平台。优点是骨架结构稳定、体积变化小、零应变、循环寿命长、充放电效率高且没有 SEI 膜；缺点是电压平台高，1.5V，使组成电池的输出电压偏低。"],"exp":"钛酸锂是尖晶石型 Li₄Ti₅O₁₂ 负极：嵌锂时 3Li + Li₄Ti₅O₁₂ → Li₇Ti₅O₁₂，产物转为岩盐结构，两相共存给出约 1.5V 的平坦平台。骨架稳定、体积变化接近零、无 SEI，使循环寿命和安全性突出；代价是平台偏高、拉低全电池电压，所以适合快充与长寿命场景，不适合追求高能量密度。易错点是嵌锂产物仍写成尖晶石。","ev":"钛酸锂：氧化钛与锂的复合氧化物，尖晶石结构Li4Ti5O12\n工作原理：可以嵌入Li+\n3Li + Li4Ti5O12 → Li7Ti5O12(岩盐结构)\n充电结束：尖晶石和岩盐结构两相区的电压平台出现","keys":[],"ref":"第 44 页","hint":"","score":2},{"i":46,"n":47,"ch":"第五章 锂离子电池材料","sec":"Li–O₂ 电池","code":"","id":"ch05-term-010","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"氧化还原介体","o":[],"a":["一类可溶于电解液、在电极与反应物之间传递电子的催化剂，与固定在电极表面的催化剂不同。在锂–氧电池中可降低充电过电位；但可溶性介体也可能穿过隔膜到达锂金属负极，产生不利的穿梭反应，因此需要自保护等策略。"],"exp":"释义抓住“可溶、传递电子”两个要点，并补充原文随后指出的穿梭风险：介体可能穿过隔膜到达锂金属负极，因此出现自保护型介体策略。不要把它与固定在正极表面的非均相催化剂混为一谈。","ev":"将可溶性的氧化还原介体加入电解液，让它在电极与反应物之间传递电子。","keys":[],"ref":"第 83 页","hint":"","score":2},{"i":47,"n":48,"ch":"第五章 锂离子电池材料","sec":"Li–S 电池","code":"","id":"ch05-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"多硫化物穿梭效应","o":[],"a":["锂硫电池在锂负极侧面临的挑战。溶入电解液的长链多硫化锂（Li₂S₄至Li₂S₈）扩散到锂负极后，被化学还原（而非电化学还原）为低价多硫化物，再扩散回硫正极被重新氧化。这种寄生式穿梭相当于内部氧化还原短路，会造成电池自放电并降低循环库仑效率。"],"exp":"定义的三个要点是物种（溶解的长链多硫化锂）、负极侧为化学还原、后果是自放电与低库仑效率。不要与锂负极侧 SEI 不均一、或正极侧多硫化锂溶解混为一谈。","ev":"溶解于电解液中的长链多硫化锂（Li₂S₄至Li₂S₈）可以扩散至锂负极，通过化学还原反应（而非电化学还原）生成低阶多硫化物。这些产物随后又可扩散回硫正极，被重新氧化。","keys":[],"ref":"第 95 页","hint":"","score":2},{"i":48,"n":49,"ch":"第五章 锂离子电池材料","sec":"Li–S 电池","code":"","id":"ch05-term-008","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"蛋黄-壳结构（yolk–shell）","o":[],"a":["硫正极无机基体材料的一种形貌设计。典型例子是硫–二氧化钛体系：用 TiO₂ 壳层均匀包覆硫纳米颗粒，并把多硫化锂限域在壳层内部。"],"exp":"该术语的要点是壳层的两项功能：均匀包覆硫纳米颗粒、把多硫化锂限域在壳层内部，属于无机基体材料一类。不要与导电聚合物的部分容纳体积变化、多孔结构提供传质通道这两种功能混淆。","ev":"研究人员设计了硫–二氧化钛（TiO₂）蛋黄–壳结构，利用TiO₂壳层均匀包覆硫纳米颗粒，并将多硫化锂限域在壳层内部。","keys":[],"ref":"第 105 页","hint":"","score":2},{"i":49,"n":50,"ch":"第五章 锂离子电池材料","sec":"锂金属负极","code":"","id":"ch05-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"人工 SEI 膜","o":[],"a":["针对不稳定 SEI 问题，一条有前景的解决思路是制备人工 SEI 膜。与之相对，锂金属与电解液反应自然生成的 SEI 通常不均匀，无法充分钝化锂表面。"],"exp":"释义依据总结页第（4）条，并结合前面关于 SEI 不均一、不能充分钝化锂表面的讨论。原文只称其为有前景的办法，并未说它能同时解决枝晶或无限的体积变化问题。","ev":"(4) The fabrication of artificial SEI films is a promising approach to resolve the unstable SEI problem.","keys":[],"ref":"第 117 页","hint":"","score":2},{"i":50,"n":51,"ch":"第六章 超级电容器","sec":"1.1 概述与分类","code":"1.1","id":"ch06-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"超级电容器","o":[],"a":["相对于传统电容器而言具有更高容量的一种电容器，通过极化电解质来存储能量。它介于电容器和电池之间的储能器件：既具有电容器可以快速充放电的特点（功率密度约 1-10 kW/kg），又具有电池的储能特性。"],"exp":"依据 S3，定义落在三处：靠极化电解质储能、处在电容器与电池之间、兼有快速充放电（功率密度约 1-10 kW/kg）与电池储能特性。只答“大容量电容器”会漏掉介于两者之间这一关键定位。","ev":"超级电容器（supercapacitor），是相对于传统电容器而言，具有更高容量的一种电容器。通过极化电解质来存储能量。\n超级电容器是介于电容器和电池之间的储能器件，它既具有电容器可以快速充放电的特点，功率密度约1-10kW/kg,又具有电池的储能特性。","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":51,"n":52,"ch":"第六章 超级电容器","sec":"1.1 概述与分类","code":"1.1","id":"ch06-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"双电层电容","o":[],"a":["靠正负离子在固体电极与电解液之间的表面上分别吸附、造成两固体电极之间电势差来实现能量存储的电容。充电时电解液中阴阳离子在电极上电荷引力的作用下分别聚集到两个固体电极表面，放电时离开表面返回电解液本体；储能过程是物理过程，没有化学反应且完全可逆，容量随所选电极材料有效比表面积的增大而增大，因而允许大电流快速充放电。"],"exp":"依据S7的定义、充放电两侧的过程描述与该页关于可逆性的结论。判断要点是它不涉及法拉第反应，这与蓄电池的电化学储能过程不同，也正是它比电容低于法拉第赝电容的原因。","ev":"由于正负离子在固体电极与电解液之间的表面上分别吸附，造成两固体电极之间的电势差，从而实现能量的存储。\n这种储能原理允许大电流快速充放电，其容量大小随所选电极材料的有效比表面积的增大而增大。\n充电时，在固体电极上电荷引力的作用下，电解液中阴阳离子分别聚集两个固体电极的表面；\n双电层的厚度取决于电解液的浓度和离子大小。\n其储能过程是物理过程，没有化学反应，且过程完全可逆，这与蓄电池电化学储能过程不同。","keys":[],"ref":"第 7 页","hint":"","score":2},{"i":52,"n":53,"ch":"第六章 超级电容器","sec":"1.1 概述与分类","code":"1.1","id":"ch06-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"法拉第赝电容","o":[],"a":["也叫法拉第准电容，指电极活性物质在电极表面或体相中的二维、三维空间上进行欠电位沉积，发生高度可逆的化学吸附或氧化还原反应，产生与电极充电电位有关的电容。这种体系的电压随电荷转移的量呈线性变化，表现出电容特征，是作为双电层型电容器的一种补充形式。在电极面积相同的情况下，它的比电容是双电层电容器的10-100倍，并拥有较大的比容量和能量密度，但因牵涉化学反应而常带有不可逆成分，可逆性与循环性能相对较差。"],"exp":"定义句出自S9，倍数与优缺点出自S11。它的长处和短处同源：能量密度来自可逆的法拉第反应，循环性能的短板也来自同一反应中的不可逆成分。","ev":"法拉第赝电容器也叫法拉第准电容，是在电极表面活体相中的二维或三维空间上，电极活性物质进行欠电位沉积，发生高度可逆的化学吸附或氧化还原反应，产生与电极充电电位有关的电容。这种电极系统的电压随电荷转移的量呈线性变化，表现出电容特征，故称为“准电容”，是作为双电层型电容器的一种补充形式。","keys":[],"ref":"第 9 页","hint":"","score":2},{"i":53,"n":54,"ch":"第六章 超级电容器","sec":"1.1 概述与分类","code":"1.1","id":"ch06-term-007","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"混合型超级电容器","o":[],"a":["一极采用传统电池电极并通过电化学反应储存和转化能量，另一极通过双电层储存能量的一种超级电容器。其正负极储能机理不同，因此具有双电层电容器和电池的双重特征；充放电速度、功率密度、内阻、循环寿命等性能主要由电池电极决定，充放电过程中电解液体积和电解质浓度也会改变。"],"exp":"定义抓住“一极电池型、一极双电层型”的非对称结构；性能主要由电池电极决定是原文强调的推论。不要与复合型超级电容器混淆，后者是在同一电极的材料层面混合碳材料与氧化物/导电聚合物。","ev":"一极采用传统的电池电极并通过电化学反应来储存和转化能量，另一极则通过双电层来储存能量的一种超级电容器。","keys":[],"ref":"第 13 页","hint":"","score":2},{"i":54,"n":55,"ch":"第六章 超级电容器","sec":"1.1 概述与分类","code":"1.1","id":"ch06-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"锂离子电容器","o":[],"a":["属于混合型超级电容器的一类。充电时电解液中的Li⁺嵌入石墨层间形成嵌锂石墨，同时电解液中的阴离子吸附在活性炭正极表面形成双电层；放电时Li⁺从负极材料中脱出回到电解液，正极活性炭与电解液界面间的双电层解离、阴离子从正极表面释放，电子由负极经外电路到达正极。"],"exp":"S14把它的结构归在混合型超级电容器之下，S15给出充放电两侧的机理，要点是负极靠Li⁺嵌入脱出储电、正极始终保持双电层储电。","ev":"电解液中的Li+嵌入到石墨层间形成嵌锂石墨，同时，电解液中的阴离子则吸附在活性炭正极表面形成双电层。\nLi+从负极材料中脱出回到电解液中，正极活性炭与电解液界面间产生的双电层解离，阴离子从正极表面释放，同时电子从负极通过外电路到达正极。","keys":[],"ref":"第 15 页","hint":"","score":2},{"i":55,"n":56,"ch":"第六章 超级电容器","sec":"1.1 概述与分类","code":"1.1","id":"ch06-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"有机电解液","o":[],"a":["以有机溶剂和电解质盐组成的超级电容器电解液。水的分解电压较低，采用有机电解液可以提高工作电压，从而按 E=½CU² 显著提高储电性能；代价是电导率、安全性和成本控制要求更高。"],"exp":"第 18 页指出水的分解电压较低，为提高储电性能采用有机电解液；第 49 页的能量公式说明提高电压窗口 U 对能量提升最有效。两者结合即可理解有机电解液的意义与代价。","ev":"水的分解电压较低，为了提高储电性能，采用有机电解液","keys":[],"ref":"第 18 页","hint":"","score":2},{"i":56,"n":57,"ch":"第六章 超级电容器","sec":"碳电极与赝电容材料","code":"","id":"ch06-term-008","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"活性炭（超级电容器电极材料）","o":[],"a":["超级电容器最常用的双电层电极材料，优势是成本低、比表面积高、实用性强、制备工艺成熟，比容量可达 500F/g、一般为 200F/g。性能受炭化与活化条件（高温处理）、孔分布、表面官能团和杂质影响；研究趋势是材料复合、降低成本。"],"exp":"释义按优势、性能影响因素、研究趋势三块组织。关键数字是最高 500F/g、一般 200F/g；影响因素中“表面官能团”与 S55 的含氧官能团影响导电性和漏电电流相衔接。","ev":"1、成本低\n2、比表面积高\n3、实用性强\n4、生产制备工艺成熟\n5、高比容量，能达到500F/g，一般为200F/g","keys":[],"ref":"第 22 页","hint":"","score":2},{"i":57,"n":58,"ch":"第六章 超级电容器","sec":"碳电极与赝电容材料","code":"","id":"ch06-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"碳气凝胶","o":[],"a":["由凝胶经丙酮置换、液体 CO₂ 置换、超临界干燥得到气凝胶后再炭化制得的多孔碳材料，用作超级电容器的电容炭。制备路线以甲醛、间二苯酚为原料，在 Na₂CO₃ 催化下热凝成凝胶。它的优点是电子导电性好，缺点是制备工艺复杂、所用药品毒性较大。用它制成的电容器产品性能为功率 4000W/kg、能量 1Wh/kg，并在与纳米孔玻态炭的比较中指出其最佳比容量 170F/g 偏低、超临界干燥周期长且费用高。"],"exp":"定义与优缺点出自 S25 的制备路线与结论：甲醛/间二苯酚在 Na₂CO₃ 催化下热凝，经丙酮置换、液体 CO₂ 置换与超临界干燥得气凝胶，再炭化。性能数据与对比数据分别见 S61 和 S63。它的短板集中在制备环节而非导电性。","ev":"甲醛、间二苯酚\n以Na2CO3催化热凝\n凝胶\n丙酮置换\n无水凝胶\n液体CO2置换\n超临界干燥\n气凝胶\n炭化\n碳气凝胶\n优点：电子导电性好\n缺点：制备工艺复杂\n所用药品毒性较大","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":58,"n":59,"ch":"第六章 超级电容器","sec":"研究进展","code":"","id":"ch06-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"等效串联电阻（ESR）","o":[],"a":["超级电容器内部各接触与传质环节等效到串联回路中的电阻，用 R 表示、单位为 Ω。它决定最大功率 Pm=U²/(4R)，ESR 越大，欧姆极化与发热越大，可用功率越低。"],"exp":"第 49 页在能量与功率计算中给出 Pm=U²/(4R)，并注明 R 为等效串联电阻 ESR（Ω）；质量比功率为 Pm/m。因此降低 ESR 是提高功率密度的关键。","ev":"R 为等效串联电阻 ESR（Ω）","keys":[],"ref":"第 49 页","hint":"","score":2},{"i":59,"n":60,"ch":"第六章 超级电容器","sec":"研究进展","code":"","id":"ch06-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"hard","q":"玻态炭","o":[],"a":["一类用作多孔电容炭的材料，电导率高、机械性能好，但结构致密、慢升温制作难、价格高。把它做成活性玻态炭只能表层活化，得到厚15-20um的多孔碳层，多孔碳层电导率高、比功率18KW/L，但电容的比能量很低，只有0.07 Wh/L；做成整体多孔的纳米孔玻态炭后比能量提高，并可通过快速升温炭化使成本大降。"],"exp":"释义取自 S62：电导率高、机械性能好，但结构致密、慢升温制作难、价格高；同页还给出活性玻态炭只能表层活化（多孔碳层厚 15-20 μm，比功率 18KW/L，比能量仅 0.07 Wh/L），而纳米孔玻态炭整体多孔、比能量提高且可快速升温炭化降本。","ev":"电导率高，机械性能好；\n结构致密，慢升温制作难，价格高。","keys":[],"ref":"第 62 页","hint":"","score":2},{"i":60,"n":61,"ch":"第七章 碳材料发展史","sec":"碳的杂化与同素异形体","code":"","id":"ch07-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"同素异形体","o":[],"a":["同一种元素形成的不同单质。碳的同素异形体包括金刚石、石墨、咔宾、富勒烯、石墨烯五种碳单质，其中金刚石为面心立方晶体。S41 又把石墨、结晶 C₆₀、咔宾、金刚石四种单质碳的结构与性质放进同一张表并列比较。"],"exp":"同素异形体的判断标准是「同一种元素、不同单质」，与形态或用途无关。碳的五种单质包括金刚石、石墨、咔宾、富勒烯和石墨烯，它们的共同点是都由碳组成，差别在晶体结构与性质；金刚石是面心立方，石墨是层状六方，咔宾是一维链。","ev":"（1） 金刚石（diamond）\n面心立方晶体","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":61,"n":62,"ch":"第七章 碳材料发展史","sec":"碳的杂化与同素异形体","code":"","id":"ch07-term-010","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"人造石墨","o":[],"a":["以石油焦、沥青焦等为原料，经煅烧、配料、成型、焙烧、浸渍和石墨化等工序制得的人造石墨材料，如等静压石墨、模压石墨、挤压石墨，常用作电极材料。"],"exp":"第 35 页把石墨分为天然石墨和人造石墨，并列举等静压石墨、模压石墨、挤压石墨，注明其作电极材料。人造石墨的性能可通过原料与工艺调控，是电碳材料的重要基础。","ev":"石墨可分为天然石墨和人造石墨，如等静压石墨、模压石墨、挤压石墨（作电极材料）","keys":[],"ref":"第 35 页","hint":"","score":2},{"i":62,"n":63,"ch":"第七章 碳材料发展史","sec":"碳的杂化与同素异形体","code":"","id":"ch07-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"hard","q":"咔宾","o":[],"a":["咔宾（carbyne）是碳的同素异形体之一，呈线状，单元链长 10-12 个碳原子，属六方晶体，为树脂状组织的白色白碳。它 1968 年在石墨片麻岩中被发现，其后人工合成少许。同页还说明它由 sp 杂化轨道形成，有 2 个σ键、2 个π键，分聚炔与累积烯烃两种类型。"],"exp":"咔宾是一维链状碳：sp 杂化，每个碳有 2 个 σ 键和 2 个 π 键，按链中键的排列分为聚炔与累积烯烃两类。它呈白色树脂状、属六方晶体，单元链长约 10-12 个碳原子，1968 年在石墨片麻岩中发现；后续研究关注其半导体/超导性质、生物相容性以及由累积烯烃向金刚石转化的可能。","ev":"线状，单元链长10-12C原子，六方晶体；\n树脂状组织，白色，白碳\n1968年于石墨片麻岩中发现，其后人工合成少许；","keys":[],"ref":"第 36 页","hint":"","score":2},{"i":63,"n":64,"ch":"第七章 碳材料发展史","sec":"碳的杂化与同素异形体","code":"","id":"ch07-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"富勒烯","o":[],"a":["富勒烯（fullerene）是 1985 年发现的新碳相。当 sp² 杂化轨道形成的六圆环在一起形成某些五圆环时，它就不再呈平面状而是呈现球状笼形结构。C₆₀ 由 20 个六元环、12 个五元环构成，六元环增加时可形成更大的球形分子，上限是 C₉₆₀。"],"exp":"富勒烯是 1985 年发现的新碳相，由 sp² 碳组成封闭笼形分子；在六元环网络中引入五元环后，片层无法保持平面而弯曲成球。C₆₀ 是最典型代表，由 12 个五边形和 20 个六边形构成截角二十面体；六元环继续增加可形成更大的笼，原文给出的上限是 C₉₆₀。它属于 0D 碳材料，与 1D 碳纳米管、2D 石墨烯并列。","ev":"（4） 富勒烯（fullerene）\n1985年发现的新碳相；当SP2杂化轨道形成的六圆环在一起形成某些五圆环时，它就不再呈平面状而是呈现球状笼形结构；\nC60 20个六元环、12个五元环，当六元环增加时，则可形成更大的球形分子；最大到C960。","keys":[],"ref":"第 38 页","hint":"","score":2},{"i":64,"n":65,"ch":"第七章 碳材料发展史","sec":"碳的杂化与同素异形体","code":"","id":"ch07-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"石墨烯","o":[],"a":["石墨烯（graphene）是碳的同素异形体中的第（5）种，相关页给出 Andre Geim 与 Konstantin Novoselov 两个名字以及 RANDOM WALK TO GRAPHENE 的字样。在碳材料的发展一节里，石墨烯与富勒烯球、碳纳米管、其它准纳米炭材料一起被归入纳米炭。这一页没有给出石墨烯的制备方法和性能数据。"],"exp":"石墨烯是单层 sp² 碳按蜂窝状排列的 2D 晶体，也是石墨、碳纳米管和富勒烯的基本结构单元。第 7 章只把它作为碳材料发展史的一站：条目编号、Geim 与 Novoselov 的名字以及「RANDOM WALK TO GRAPHENE」都出现在这一页，并与富勒烯球、碳纳米管一起归入纳米炭；具体的制备方法与性能数据要到第 10 章才展开。","ev":"（5）石墨烯（graphene）\nAndre Geim\nKonstantin Novoselov\nRANDOM WALK TO GRAPHENE","keys":[],"ref":"第 40 页","hint":"","score":2},{"i":65,"n":66,"ch":"第七章 碳材料发展史","sec":"碳材料的分类","code":"","id":"ch07-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"碳材料","o":[],"a":["由碳元素构成的无机材料。常见品种包括石墨、金刚石、咔宾、富勒烯、煤炭、木炭、竹炭、活性炭、骨炭、炭黑、碳纤维、碳纸、碳布、纳米炭、椰壳炭、果核炭等。定义强调「由碳元素构成」，因此碳纤维、活性炭等不同形态或用途的碳材料都归入其中。"],"exp":"定义出自 S42 首句，紧随其后的列举说明碳材料覆盖面很广：从煤炭、木炭等传统碳材料，到碳纤维、活性炭、炭黑，再到富勒烯、纳米炭等新型碳材料。S13 的另一句定义强调「纯的碳元素组成」，两处一致。判断时抓碳元素构成，不要按「是不是单质」把炭黑、活性炭排除。","ev":"碳材料是由碳元素构成的无机材料\n石墨、金刚石、咔宾、富勒烯、煤炭、木炭、竹炭、活性炭、骨炭、炭黑、 碳纤维、碳纸、碳布、\n纳米炭、椰壳炭、果核炭","keys":[],"ref":"第 42 页","hint":"","score":2},{"i":66,"n":67,"ch":"第七章 碳材料发展史","sec":"碳材料的分类","code":"","id":"ch07-term-007","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"结构碳材料","o":[],"a":["按用途划分的一类碳材料，以力学性能为主要特点，其构件主要用于承受力的作用，例如 PAN 碳纤维、中间相沥青基碳纤维。与之相对的是功能碳材料，主要发挥导电、导热、隔热、吸附、耐高温、耐摩擦、润滑、刀具等力学性能以外的功能。"],"exp":"定义抓住“按用途分、以力学性能为主、构件承受力”三点，例子是 PAN 碳纤维与中间相沥青基碳纤维。不要与按分子结构分的金刚石、石墨、炔碳、富勒烯球和纳米炭混淆。","ev":"（2）从用途上分\n结构碳材料\n以力学性能为主要特点的场合，其构件主要用于承受力的作用。\nPAN碳纤维、中间相沥青基碳纤维","keys":[],"ref":"第 44 页","hint":"","score":2},{"i":67,"n":68,"ch":"第七章 碳材料发展史","sec":"碳材料的分类","code":"","id":"ch07-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"功能碳材料","o":[],"a":["以导电、导热、高温隔热、吸附、耐高温、耐摩擦、高强刀具等力学性能以外的功能为主要用途的碳材料。常见方向包括导电（石墨电极、导电炭黑）、导热（高导热石墨、泡沫碳）、隔热（碳毡、泡沫碳、石墨砖）、吸附（活性炭、活性碳纤维）、耐高温、摩擦、润滑和刀具等。"],"exp":"第 45 页按用途把碳材料分为结构碳材料和功能碳材料；功能碳材料强调力学性能以外的功能，并按导电、导热、隔热、吸附、耐高温、摩擦、润滑、刀具逐项举例。","ev":"以导电、导热、高温隔热、吸附、耐高温、耐摩擦、高强刀具等，主要发挥力学性能以外的功能的场合","keys":[],"ref":"第 45 页","hint":"","score":2},{"i":68,"n":69,"ch":"第七章 碳材料发展史","sec":"工业化碳制品","code":"","id":"ch07-term-006","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"核石墨","o":[],"a":["核石墨是工业化碳制品之一，用途是中子减速剂和内壁防辐射材料。同一页还写明核电占世界总电量 15％、我国不足 2％。S35 讲石墨用途时也提到作为中子减速剂用于原子反应堆。"],"exp":"核石墨是石墨在核工业中的功能化应用：利用高热导、高纯度与低中子吸收截面，做中子减速剂和反应堆内壁的防辐射材料。它不是一种新的碳单质，而是对石墨纯度和性能等级的要求；同页用世界核电约 15%、我国不足 2% 的占比说明其需求与核电规模直接相关。","ev":"（3）核石墨\n中子减速剂\n内壁防辐射材料\n核电占世界总电量15％\n我国不足2％","keys":[],"ref":"第 52 页","hint":"","score":2},{"i":69,"n":70,"ch":"第七章 碳材料发展史","sec":"工业化碳制品","code":"","id":"ch07-term-008","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"炭黑","o":[],"a":["一种传统碳材料，起源是墨的原料“烟炱”。《齐民要术》称其“至轻微，不宜露筛，喜失飞去”；《梦溪笔谈》称“黑光如漆，松烟不及也”；《天工开物》记载烟窑如舟中雨蓬式。1864 年美国开始以人造气体经过燃烧、用石板收集并用刮板刮下，获得优质炱。"],"exp":"按「起源—古代记载—近代生产—结构分类」四层组织：起源是墨的原料烟炱；《齐民要术》《梦溪笔谈》《天工开物》分别记载其轻细、黑光如漆和烟窑形制；1864 年美国开始以人造气体燃烧、石板收集、刮板刮下获得优质炱。现代炭黑按生产方法分接触法（槽黑）与非接触法（炉法、裂解），基本结构是乱层石墨，皮部较有序、内部乱层。它属于传统碳材料，不要与活性炭的刻蚀/模板法制备混淆。","ev":"起源：墨的原料——“烟炱”\n《齐民要术》 ——“此物至轻微，不宜露筛，喜失飞去，不可不慎。”\n《梦溪笔谈》 ——“黑光如漆，松烟不及也”\n《天工开物》——烟窑： 如舟中雨蓬式\n1864年美国开始以人造气体经过燃烧，以石板为收集面，用刮板刮下而获得优质炱。","keys":[],"ref":"第 54 页","hint":"","score":2},{"i":70,"n":71,"ch":"第八章 传统碳材料","sec":"1.1 什么是活性炭","code":"1.1","id":"ch08-term-001","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"活性炭","o":[],"a":["活性炭是经过活化、有活性的多孔炭，共同特征是“多孔”。英文 Activated carbon 强调制法，Active carbon 强调特性。制备上可用化学活化、物理活化、溶胶凝胶法或模板法；孔结构上按 IUPAC 分为微孔、介孔、大孔，分别主要贡献容量、速率和通道。"],"exp":"定义出自 S5，并同页给出 Activated carbon 与 Active carbon 的命名差别；制备方法见 S42，三类孔的分工见 S37。答成“木炭”或“骨炭”都不准确，原文把它们与活性炭区分开讲。","ev":"活性炭就是一种经过活化、有活性的多孔炭。","keys":[],"ref":"第 5 页","hint":"","score":2},{"i":71,"n":72,"ch":"第八章 传统碳材料","sec":"1.3 活性炭的孔结构","code":"1.3","id":"ch08-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"微孔","o":[],"a":["按杜比宁划分，直径小于 2.0 nm 的孔；按 IUPAC 划分同样以 2 nm 为界（超微孔小于 0.7 nm）。微孔提供绝大部分比表面积与吸附容量，是双电层储能的主战场；碘值主要反映微孔的发达程度。孔径必须与电解液离子尺寸匹配，过小离子进不去。"],"exp":"杜比宁划分见 S36，IUPAC 分界与功能见 S37。答题要同时写出“小于 2 nm”和“给容量/碘值看微孔”；只写“很小的孔”没有分。","ev":"小于2.0nm的叫微孔","keys":[],"ref":"第 36 页","hint":"","score":2},{"i":72,"n":73,"ch":"第八章 传统碳材料","sec":"1.3 活性炭的孔结构","code":"1.3","id":"ch08-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"大孔","o":[],"a":["按杜比宁划分，直径大于 100 nm 的孔；按 IUPAC 划分以大于 50 nm 为界。大孔对吸附比表面积贡献很小，主要起“总管廊”的传输通道作用，把吸附质送到微孔入口；在超级电容器中作为电解液储库和缓冲空间，但过多会降低体积能量密度。"],"exp":"S36 给出杜比宁的“大于 100 nm”，S37 给出 IUPAC 的“大于 50 nm”并说明两套体系并存。答题要注明按哪套划分，再写“通道/储库、过多降低体积能量密度”，不能把大孔说成主要吸附空间。","ev":"大于100nm的叫大孔","keys":[],"ref":"第 36 页","hint":"","score":2},{"i":73,"n":74,"ch":"第八章 传统碳材料","sec":"1.3 活性炭的孔结构","code":"1.3","id":"ch08-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"介孔","o":[],"a":["按 IUPAC 分类，孔径 2~50 nm 的孔；按杜比宁划分则指大于 2.0 nm、小于 50 nm 的孔。吸附中主要起毛细凝聚与传输通道作用，吸附亚甲蓝、腐殖酸、色素等大分子，亚甲蓝吸附值主要反映介孔及更大孔的数量；在超级电容器中作为离子快速传输通道，缩短扩散路径、降低内阻，适量介孔可提高倍率性能与功率密度。"],"exp":"IUPAC 分类与功能分工出自 S37；杜比宁划分的介孔定义在 S36。S37 下方的“注意”特别说明教材两套划分并存，考试按 IUPAC 的 2 nm / 50 nm 分界作答。","ev":"介孔 | 2 ~ 50 nm | 毛细凝聚与传输通道；吸附亚甲蓝、腐殖酸、色素等大分子——亚甲蓝吸附值主要反映介孔及更大孔的数量 | 离子的快速传输通道，缩短扩散路径、降低内阻；介孔适量可显著提高倍率性能与功率密度","keys":[],"ref":"第 37 页","hint":"","score":2},{"i":74,"n":75,"ch":"第八章 传统碳材料","sec":"1.4 活性炭的制备与分类","code":"1.4","id":"ch08-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"化学活化","o":[],"a":["以 KOH、NaOH、ZnCl₂、H₃PO₄ 等化学药品为活化剂，先与原料浸渍混合，再一同炭化活化的方法。机理是活化剂的刻蚀、插层与氧化还原反应造孔，兼具脱水抑焦作用，促进交联与孔隙生成；造孔能力强，比表面积可达 2000~3000 m²/g，收率较高（50%以上）、活化温度较低，但必须酸洗除杂，废液腐蚀性强、污染大。"],"exp":"方法分类出自 S42，机理与收率对比出自 S44；S43 补充“化学活化中还有插层的因素，因此比表面积和收率较物理活化高”。注意 S42 列的 NaCl、Na₂CO₃ 只是例子，S44 的对比表还给出 NaOH、H₃PO₄。","ev":"（1）化学药品活化－化学活化\nKOH、ZnCl₂、NaCl、Na₂CO₃等等","keys":[],"ref":"第 42 页","hint":"","score":2},{"i":75,"n":76,"ch":"第八章 传统碳材料","sec":"1.4 活性炭的制备与分类","code":"1.4","id":"ch08-term-007","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"物理活化","o":[],"a":["以水蒸气、CO₂（或空气）等氧化性气体为活化剂，在高温下通过碳的选择性氧化造孔的方法。无定形碳与缺陷位优先被烧蚀而开孔，产品以微孔为主、孔径分布较窄、介孔少，比表面积一般 800~1500 m²/g；烧失较多、收率约 30%~50%，但无需酸洗、无废液。"],"exp":"定义出自 S42 的“气相活化－物理活化”，机理与指标出自 S44 对比表。答题要抓住“氧化性气体 + 选择性烧蚀 + 微孔为主”；把 KOH、ZnCl₂ 写进来就变成化学活化了。","ev":"（2）气相活化－物理活化\n水蒸气、二氧化碳等氧化性气体","keys":[],"ref":"第 42 页","hint":"","score":2},{"i":76,"n":77,"ch":"第八章 传统碳材料","sec":"1.4 活性炭的制备与分类","code":"1.4","id":"ch08-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"活性炭纤维","o":[],"a":["以 PAN、沥青、酚醛树脂或粘胶基碳纤维（毡）为原料，通常经物理活化制得的多孔纤维材料。由于纤维很细，产品以微孔为主，孔径分布集中；可制成纤维布、纤维毡，用于吸附、净化与储能。"],"exp":"S47 把它列为形态分类中的一种，S51 给出原料、活化方式与“以微孔为主”的结构特点。答题要区别于粒状/球状活性炭：纤维细、微孔为主、可做布和毡。","ev":"以PAN、沥青、酚醛树脂及粘胶基碳纤维（毡）为原料，通常采用物理活化方法制得活性碳纤维（毡）。由于碳纤维很细，因此产品以微孔为主。","keys":[],"ref":"第 51 页","hint":"","score":2},{"i":77,"n":78,"ch":"第八章 传统碳材料","sec":"2 炭黑的生产和应用","code":"2","id":"ch08-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"槽法炭黑","o":[],"a":["按生产方法分类属于接触法的一类碳黑，原料为天然气、焦炉气等。槽法炭黑温度高而且过度氧化，适合做色素炭黑。"],"exp":"分类与原料出自 S60；S65 补充槽法炭黑“温度高而且过度氧化，适合于色素炭黑”。不要与炉法炭黑、裂解炭黑混为一谈，后两者属于非接触法。","ev":"（1）接触法：     槽黑：天然气，焦炉气等","keys":[],"ref":"第 60 页","hint":"","score":2},{"i":78,"n":79,"ch":"第八章 传统碳材料","sec":"2 炭黑的生产和应用","code":"2","id":"ch08-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"炉法炭黑","o":[],"a":["按生产方法分类属于非接触法的一类碳黑，以气液态烃类为原料。生产要点是：气相碳源可用天然气、苯、焦油，高温 1260－1420℃。"],"exp":"分类出自 S60，生产温度与碳源出自 S62。注意原文把“炉法碳黑”与“裂解碳黑”并列写在非接触法下，两者不是同一类。","ev":"（2）非接触法： 炉法碳黑：气液态烃类\n裂解碳黑：天然气、乙炔","keys":[],"ref":"第 60 页","hint":"","score":2},{"i":79,"n":80,"ch":"第八章 传统碳材料","sec":"2 炭黑的生产和应用","code":"2","id":"ch08-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"炭黑","o":[],"a":["炭黑从墨的原料“烟炱”讲起，把碳黑的基本物理结构概括为典型的乱层石墨结构，皮部较有序、内部乱层。按生产方法分为接触法（槽黑）与非接触法（炉法碳黑、裂解碳黑），按用途分为橡胶碳黑、色素碳黑和导电碳黑；粒径主要通过 SEM 测定，比表面积常用碘吸附法和 BET 氮吸附法测定。"],"exp":"结构描述出自 S70；分类见 S60、S61，粒径测定见 S71，比表面积测定见 S72。原文没有把碳黑等同于石墨：S75 只是用石墨的电阻率与碳黑作对比。","ev":"五、 碳黑的基本物理结构\n——典型的乱层石墨结构，皮部较有序，内部乱层","keys":[],"ref":"第 70 页","hint":"","score":2},{"i":80,"n":81,"ch":"第九章 碳纤维及其复合材料","sec":"聚丙烯腈基碳纤维","code":"","id":"ch09-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"湿法纺丝","o":[],"a":["聚丙烯腈原丝制备的一种纺丝路线，纺丝温度为50－60 ℃。以该法得到的丝结构不够均匀、孔洞问题较为严重；与之相比，干湿法纺丝的原丝孔洞少、直径小、皮芯差异小，强度更高。粘胶基碳纤维同样采用湿法纺丝，粘胶液在硫酸等凝固浴中纺丝成形。"],"exp":"S11 给出湿法纺丝的位置与纺丝温度 50－60 ℃；其孔洞问题与干湿法的对比见 S19、S13，干湿法原丝强度比湿法高 50％以上；S25 说明粘胶液在硫酸等凝固浴中也用湿法纺丝。把它说成以空气层加第一凝固池成形的是干湿法纺丝，属于工艺路线混淆。","ev":"2.1 湿法纺丝:定义\n纺丝温度：50－60 ℃","keys":[],"ref":"第 11 页","hint":"","score":2},{"i":81,"n":82,"ch":"第九章 碳纤维及其复合材料","sec":"聚丙烯腈基碳纤维","code":"","id":"ch09-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"干湿法纺丝","o":[],"a":["又称干喷湿纺。纺丝液先经过空气层扩散并有效拉伸，再进入温度尽可能低的第一凝固池，使丝表面形成均匀而薄的凝固层；可纺高浓度、高黏度溶液，纺速可达 300 m/min 以上，原丝强度比湿法高 50％以上。"],"exp":"第 12 页给出干湿法纺丝的名称，第 13 页列出优点：丝孔径大、可纺高浓度高黏度溶液，纺速可达 300 m/min 以上，并因空气层拉伸和低温第一凝固池获得均匀致密的皮层，原丝强度比湿法高 50％以上。","ev":"先通过空气层的扩散及有效拉伸过程并在第一凝固池温度尽可能低的条件下阻止H2O过分的渗透","keys":[],"ref":"第 13 页","hint":"","score":2},{"i":82,"n":83,"ch":"第九章 碳纤维及其复合材料","sec":"聚丙烯腈基碳纤维","code":"","id":"ch09-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"预氧化","o":[],"a":["聚丙烯腈碳纤维制备中继纺丝之后、碳化之前的一道工序。目的是尽一切努力先把每一根PAN链变成梯形高分子链，并在氧化作用下交联，使分子链进一步碳化时不致于高温裂解。这一过程可拆成环化、氧化、扩散三个环节，并建议适当提高全同立构以利于梯形环构化。"],"exp":"该定义出自 S14 预氧化的目的，关键词是把 PAN 链变成梯形高分子链并在氧化作用下交联，从而在进一步碳化时不致于高温裂解。S15 补充了环化与立构的关系，并建议适当提高全同立构。答成去除表面浮碳或脱除裂解气体都不对，前者属表面处理，后者属碳化。","ev":"尽一切努力先把每一根PAN链变成梯形高分子链，并在氧化作用下交联，使分子链进一步碳化时不致于高温裂解。","keys":[],"ref":"第 14 页","hint":"","score":2},{"i":83,"n":84,"ch":"第九章 碳纤维及其复合材料","sec":"聚丙烯腈基碳纤维","code":"","id":"ch09-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"碳化","o":[],"a":["预氧丝转为碳纤维的工序。在惰性气氛中加热升温，使预氧丝内PAN梯形环构链通过相互作用逸出N₂、HCN等，使碳原子之间重排，变成准石墨化结构。碳化要控制保护气氛的选择、碳化温度、碳化时间和施加的张力，目的是在适当的模量条件下获得高强高形变的碳纤维。"],"exp":"S20 讲碳化过程原理，要点有三：惰性气氛中加热升温，预氧丝内 PAN 梯形环构链逸出 N₂、HCN 等并使碳原子重排成准石墨化结构；同时要控制保护气氛、碳化温度、碳化时间与施加张力，目的是在适当模量条件下获得高强高形变的碳纤维。答成让分子链梯形环构化以防高温裂解是预氧化的目的。","ev":"在惰性气氛中加热升温，使预氧丝内PAN梯形环构链通过相互作用逸出N2，HCN等，使碳原子之间重排，变成准石墨化结构","keys":[],"ref":"第 20 页","hint":"","score":2},{"i":84,"n":85,"ch":"第九章 碳纤维及其复合材料","sec":"聚丙烯腈基碳纤维","code":"","id":"ch09-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"石墨化","o":[],"a":["碳纤维碳化后的高温处理工序，温度约 2000-3000℃，使石墨微晶沿纤维轴高度取向，从而显著提高弹性模量。"],"exp":"第 20 页把石墨化放在碳化之后，温度 2000-3000 摄氏度，作用是让石墨微晶沿纤维轴高度取向、显著增强弹性模量。它与碳化的目的不同：碳化重在形成准石墨化结构并获得高强高形变，石墨化重在提高模量。","ev":"碳化后石墨化（2000-3000摄氏度）可以使石墨微晶沿纤维轴高度取向，显著增强弹性模量","keys":[],"ref":"第 20 页","hint":"","score":2},{"i":85,"n":86,"ch":"第九章 碳纤维及其复合材料","sec":"沥青基碳纤维","code":"","id":"ch09-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"各向同性沥青","o":[],"a":["热缩聚初期、芳香分子较小且杂乱取向、没有有序结构的沥青。分子量几百到一千多，从各个方向看性质相同，因而得名。通常由石油渣油或煤焦油沥青经空气液相氧化提高分子量、把软化点提高到 270℃ 以上制得，目的是提高收率并阻止中间相生成。"],"exp":"第 33 页的定义要点是芳香分子小、杂乱取向、没有有序结构，所以各方向性质相同；同页还说明原料一般选石油渣油和煤焦油沥青，并用空气液相氧化把软化点提高到 270℃ 以上。","ev":"因为从哪个方向看性质都一样，所以叫各向同性","keys":[],"ref":"第 33 页","hint":"","score":2},{"i":86,"n":87,"ch":"第九章 碳纤维及其复合材料","sec":"沥青基碳纤维","code":"","id":"ch09-term-004","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"中间相沥青","o":[],"a":["以低软化点的煤沥青、石油沥青或纯芳烃化合物为原料，经催化和低温惰性气体保护下热缩聚，沥青分子长大形成的流线型结构中间相。更具体地说，沥青在 350~450 ℃ 惰性气氛下继续热缩聚，芳香分子脱氢缩合、长到分子量一千到数千，变成盘状稠环大分子；这些“小盘子”靠 π 电子堆积平行叠起来，有序区浓度够高时析出 Brooks–Taylor 中间相小球，小球不断融并长大，最终形成连续液晶态沥青。用中间相沥青制备的碳纤维性能高，称高性能沥青纤维。"],"exp":"释义综合 S37 的机理与 S38 的制备条件：原料经催化、低温惰性气体保护热缩聚，芳香分子长大成盘状稠环大分子，靠 π 电子堆积形成中间相小球并融并成连续液晶态沥青。S31 说明中间相沥青制得的碳纤维性能高，称高性能沥青纤维，与各向同性沥青的通用级纤维相对。","ev":"采用低软化点的煤沥青、石油沥青或纯的芳烃化合物为原料，经过催化、低温惰性气体保护下热缩聚，沥青分子经热缩聚长大形成中间相流线型结构。","keys":[],"ref":"第 38 页","hint":"","score":2},{"i":87,"n":88,"ch":"第九章 碳纤维及其复合材料","sec":"复合材料基本概念","code":"","id":"ch09-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"化学气相渗透（CVI）","o":[],"a":["碳/碳复合材料致密化的一种工艺：将碳源气体（甲烷、丙烯等）通入碳纤维预制体，约 1000 ℃ 下裂解并在孔隙内沉积热解碳，孔隙逐渐填充而致密化，通常需要反复进行。特点是沉积均匀、可近净成型，但周期长、成本高，表层易结壳；工程上常先 CVI 封孔，再用树脂/沥青液相浸渍补密。"],"exp":"释义按工艺、特点、工程组合三块组织：碳源气高温裂解、孔隙内沉积热解碳并反复致密化；优点是沉积均匀、可近净成型，缺点是周期长、成本高、表层易结壳；工程上先 CVI 封孔再液相浸渍补密。不要与液相浸渍“快而便宜、致密度稍差”的特点混淆。","ev":"（1）化学气相渗透 CVI：碳源气（CH₄、C₃H₆）→ 约1000 ℃裂解 → 孔隙内沉积热解碳 → 反复致密化",
