<script>window.__QUIZ__ = {"meta":{"id":"化工原理分章精练","title":"化工原理 · 分章精练","engine":"教材 OCR 全文 + 逐字回查","source":"《化工原理》（第四版），杨祖荣主编，刘丽英、刘伟副主编，化学工业出版社，2021","generated":"","chunks":9,"accepted":106,"rejected":[],"mock":false},"questions":[{"i":0,"n":1,"ch":"绪论","sec":"绪论","code":"","id":"ch00-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"化工原理主要研究化工生产过程中各单元操作的________、典型设备及其设计计算方法。","o":[],"a":["基本原理"],"exp":"课程的三块内容是基本原理、典型设备、设计计算方法。填「基本原理」是因为后文紧接着展开的就是各类单元操作遵循的规律，设备与计算都建立在这些原理之上。","ev":"化工原理主要研究化工生产过程中各单元操作的基本原理、典","keys":[],"ref":"第 2 页","hint":"","score":2},{"i":1,"n":2,"ch":"绪论","sec":"绪论","code":"","id":"ch00-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述化工原理课程的四个基本概念与一个观点，并说明「过程平衡」在分析单元操作时的作用。","o":[],"a":["四个基本概念是物料衡算、能量衡算、过程平衡和过程速率，一个观点是经济核算的观点。物料衡算与能量衡算解决守恒关系，过程平衡给出过程能否进行、进行的方向和能达到的极限，过程速率描述过程进行的快慢，经济核算用于在多个可行方案中比较设备费与操作费。过程平衡的作用是把实际状态与平衡态的差距找出来：差距即推动力，平衡点即过程极限。"],"exp":"答题要覆盖三点：四个概念一个观点要列全；每个概念各管什么要一句话说清；过程平衡要落到「方向、极限、推动力」三个词上，这也是后面传热传质计算的共同起点。","ev":"经常会用到下列 4 个基本概念和一个观点，即物料衡算、能量衡算、过程平衡和速率这 4 个基本概念和建立一个经济核算的观点","keys":[],"ref":"第 3 页","hint":"","score":8},{"i":2,"n":3,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-fill-004","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"以大气压为基准，绝对压力高于大气压力时，高出部分称为________。","o":[],"a":["表压"],"exp":"以大气压为基准测得的压力有两种：绝对压力高于大气压时，高出部分为表压；低于大气压时，低出部分为真空度。表压等于绝对压力减大气压力，可由压力表直接读数。","ev":"若绝对压力高于大气压力，则高出部分称为表压","keys":[],"ref":"第 8 页","hint":"","score":2},{"i":3,"n":4,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-fill-009","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"以大气压为基准，绝对压力低于大气压力时，低出部分称为________。","o":[],"a":["真空度"],"exp":"绝对压力低于大气压力时，低出的部分称为真空度，真空度等于大气压力减绝对压力。若绝对压力高于大气压力，高出部分才是表压；两者都以大气压为基准，但方向相反，不能混用。","ev":"若绝对压力低于大气压力，则低出部分称为真空","keys":[],"ref":"第 8 页","hint":"","score":2},{"i":4,"n":5,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"在静止的、连续的同种流体内，位于同一水平面上各点的压力均相等，压力相等的面称为________。","o":[],"a":["等压面"],"exp":"静止同种连续流体中，水平面上各点压力相等，这样的面就是等压面。等压面是静力学基本方程的直接推论，也是 U 形压差计测压时寻找等压面、列压力平衡式的依据。","ev":"因此,在静止的、连续的同种流体内，位于同一水平面上各点的压力均相等。压力相等的面称为等压面。","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":5,"n":6,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-fill-005","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"U 形压差计中指示液应与被测流体不互溶、不起化学反应，且其密度________被测流体密度。","o":[],"a":["大于"],"exp":"指示液必须与被测流体不互溶且不反应，否则界面不清、读数失真；同时指示液密度要大于被测流体密度，才能在两接口压力不等时形成稳定的液面高差。若密度较小，指示液会上浮，无法按静力学关系读数。","ev":"要求指示液与被测流体不互洲，不起化学反应，且其密度大于被测流体密度","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":6,"n":7,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-fill-010","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"在同一静止流体中，单位质量流体的位能与静压能之和称为________。","o":[],"a":["总势能"],"exp":"静止流体只有位能和静压能两种能量形式，二者之和称为总势能。静力学基本方程的能量形式表明，位置变化时位能与静压能可以互相转换，但总势能保持不变，这正是静止流体能量守恒的体现。","ev":"上式表明，在同一静止流体中，处在不同位置流体的位能和静压能各不相同但二者之和即总势能保持不变。","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":7,"n":8,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述伯努利方程的物理意义和适用条件。","o":[],"a":["物理意义：伯努利方程是定态流动系统的机械能衡算式，表明单位质量流体的位能、动能、静压能，与外加功、能量损失之间的守恒和转换关系；理想流体无外加功、无损失时，各截面总机械能保持不变，但位能、动能和静压能之间可以相互转换。适用条件：重力场中定态、连续流动的不可压缩流体；所取两截面应与流动方向垂直，两截面间为连续定态流动；气体只有在两截面绝对压力变化率小于 20% 时才可近似按不可压缩流体处理；计算时两截面的压力基准和基准水平面要统一。"],"exp":"答题要抓住三点：方程本质是机械能衡算，总机械能守恒但各项可转换；实际流体要加外加功、减能量损失；适用对象是不可压缩流体，气体需压力变化不大才可近似。截面选取、基准面和压力基准的统一属于使用条件，也应点到。","ev":"以上 3 种能量均为流体在截面处所具有的机械能，三者之和称为某截面上流体的总机械能","keys":[],"ref":"第 18 页","hint":"","score":8},{"i":8,"n":9,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-fill-006","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"雷诺实验表明，流体在管路中流动存在两种截然不同的流型，即层流和________。","o":[],"a":["湍流"],"exp":"雷诺实验通过有色液体的流动形态揭示出两种流型：层流时质点沿管轴平行分层运动，互不混合；湍流时质点除沿轴向前进外还有径向脉动，互相碰撞混合。过渡区只是流型不确定的区域，不是第三种流型。","ev":"以上实验表明,流体在管路中流动存在两种截然不同的流型","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":9,"n":10,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-fill-011","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"湍流时，流体质点除了沿管轴方向向前流动外，其最基本的特征是存在________脉动。","o":[],"a":["径向"],"exp":"湍流时质点速度的大小和方向都随时间变化，其中垂直于管轴的径向脉动是湍流最基本的特征。正是这种径向脉动使质点互相碰撞混合，动量传递远大于层流，也使湍流的速度分布比层流平坦。","ev":"质点径向的脉动是溃流最基本的特征。","keys":[],"ref":"第 27 页","hint":"","score":2},{"i":10,"n":11,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-short-006","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述层流内层的形成、厚度变化及其对传热传质的影响。","o":[],"a":["流体在圆管内作湍流流动时，紧靠壁面处仍有一薄层流体受壁面阻滞和黏性支配，作层流流动，称为层流内层。层流内层的厚度随雷诺数增大而减薄；层内径向传递只能依靠分子运动，传热和传质阻力主要集中在这一薄层，因此它对传热、传质过程有重大影响。"],"exp":"回答要抓住三点：层流内层位于湍流边界层内紧贴壁面处；其厚度随 Re 增大而减小；层内没有质点脉动，径向传递靠分子扩散，热阻和传质阻力大。只写边界层或只写速度分布都不完整。","ev":"层流内层虽然很蒲，但却对传热和传质过程产生重大影响","keys":[],"ref":"第 29 页","hint":"","score":8},{"i":11,"n":12,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-short-004","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述边界层分离的产生原因及其对化工过程的正反两方面影响。","o":[],"a":["产生原因：流体流过曲面时，前半周流道收缩、流速增大、压力降低，边界层顺利发展；后半周流道扩大、流速降低、压力升高，沿流动方向出现逆压。边界层内流体受黏性剪应力和逆压双重作用，动能不断消耗，在壁面某点速度降为零，随后发生倒流，边界层脱离壁面，并在其后形成大量旋涡。影响：边界层分离使旋涡区质点碰撞混合加剧，机械能损失增大，流体输送中应设法避免或减弱；但分离造成的强烈混合又能强化传热和传质，有时反而加以利用。"],"exp":"答题要把逆压、动能耗尽、脱离壁面和旋涡形成这条因果链讲完整，只写流速降低或只说产生旋涡都不够。影响必须答出两面性：对输送不利，增大阻力；对混合、传热、传质有利，可强化过程。","ev":"边界层分离增加了机械能损耗，在流体输送中应设法避免或减弱，但它对混合、传热及传质等过程又起强化作用，故有时也要加以利用。","keys":[],"ref":"第 30 页","hint":"","score":8},{"i":12,"n":13,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-fill-007","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"管壁面凸出部分的平均高度称为________，它与管径的比值称为相对粗糙度。","o":[],"a":["绝对粗糙度"],"exp":"绝对粗糙度表示壁面凸起高度的平均值，单位是长度；只有把它除以管径得到相对粗糙度，才能反映粗糙元相对于流道尺寸的大小，因此摩擦系数图的参数用相对粗糙度。","ev":"管壁面凸出部分的平均高度称为绝对粗糙度(absolute roughness)，以ss 表示。","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":13,"n":14,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-fill-002","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"把流体流过管件或阀门的局部阻力折合成直径相同、长度为 lₑ 的直管所产生的阻力，lₑ 称为该管件或阀门的________。","o":[],"a":["当量长度"],"exp":"当量长度法把局部阻力换算成一段同直径直管的阻力，长度 lₑ 即当量长度，通常由实验测定。计算时它与阻力系数法二选一，同一管件不能两种方法重复计入。","ev":"式中，/。 称为管件或阀门的当量长度(equivalent length) 。","keys":[],"ref":"第 40 页","hint":"","score":2},{"i":14,"n":15,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-fill-008","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"根据计算目的，管路计算通常可分为________和操作型两类。","o":[],"a":["设计型"],"exp":"设计型计算是按规定输液量确定经济管径和供液点位能或压力，需要补充适宜流速这一条件；操作型计算则针对已知管路系统核算输送能力或所需压头。两类计算的已知量和求解目标不同。","ev":"根据计算目的，管路计算通常可分为设计型和操作型两类","keys":[],"ref":"第 42 页","hint":"","score":2},{"i":15,"n":16,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-short-003","t":"short","mode":"","bloom":"应用","diff":"hard","q":"管路计算中什么情况下需要采用试差法？简述试差法求流速的基本步骤。","o":[],"a":["当摩擦系数与流速相互关联、无法直接由方程求解时，例如已知管路和两端压差求流量，需要试差。基本步骤：先根据伯努利方程列出含摩擦系数和流速的试差方程；假设一个摩擦系数，通常取流动进入阻力平方区时的值作为初值；由试差方程算出流速，再计算雷诺数并结合相对粗糙度查图或经验公式得到新的摩擦系数；若新值与假设值相等或相近，则计算有效，否则以新值重新假设，直至相符。若已知流动处于层流区或阻力平方区，摩擦系数可直接确定，无需试差，可用解析法求解。"],"exp":"关键是把假设摩擦系数、算流速、算雷诺数、查摩擦系数、比较再迭代这条循环讲清楚，并说明初值取阻力平方区的值。还要指出层流区和阻力平方区摩擦系数可独立确定，因此不必试差。","ev":"试差计算过程实为非线性方程组的求解过程，借助于非线性方程组的计算方法可在计算机上较容易实现。","keys":[],"ref":"第 46 页","hint":"","score":8},{"i":16,"n":17,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-short-007","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述并联管路在流量、能量损失和支管流量分配方面的特点。","o":[],"a":["并联管路的主管流量等于各支管流量之和。各支管从分流点到汇合点的总机械能差相同，因此单位质量流体无论走哪根支管，能量损失都相等；计算阻力时任选一根支管即可，绝不能把各支管阻力相加。各支管的流量比取决于管径、管长和阻力系数：支管越长、管径越小、阻力系数越大，分到的流量越小。"],"exp":"答题要抓住三条：流量相加、能量损失相等、流量按阻力分配。最容易错的是把并联支管阻力相加，那等于让流体同时走完所有支管；流量分配则要与管径、管长和局部阻力系数联系起来。","ev":"并联管路中各支管的能量损失均相等","keys":[],"ref":"第 46 页","hint":"","score":8},{"i":17,"n":18,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"流体流经孔板时流束继续收缩，流束截面最小处称为________。","o":[],"a":["缩脉"],"exp":"孔板前流束受节流元件制约而收缩，由于惯性，最小截面出现在孔口之后，该处流速最大、压力最低，称为缩脉。孔板流量计的流量方程正是以缩脉附近的能量关系为基础推导的。","ev":"流束截面最小处称为缩脉 〈vena contracta) 。","keys":[],"ref":"第 50 页","hint":"","score":2},{"i":18,"n":19,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-short-005","t":"short","mode":"","bloom":"分析","diff":"hard","q":"离心泵调节流量有哪两类途径？各自的特点是什么？","o":[],"a":["第一类是改变管路特性曲线，最常用的是调节泵出口阀门开度：关小阀门使管路阻力增大、管路特性曲线变陡，工作点向小流量方向移动。该法操作简便灵活、流量可连续变化，但关小阀门会增加附加阻力并使泵在低效率区工作，经济性差，适用于调节幅度不大且经常需要调节的场合。第二类是改变泵特性曲线，如改变转速或切削叶轮直径：转速调节不额外增加阻力，可在较高效率下工作，经济性好，但需要可调速原动机或调速装置，常用于调节幅度大、时间长的场合；切削叶轮属于一次性调节。"],"exp":"答题要抓住两条思路：改变管路特性或改变泵特性，二者的交点即工作点。阀门调节简单但耗能，转速调节节能但设备复杂，比较时要同时说清操作性和经济性。只答一种方法或只说阀门开大关小都不完整。","ev":"采用出口阀门调节流量，操作简便、灵活， 流量可以连续变化，故应用较广,尤其适用于调节幅度不大，而经常需要改变流量的场合。","keys":[],"ref":"第 62 页","hint":"","score":8},{"i":19,"n":20,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-short-002","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述离心泵汽蚀现象的产生原因、危害及主要防止措施。","o":[],"a":["产生原因：泵内叶轮入口附近的最低压力降至输送温度下液体的饱和蒸气压，液体汽化或溶解气体析出形成气泡；气泡进入叶轮高压区后迅速凝结破裂，周围液体高速撞击叶片。危害：泵体强烈振动并发出噪声，流量、压头及效率明显下降，严重时吸不上液体，叶轮表面出现斑痕、裂纹甚至海绵状脱落。防止措施：降低泵的安装高度，减小吸入管路阻力，例如加大吸入管径、缩短管路、减少弯头阀门，控制所输送液体的温度，并保证有效汽蚀余量大于必需汽蚀余量且留 0.5 m 以上安全量。"],"exp":"回答要把因果链讲完整：压力低于饱和蒸气压产生气泡，气泡在高压区破裂产生高频冲击，进而损伤叶轮和降低性能。措施要围绕提高泵入口有效汽蚀余量展开，核心是降低安装高度和减小吸入阻力，只写灌泵或关小出口阀都不对症。","ev":"离心泵一旦发生汽蚀，泵体强烈振动并发出噪声，液体流量、压头(出口压力)及效率明显下降，严重时甚至吸不上液体。","keys":[],"ref":"第 66 页","hint":"","score":8},{"i":20,"n":21,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-short-009","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述离心泵选用的基本步骤和主要原则。","o":[],"a":["选用离心泵首先要根据生产任务确定输送系统的流量和所需压头，流量有变化时按最大流量选取并计算该流量下的管路压头；其次根据被输送液体的性质（如清水、腐蚀性、油品、易燃易爆等）和操作条件确定泵的类型，再按流量和压头从样本中选择合适型号；最后核算轴功率，若液体密度大于水，应按实际密度核算并配套电机。若没有完全合适的型号，可选流量和压头都稍大的泵；几个型号都能满足时，应选效率最高者。"],"exp":"步骤可归纳为确定流量压头、选类型型号、核算轴功率三步。原则是满足工艺要求为前提，按最大流量选泵，型号稍大而不偏小，并在满足要求的前提下优先选效率高的泵；密度大于水时不能直接套用水泵的轴功率。","ev":"离心泵的选用是以能满足液体输送的工艺要求为前提，基本步骤如下。","keys":[],"ref":"第 69 页","hint":"","score":8},{"i":21,"n":22,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-short-008","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述往复压缩机余隙的存在对吸气量和容积系数的影响，以及高压缩比时为什么宜采用多级压缩。","o":[],"a":["往复压缩机排气终了时活塞与气缸盖之间留有余隙，余隙内残存高压气体。活塞回行时这些气体先膨胀，占据一部分气缸容积，使实际吸入量小于活塞扫过的体积。余隙系数越大、压缩比越高，容积系数越小，吸气量越少；压缩比高到一定程度时容积系数可降为零，达到极限压缩比。此外高压缩比会使排气温度过高、润滑油变质、机件磨损，因此压缩比大于 8 时宜采用多级压缩，并在级间设置冷却器和油水分离器。"],"exp":"答题要把余隙气体膨胀、占据容积、减少吸入量这条因果链讲清楚，并指出容积系数随余隙系数和压缩比增大而减小。多级压缩的理由有两条：提高容积利用率、避免排气温度过高损坏润滑油和机件，级间冷却还能使压缩过程接近等温、减少外功。","ev":"为提高气伺容积利用率及避免高压缩比时因排气温度过高而导致润滑油变质，使机件磨损，一般压缩比大于 8 时宜采用多级压缩。","keys":[],"ref":"第 78 页","hint":"","score":8},{"i":22,"n":23,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"颗粒群平均粒径的计算方法很多，其中最常用的是________。","o":[],"a":["平均比表面积直径"],"exp":"教材指出颗粒群平均粒径的表示方法有多种，最常用的是按比表面积相等原则求出的平均比表面积直径。它把大小不等的颗粒群折算成具有相同比表面积的均匀颗粒群，便于后续计算。","ev":"颗粒平均粒径计算方法有很多，其中最常用的是平均比表面积直径。","keys":[],"ref":"第 91 页","hint":"","score":2},{"i":23,"n":24,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"若颗粒群的体积包括颗粒之间的空隙，由此得到的密度称为表观密度或________。","o":[],"a":["堆积密度"],"exp":"密度按是否计入颗粒间空隙分为两种：只计颗粒本身体积的是真密度，把空隙一并计入的是表观密度，又称堆积密度。空隙占去一部分体积，所以堆积密度必然小于真密度；设计颗粒贮存设备和加工设备时要按堆积密度估算容积。","ev":"若颗粒群体积包括颗粒之间的空隙，则得到的密度为表观密度或堆积密度(accumulative density)。","keys":[],"ref":"第 91 页","hint":"","score":2},{"i":24,"n":25,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述影响重力沉降速度的主要因素，并说明自由沉降与干扰沉降的区别。","o":[],"a":["影响因素包括颗粒的形状、大小、密度以及流体的密度和黏度。自由沉降是颗粒沉降时不受周围颗粒和器壁影响，一般发生在颗粒含量较少、设备尺寸足够大的情况；干扰沉降发生在颗粒浓度大、颗粒间距小时，颗粒间相互影响使沉降速度低于自由沉降。工程上颗粒体积浓度较高或容器较小时还需考虑干扰沉降与器壁效应的修正。"],"exp":"答题要抓住两点：一是从受力出发列出颗粒与流体双方的形状、粒径、密度和黏度；二是说清自由沉降与干扰沉降的判别条件是颗粒浓度和器壁影响。干扰沉降速度偏小，是因为被置换流体反向运动使曳力增大。","ev":"其影响因素很多，如颗粒的形状、大小、密度以及流体的密度和黏度等。","keys":[],"ref":"第 92 页","hint":"","score":8},{"i":25,"n":26,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-short-003","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述降尘室的结构特点、适用场合，并说明为什么常把降尘室做成扁平形或设置多层水平隔板。","o":[],"a":["降尘室结构简单、阻力小，但体积庞大、分离效率低，适于分离75μm以上的粗颗粒，一般用作含尘气体的预分离。由生产能力关系可知，降尘室的生产能力只与沉降面积和颗粒沉降速度有关，而与室高无关，因此把降尘室做得扁平，或在室内加设多层水平隔板，可在不增加占地面积的前提下成倍扩大沉降面积、提高处理量。多层降尘室能分离较细颗粒并节省地面，但清灰比较麻烦。"],"exp":"答题要分三层：结构上简单、阻力小但体积庞大；性能上效率低，只适合较粗颗粒的预分离；原理上生产能力由沉降面积和沉降速度决定，与高度无关，所以提高能力的办法是增大沉降面积。扁平形和多层隔板正是增大沉降面积的具体做法，代价是清灰不便。","ev":"降尘室结构简单，阻力小，但体积庞大，分离效率低，适于分离 75pm 以上的粗颗粒，一般用于含尘气体的预分离。","keys":[],"ref":"第 96 页","hint":"","score":8},{"i":26,"n":27,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-fill-002","t":"fill","mode":"","bloom":"理解","diff":"easy","q":"悬浮液性质和浓度不同时过滤常数差别很大，因此工程设计中过滤常数需要用________的方法得到。","o":[],"a":["实验测定"],"exp":"过滤常数与悬浮液性质、浓度、操作温度和压强差都有关，难以统一查表，教材明确工程设计中要用实验测定的方法取得。测定时应尽量采用与实际生产相同的悬浮液和操作条件，数据才有可比性。","ev":"工程设计时，要用实验测定的方法得到过滤常数。","keys":[],"ref":"第 105 页","hint":"","score":2},{"i":27,"n":28,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-fill-004","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"转鼓真空过滤机中，转鼓表面浸入料浆的分数称为________。","o":[],"a":["浸没度"],"exp":"浸没度等于转鼓浸入料浆的浸没角度与360°之比，它决定转鼓每转一周中用于真空吸滤的时间。浸没度越大，过滤时间越长，滤饼越厚；但浸没度过大又会挤占洗涤、吹松和卸饼的时间，因此要根据料浆的过滤性能选取合适数值。","ev":"转鼓表面浸入料浆的分数称为浸没度","keys":[],"ref":"第 109 页","hint":"","score":2},{"i":28,"n":29,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-short-002","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述强化过滤过程的主要途径。","o":[],"a":["一是使用助滤剂改变滤饼结构，增加滤饼刚性、降低可压缩滤饼的阻力；二是加入混凝剂或絮凝剂，使细颗粒聚集成较大颗粒，改善悬浮液的过滤性能；三是采用动态过滤，使料浆与过滤面成平行或旋转的剪切运动，避免滤饼不断增厚；此外还可采用复合过滤、膜分离以及降低滤液黏度等措施。"],"exp":"强化过滤的核心是降低过滤阻力或提高推动力。助滤剂针对滤饼结构，混凝剂和絮凝剂针对悬浮液中颗粒的聚集状态，动态过滤则从设备操作方式上抑制滤饼增厚；回答时按这三个层次展开最清楚。","ev":"强化过滤过程途径，除前已述及的利用助滤剂改变滤饼结构以及利用混凝剂、絮凝剂改变悬浮液中颗粒聚集状态、提高过滤速率之外，在过滤技术上采用动态过滤(dynamic filtration)也是强化过滤的一个途径。","keys":[],"ref":"第 112 页","hint":"","score":8},{"i":29,"n":30,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-fill-007","t":"fill","mode":"","bloom":"理解","diff":"easy","q":"多层平壁定态导热中，通过各层的导热速率________。","o":[],"a":["相等"],"exp":"定态下平壁内没有热量积累，通过各层的导热速率必须相等，否则层与层之间会出现热量的积聚或亏空，故应填相等。各层温度降则按热阻大小分配，热阻大的层温度降大，不能把速率相等与温度降相等混为一谈。","ev":"在定态热传导中,通过各层平壁的导热速率相等，即","keys":[],"ref":"第 124 页","hint":"","score":2},{"i":30,"n":31,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"流体在圆形管内作强制对流传热时，特征尺寸通常取管子的________。","o":[],"a":["内径"],"exp":"教材规定，管内流动对流传热的特征尺寸取管子内径，因为它直接决定流道截面和边界层的发展；特征流速按流通截面计算。定性温度则取流体进、出口温度的算术平均值。","ev":"对于流体在管内流动时的对流传热，采用管子的内径作为特征尺寸","keys":[],"ref":"第 129 页","hint":"","score":2},{"i":31,"n":32,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-fill-008","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"管内强制对流传热的关联式中，定性温度取流体在换热管进、出口温度的________。","o":[],"a":["算术平均值"],"exp":"关联式中的物性需要按一个有代表性的温度查取，管内强制对流传热取进、出口温度的算术平均值作为定性温度，特征尺寸则取管内径。若误取壁温或对数平均值，查得的物性不符，计算结果会明显偏离。","ev":"定性温度取流体在换热管进、出口温度的算术平均值。","keys":[],"ref":"第 129 页","hint":"","score":2},{"i":32,"n":33,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-fill-004","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"列管式换热器壳程常用的折流挡板有圆盘形和________形两种，其中后者又称弓形挡板。","o":[],"a":["圆缺"],"exp":"教材指出折流挡板主要有圆盘形和圆缺形两种，其中圆缺形又称弓形挡板，最为常用。挡板迫使壳程流体多次错流通过管束，提高湍动程度和对流传热系数；填空要写圆缺，不要与圆盘形混淆。","ev":"折流挡板主要有圆盘形和圆缺形两种，其中以圆缺形 (又称弓形)挡板最为常用。","keys":[],"ref":"第 134 页","hint":"","score":2},{"i":33,"n":34,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-fill-002","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"传热计算中习惯上以换热管的________为基准计算总传热系数。","o":[],"a":["外表面"],"exp":"同一台管式换热器，取内表面或外表面作基准会得到不同数值的总传热系数。教材规定习惯上采用换热管外表面为基准，与之对应的传热面积也必须取外表面积，两者基准要一致。","ev":"在传热计算中习惯上采用换热管的外表面为基准","keys":[],"ref":"第 143 页","hint":"","score":2},{"i":34,"n":35,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-short-003","t":"short","mode":"","bloom":"分析","diff":"medium","q":"换热器使用一段时间后传热速率下降的原因是什么？计算总传热系数时应如何考虑？","o":[],"a":["工作流体中的难溶物沉积于换热面，或生物物质在换热面上生长，使两侧换热面各形成一层污垢。污垢层虽薄但热导率很小，相当于在壁面两侧各串联一层附加热阻，使总传热系数下降，表现为热流体出口温度升高或冷流体出口温度降低。因此计算总传热系数时应在管壁热阻之外计入管内、外两侧的污垢热阻，并定期清洗。"],"exp":"答题要点是污垢的来源、污垢热阻的物理本质和它在总热阻中的位置。污垢热阻按单位面积计，与对流传热热阻、管壁热阻串联；污垢层薄不等于热阻小，关键在热导率低。工程上还要通过减缓结垢和及时清洗来控制其影响。","ev":"换热器在使用一段时间以后， 传热速率往往会呈现一定程度的下降. 表现为热流体出口升高或冷流体出口温度降低。这是 因为工作流体中的一些难溶物沉积于换热面，或有生物物质生长于换热面上，两换热表面上 分别形成一层污拍。","keys":[],"ref":"第 144 页","hint":"","score":8},{"i":35,"n":36,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-fill-005","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"总传热速率方程中，用于计算整个换热面传热量的平均温差称为________。","o":[],"a":["对数平均温度差"],"exp":"换热器两端冷、热流体的温差通常不相等，沿传热面温度差按指数关系变化，工程上用两端温差的对数平均值作为平均推动力，称为对数平均温度差。当两端温差之比小于2时，可用算术平均值近似代替。","ev":"实际上它是热、冷流体 在换热器两端温差的对数平均值。","keys":[],"ref":"第 146 页","hint":"","score":2},{"i":36,"n":37,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-short-005","t":"short","mode":"","bloom":"分析","diff":"medium","q":"为什么逆流操作的平均传热温差最大？什么情况下反而宜采用并流？","o":[],"a":["冷、热流体进、出口温度一定时，逆流两端的温差都较大，按对数平均得到的平均温差最大，也就是平均推动力最大，完成同样换热量所需传热面积最小，或可少用加热剂、冷却剂。并流时热流体出口温度不可能低于冷流体出口温度，冷流体出口温度也受到限制，所以当工艺要求冷流体被加热时不得超过某一温度或热流体被冷却时不得低于某一温度时，宜采用并流；代价是平均温差较小、所需传热面积较大。"],"exp":"答题先说明平均温差是换热过程的平均推动力，再比较逆流与并流两端温差的大小，最后指出并流能限制出口温度这一独特优点。只答逆流温差大而不提并流的限温用途，或把并流说成推动力更大，都是常见失分点。","ev":"平均温差代表了换热器中两种流体热交换过程的平均推动力。","keys":[],"ref":"第 150 页","hint":"","score":8},{"i":37,"n":38,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-short-002","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述换热器设计型计算与操作型计算的任务，并说明二者共同需要联立求解的方程。","o":[],"a":["设计型计算的任务是根据给定热负荷和允许的温度条件，确定完成换热任务所需的传热面积，并据此选择换热器型号；操作型计算是在设备参数已定的情况下，预测两流体的出口温度等操作结果。二者都以热量平衡方程和总传热速率方程为基础，通过联立求解完成计算。"],"exp":"设计型是缺设备、算面积再选型；操作型是设备已定、算出口温度。热量平衡方程给出换热量与流量、比热和温升的关系，总传热速率方程给出换热量与总传热系数、面积、平均温差的关系，两个方程联立才能同时确定未知温度。","ev":"传热过程设计型计算的基本要求是确定完成换热任务所需要的传热面积。","keys":[],"ref":"第 151 页","hint":"","score":8},{"i":38,"n":39,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-fill-006","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"热辐射中，能被物体吸收并转变为热能的电磁波主要是可见光和________两部分。","o":[],"a":["红外线"],"exp":"电磁波波长范围很广，但只有可见光和红外线能被物体吸收并转变为热能，这两部分统称为热辐射线。波长更短的射线在一般工业温度下对热辐射的贡献很小，不能与红外线混为一谈。","ev":"电磁波的波长范围很广，但能被物体吸收且转变为热能的只是可见 光和红外线两部分统称为热辐射线。","keys":[],"ref":"第 155 页","hint":"","score":2},{"i":39,"n":40,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"实际物体的辐射能力与同温度黑体的辐射能力之比称为________，其值恒小于1。","o":[],"a":["黑度"],"exp":"黑度又称发射率，表示实际物体接近黑体的程度。实际物体的辐射能力总小于同温度黑体，所以黑度恒小于1；黑度与材料种类、表面温度和表面粗糙度、氧化程度等有关，表面氧化后黑度通常增大。","ev":"黑度是实际物体的辐射能力与黑体的辐射能力之比。","keys":[],"ref":"第 156 页","hint":"","score":2},{"i":40,"n":41,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-fill-009","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"两固体间辐射传热计算中，总辐射系数和角系数的数值与物体黑度、形状、大小、距离及________有关。","o":[],"a":["相对位置"],"exp":"两固体间的辐射换热量不仅取决于温度和黑度，还与两表面的形状、大小、间距以及彼此的相对位置有关，这些几何因素集中体现在角系数和总辐射系数中，故应填相对位置。忽略方位变化把角系数当成常数，会带来较大误差。","ev":"其中总辆射系数 Ci 和角系数 pi的数值与物体黑度、形状、大小、距离及相对位置有关。","keys":[],"ref":"第 157 页","hint":"","score":2},{"i":41,"n":42,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-short-006","t":"short","mode":"","bloom":"分析","diff":"hard","q":"列管式换热器选型计算为什么需要试差？初选后还要核算哪些内容？","o":[],"a":["因为总传热系数和平均传热温差都与换热器的结构、流速及流动空间安排有关，计算传热面积前必须先假定总传热系数，所以只能先估算面积、初选型号，再回头核算，整个过程是试差过程。初选后要计算管程和壳程的压强降，检查是否满足工艺要求；再按选定结构计算两侧对流传热系数，计入污垢热阻求出总传热系数，用传热速率方程核算所需传热面积，并要求实际面积有15%至25%的裕量，不合格则调整流速、管程数或挡板间距后重算。"],"exp":"答题要交代试差的根源是总传热系数与设备结构互相牵连，无法一次算清。核算内容包括压强降和传热面积两项：前者不合格要调整流速或结构，后者不合格要重估总传热系数，漏掉压强降校核是常见失分点。","ev":"从上述换热器选型计算步骤来看，该过程确为一个试差过程。","keys":[],"ref":"第 170 页","hint":"","score":8},{"i":42,"n":43,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述强化换热器传热过程可以从哪些方面入手，并各举一例。","o":[],"a":["可从三方面入手：提高总传热系数，例如提高流速或湍动程度、减小污垢热阻、采用翅片管等异形传热面；提高传热面积，例如采用板式、板翅式等紧凑换热器；提高平均传热温差，例如采用逆流、选用温位更高的加热剂或温位更低的冷却剂。采取措施时还要综合考虑制造费用和流体输送动力。"],"exp":"答题框架来自总传热速率方程，换热量与总传热系数、传热面积、平均温差三者成正比，强化自然从这三项找办法。举例要与措施对应，最后补一句强化往往以增加制造费用或输送能耗为代价，体现经济权衡。","ev":"由总传热速率方程可知，强化传热可从提高总传热系数、提高传热面积和提高平均传热温差三方面人手。","keys":[],"ref":"第 172 页","hint":"","score":8},{"i":43,"n":44,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-short-007","t":"short","mode":"","bloom":"评价","diff":"hard","q":"为什么单台换热器的强化不等于整个装置传热的最优？应从什么层面考虑？","o":[],"a":["单台换热器的强化只着眼于提高该台设备的总传热系数、传热面积或平均温差，而大型工业生产中若干台换热器把多股需要加热或冷却的物流联系起来构成换热网络，局部强化未必能消除系统用能的瓶颈，甚至可能增加公用工程消耗。应从换热网络整体优化着眼：用夹点技术分析能量流沿温度的分布，找出用能瓶颈，以最大能量回收率建立初始网络，再协调设备费用与能量费用进行修正，必要时辅以有效能分析或数学规划法，得到最佳的换热网络结构。"],"exp":"答题要先指出单台设备的强化目标与装置整体目标不同，再用换热网络和夹点的概念说明系统层面的做法。只罗列强化措施而不谈网络优化，或把夹点技术说成单台换热器的计算方法，都不符合题意。","ev":"以上所述为单个换热吉中传热过程的强化措施，然而这并不是一套大型工业生产装置传热操作的最终着眼点。","keys":[],"ref":"第 173 页","hint":"","score":8},{"i":44,"n":45,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-short-004","t":"short","mode":"","bloom":"理解","diff":"medium","q":"处理换热器污垢问题应从哪几个方面入手？各举一例说明。","o":[],"a":["应从三方面入手：一是防止结垢形成，例如对颗粒污垢进行过滤、凝聚与沉淀，或用离子交换、化学处理去除结疤物质；二是防止垢物黏结并沉积在传热表面，例如针对结垢机理加入阻垢剂、分散剂等添加剂；三是从传热表面除去已形成的沉积物，即清洗，例如化学清洗和机械清洗。"],"exp":"这一框架把污垢问题分为生成、黏附沉积和清除三个环节，分别对应预防、运行控制和清洗。举例要与环节对应，并注意化学清洗可能腐蚀设备、机械清洗多用于壳侧，选择时要结合垢层性质与设备结构。","ev":"处理污垢问题应该 从如下三方面考虑: 防止结垢形成: 防止结垢后物质之间的黏结及其在传热表面上的沉积; 从传热表面上除去沉积物，即清洗。","keys":[],"ref":"第 174 页","hint":"","score":8},{"i":45,"n":46,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-short-003","t":"short","mode":"","bloom":"理解","diff":"medium","q":"与一般传热过程相比，蒸发操作有哪些特点？","o":[],"a":["蒸发虽属间壁两侧恒温的传热过程，但有三个特点：一是溶液沸点升高，溶质不挥发使溶液蒸气压低于纯溶剂，相同压力下沸点更高，浓度越高越显著，设计和操作时必须考虑；二是物料及工艺特性，浓缩时溶质或杂质可能在加热面沉积、析出结晶形成垢层，有些溶质热敏、易变质，有些物料腐蚀性强或黏度大；三是能量回收问题突出，溶剂汽化潜热很大，蒸发是大能耗单元操作，节能十分重要。"],"exp":"答题要抓住沸点升高、物料工艺特性、能量回收三条，并各作一句解释。只答蒸发属于传热过程而不列出特点，或漏掉沸点升高这一条，都是常见失分点。","ev":"但是,蒸发操作与一般传热过程比较有以下特点。","keys":[],"ref":"第 181 页","hint":"","score":8},{"i":46,"n":47,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"二次蒸汽从分离室到冷凝器的压降造成的温度差损失难以计算，一般取经验值为________。","o":[],"a":["1℃"],"exp":"教材指出该温度差损失与二次蒸汽速率、管路规格和除沫器阻力有关，难以精确计算，一般取经验值1℃。它属于总温度差损失的一部分，此外还包括溶液浓度引起的沸点升高和液柱静压头引起的损失。","ev":"由于此值难以计算，一 般取经验值为1C，即A“=1C。","keys":[],"ref":"第 184 页","hint":"","score":2},{"i":47,"n":48,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"蒸发器的生产能力可用单位时间内________来表示。","o":[],"a":["蒸发的水分量"],"exp":"生产能力只反映蒸发器生产量的大小，用单位时间内蒸发的水分量表示。若要比较蒸发器的优劣，应使用生产强度，即单位时间单位传热面积上所蒸发的水量，它同时考虑了设备尺寸的影响。","ev":"蒸发器的生产能力可用单位时间内蒸发的水分量来表示。","keys":[],"ref":"第 186 页","hint":"","score":2},{"i":48,"n":49,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"多效蒸发的效数为什么不能无限增加？确定效数时应遵循什么原则？","o":[],"a":["随效数增加，单位蒸汽消耗量减少、操作费用降低，但温度差损失增大、有效温度差减小，且每增加一效都要增加设备和投资；当效数增加到一定程度后，节省的操作费用不足以补偿增加的投资，总费用反而上升，所以效数不能无限增加。确定效数应使操作费与设备费之和为最少，即按总费用最低的原则合理选取。"],"exp":"答题要抓住两方面：一是效数增加的收益是单位蒸汽消耗量和操作费用下降，代价是有效温度差减小、传热面积和设备投资增大；二是二者存在最佳匹配，效数过多时设备费增长超过操作费节省。结论是使操作费与设备费之和最少，而不是效数越多越好。","ev":"因此必须合理选取蒸发效数，使操作费和设备费之和为最少。","keys":[],"ref":"第 194 页","hint":"","score":8},{"i":49,"n":50,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-short-002","t":"short","mode":"","bloom":"理解","diff":"medium","q":"蒸发装置的主要附属设备有哪些？各起什么作用？","o":[],"a":["主要有除沫器、冷凝器和真空装置。除沫器装在蒸发器内或器外，用来除去二次蒸汽夹带的液滴，防止产品损失或冷却水被污染；冷凝器用来冷凝二次蒸汽，二次蒸汽需要回收或会污染水源时用间壁式，否则用直接接触式；真空装置装在冷凝器之后，抽除漏入的空气和溶解的不凝性气体等，以维持蒸发系统的真空度。"],"exp":"答题按设备逐项说明作用，并点出除沫器有内置与外置、冷凝器有间壁式与直接接触式、真空装置必须位于冷凝器之后。负压主要由二次蒸汽冷凝形成，真空装置只负责抽除不凝性气体，这一点常被误解。","ev":"主要有除沫器、冷凝器和真空装置。","keys":[],"ref":"第 197 页","hint":"","score":8},{"i":50,"n":51,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-fill-002","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"真空蒸发系统中，无论采用哪一种冷凝器，均需在冷凝器后安装________，以维持系统的真空度。","o":[],"a":["真空装置"],"exp":"蒸发系统的负压主要由二次蒸汽冷凝形成，真空装置的作用是抽除系统泄漏的空气、物料和冷却水中溶解的不凝性气体以及冷却水饱和温度下的水蒸气，从而维持操作真空度。常用真空装置有喷射泵、水环式真空泵和往复式真空泵等。","ev":"当攻发句在负压下操作时，无论采用哪一种冷凝器，均需在冷凝器后安装真空装置。","keys":[],"ref":"第 199 页","hint":"","score":2},{"i":51,"n":52,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-fill-004","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"一个完整的吸收流程包括吸收和________两部分。","o":[],"a":["解吸"],"exp":"吸收只是把溶质从气相转移到液相，要得到较纯的溶质并使吸收剂再生后循环使用，还需要把溶质从吸收液中脱除，这一步就是解吸。吸收与解吸传质方向相反，二者联合才构成完整的气体分离流程，所以完整流程包括吸收和解吸两部分。","ev":"一个完整的吸收流程包括吸收和解吸两部分，下面以甲醇脱硫为例介绍吸收操作的流程。","keys":[],"ref":"第 206 页","hint":"","score":2},{"i":52,"n":53,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-fill-007","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"吸收操作中排出的气体称为________，其主要成分是惰性气体和残余溶质。","o":[],"a":["吸收尾气"],"exp":"吸收塔排出的气体称为吸收尾气，其中主要是未溶解的惰性气体和少量未被吸收的溶质。它与塔底流出的吸收液相对应：吸收液由溶质和溶剂组成，而尾气由惰性气体和残余溶质组成，两者共同构成吸收塔的出口物流。","ev":"吸收操作中排出的气体称为吸收尾气，其主要成分是惰性气体 B 及残余的溶质 A","keys":[],"ref":"第 206 页","hint":"","score":2},{"i":53,"n":54,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-fill-005","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"用二维坐标绘成的气液相平衡关系曲线称为________。","o":[],"a":["溶解度曲线"],"exp":"气液相平衡关系可以用列表、图线和公式表示，其中在二维坐标上绘制的平衡关系曲线叫溶解度曲线。曲线上的每一点都对应一个平衡状态：给定液相组成就有相应的平衡分压或气相组成，温度、压力改变时曲线位置也会改变。","ev":"气液相平衡关系可用列表、图线和公式表示，其中用二维坐标绘成的气液相平衡关系曲线称为溶解度曲线。","keys":[],"ref":"第 210 页","hint":"","score":2},{"i":54,"n":55,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"双膜理论认为，整个相际对流传质阻力全部集中在________内。","o":[],"a":["两个层流膜层"],"exp":"双膜理论把相际传质阻力归结为气膜和液膜两个层流膜层的阻力：主体湍动充分、浓度均匀，界面处达到平衡且无阻力，因此总阻力全部集中在两个层流膜层内。当两相主体浓度一定时，通过两膜的传质阻力决定传质速率，故双膜理论又称双膜阻力理论。","ev":"那么整个相际对流传质阻力全部集中在两个层流膜层内","keys":[],"ref":"第 226 页","hint":"","score":2},{"i":55,"n":56,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述双膜理论的要点及其局限性。","o":[],"a":["双膜理论把复杂的相际对流传质简化为溶质通过两个串联层流膜的分子扩散：气液两相间存在稳定相界面，界面两侧分别为稳定的气膜和液膜；膜内为层流，溶质以分子扩散连续通过两膜；界面处气液达到平衡、无扩散阻力；膜外主体充分湍动、浓度均匀，以涡流扩散传质，总传质阻力等于气膜阻力与液膜阻力之和。其局限性是只在流速不太高、界面稳定时与实际较符合；流速很大时界面不断破灭更新，实际结果与理论不符。"],"exp":"要点包括稳定界面与两层膜、膜内层流分子扩散、界面平衡无阻力、主体涡流扩散以及阻力串联叠加。局限性在于模型把界面视为静止不变，未考虑高流速下界面的不断更新，因此高流速时偏差较大；溶质渗透理论、表面更新理论正是针对这一不足提出的。","ev":"它把复杂的传质过程简化为溶质通过两个层流膜的分子扩散过程 ，而在相界面处及两相主体均无传质阻力。","keys":[],"ref":"第 226 页","hint":"","score":8},{"i":56,"n":57,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-fill-006","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"总传质速率等于总传质系数乘以________。","o":[],"a":["总传质推动力"],"exp":"总传质速率方程与单相传质速率方程形式相似，都是传质速率等于传质系数乘以推动力，只是这里用总传质系数和总传质推动力。推动力可以按气相或液相浓度差表示，因此总传质系数也有气相和液相两种，使用时必须让系数与推动力的表示方式相对应。","ev":"总传质速率方程与单相传质速率方程类似，总传质速率等于总传质系数乘以总传质推动力","keys":[],"ref":"第 227 页","hint":"","score":2},{"i":57,"n":58,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-short-005","t":"short","mode":"","bloom":"分析","diff":"hard","q":"说明吸收过程中相界面组成的确定方法，以及工程上为什么要引入总传质速率方程。","o":[],"a":["定态传质时界面上没有溶质积累，溶质在气相中的传质速率等于在液相中的传质速率；界面处气液两相达到平衡。将气相和液相的单相传质速率方程与界面平衡关系联立，即可求得界面分压和界面浓度，也可用作图法求交点。但界面组成难以直接测量，工程上把总推动力取为一相主体浓度与另一相平衡浓度之差，用总传质系数表示总传质阻力，从而避开界面参数。"],"exp":"答题要抓住两个层次：先用定态下气液传质速率相等和界面平衡两个条件确定界面组成；再说明界面参数难以测定，所以引入总传质速率方程，把推动力改为跨相的实际浓度与平衡浓度之差。若只写总传质速率等于系数乘推动力而不说明界面如何确定，就没有回答完整。","ev":"定态传质过程 ，界面上无溶质的积累，所以溶质在气相中的传质速率等于在液相中的传速率","keys":[],"ref":"第 227 页","hint":"","score":8},{"i":58,"n":59,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-short-003","t":"short","mode":"","bloom":"分析","diff":"medium","q":"简述气膜控制与液膜控制的含义，并说明各自强化吸收的主要措施。","o":[],"a":["气膜控制是指传质阻力主要集中在气相、过程由气相阻力控制，常见于氨等易溶气体的吸收；强化措施是增大气体流速或增强气相湍动程度，以减薄气膜、降低气相传质阻力。液膜控制是指传质阻力主要集中在液相、过程由液相阻力控制，常见于二氧化碳、氧气等难溶气体的吸收；强化措施是提高液体流速或增强液相湍动程度，以降低液相传质阻力。两相阻力相当时为双膜控制，应同时改善两相的湍动程度。"],"exp":"判断控制步骤的依据是两相阻力哪一相占主导：易溶气体亨利系数小、平衡线斜率小，气膜阻力大；难溶气体亨利系数大、平衡线斜率大，液膜阻力大。强化吸收只能从控制步骤入手，气膜控制时提高气速，液膜控制时提高液速，否则效果有限；双膜控制则需兼顾两相。","ev":"对于气相阻力控制的吸收过程，要想提高吸收的传质速率，应减少气相传质阻力。如增大气体流速或增加气相湍流程度，能有效地降低传质阻力，从而提高总传质速率。","keys":[],"ref":"第 229 页","hint":"","score":8},{"i":59,"n":60,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-short-004","t":"short","mode":"","bloom":"分析","diff":"hard","q":"比较对数平均推动力法与吸收因数法计算传质单元数时的适用条件和特点。","o":[],"a":["对数平均推动力法要求平衡线和操作线均为直线，用塔顶、塔底两端推动力的对数平均值作为平均推动力，当两端推动力相差不大时可用算术平均值代替，工程误差小于4%。吸收因数法要求平衡关系服从亨利定律、平衡线为通过原点的直线，也可用于不通过原点的直线；当已知进、出塔气体组成和吸收剂进口组成三个浓度时，用吸收因数法更方便。平衡线为曲线时宜用图解积分法。"],"exp":"两种方法都以传质单元数的定义式为基础，区别在平均推动力的处理：对数平均推动力法直接对推动力取对数平均，适用于平衡线和操作线都是直线的情况；吸收因数法则把平衡线斜率与操作线斜率之比作为解吸因数，导出解析式，要求平衡关系服从亨利定律。吸收因数法能用的体系一定也能用对数平均推动力法，反之则不一定。","ev":"若气液平衡关系在吸收过程所涉及的组成范围内服从亨利定律，即平衡线为通过原点的直线，根据传质单元数的定义式(5-90)可导出其解析式。","keys":[],"ref":"第 238 页","hint":"","score":8},{"i":60,"n":61,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-short-002","t":"short","mode":"","bloom":"分析","diff":"medium","q":"吸收塔操作中，可采取哪些措施提高吸收率或降低出塔气体浓度？","o":[],"a":["可调节操作温度、压力、吸收剂流量和吸收剂进口组成：降低操作温度、提高操作压力，使平衡线下移、推动力增大；增大吸收剂流量，使操作线斜率增大、推动力提高；降低吸收剂进口溶质浓度，增大塔顶推动力。还可提高流体湍动程度以降低传质阻力，如加大气速或液速、改善填料润湿；但吸收剂流量不宜过大，以免再生负荷过高。"],"exp":"思路是围绕吸收速率等于推动力与阻力之比：凡使平衡线下移、操作线远离平衡线的措施都提高推动力，如降温、升压、加大液量、降低吸收剂入口浓度；凡增强湍动、减小膜阻力的措施都降低阻力。还要注意液量过大会增大再生负荷和解吸难度，可能使吸收剂入口浓度升高，反而削弱推动力。","ev":"在吸收操作中，要想提高吸收率或降低混合气体出口浓度，可调节的操作参数有操作温度、压力、吸收剂流量及吸收剂进口组成。","keys":[],"ref":"第 242 页","hint":"","score":8},{"i":61,"n":62,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-short-006","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述吸收塔操作型定性分析的一般步骤。","o":[],"a":["先根据操作条件的变化判断气相总传质单元高度和解吸因数的变化趋势；再由塔高一定的关系式判断气相总传质单元数的变化方向；然后用吸收因数法关系图确定出塔气体组成或吸收率的变化趋势；最后通过全塔物料衡算分析塔底吸收液组成的变化。"],"exp":"操作型分析是在塔高一定的前提下进行的，所以不能直接假定传质单元数不变，而要先判断传质单元高度和解吸因数如何变化，再由塔高关系式反推传质单元数的变化，进而确定吸收效果。最后必须用物料衡算求吸收液组成，否则分析链不完整。","ev":"在吸收操作过程定性分析时，常根据已知条件确定 互oc、S$ 的变化趋势，然后用 2 =Noc互oc确定 Noc的变化方向，再用吸收因数法中的图 5-24 来确定吸收效果 Y。 或吸收率的变化趋势，最后，通过全塔物料衡算分析吸收液出口组成 Xi 的变化。","keys":[],"ref":"第 242 页","hint":"","score":8},{"i":62,"n":63,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-fill-002","t":"fill","mode":"","bloom":"理解","diff":"easy","q":"提高解吸效果往往以________为代价，因此加热温度应从经济角度权衡。","o":[],"a":["能耗"],"exp":"加热可提高溶质的平衡分压、增大解吸推动力，但解吸效果的提高以能耗为代价，温度越高能耗越大。因此应从经济角度权衡加热温度，工业上常联合使用加热、减压和气提等方法，而不是单纯提高温度。","ev":"可见解吸效果的提高是以能耗为代价的，其加热温度应从经济角度来权衡。","keys":[],"ref":"第 245 页","hint":"","score":2},{"i":63,"n":64,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-short-007","t":"short","mode":"","bloom":"分析","diff":"hard","q":"解吸过程的最小气-液比是如何确定的？实际操作气-液比为什么应大于它？","o":[],"a":["解吸气量减少时，解吸操作线斜率增大，出塔气体组成升高，操作线向平衡线靠近。当平衡线为上凸曲线时，操作线与平衡线相交；当平衡线为下凹曲线时，操作线与平衡线相切。此时达到规定解吸任务所需塔高为无穷大，对应的气-液比就是最小气-液比。实际操作气-液比取最小气-液比的1.1至2.0倍，使塔顶保留一定推动力，避免塔高无穷大，同时兼顾解吸气用量和操作费用。"],"exp":"确定最小气-液比的关键是找到操作线与平衡线的极限位置：上凸平衡线取交点，下凹平衡线取切点，两者都对应所需塔高无穷大。实际气-液比大于最小值才能保证塔顶有推动力，但气量过大会增加解吸剂消耗和操作费用，所以通常取最小值的1.1至2.0倍。","ev":"根据生产实际经验，实际操作气-液比为最小气-液比的1.1一2.0倍","keys":[],"ref":"第 246 页","hint":"","score":8},{"i":64,"n":65,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"单位体积填料所提供的空隙体积称为填料的________。","o":[],"a":["空隙率"],"exp":"空隙率是单位体积填料所提供的空隙体积，无量纲。流体在填料空隙中流过，空隙率大则流动阻力小，气液两相流量可提高、流体通量增大；但空隙率过大也会减小比表面积、影响传质，因此选用填料时需综合考虑。","ev":"填料的空隙率定义为单位体积填料所提供的空隙体积","keys":[],"ref":"第 248 页","hint":"","score":2},{"i":65,"n":66,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-fill-008","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"填料层内有液体流过时，润湿的填料实际比表面积与填料实际空隙率的三次方之比称为________。","o":[],"a":["湿填料因子（填料因子）"],"exp":"湿填料因子简称填料因子，是润湿填料的实际比表面积与实际空隙率三次方的比值，反映气体通过湿填料的流动特性。液体流过填料后部分空隙被液体占据，实际空隙率变小、比表面积也变化，因此同一填料的湿填料因子与干填料因子数值不同。","ev":"湿填料因子(简称填料因子)是指填料层内有液体流过时，润湿的填料实际比表面积与填料实际空隙率的三次方之比","keys":[],"ref":"第 249 页","hint":"","score":2},{"i":66,"n":67,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-fill-007","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"式(6-5)称为________方程，它描述一定压力下平衡物系的温度与气相组成的关系。","o":[],"a":["露点"],"exp":"式(6-5)由拉乌尔定律和道尔顿分压定律导出，给定气相组成可求混合蒸气开始冷凝、出现第一滴液滴时的温度，即露点温度，因此称为露点方程。与之对应的泡点方程描述温度与液相组成的关系，两者分别对应温度-组成图上的露点线和泡点线，不能互换。","ev":"式(6-5)称为露点方程。该方程描述在一定压力下平衔物系的温度与气相组成的关系。","keys":[],"ref":"第 265 页","hint":"","score":2},{"i":67,"n":68,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-short-003","t":"short","mode":"","bloom":"理解","diff":"medium","q":"比较简单蒸馏与平衡蒸馏的操作特点、定态性和适用场合。","o":[],"a":["简单蒸馏把原料一次加入蒸馏釜，加热到泡点后不断引出蒸气并冷凝，釜液轻组分浓度逐渐下降，馏出液按不同组成范围分罐收集，因而是非定态过程，只适合挥发度相差较大、分离要求不高的粗分离。平衡蒸馏把料液加压加热到高于闪蒸器压力下泡点的温度，经节流阀骤然减压成为过热液体，一次部分汽化后气液两相及时分离，是连续定态过程，适合大批量粗分离。两者都只能得到初步分离的产品，不能获得高纯度产品。"],"exp":"答题要抓住三点：简单蒸馏间歇、非定态，馏出液组成随时间降低；平衡蒸馏连续、定态，靠一次部分汽化实现初步分离；两者产品纯度都不高。常见错误是把两者的定态性和适用场合对调，或误以为平衡蒸馏能得到高纯产品。","ev":"由于平衡莱馏可连续操作，且在内蒸器内通过一次部分汽化使料液得到初步分离，因此它适合于大批量、粗分离的场合。","keys":[],"ref":"第 272 页","hint":"","score":8},{"i":68,"n":69,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-fill-008","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"连续精馏装置主要由精馏塔、________、冷凝器、冷却器、原料预热器和贮槽等设备组成。","o":[],"a":["再沸器"],"exp":"再沸器装在塔底，用加热介质使釜液部分汽化，为全塔提供上升蒸气；没有它塔内就没有气相回流，精馏无法进行。冷凝器负责将塔顶蒸气冷凝并分成回流液和产品，原料预热器只调整进料温度，三者作用不能互相代替。","ev":"它主要包括精馏塔、再沸器、淮\n凝器、冷却器、原料预热器和贮梭等设备。","keys":[],"ref":"第 273 页","hint":"","score":2},{"i":69,"n":70,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"为什么精馏塔必须引入回流？回流液和上升蒸气分别起什么作用？","o":[],"a":["精馏是气液两相间的传质过程，必须在塔内形成不平衡的气液两相并使其反复接触。塔顶冷凝液的一部分作为回流液引回第一块板，回流液轻组分含量高、温度低，自上而下逐级下降；塔釜再沸器使液体部分汽化提供上升蒸气，蒸气中重组分含量较高，自下而上逐级上升。两者在每块塔板上接触，气相部分冷凝放出的热量使液相部分汽化，轻组分向气相转移、重组分向液相转移，从而在塔顶得到较纯的轻组分、塔底得到较纯的重组分。若没有回流，板上液体无法维持，传质所需的必要条件就不存在。"],"exp":"答题要抓住三点：回流与上升蒸气共同提供不平衡的两相；回流液轻组分高、温度低，上升蒸气重组分高、温度高，两者在板上传热传质；没有回流就无法在板上维持液层，精馏不能进行。只答回流能提高纯度而不说明两相接触机理，得分不全。","ev":"为了将双组分混合液充分分离，必须向塔内引入回流液和上升蒸气，形成两相系统。","keys":[],"ref":"第 275 页","hint":"","score":8},{"i":70,"n":71,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-fill-004","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"气液混合进料时，进料热状况参数 q 可用进料中________占总进料量的分率来表示。","o":[],"a":["液体量"],"exp":"气液混合进料的温度介于泡点与露点之间，原料已部分汽化，q 值恰好等于进料中液体量占总进料量的分率。冷液进料 q 大于 1、饱和液体进料 q 等于 1、饱和蒸气进料 q 等于 0、过热蒸气进料 q 小于 0，这些情况都不能把 q 简单理解为液体分率。","ev":"此时9 值可用进料中液体量占总进料量的分率来表示。","keys":[],"ref":"第 281 页","hint":"","score":2},{"i":71,"n":72,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-short-002","t":"short","mode":"","bloom":"应用","diff":"hard","q":"写出进料热状况参数 q 的定义，说明五种进料热状况下 q 的取值范围，并指出 q 如何影响提馏段的气液流量。","o":[],"a":["q 定义为每摩尔原料汽化为饱和蒸气所需的热量与原料摩尔相变焓之比，即 q 等于饱和蒸气焓减原料焓再除以饱和蒸气焓减饱和液体焓。冷液进料 q 大于 1，饱和液体进料 q 等于 1，气液混合进料 q 介于 0 与 1 之间，饱和蒸气进料 q 等于 0，过热蒸气进料 q 小于 0。提馏段下降液量与上升蒸气量分别为 L' 等于 L 加 qF、V' 等于 V 减（1 减 q）F：q 越大，提馏段液量越大、气量越小，提馏段操作线斜率越大，完成同样分离所需理论板数越少。"],"exp":"要点是 q 的物理意义、五种进料的取值范围以及两个流量关系式。容易错的是把 q 当成进料中液体分率：这只对气液混合进料成立，冷液和过热蒸气进料时 q 会超出 0 到 1 的范围。q 对操作线的影响要与图解法中 q 线斜率联系起来理解。","ev":"式(6-28)和式(6-29)关联了精馅塔内精馏段与提馅段上升蒸气量V、Ww ，下降液体量志、工 ，原料液量 下 及进料热状况 v 之间的关系。","keys":[],"ref":"第 281 页","hint":"","score":8},{"i":72,"n":73,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-fill-005","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"芬斯克公式中，全塔平均相对挥发度常取塔顶与塔底相对挥发度的________平均值。","o":[],"a":["几何"],"exp":"相对挥发度随温度变化，但对理想物系变化不大，工程上取塔顶与塔底相对挥发度的几何平均值作为全塔平均相对挥发度，再代入芬斯克公式计算全回流时的最少理论板数。取算术平均值或某一点处的瞬时值都会带来偏差，因此教材采用几何平均。","ev":"可取塔顶与塔底相对挥发度的几何平均值作为全塔的平均相对挥发度","keys":[],"ref":"第 292 页","hint":"","score":2},{"i":73,"n":74,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-fill-009","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"用芬斯克公式求得的最少理论板数________再沸器。","o":[],"a":["不包括"],"exp":"芬斯克公式由全回流条件导出，所得最少理论板数只计塔内理论板，不包括再沸器。若再沸器为间接蒸汽加热，离开它的气液两相达到平衡，相当于一块理论板，需要计入总板数时应另加一块；塔顶全凝器只起冷凝作用，也不计入理论板。","ev":"Ni为全回流时所需的最少理论板数(不包括再沸器)","keys":[],"ref":"第 293 页","hint":"","score":2},{"i":74,"n":75,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-short-006","t":"short","mode":"","bloom":"分析","diff":"hard","q":"为什么实际生产中的回流比要选在全回流与最小回流比之间？请从理论板数和费用两方面说明。","o":[],"a":["全回流时操作线与对角线重合，距平衡线最远，每块理论板的分离程度最大，理论板数最少；但塔顶和塔底都不采出产品，生产能力为零，只能用于开工、调试和实验。最小回流比时两操作线交点落在平衡线上，出现恒浓区，理论板数趋于无穷多，设备费用极高。回流比从最小回流比增大，理论板数迅速减少、设备费下降，但上升蒸气量增大，冷凝器和再沸器负荷及操作费增加；回流比过大时塔径和换热面积也要增大。因此存在使设备费与操作费之和最小的适宜回流比，生产中常取最小回流比的 1.1 至 2.0 倍。"],"exp":"要从两个极端说明：全回流板数最少但没有产品，最小回流比板数无穷多、费用无穷大，二者都不能用于正常生产。回流比增大时设备费下降而操作费上升，两条曲线叠加出现总费用最低点，这就是适宜回流比的依据。只答一个极端或只说费用不看理论板数，分析就不完整。","ev":"全回流和最小回流比都无法在正常工业生产中采用。对于一定的分离任务而言，生产中采用的回流比应介于全回流与最小回流比之间。","keys":[],"ref":"第 294 页","hint":"","score":8},{"i":75,"n":76,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-short-005","t":"short","mode":"","bloom":"应用","diff":"hard","q":"精馏塔的操作型计算与设计型计算相比有什么特点？为什么常需采用试差法？","o":[],"a":["设计型计算已知原料量、组成、分离要求和进料热状况等，求所需理论板数和加料板位置；操作型计算则已知相平衡关系、全塔理论板数及加料板位置、原料量及组成、进料热状况、回流比和塔顶采出率，求某个操作条件改变时塔顶、塔底产品的量或组成如何变化。两者所用公式相同，但操作型计算中变量之间多为非线性关系，不能直接求解，通常先假设一个产品组成，再逐板计算到另一端组成并与假设值比较，反复试差直至吻合。"],"exp":"要抓住已知量与待求量的差别：设计型求设备尺寸即理论板数，操作型核算已有塔在条件变化后的产品组成或产量。操作型计算不能像设计型那样顺序求解，因为产品组成同时受物料衡算、操作线和相平衡关系约束，必须假定终值再校验，试差收敛的关键是初值合理。把操作型当作设计型直接算，是常见错误。","ev":"操作型计算所用公式与设计计算时相同。由于许多变量之间存在非线性关系，因此在操作型计算时需采用试差法来解决。","keys":[],"ref":"第 302 页","hint":"","score":8},{"i":76,"n":77,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-short-007","t":"short","mode":"","bloom":"分析","diff":"hard","q":"简述特殊精馏的基本原理，并比较恒沸精馏与萃取精馏中第三组分的作用。","o":[],"a":["特殊精馏是在混合液中加入第三组分，改变物系的非理想性，提高各组分的相对挥发度，使相对挥发度接近 1 或有恒沸物的物系能用一般精馏方法分离。恒沸精馏加入挟带剂，挟带剂与原溶液中一个或多个组分形成沸点更低的新恒沸物，分离任务变为新恒沸物与纯组分的分离，例如在乙醇-水溶液中加苯制取无水乙醇。萃取精馏加入萃取剂，萃取剂不与原料中任何组分形成恒沸物，其沸点比原料组分高得多，靠对某组分较强的吸引力降低该组分的蒸气压，从而增大相对挥发度，萃取剂从塔底排出后循环使用。"],"exp":"两种方法都靠第三组分提高相对挥发度，区别在第三组分是否形成新恒沸物以及沸点高低。恒沸精馏的挟带剂参与形成低沸点恒沸物，随塔顶蒸气带出后需分层或回收；萃取精馏的萃取剂不形成恒沸物、沸点高，从塔底排出循环使用。把两者的第三组分作用对调是常见错误。","ev":"它的基本原理\n是在混合液中加入第三组分，改变物系的非理想性，以提高各组分的相对挥发度，使之能用一般精\n馏方法实现分离。","keys":[],"ref":"第 305 页","hint":"","score":8},{"i":77,"n":78,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-fill-006","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"为使塔板上维持一定高度的液层，每层塔板的出口端装有高出板面的________。","o":[],"a":["溢流堰"],"exp":"溢流堰装在塔板出口端，堰高决定板上液层厚度，液体横向流过塔板后翻越堰进入降液管。堰高过小则板上液层太薄、气液接触时间不足，堰高过大则塔板压降增大、易引起液泛，所以堰高要与气液负荷匹配。","ev":"为了使塔板上维持一定高度的液层，在每层塔板的出口端装有高出板面的洪流堰(weir) 。","keys":[],"ref":"第 307 页","hint":"","score":2},{"i":78,"n":79,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-fill-002","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"________为相邻两层塔板之间的液体通道，其下端与塔板间留有底隙。","o":[],"a":["降液管"],"exp":"降液管把上层塔板的液体引到下层塔板，液体横向流过塔板、翻越溢流堰后进入降液管。底隙高度要保证液体顺畅流出，又要防止气体窜入降液管，因此底隙应小于堰高。","ev":"降液管(downcomer)为相邻两层塔板之间的液体通道。","keys":[],"ref":"第 308 页","hint":"","score":2},{"i":79,"n":80,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"全塔效率又称总板效率，定义为完成一定分离任务所需的________与________之比。","o":[],"a":["理论板数；实际板数"],"exp":"全塔效率用理论板数除以实际板数表示，理论板数不包括再沸器，数值恒小于 1。它把塔板结构、物性和操作条件对传质的影响综合成一个系数，已知全塔效率便可由理论板数求出实际板数。","ev":"理论板数与所需实际板数之比称为全塔效率，又称为总板效率","keys":[],"ref":"第 311 页","hint":"","score":2},{"i":80,"n":81,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"medium","q":"单板效率常用________板效率表示，可用气相或液相组成的变化来定义。","o":[],"a":["默弗里"],"exp":"默弗里板效率用实际板上气相或液相组成的变化与理论板上组成变化之比表示，反映单块塔板的传质效果。它可通过实验测定；同一块板的气相效率与液相效率数值不同，不能与全塔平均的全塔效率混为一谈。","ev":"常用的是默弗里板效率(Murphree plate efficiency)，以M 表示。","keys":[],"ref":"第 311 页","hint":"","score":2},{"i":81,"n":82,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-short-004","t":"short","mode":"","bloom":"分析","diff":"medium","q":"比较泡罩塔板、筛孔塔板和浮阀塔板的主要优缺点。","o":[],"a":["泡罩塔板以泡罩和升气管为气体通道，气体经齿缝分散进入液层，不易漏液、操作弹性大，但结构复杂、造价高、安装检修不便，气体通道曲折使压降大、液泛气速低、生产能力小，目前已很少采用。筛孔塔板结构简单、造价低廉、压降小，生产能力和塔板效率较高，但气速过低时容易漏液，设计不合理时操作弹性较小。浮阀塔板取消了升气管，在开孔上方安装可浮动阀片，能随气量自动调节开度，操作弹性大、结构较简单、造价低、检修方便，塔板效率也较高。"],"exp":"比较时按气体通道形式、操作弹性、压降与生产能力、造价与检修四条线索展开。泡罩的优点是弹性大、缺点是复杂昂贵；筛板的优点是简单便宜、缺点是易漏液；浮阀综合两者优点，是应用很广的板型。只答一句结构简单而不分板型，得分很低。","ev":"浮阀塔板结构简单、造价低、安装检修方便","keys":[],"ref":"第 317 页","hint":"","score":8},{"i":82,"n":83,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"化学工业中固体物料的去湿，一般是先用________除去大量的湿分，再利用干燥法使湿含量进一步降低。","o":[],"a":["机械去湿法"],"exp":"去湿方法有机械去湿、吸附去湿和热能去湿三类。机械去湿用过滤、离心分离等方法可脱除大量湿分且能量消耗较少，但去湿程度不高；因此工业上先用它除去大部分水分，再用干燥把湿含量降到产品要求，这样比全部依靠热能汽化更经济。","ev":"化学工业中国体物料的去湿一般是先用机械去湿法除去大量的湿分，再利用干燥法使湿含量进一步降低","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":83,"n":84,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-fill-004","t":"fill","mode":"","bloom":"理解","diff":"medium","q":"对于空气-水系统，当空气流速较高时，可以认为空气的绝热饱和温度与________近似相等。","o":[],"a":["湿球温度"],"exp":"两者的数值关系取决于传质系数与对流传热系数之比同湿比热容的比较。对空气-水系统，流速足够高时二者之比近似等于湿比热容，所以绝热饱和温度与湿球温度在数值上近似相等。这一巧合给干燥计算带来方便，但两者的物理意义并不相同。","ev":"因此，可以认为空气的绝热饱和温度与湿球温度近似相等。","keys":[],"ref":"第 333 页","hint":"","score":2},{"i":84,"n":85,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-fill-005","t":"fill","mode":"","bloom":"理解","diff":"medium","q":"已知空气的总压和露点，即可求得空气的________，这是露点法测定空气湿度的依据。","o":[],"a":["湿度"],"exp":"一定总压下，露点下水的饱和蒸气压只与空气的湿度有关，因此测出露点温度后，查出该温度下水的饱和蒸气压，就能算出空气的湿度。湿球温度虽然也与空气状态有关，但还受流速等因素影响，不能像露点那样直接换算出湿度；把露点当作湿球温度是常见错误。","ev":"反之，若已知空气的总压和露点，即可求得空气的湿度，此为露点法测定空气湿度的依据。","keys":[],"ref":"第 333 页","hint":"","score":2},{"i":85,"n":86,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"干燥系统的热效率越高，表明________越高，操作费用越低。","o":[],"a":["热利用率"],"exp":"热效率反映供给干燥系统的热量中有多少真正用于汽化水分，热效率越高说明热量被利用得越充分，即热利用率越高，燃料或蒸汽消耗相应减少，操作费用降低。若大量热量随废气排走或散失，热效率就低。","ev":"干燥系统的热效率越高，表明热利用率越高，操作费用越低。","keys":[],"ref":"第 343 页","hint":"","score":2},{"i":86,"n":87,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"连续干燥系统中，干燥系统提供的总热量用于哪几个方面？为提高干燥系统的热效率可采取哪些措施？","o":[],"a":["总热量用于四个方面：一是加热空气，使其达到进入干燥器的温度；二是汽化物料中的水分；三是加热物料，使其达到离开干燥器的温度；四是补偿干燥器的热损失。提高热效率的措施有：适当提高空气的预热温度，热敏物料可采用中间加热；适当降低废气出口温度；回收废气余热用于预热新鲜空气；加强设备保温，减少散热损失。"],"exp":"热量衡算把输入的热量分成加热空气、汽化水分、加热物料和热损失四块，其中只有汽化水分对应的热量是有效利用的热量，热效率就是有效项与总供热量之比。要提高热效率，就要减少废气带走的热和设备的散热损失，并尽量回收余热，上述措施正是从这几个方面入手的。","ev":"由此可见，干燥系统提供的总热量用于以下 4 个方面","keys":[],"ref":"第 343 页","hint":"","score":8},{"i":87,"n":88,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-short-004","t":"short","mode":"","bloom":"分析","diff":"hard","q":"等焓干燥过程的基本条件有哪些？实际操作中为什么常偏离等焓过程？","o":[],"a":["等焓干燥又称绝热干燥、理想干燥，基本条件有三条：干燥器内不补充热量，即 Qb 等于 0；干燥器的热损失忽略不计，即 Ql 等于 0；物料在干燥过程中不升温，进、出干燥器的焓相等。满足这些条件时空气通过干燥器的焓不变，过程沿等焓线进行。实际干燥器难免向环境散热，物料升温要吸收热量，有的流程还在中间补充加热，热损失和物料带热都不能忽略，所以空气的焓一般并不守恒，只能近似按等焓过程处理。"],"exp":"三条条件分别对应补充热、热损失和物料升温三项，缺一项就不能严格等焓。实际过程有散热、物料吸热和补充加热，空气焓沿程变化，应按非等焓过程作热量衡算；把实际干燥都当作等焓过程，或把等焓条件只说成绝热，都是常见错误。","ev":"等焓干燥过程即为绝热干燥过程，其基本条件为以下几点。","keys":[],"ref":"第 344 页","hint":"","score":8},{"i":88,"n":89,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-short-003","t":"short","mode":"","bloom":"理解","diff":"medium","q":"什么是恒定干燥条件？为什么测定干燥速率曲线的实验要在恒定干燥条件下进行？","o":[],"a":["恒定干燥条件是指干燥过程中空气的温度、湿度、流速以及与物料的接触方式都保持不变的干燥条件。由于干燥机理复杂、影响因素多，工业干燥器的操作条件又随时间变化，若实验条件也在变化，就无法把干燥速率与物料含水量的关系单独分离出来。只有在恒定条件下测定，才能得到与某组空气状态唯一对应的干燥曲线和干燥速率曲线，用于干燥器的设计与放大。通常用大量空气干燥少量湿物料，即可近似认为接近恒定干燥条件。"],"exp":"恒定干燥条件包含温度、湿度、流速和接触方式四个方面同时不变。干燥速率同时受物料含水量和空气状态影响，实验中若空气状态也在变化，测得的曲线既不便于复现也不便于应用；恒定条件把变量减少到只剩含水量，结果才能用于放大，用大量空气干燥少量物料正是实现这一条件的手段。","ev":"为简化影响因素，实验一般是在恒定的干燥条件下进行，即保持空气的温度、湿度、流速及与物料的接触方式不变","keys":[],"ref":"第 346 页","hint":"","score":8},{"i":89,"n":90,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-short-002","t":"short","mode":"","bloom":"分析","diff":"hard","q":"试比较恒速干燥阶段与降速干燥阶段的特点，并说明强化这两个阶段干燥速率的方向有何不同。","o":[],"a":["恒速阶段物料表面保持充分润湿，干燥速率由表面水分的汽化控制，属于表面汽化控制，速率大小取决于空气的温度、湿度和流速等外部条件，物料内部水分向表面的迁移足以补充表面汽化，此阶段速率基本不变。降速阶段物料表面逐渐变干，内部水分向表面的迁移速率已小于表面汽化速率，过程转为内部迁移控制，干燥速率随含水量下降而不断减小，受物料结构、形状和尺寸影响。强化方向：恒速段应改善外部条件，如提高空气温度、降低空气湿度、加大流速；降速段应减小内部扩散阻力，如减小物料尺寸、采用微波加热或搅拌翻动。"],"exp":"两个阶段的控制步骤不同，恒速段表面充分润湿，汽化速率由外部传热传质条件决定；降速段表面逐渐变干，内部水分迁移成为控制步骤，速率随含水量降低而减小。强化措施必须针对各自的控制步骤，恒速段改善外部条件有效，而降速段一味加大风量收效甚微，必须从减小内部阻力着手。","ev":"在该阶段湿物料内部的水分向表面迁移的速率已小于水分自物料表面汽化的速率","keys":[],"ref":"第 348 页","hint":"","score":8},{"i":90,"n":91,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-fill-002","t":"fill","mode":"","bloom":"理解","diff":"medium","q":"在相同的初始条件和最终条件下，单级预热与多级预热的空气用量相同，即空气用量仅与空气的________有关，而与所经历的途径无关。","o":[],"a":["初始状态和最终状态"],"exp":"空气用量由物料衡算决定，等于汽化水分量除以进出干燥器空气的湿度差，只要最初和最终状态的湿度确定，无论中间是一次预热还是分多级预热，所需空气量都不变。多级预热的作用是降低每级入口温度、使干燥速率均匀并保护热敏物料，并不减少空气用量。","ev":"在相同的初始条件和最终条件下，单级预热与多级预热的空气用量相同，即空气用量仅与空气的初始状态和最终状态有关，而与所经历的途径无关。","keys":[],"ref":"第 353 页","hint":"","score":2},{"i":91,"n":92,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-fill-001","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"不同温度下的溶解度数据是计算结晶________的依据。","o":[],"a":["理论产量"],"exp":"结晶产量取决于降温或蒸发后溶液能析出多少溶质，必须用始末温度下的溶解度之差来估算，所以不同温度下的溶解度数据是计算理论产量的基础；实际产量还要扣除母液夹带和操作损失。","ev":"需要指出的是,不同温度下的溶解度数据是计算结晶理论产量的依据。","keys":[],"ref":"第 365 页","hint":"","score":2},{"i":92,"n":93,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-short-001","t":"short","mode":"","bloom":"理解","diff":"medium","q":"晶体成长过程分为哪两步？多数结晶物系由哪一步控制？并说明工业结晶为什么尽量避免初级成核。","o":[],"a":["晶体成长分两步：第一步是溶质从溶液主体向晶体表面扩散传递，以浓度差为推动力；第二步是溶质在晶体表面附着并按一定排列方式嵌入晶面，同时放出结晶热，多数物系由第二步即表面反应过程控制。初级成核速率远大于二次成核，且对过饱和度十分敏感，一旦发生会生成大量细晶，使产品粒度分布变差，因此工业结晶主要采用二次成核作为晶核来源。"],"exp":"答题要按扩散、表面反应两步展开，并明确指出多数物系由表面反应控制；再说明初级成核速率快、对过饱和度敏感，容易爆发成核产生细晶，所以工业上以二次成核为主，并把过饱和度控制在介稳区。","ev":"晶体成长的过程分两步进行， 首先是溶质从溶液主体向晶体表面扩散传递的过程，它是以浓度差为推动力; 其次是溶质在晶体表面附着并按一定排列方式嵌入晶体面，使晶体长大并放出结晶热。对于多数结晶物系，晶体成长过程由第二步(又称表面反应过程)控制。","keys":[],"ref":"第 366 页","hint":"","score":8},{"i":93,"n":94,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-short-003","t":"short","mode":"","bloom":"理解","diff":"medium","q":"工业上影响结晶速率的因素有哪些？添加剂或杂质对晶核形成和晶体成长分别有什么影响？","o":[],"a":["结晶速率包括成核速率和晶体成长速率，影响因素有过饱和度、温度、黏度、密度以及搅拌等外部条件，杂质的影响尤其显著。杂质对晶核形成一般起抑制作用：胶体物质和表面活性剂吸附在晶核表面，抑制其长成晶核，杂质离子则破坏溶液中的液体结构；对晶体成长的影响较复杂，有的杂质抑制、有的促进，还与杂质浓度和作用途径有关。"],"exp":"答题先列过饱和度、温度、黏度、密度和搅拌等常规因素，再点明杂质影响显著；晶核形成要落到吸附抑制和破坏液体结构两种机理，晶体成长要说明既可能被抑制也可能被促进，不能一概而论。","ev":"结品速率包括成核速率和晶体成长速率，工业上影响结晶速率的因素很多，例如溶液的过饱和度、温度、黏度、密度以及外部条件，如有无搅拌等，特别是杂质对结晶过程的影响十分显著。","keys":[],"ref":"第 366 页","hint":"","score":8},{"i":94,"n":95,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-fill-003","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"结晶器按流动方式可分为混合型结晶器、多级型结晶器和________结晶器。","o":[],"a":["母液循环型"],"exp":"按流动方式，结晶器分为混合型、多级型和母液循环型三类：混合型靠搅拌使器内浓度温度均匀，多级型把多个结晶段串联，母液循环型则让母液循环流动以控制过饱和度。冷却、蒸发、真空是按结晶方法的分类，不要混用。","ev":"按流动方式可分为混合型结晶器、多级型结晶器、母液循环型结晶器。","keys":[],"ref":"第 367 页","hint":"","score":2},{"i":95,"n":96,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-fill-007","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"能改变晶体外形、常用的有无机离子和表面活性剂的一类添加剂称为________。","o":[],"a":["晶习修改剂"],"exp":"杂质或添加剂对晶体形状即晶习的影响在工业结晶中很有实际意义，能把晶习改变到惊人程度的物质称为晶习修改剂，常用的有无机离子和表面活性剂。它改变的是晶体各晶面的相对生长速度，从而改变产品外形，并不等同于改变溶解度。","ev":"这些物质称为晶习修改剂，常用的有无机离子、表面活性剂等。","keys":[],"ref":"第 367 页","hint":"","score":2},{"i":96,"n":97,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-short-005","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述物理吸附与化学吸附的主要区别。","o":[],"a":["物理吸附又称范德华吸附，靠分子间作用力，结合力弱、吸附热低且与相变热同数量级，解吸容易、过程可逆，可单层也可多层，吸附速率快；化学吸附靠化学键，吸附热与化学反应热相当且明显更高，仅单分子层，吸附速度慢，过程往往不可逆。工业吸附分离主要利用物理吸附的可逆性来分离混合物并回收吸附剂。"],"exp":"答题按作用力、吸附热、层数、可逆性和速率五个方面对照最清楚：物理吸附弱而可逆、可多层、速率快；化学吸附强而多不可逆、只单层、速率慢。吸附热大小是判别两类吸附的主要标志之一，但不能作为唯一依据，还要结合可逆性和层数判断。","ev":"物理吸附也称为范德华吸附，它是吸附质和吸附剂以分子间作用力为主的吸附。物理吸附的结合力较弱,解吸较容易，吸附热较低，吸附热的数值与组分的相变和数量级相当。","keys":[],"ref":"第 369 页","hint":"","score":8},{"i":97,"n":98,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-fill-008","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"吸附剂颗粒内细孔体积与单个颗粒体积之比定义为颗粒的________。","o":[],"a":["孔隙率"],"exp":"颗粒孔隙率反映颗粒内部细孔的多少，孔隙率越大，颗粒的表观密度越小，因为细孔占据了一部分颗粒体积。它与填充床层中颗粒之间空隙所占的床层空隙率不是同一个量，计算吸附剂装填量时要区分清楚。","ev":"细孔体积与单个颗粒体积比定义为颗粒的孔隙率","keys":[],"ref":"第 370 页","hint":"","score":2},{"i":98,"n":99,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-fill-002","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"单位质量的吸附剂所具有的吸附表面积称为吸附剂的________。","o":[],"a":["比表面积"],"exp":"吸附发生在固体表面上，所以用单位质量吸附剂提供的表面积来衡量吸附能力，常用单位是 m²/g；孔径越细、微孔越多，比表面积通常越大，吸附容量也越高。","ev":"吸附剂的比表面积是指单位质量的吸附剂所具有的吸附表面积，单位为 m2/g。","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":99,"n":100,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-fill-004","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"吸附剂孔径为 1～10nm 的孔称为________。","o":[],"a":["微孔"],"exp":"按孔径大小，吸附剂孔隙分为大孔、过渡孔和微孔三类，微孔为 1～10nm，过渡孔为 10～200nm，大孔为 200～10000nm；微孔提供的表面积占比最大，是吸附容量的主要来源。","ev":"孔径的大小可分成 3 类，大孔为 200一10000nm，过渡孔为 10一200nm，微孔为 1一10nm。","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":100,"n":101,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-short-002","t":"short","mode":"","bloom":"理解","diff":"medium","q":"简述吸附过程的三个传质步骤，并说明总吸附速率由什么决定。","o":[],"a":["吸附过程包括外扩散、内扩散和表面吸附三步：吸附质先从流体主体以对流扩散方式传递到吸附剂外表面，再进入微孔扩散到固体内表面，最后在固体表面上被吸附。物理吸附的表面吸附速率很快，总吸附速率主要取决于内外扩散速率的相对大小；外扩散慢时为外扩散控制，内扩散慢时为内扩散控制。"],"exp":"答题要按流体主体到外表面、外表面到微孔内表面、表面吸附的顺序写全三步，并指出表面吸附不是控制步骤；再用内外扩散速率的相对大小判断控制类型，这是设计吸附装置和选择操作条件的依据。","ev":"吸附速率是设计吸附装置的重要依据。吸附速率是指当流体与吸附剂接触时，单位时间内的吸附量，单位为 kg/s。吸附速率与物系、操作条件及浓度有关，当物系及操作条件一定时，吸附过程包括以下 3 个步又。","keys":[],"ref":"第 373 页","hint":"","score":8},{"i":101,"n":102,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-fill-005","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"表征膜透过性能的参数为________，是指单位时间、单位膜面积透过组分的通过量。","o":[],"a":["透过速率"],"exp":"透过速率又称透水率或水通量，用单位时间、单位膜面积透过的体积或质量表示，直接决定分离设备所需膜面积的大小；它随推动力增大而提高，并受膜材料化学特性和膜形态结构影响。","ev":"表征膜透过性能的参数为透过速率(permeation flux)，是指单位时间、单位膜面积透过组分的通过量。","keys":[],"ref":"第 381 页","hint":"","score":2},{"i":102,"n":103,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-fill-006","t":"fill","mode":"","bloom":"记忆","diff":"easy","q":"电渗析采用带电的离子交换膜，在________作用下膜能允许阴离子或阳离子通过。","o":[],"a":["电场"],"exp":"电渗析靠直流电场驱动，阴、阳离子交换膜交替排列，使离子选择性迁移，从而实现脱盐或去除溶液中的离子；它属于电位差推动的膜过程，与压力驱动的反渗透、超滤和微滤不同。","ev":"电渗析采用带电的离子交换膜，在电场作用下膜能允许阴离子或阳离子通过，可用于去除溶液中的离子。","keys":[],"ref":"第 381 页","hint":"","score":2},{"i":103,"n":104,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-short-007","t":"short","mode":"","bloom":"分析","diff":"hard","q":"比较反渗透、纳滤、超滤和微滤的膜结构、操作压力与截留对象。","o":[],"a":["四者都以压力差为推动力，按膜由致密到疏松排列：反渗透膜几乎无孔，操作压力约 2～10MPa，截留大多数溶质包括离子；纳滤膜孔径约 2～5nm，压力约 0.7～3MPa，截留部分离子和有机物；超滤膜孔径约 2～20nm，压力约 0.1～1MPa，截留小胶体粒子和大分子；微滤膜孔径约 0.05～1μm，压力约 0.05～0.5MPa，截留胶体颗粒、微生物和悬浮粒子。"],"exp":"答题按膜由致密到多孔、压力由高到低、截留物由小到大的顺序展开最清楚：反渗透靠溶解-扩散截留离子，纳滤兼顾电荷效应，超滤和微滤靠筛分。四者同属压力推动的膜过程，但孔径和操作压力相差很大，选用时要按分离对象和能耗综合考虑。","ev":"反渗透膜几乎无孔，可以截留大多数深质(包括离子)而使溶剂通过，操作压力较高，一般为 2一10MPa; 纳滤膜孔径为 2一5nm，能截留部分离子及有机物，操作压力为 0.7一3MPa; 超滤膜孔径为2~20nm，能截留小胶体粒子、大分子物质，操作压力为 0.1一1MPa","keys":[],"ref":"第 381 页","hint":"","score":8},{"i":104,"n":105,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-short-006","t":"short","mode":"","bloom":"理解","diff":"medium","q":"从膜结构、孔径和截留对象三方面比较超滤与微滤。","o":[],"a":["超滤膜多为非对称结构，由极薄的表皮层和较厚的海绵状多孔层组成，前者起分离作用、后者起支撑作用，孔径约为 1nm～0.05μm，主要截留大分子和胶体，用于大分子溶液的分离与浓缩。微滤膜有对称和非对称两种结构，孔径约为 0.05～10μm，截留胶体微粒、微生物和悬浮粒子，是应用最普遍的膜过程。两者都在压力差作用下按孔径筛分。"],"exp":"答题要抓住三条对照线：结构上超滤多为非对称、微滤两种结构都有；孔径上超滤约 1nm～0.05μm、微滤约 0.05～10μm，微滤明显更大；截留对象上超滤针对大分子和胶体，微滤针对微粒和微生物。二者同属压力驱动的筛分过程，只是孔径档次不同。","ev":"超滤膜多数为非对称结构，膜孔径范围为 lnm一0.05pm，系由一极薄的、具有一定孔径的表皮层和一层较厚的、具有海绵状和指孔状结构的多孔层组成，前者起分离作用，后者起支撑作用。微滤膜有对称和非对称两种结构，和孔径范围为0.05一10pkm。","keys":[],"ref":"第 385 页","hint":"","score":8},{"i":105,"n":106,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-short-004","t":"short","mode":"","bloom":"应用","diff":"medium","q":"减轻浓差极化与膜污染可以采取哪些措施？","o":[],"a":["主要有三条：一是对原料液进行预处理，除去料液中的大颗粒，减少在膜面和膜孔中的沉积；二是增加料液流速或在膜组件中加内插件，提高湍动程度、减薄边界层厚度；三是定期对膜进行反冲和清洗，及时恢复通量。"],"exp":"答题要对应预处理、改善流动、清洗三条途径：预处理减少污染物来源，提高流速或加内插件强化传质、减薄边界层，定期反冲清洗恢复通量。只提高操作压力不能解决浓差极化和污染，反而可能加重膜面沉积。","ev":"减轻浓关极化与膜污染的途径主要有以下 3 种。","keys":[],"ref":"第 386 页","hint":"","score":8}]};</script>
