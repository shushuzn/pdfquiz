<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="tcMeta" content="#f3f1ec">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="化工原理 · 客观题专练">
<title>化工原理 · 客观题专练 · 复习题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b5a'/%3E%3Cpath d='M11 22V10h5a4 4 0 0 1 0 8h-5m5 0 4 4' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --sans: system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif: "Iowan Old Style","Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  --mono: ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;

  --paper:#f3f1ec;
  --surface:#fffefc;
  --surface2:#f7f4ee;
  --ink:#1b201e;
  --ink2:#49524f;
  --muted:#8a938f;
  --line:#e6e1d6;
  --line2:#d3ccbd;
  --accent:#1f6b5a;
  --accent-ink:#175246;
  --accent-soft:#e7f1ed;
  --ok:#187a55;
  --ok-soft:#e6f4ee;
  --bad:#b23a30;
  --bad-soft:#fbeae7;
  --shadow-sm:0 1px 2px rgba(27,32,30,.05);
  --shadow:0 1px 2px rgba(27,32,30,.04),0 14px 32px -20px rgba(27,32,30,.35);
  --r:16px;
  /* 可调字号：题干与选项、输入框跟随，正文其它元素保持不变 */
  --stem:18.5px;
  --body:15px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-fs="sm"]{--stem:16.5px;--body:13.8px}
html[data-fs="md"]{--stem:18.5px;--body:15px}
html[data-fs="lg"]{--stem:21px;--body:17px}
[data-theme="dark"]{
  --paper:#0f1214;
  --surface:#171b1e;
  --surface2:#1d2226;
  --ink:#e9edeb;
  --ink2:#b8c1be;
  --muted:#7d8885;
  --line:#272f33;
  --line2:#374247;
  --accent:#5ec0a5;
  --accent-ink:#8ad8c2;
  --accent-soft:#13302a;
  --ok:#57c496;
  --ok-soft:#122f29;
  --bad:#f08a7e;
  --bad-soft:#321a1a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
/* 横滑翻页不能被浏览器当成「后退」手势吃掉 */
html{overscroll-behavior-x:none}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb, var(--accent) 22%, transparent)}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh;min-height:100dvh}

/* ---------------------------------------------------------------- side */
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  padding:26px 18px 20px;
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:22px;
  backdrop-filter:blur(8px);
}
.brand{display:flex;gap:12px;align-items:flex-start;padding:0 4px}
.mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 2px 8px -2px color-mix(in srgb, var(--accent) 55%, transparent);
}
.brand-t h1{
  margin:0;font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.45;
  letter-spacing:.01em;
}
.brand-t p{margin:3px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.02em}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-sm);
}
.ring{position:relative;width:72px;height:72px;flex:0 0 72px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--line2);opacity:.55}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring-t{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1;
}
.ring-t b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ring-t span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.ring-meta{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2)}
.ring-meta div{display:flex;align-items:center;gap:6px}
.ring-meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.mut{background:var(--line2)}

.filters{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.seg{
  display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;
}
.seg button{
  flex:1;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--ink2);
  transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{
  background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);
}
.seg.small button{padding:4px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px}
.chips button{
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink2);
  background:var(--surface);transition:all .16s;
}
.chips button:hover{border-color:var(--line2);color:var(--ink)}
.chips button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;
}

.chapters{display:flex;flex-direction:column;gap:12px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.grp-t{
  font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  padding:0 8px 6px;text-transform:none;
}
.nav-item{
  width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:12.5px;color:var(--ink2);text-align:left;transition:background .15s,color .15s;
  border-left:2px solid transparent;
}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item[aria-current="true"]{
  background:var(--accent-soft);color:var(--accent-ink);font-weight:600;border-left-color:var(--accent);
}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item[aria-current="true"] .cnt{color:var(--accent-ink);opacity:.75}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.side-foot button,.side-foot .hub-link{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:12.5px;color:var(--ink2);text-align:left;transition:background .15s,color .15s;
}
.side-foot button:hover,.side-foot .hub-link:hover{background:var(--surface2);color:var(--ink)}
.side-foot svg{width:14px;height:14px;opacity:.7}
.side-foot .hub-link{margin-bottom:2px;color:var(--accent);font-weight:600}
.side-foot .hub-link:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}

/* ---------------------------------------------------------------- main */
.main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative}
.progress{position:sticky;top:0;height:2px;background:transparent;z-index:30}
.progress i{
  display:block;height:100%;width:0;background:var(--accent);
  transition:width .4s cubic-bezier(.2,.8,.2,1);
}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;min-width:0;white-space:nowrap}
.crumb span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:180px}
.crumb span:last-child{color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .sep{opacity:.45}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.timer{
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line);
}
.icon-btn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 15px;border-radius:9px;font-size:13px;font-weight:500;
  transition:all .16s;white-space:nowrap;
}
.btn.ghost{border:1px solid var(--line2);color:var(--ink2);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink2);color:var(--ink)}
.btn.primary{
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  box-shadow:0 1px 2px color-mix(in srgb, var(--accent) 40%, transparent);
}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--accent);border-color:var(--accent)}
.only-mobile{display:none}

/* ---------------------------------------------------------------- stage */
.stage{
  flex:1;width:100%;max-width:860px;margin:0 auto;
  padding:38px 26px 28px;
}
.q{display:none;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
.q.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.num{
  font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;line-height:1;margin-right:2px;font-variant-numeric:tabular-nums;
}
.tag{
  font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.02em;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
}
.tag.t{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:500}
.tag.lv-easy{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%, transparent)}
.tag.lv-hard{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%, transparent)}
.mark-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--muted);padding:4px 8px;border-radius:7px;
  transition:all .15s;
}
.mark-btn:hover{background:var(--surface2);color:var(--ink2)}
.mark-btn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.mark-btn svg{width:13px;height:13px}

.stem{
  font-size:var(--stem);line-height:1.85;font-weight:500;letter-spacing:.005em;color:var(--ink);
  margin:0 0 26px;max-width:64ch;overflow-wrap:break-word;
}
.stem code,.ans code{
  font-family:var(--mono);font-size:.88em;background:var(--surface2);
  padding:1px 5px;border-radius:5px;border:1px solid var(--line);
}
.blank{display:inline-block;width:3.4em;border-bottom:1.5px solid var(--line2);vertical-align:-.12em;margin:0 .18em}
/* 上下标：题干、选项、解析里都可能出现化学式与指数 */
.stem sup,.opt .txt sup,.ans-row .v sup,.key-row sup,.sheet sup,.wrong-item .qt sup{font-size:.72em;line-height:0;vertical-align:super}
.stem sub,.opt .txt sub,.ans-row .v sub,.key-row sub,.sheet sub,.wrong-item .qt sub{font-size:.72em;line-height:0;vertical-align:sub}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);
  font-size:var(--body);line-height:1.65;
  transition:border-color .16s,background .16s,transform .16s,box-shadow .16s;
  box-shadow:var(--shadow-sm);
}
.opt:hover:not(.locked){border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.opt:active:not(.locked){transform:translateY(0) scale(.995);border-color:var(--accent)}
.opt .ltr{
  flex:0 0 24px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
  transition:all .16s;margin-top:1px;
}
.opt .txt{flex:1;min-width:0}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.opt .flag{font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap;align-self:center}
.opt.is-ok .flag{color:var(--ok);font-weight:600}
.opt.is-bad .flag{color:var(--bad);font-weight:600}

/* text inputs */
.field{
  width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:var(--body);line-height:1.7;
  transition:border-color .16s,box-shadow .16s;resize:vertical;
}
/* 多行作答区按 rows 给初始高度；单行填空框保持一行高，别撑成大方块 */
textarea.field{min-height:calc(var(--rows,3) * 1.7em + 28px)}
.field::placeholder{color:var(--muted)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field[readonly]{background:var(--surface2);color:var(--ink2)}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0;display:flex;gap:6px;align-items:center}

/* actions under question */
.q-actions{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.q-actions .spacer{flex:1}
.self-grade{display:flex;gap:8px}
.self-grade button{
  padding:7px 14px;border-radius:9px;font-size:13px;border:1px solid var(--line2);
  color:var(--ink2);transition:all .16s;
}
.self-grade button:hover{border-color:var(--ink2);color:var(--ink)}
.self-grade button[data-self="yes"]:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.self-grade button[data-self="no"]:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

/* verdict + answer */
.verdict{
  display:none;align-items:center;gap:9px;margin-top:22px;
  font-size:14px;font-weight:600;
}
.q.graded .verdict{display:flex}
.verdict .ico{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;color:#fff;flex:0 0 20px;
}
.verdict.ok{color:var(--ok)}
.verdict.ok .ico{background:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict.bad .ico{background:var(--bad)}
.verdict.info{color:var(--ink2)}
.verdict.info .ico{background:var(--ink2)}
.verdict .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.verdict .redo{
  margin-left:auto;flex:0 0 auto;padding:4px 10px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
}
.verdict .redo:hover{border-color:var(--line2);color:var(--ink)}

.ans{display:none;margin-top:14px;padding:18px 20px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.q.graded .ans{display:block}
.ans-row{display:flex;gap:10px;font-size:13.5px;line-height:1.8;margin-bottom:8px}
.ans-row:last-child{margin-bottom:0}
.ans-row .k{
  flex:0 0 auto;min-width:46px;white-space:nowrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.06em;padding-top:2px;
}
.ans-row .v{flex:1;color:var(--ink);min-width:0}
.ans-row .v b{color:var(--accent-ink);font-weight:600}

/* 翻译题：输入框下的操作提示 */
.typeline{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.7}

/* 采分点：英文术语与中文释义分开排版，别挤成一串 */
.keys{margin:12px 0 10px;padding:11px 13px;border-radius:9px;background:var(--surface2)}
.keys-h{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
.key-row{display:flex;gap:8px;align-items:baseline;line-height:2}
.key-row .ke{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);font-weight:600}
.key-row .kc{font-size:12.5px;color:var(--ink2)}
.key-row .kc::before{content:"·";margin-right:8px;color:var(--muted)}
/* 出处 */
.src{margin-top:10px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
blockquote.ev{
  margin:10px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--accent);
  font-size:12.5px;line-height:1.85;color:var(--ink2);
}
blockquote.ev::before{
  content:"原文依据";display:block;font-size:10px;letter-spacing:.12em;
  color:var(--muted);margin-bottom:2px;
}
.alt{display:block;margin-top:3px;color:var(--ink2);font-size:13px}
.alt i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

/* navbar */
.navbar{
  position:sticky;bottom:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 26px 30px;
  background:linear-gradient(to top, var(--paper) 62%, transparent);
}
.kbd-hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);white-space:nowrap;display:flex;gap:12px;align-items:center;
}
.kbd-hint kbd{
  font-family:var(--mono);font-size:10px;padding:0 4px;border:1px solid var(--line);
  border-radius:4px;background:var(--surface);color:var(--ink2);
}
@media (max-width:1100px){.kbd-hint{display:none}}
.pos{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.pos b{color:var(--ink);font-weight:600}

/* ---------------------------------------------------------------- result */
.result{display:none;flex:1;max-width:860px;width:100%;margin:0 auto;padding:44px 26px 60px}
.result.show{display:block;animation:rise .3s ease}
.res-head{display:flex;gap:34px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.big-ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.big-ring svg{transform:rotate(-90deg);display:block}
.big-ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big-ring .t b{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.big-ring .t span{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.res-title h2{margin:0 0 6px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.01em}
.res-title p{margin:0;color:var(--ink2);font-size:13.5px}
.res-title p.res-meta{margin-top:3px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.res-title p b.sc{font-family:var(--mono);font-size:19px;color:var(--accent-ink);font-weight:600;margin:0 1px}
.res-stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.res-stats div{font-size:12.5px;color:var(--muted)}
.res-stats b{display:block;font-size:21px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:1px}
.res-sec{margin-top:30px}
.res-sec h3{
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 12px;font-weight:600;
}
.bars{display:flex;flex-direction:column;gap:13px;max-width:640px}
/* 单元名长短悬殊（最长 60 字符），单行三段式必然截断，改成上下两行 */
.bar-row{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.bar-row .top{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.bar-row .lbl{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .frac{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 轨道用可见的浅色：surface2 与纸底几乎同色，0% 的行看上去会像没有轨道 */
.bar-row .track{display:block;width:100%;height:6px;border-radius:99px;background:color-mix(in srgb,var(--line2) 62%,transparent);overflow:hidden}
.bar-row .fill{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.wrong-list{display:flex;flex-direction:column;gap:8px}
.wrong-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;
  transition:border-color .16s,transform .16s;
}
.wrong-item:hover{border-color:var(--line2);transform:translateX(2px)}
.wrong-item .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:0 0 26px;padding-top:2px}
.wrong-item .qt{font-size:13.5px;line-height:1.6;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wrong-item .qt .tk{font-style:normal;font-size:10.5px;letter-spacing:.04em;color:var(--accent-ink);
  background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px}
.res-actions{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600}

.scrim{display:none}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:100;
  background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px 16px;border-radius:99px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------------------------------------------------------- 题号跳转 */
.pos-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:1px;
  min-width:66px;padding:7px 10px;border-radius:9px;border:1px solid transparent;
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,color .15s;
}
.pos-btn:hover{background:var(--surface2);border-color:var(--line);color:var(--ink2)}
.pos-btn b{color:var(--ink);font-weight:600;font-size:13px}
.pos-btn svg{width:13px;height:13px;flex:0 0 13px;opacity:.5;margin-right:5px}
.pos-btn:hover svg{opacity:.75}

.sheet-scrim{
  display:none;position:fixed;inset:0;z-index:70;
  background:rgba(12,14,13,.38);backdrop-filter:blur(2px);
}
.sheet-scrim.show{display:block;animation:fade .18s ease}
.sheet{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:75;
  max-height:76vh;max-height:76dvh;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  box-shadow:0 -14px 44px -14px rgba(0,0,0,.45);
  padding-bottom:var(--safe-b);
}
.sheet.show{display:flex;animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{
  display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line);
}
.sheet-h b{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.sheet-h .legend{margin-left:auto;display:flex;gap:11px;font-size:10.5px;color:var(--muted)}
.sheet-h .legend span{display:inline-flex;align-items:center;gap:4px}
.sheet-h .legend i{width:8px;height:8px;border-radius:2.5px;background:var(--line2)}
.sheet-h .legend i.ok{background:var(--ok)}
.sheet-h .legend i.bad{background:var(--bad)}
.sheet-tools{padding:11px 16px 0;display:flex;align-items:center}
.sheet-tools .seg{max-width:210px;width:100%}
.sheet-body{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(20px + var(--safe-b));
}
.qgrid-grp{margin-bottom:15px}
.qgrid-grp:last-child{margin-bottom:0}
.qgrid-t{
  font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px 2px;
  display:flex;align-items:center;gap:8px;line-height:1.5;
}
.qgrid-t i{flex:1 1 12px;height:1px;background:var(--line);font-style:normal}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.qcell{
  position:relative;height:44px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  display:grid;place-items:center;transition:transform .12s,border-color .12s;
}
.qcell:active{transform:scale(.94)}
.qcell.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok);font-weight:600}
.qcell.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 42%,transparent);color:var(--bad);font-weight:600}
.qcell.pending{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.qcell.cur{outline:2px solid var(--accent);outline-offset:1px}
.qcell.marked::after{
  content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);
}
.qcell.cur.marked::after{background:var(--accent-ink)}

/* 翻页方向：左滑进入新题从右侧滑入，右滑返回从左侧 */
.stage[data-dir="l"] .q.active{animation:slideL .28s cubic-bezier(.2,.8,.2,1)}
.stage[data-dir="r"] .q.active{animation:slideR .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* 桌面端别让面板横贯整屏，收成居中浮层 */
@media (min-width:981px){
  .sheet{
    left:0;right:0;margin:0 auto;width:min(680px,92vw);
    bottom:28px;border:1px solid var(--line);border-radius:18px;
    padding-bottom:0;max-height:72vh;
  }
  .sheet-body{padding-bottom:18px}
  .sheet-scrim{background:rgba(12,14,13,.26)}
}

/* 超长英文单词（化学名）在窄屏会顶破容器 */
.stem,.opt .txt,.ans-row .v,blockquote.ev,.key-row,.wrong-item .qt{overflow-wrap:break-word}

/* ---------------------------------------------------------------- responsive */
@media (max-width:980px){
  /* 小屏上直接放大字号会溢出，按断点重算三档 */
  html[data-fs="sm"]{--stem:15.8px;--body:13.6px}
  html[data-fs="md"]{--stem:17.4px;--body:15.4px}
  html[data-fs="lg"]{--stem:20px;--body:17.4px}

  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;left:0;top:0;z-index:60;
    width:min(86vw,318px);height:100vh;height:100dvh;
    padding:calc(20px + var(--safe-t)) 16px calc(16px + var(--safe-b));
    transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    background:var(--surface);box-shadow:var(--shadow);
  }
  .side.open{transform:none}
  .scrim.show{
    display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.34);
    animation:fade .2s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .only-mobile{display:grid}

  .topbar{
    padding:calc(8px + var(--safe-t)) 14px 8px;gap:10px;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(14px) saturate(1.15);
  }
  .stage{padding:20px 16px calc(94px + var(--safe-b))}

  /* 底栏贴住视口底部：长页面滚动时始终可点，且不遮住正文末段 */
  .navbar{
    position:fixed;left:0;right:0;bottom:0;
    justify-content:space-between;gap:10px;
    padding:10px 14px calc(10px + var(--safe-b));
    background:color-mix(in srgb, var(--surface) 93%, transparent);
    backdrop-filter:blur(14px) saturate(1.15);
    border-top:1px solid var(--line);
    box-shadow:0 -10px 28px -22px rgba(0,0,0,.55);
  }
  .nav-prev{min-height:44px;padding:10px 16px;font-size:13.5px}
  .nav-next{min-height:44px;padding:10px 16px;font-size:13.5px;flex:1;max-width:200px}
  .pos-btn{min-height:44px;min-width:60px}

  /* 键盘弹出时收起底栏，别压在输入框上 */
  body.kbd .navbar{display:none}
  body.kbd .stage{padding-bottom:32px}
  .toast{bottom:calc(84px + var(--safe-b))}

  /* 抽屉整体滚动，章节列表别再套一层滚动区，否则手机上只剩三行可视 */
  .chapters{overflow:visible;flex:0 0 auto}
  .side-foot{margin-top:12px}
  .result{padding:26px 16px calc(48px + var(--safe-b))}
  .res-head{gap:20px}
}

@media (max-width:640px){
  #mode{display:none}
  .topbar{gap:8px}
  .crumb{font-size:11.5px}
  .crumb span:first-child,.crumb .sep{display:none}
  .timer{display:block;font-size:11px;padding:3px 7px}
  .btn{padding:8px 12px;font-size:13px;min-height:40px}
  .icon-btn{width:40px;height:40px}
  .icon-btn svg{width:18px;height:18px}

  .qhead{gap:7px;margin-bottom:16px}
  .num{font-size:22px}
  .tag{font-size:10.5px;padding:3px 7px}
  .mark-btn{padding:6px 4px}

  .stem{line-height:1.9;margin-bottom:18px}
  .opts{gap:10px}
  .opt{padding:14px;border-radius:13px;min-height:54px;flex-wrap:wrap}
  .opt .ltr{width:26px;height:26px;flex-basis:26px;margin-top:0}
  /* 判定标注换行到正文下方，避免把选项文字挤成窄条 */
  .opt .flag{flex:1 1 100%;margin:5px 0 0 38px;font-size:11px}
  .opt .flag:empty{display:none}

  .field{padding:13px 14px;font-size:max(16px, var(--body))}
  .q-actions{gap:8px;margin-top:16px}
  .q-actions .btn{flex:1;min-height:44px}
  .q-actions .hint{flex:1 1 100%;margin:0}
  .self-grade{display:flex;gap:8px;width:100%}
  .self-grade button{flex:1;min-height:46px;font-size:13.5px}

  .verdict{margin-top:18px;font-size:13.5px}
  .ans{padding:15px 14px;border-radius:13px;margin-top:12px}
  .ans-row{font-size:13px;gap:8px}
  .ans-row .k{min-width:42px;font-size:11px}
  .keys{padding:10px 12px}
  .key-row{line-height:1.9}
  blockquote.ev{font-size:12.5px;line-height:1.9;padding-left:12px}

  /* 结果页：环形缩小、数据两列、按钮整宽堆叠 */
  .res-head{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:26px}
  .big-ring{width:104px;height:104px;flex-basis:104px}
  .big-ring svg{width:104px;height:104px}
  .big-ring .t b{font-size:27px}
  .res-title h2{font-size:20px}
  .res-title p{font-size:12.5px;line-height:1.8}
  .res-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;width:100%;margin-top:14px}
  .res-stats b{font-size:19px}
  .res-actions{flex-direction:column;gap:8px;margin-top:24px}
  .res-actions .btn{width:100%;min-height:46px}
  .wrong-item{padding:11px 12px}
  .wrong-item .qt{-webkit-line-clamp:3}
  .bar-row .lbl{white-space:normal;line-height:1.5}
}

@media (max-width:400px){
  .topbar{padding-left:10px;padding-right:10px;gap:6px}
  .crumb{max-width:96px}
  .num{font-size:20px}
  .qgrid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
  .qcell{height:42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---------------------------------------------------------------- print */
@media print{
  body{background:#fff}
  .side,.topbar,.navbar,.scrim,.toast,.progress,.q-actions,.mark-btn,
  .sheet,.sheet-scrim,.pos-btn{display:none!important}
  .app{display:block}
  .stage{max-width:none;padding:0}
  .q{display:block!important;page-break-inside:avoid;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid #ddd}
  .ans,.verdict{display:block!important}
  .opt{box-shadow:none;break-inside:avoid}
  .result{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">Q</div>
      <div class="brand-t">
        <h1>化工原理 · 客观题专练</h1>
        <p>解析器 教材 OCR 全文 + 逐字回查 · 157 题</p>
      </div>
    </div>

    <div class="panel">
      <div class="ring">
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="track" cx="36" cy="36" r="30" fill="none" stroke-width="5"/>
          <circle class="bar" id="ringBar" cx="36" cy="36" r="30" fill="none" stroke-width="5"
                  stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="ring-t"><b id="ringNum">0</b><span id="ringAll">/ 0</span></div>
      </div>
      <div class="ring-meta">
        <div><span class="dot ok"></span><b id="okNum">0</b> 答对</div>
        <div><span class="dot bad"></span><b id="badNum">0</b> 答错</div>
        <div><span class="dot mut"></span><b id="leftNum">0</b> 未做</div>
      </div>
    </div>

    <div class="filters">
      <div class="flabel">范围</div>
      <div class="seg" id="scope">
        <button data-scope="all" aria-pressed="true">全部</button>
        <button data-scope="todo" aria-pressed="false">未做</button>
        <button data-scope="wrong" aria-pressed="false">错题</button>
        <button data-scope="marked" aria-pressed="false">标记</button>
      </div>
      <div class="flabel" style="margin-top:6px">题型</div>
      <div class="chips" id="types"></div>
      <div class="flabel" style="margin-top:10px">模式</div>
      <div class="seg small" id="mode2">
        <button data-mode="practice">练习</button>
        <button data-mode="exam">考试</button>
      </div>
      <div class="flabel" style="margin-top:10px">正文字号</div>
      <div class="seg small" id="fsSeg">
        <button data-fs-btn="sm">小</button>
        <button data-fs-btn="md">标准</button>
        <button data-fs-btn="lg">大</button>
      </div>
    </div>

    <nav class="chapters" id="chapters" aria-label="章节导航"></nav>

    <div class="side-foot">
      <a class="hub-link" href="hgyl.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回课程</a>
      <button id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
        打印 / 存为 PDF
      </button>
      <button id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        清空答题记录
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="progress"><i id="progBar"></i></div>
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="打开目录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="crumb">
        <span id="crumbCh">—</span><span class="sep">/</span><span id="crumbSec">—</span>
      </div>
      <div class="top-right">
        <div class="timer" id="timer">00:00</div>
        <div class="seg small" id="mode">
          <button data-mode="practice">练习</button>
          <button data-mode="exam">考试</button>
        </div>
        <button class="btn ghost" id="submitBtn">交卷</button>
        <button class="icon-btn" id="themeBtn" aria-label="切换深浅色"></button>
      </div>
    </header>

    <div class="stage" id="stage"></div>

    <div class="result" id="result"></div>

    <footer class="navbar" id="navbar">
      <button class="btn ghost nav-prev" id="prevBtn" disabled>上一题</button>
      <button class="pos-btn" id="posBtn" aria-label="打开题目列表，快速跳转" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
        </svg>
        <b id="posNow">1</b><span>/</span><span id="posAll">0</span>
      </button>
      <button class="btn primary nav-next" id="nextBtn">下一题</button>
      <div class="kbd-hint">
        <span><kbd>1</kbd>–<kbd>4</kbd> 选择</span>
        <span><kbd>←</kbd><kbd>→</kbd> 翻页</span>
        <span><kbd>M</kbd> 标记</span>
        <span><kbd>T</kbd> 主题</span>
      </div>
    </footer>
  </main>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="题目列表">
  <header class="sheet-h">
    <b>题目列表</b>
    <div class="legend">
      <span><i class="ok"></i>对</span>
      <span><i class="bad"></i>错</span>
      <span><i></i>未做</span>
    </div>
    <button class="icon-btn" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="sheet-tools">
    <div class="seg small" id="sheetScope">
      <button data-sheet-scope="unit" aria-pressed="true">按单元</button>
      <button data-sheet-scope="type" aria-pressed="false">按题型</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
