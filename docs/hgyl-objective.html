ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-truefalse-014","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"采用减压解吸时，若吸收在常压下进行，解吸通常需要在真空条件下操作。","o":["正确","错误"],"a":["T"],"exp":"加压吸收后吸收液中溶质的平衡分压较高，把压力降到常压就能使溶质逸出；但若吸收本身在常压下进行，气相中溶质分压已经较低，只有进一步抽真空降低总压，才能使气相溶质分压低于液相平衡分压，从而满足解吸条件。","ev":"但如果是常压吸收，解吸只能在真空条件下进行， 这样才能使溶质从液相中解吸出来。","keys":[],"ref":"第 245 页","hint":"","score":2},{"i":268,"n":269,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-single-033","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"填料塔中，液体沿填料层向下流动时逐渐向塔壁聚集、塔壁附近液流量增大的现象称为什么？","o":["液泛","沟流","载点","壁流"],"a":["D"],"exp":"液体在填料层内流动时有向塔壁流动的趋势，塔壁附近液流量逐渐增大，这种现象称为壁流。壁流使气液两相在塔内分布不均，降低传质效果，因此填料层较高时要分段并设置液体再分布器。液泛是气速过大使液体不能顺利流下，沟流是液体局部短路，载点是压降随气速急剧上升的转折点。","ev":"当液体在填料层内流动时，有向塔壁流动的趋势，塔壁附近液体流量会逐渐增大，这种现象称为壁流。","keys":[],"ref":"第 248 页","hint":"","score":2},{"i":269,"n":270,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-single-024","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"鲍尔环填料与拉西环相比，主要的结构改进和效果是什么？","o":["侧壁开两排窗口，气液传质效率提高、流体通量增大、阻力下降","高径比改为1:2，底端做成喇叭口形","内外表面全部敞开，液体可流经内外两侧","用木板、陶瓷等材料排列成栅板"],"a":["A"],"exp":"鲍尔环是在拉西环侧壁上开两排长方形或正方形窗口发展而来的，开窗后气体和液体可以穿过环壁，气液分布改善，因此传质效率大大提高、流体通量增加、流动阻力下降。高径比1:2、底端喇叭口是阶梯环的特征；内外表面全部敞开是弧鞍填料的特点；用木板、陶瓷排列成栅板是格栅填料。","ev":"鲍尔环填料 是对拉西环结构改进发展而来的，在拉西环的侧壁上开两排长方形或正方形的窗口，如图 5-32(b)所示。鲍尔环填料与拉西环相比，其比表面积、空阶率并未增加很多，但气液传质效率大大提高，流体通量增加，流体流动的阻力下降。","keys":[],"ref":"第 250 页","hint":"","score":2},{"i":270,"n":271,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-multiple-002","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"填料塔的流体力学性能通常包括下列哪些内容？","o":["填料层的持液量","填料层压降","液泛气速","填料的比表面积"],"a":["A","B","C"],"exp":"填料塔的流体力学性能通常包括持液量、填料层压降和液泛气速，它们分别用于设计填料支承板、选择气体输送设备以及确定操作气速和塔径。比表面积是填料的几何特性，属于填料性能参数，用于计算传质面积，不属于流体力学性能，故D不选。","ev":"填料塔的流体力学性能通常包括填料层的持液量、填料层压降、液泛气速等。","keys":[],"ref":"第 251 页","hint":"","score":3},{"i":271,"n":272,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-truefalse-004","t":"truefalse","mode":"","bloom":"记忆","diff":"easy","q":"泛点是填料塔操作的极限气速，泛点对应的气速称为泛点气速。","o":["正确","错误"],"a":["T"],"exp":"气速增大到泛点时，液体向下流动严重受阻、在填料层内积聚并扩展到整个塔截面，塔的正常操作被破坏，因此泛点是填料塔操作的极限气速。设计时操作气速应低于泛点气速，通常取泛点气速的0.6至0.8倍，正常操作范围在载点气速与泛点气速之间。","ev":"所以，泛点是填料塔操作的极限气速，泛点对应的气速为泛点气速。","keys":[],"ref":"第 252 页","hint":"","score":2},{"i":272,"n":273,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-truefalse-020","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"为使填料塔获得最大的传质速率，操作气速应取泛点气速。","o":["正确","错误"],"a":["F"],"exp":"气速接近但小于泛点气速时，气液两相滑动程度较大，传质确实有利，但此时操作极不稳定，稍有波动就可能液泛，塔的正常操作被破坏。因此正常操作气速应取在载点气速与泛点气速之间，设计时通常取泛点气速的0.6至0.8倍，而不能直接在泛点气速下操作。","ev":"适宜的操作气速应低于泛点气速，当气速接近但小于泛点气速时，气液两相滑动程度较大，有利于传质，但此时操作极为不稳定,生产过程中稍有波动便可能液泛。所以正常的操作气速范围应为载点气速到泛点气速之间。","keys":[],"ref":"第 252 页","hint":"","score":2},{"i":273,"n":274,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-multiple-006","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"填料塔的主要附件包括下列哪些？","o":["填料支承板","液体分布器","液体再分布器","降液管"],"a":["A","B","C"],"exp":"填料塔的主要附件有填料支承板、液体喷淋装置、液体分布器、液体再分布器和气体出口除沫器等，故A、B、C正确。降液管是板式塔中引导液体从上层塔板流向下层塔板的部件，填料塔没有塔板，不需要降液管。","ev":"填料塔的主要附件有填料支承板、液体喷淋装置、液体分布器、液体再分布器和气体出口除沫融等。","keys":[],"ref":"第 254 页","hint":"","score":3},{"i":274,"n":275,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-multiple-008","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"填料支承板的设计应满足下列哪些基本要求？","o":["自由截面积应小于填料层的自由截面积","具有足够的机械强度","自由截面积不应小于填料层的自由截面积","结构应易于使流体分布均匀"],"a":["B","C","D"],"exp":"支承板要承受填料和塔内持液的重量，因此必须有足够的机械强度；其自由截面积不能小于填料层的自由截面积，否则气液通过时阻力过大，可能在支承板处首先发生液泛；结构还应便于流体均匀分布。把自由截面积设计得比填料层小正好违背这一要求，故A错误。","ev":"工业生产要求文承板的设计应具备以下基本条件， @) 足够的机械强度; @) 支承板的自由截面积不应小于填料层的自由截面积，以免气液在通过支承板时流动阻力过大，在支承板处首先发生液泛; 吧 结构易于使流体分布均匀 。","keys":[],"ref":"第 254 页","hint":"","score":3},{"i":275,"n":276,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-multiple-001","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"强化吸收过程可从下列哪些方面着手？","o":["提高吸收过程的推动力","降低吸收过程的传质阻力","提高吸收剂温度以增大溶解度","增大吸收剂黏度以延长接触时间"],"a":["A","B"],"exp":"吸收速率等于推动力与阻力之比，强化吸收一是提高推动力，如采用逆流操作、增大吸收剂流量、降低吸收剂温度和入口浓度；二是降低传质阻力，如提高流体的湍动程度。提高吸收剂温度会使溶解度下降、推动力减小，增大黏度会增大液膜阻力，二者都使吸收变差，故C、D错误。","ev":"吸收速率为吸收推动力与吸收阻力之比，故强化吸收过程从以下两个方面考虑: 一是提高吸收过程的推动力; 二是降低吸收过程的传质阻力。","keys":[],"ref":"第 256 页","hint":"","score":3},{"i":276,"n":277,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-001","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"蒸馏能够把液体混合物中的各组分分离开来，其分离依据是什么？","o":["各组分化学性质的差异","各组分挥发性的差异","各组分密度的差异","各组分溶解度的差异"],"a":["B"],"exp":"蒸馏靠的是组分挥发性的差异：相同温度下饱和蒸气压大的组分更易进入气相，部分汽化时气相被易挥发组分富集，冷凝后便得到组成不同的产品。密度差用于沉降分离，溶解度差用于吸收或萃取，化学性质差异则属于化学反应，都不是蒸馏的依据。","ev":"蒸馏是利用液体混合物中各组分挥发性的差异将其分离的化工单元操作。","keys":[],"ref":"第 264 页","hint":"","score":2},{"i":277,"n":278,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-026","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"精馏过程属于下列哪一类单元操作？","o":["传质过程","传热过程","机械分离过程","化学反应过程"],"a":["A"],"exp":"精馏依靠气液两相间组分的转移与重新分配实现分离，物质从一相转入另一相而浓度发生变化，因此属于传质过程。过程中虽然伴随冷凝放热和汽化吸热，但传热只是实现传质的条件而不是分离依据；机械分离处理非均相物系，化学反应会改变物质种类，都与精馏本质不符。","ev":"由于精馅过程是物质在两相间的转移过程，故属传质过程。","keys":[],"ref":"第 264 页","hint":"","score":2},{"i":278,"n":279,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-002","t":"single","mode":"","bloom":"理解","diff":"medium","q":"泡点方程描述的是哪两个量之间的关系？","o":["一定压力下平衡物系的温度与气相组成","总压与液相组成","挥发度与温度","一定压力下平衡物系的温度与液相组成"],"a":["D"],"exp":"泡点方程由拉乌尔定律和道尔顿分压定律联立导出，给出一定总压下液相组成所对应的泡点温度，即加热时出现第一个气泡的温度。描述温度与气相组成关系的是露点方程，故 B 错；C、D 都不是泡点方程所描述的关系。","ev":"式(6-4)称为泡点方程。该方程描述在一定压力下平衡物系的温度与液相组成的关系。","keys":[],"ref":"第 265 页","hint":"","score":2},{"i":279,"n":280,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-012","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"工程上把什么样的物系称为理想物系？","o":["液相为理想溶液、气相为理想气体的物系","液相服从拉乌尔定律、气相为任意实际气体的物系","液相为任意非理想溶液、气相为理想气体的物系","由两种纯组分混合而成、必然完全理想的物系"],"a":["A"],"exp":"理想物系要求液相中各组分都服从拉乌尔定律、气相服从道尔顿分压定律，也就是液相为理想溶液且气相为理想气体。B 把气相条件放宽，C 又把液相条件放宽，都不满足定义；D 错在把双组分混合液一概当成理想物系，实际溶液多数是非理想的。","ev":"液相为理想溶液. 气相为理想气体的物系称为理想物系。","keys":[],"ref":"第 265 页","hint":"","score":2},{"i":280,"n":281,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在总压恒定的温度-组成图上，泡点线与露点线之间的区域表示什么？","o":["尚未沸腾的液相区","温度高于露点的过热蒸气区","气液两相同时存在的气液共存区","两组分完全互溶的恒沸物区"],"a":["C"],"exp":"泡点线以下是尚未沸腾的液相区，露点线以上是过热蒸气区，只有两线之间才是气液两相同时存在的共存区，也只有在这个区域内才能得到互呈平衡的气液两相。恒沸物是平衡曲线与对角线交点对应的特殊组成，并不是相图上的一个区域。","ev":"两曲线之间的区域表示气、液两相同时存在，称为气液共存区。","keys":[],"ref":"第 266 页","hint":"","score":2},{"i":281,"n":282,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-027","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在 x-y 图上，平衡曲线离对角线越远，说明什么？","o":["两组分的相对挥发度越接近 1","该溶液越难用精馏分离","该溶液越容易用精馏分离","气液两相平衡时的温度越接近"],"a":["C"],"exp":"平衡曲线离对角线越远，表示同一液相组成下平衡气相中易挥发组分含量越高，即相对挥发度越大，精馏推动力越大、越易分离。曲线向对角线靠拢说明两组分组成差别变小，相对挥发度趋近 1，分离变难；平衡曲线上各点温度并不相同，不能据此判断温度是否接近。","ev":"平衡线离对角线越远，表示该溶液越易分离。","keys":[],"ref":"第 266 页","hint":"","score":2},{"i":282,"n":283,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"相对挥发度的大小表示什么？","o":["气相中两组分的浓度比是液相中浓度比的倍数","液相中两组分的浓度比是气相中浓度比的倍数","两组分饱和蒸气压之和","两组分摩尔质量之比"],"a":["A"],"exp":"相对挥发度等于两组分挥发度之比，也可写成气相浓度比与液相浓度比之比，因此它表示气相浓度比是液相浓度比的倍数。该值越大，平衡线离对角线越远，越易分离；等于 1 时气液相组成相同，普通精馏无法分离。B 把比值说反，C、D 与定义无关。","ev":"相对挥发度 值的大小表示两组分在气相中的浓度比是液相中浓度比的倍数","keys":[],"ref":"第 268 页","hint":"","score":2},{"i":283,"n":284,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"其他条件不变时，降低精馏塔的总压会使相对挥发度增大，物系变得更容易分离。","o":["正确","错误"],"a":["T"],"exp":"总压升高时泡点线和露点线都向上移动，气液两相区变窄，相对挥发度减小，平衡曲线向对角线靠拢，分离变难；反过来降低总压，两相区变宽、相对挥发度增大，平衡曲线远离对角线，完成同样分离所需理论板数减少。题目说的正是这一相反方向，所以成立。","ev":"当系统的总压由 Pi 增加到 p， 时，tz-y 图中泡点线和露点线向上移动，同时气液两相区变窒,相对挥发度变小，分离变得困难。","keys":[],"ref":"第 269 页","hint":"","score":2},{"i":284,"n":285,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-multiple-004","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于简单蒸馏与平衡蒸馏，下列说法正确的有哪些？","o":["简单蒸馏是非定态过程，馏出液组成随操作进行不断降低","平衡蒸馏是连续定态过程，料液一次部分汽化后气液两相及时分离","两者都能直接得到高纯度的产品","简单蒸馏适合挥发度相差较大、分离要求不高的粗分离"],"a":["A","B","D"],"exp":"简单蒸馏一次加料、釜液轻组分浓度不断下降，馏出液需按组成分罐收集，属非定态过程，只适合挥发度相差大而分离要求不高的粗分离；平衡蒸馏连续操作，料液经节流减压一次部分汽化后气液分离，属连续定态过程。两者都只能做初步分离，得不到高纯度产品，所以 C 错误。","ev":"可见简单蒸馏是一个非定态过程，适合于混合物的粗分离，特别适合于挥发度相差较大而分离要求不高的场合","keys":[],"ref":"第 271 页","hint":"","score":3},{"i":285,"n":286,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-004","t":"single","mode":"","bloom":"理解","diff":"easy","q":"简单蒸馏的操作特点是什么？","o":["只适用于大批量、高纯度分离","必须设置塔顶回流和塔釜再沸器","非定态过程，馏出液组成随操作进行不断降低","连续定态过程，馏出液组成始终不变"],"a":["C"],"exp":"简单蒸馏是一次加料，随着蒸气不断引出，釜液中易挥发组分浓度下降，产生的蒸气组成也随之降低，所以馏出液要按不同组成范围分罐收集。它是非定态过程，只适合挥发度相差较大而分离要求不高的粗分离；连续定态是平衡蒸馏的特点。","ev":"可见简单蒸馏是一个非定态过程，适合于混合物的粗分离，特别适合于挥发度相差较大而分离要求不高的场合，例如原油或煤油的初馏。","keys":[],"ref":"第 271 页","hint":"","score":2},{"i":286,"n":287,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-005","t":"single","mode":"","bloom":"理解","diff":"easy","q":"平衡蒸馏（闪蒸）属于哪种操作？","o":["只能处理少量物料的间歇过程","连续定态过程，料液一次部分汽化后气液分离","间歇非定态过程，馏出液分批收集","只靠回流实现分离的过程"],"a":["B"],"exp":"闪蒸中料液先被加热到高于闪蒸器压力下泡点的温度，再经节流阀骤然减压成为过热液体，一次部分汽化后气液两相及时分离，过程连续定态，适合大批量粗分离。间歇分批收集馏出液是简单蒸馏，靠回流分离则是精馏的特征。","ev":"平衡蒸馏又称闪蒸(flash distillation) ，是一个连续定态过程","keys":[],"ref":"第 271 页","hint":"","score":2},{"i":287,"n":288,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-truefalse-017","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"非理想性只是出现恒沸点的必要条件，非理想溶液并不都形成恒沸物，只有偏离拉乌尔定律足够大时才会出现恒沸点。","o":["正确","错误"],"a":["T"],"exp":"恒沸物的出现要求溶液偏离拉乌尔定律足够大，使平衡曲线与对角线相交；甲醇-水、二硫化碳-四氯化碳等物系虽属非理想溶液，在常压下并不出现恒沸点。原题把非理想性当成形成恒沸物的充分条件，扩大了结论的适用范围。","ev":"非理想溶液并非都具有恒沸点，如甲醇-水，二硫化碳-四氧化碳等系\n统。只有非理想性足够大时才有恒沸点。","keys":[],"ref":"第 271 页","hint":"","score":2},{"i":288,"n":289,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-multiple-007","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"若把多次部分汽化、多次部分冷凝的流程直接用于工业生产，会带来哪些问题？","o":["流程庞大，设备费用很高","部分汽化需要加热剂、部分冷凝需要冷却剂，能量消耗大","生成的中间物流增多，高纯产品的收率反而提高","每经过一级都产生中间物流，高纯产品的收率很低"],"a":["A","B","D"],"exp":"逐级部分汽化和部分冷凝要设置大量分离器、加热器和冷却器，流程庞大、设备费高，而且加热剂和冷却剂用量大。每级都产生中间物流，使高纯产品收率很低，故 C 把收率说成提高是错的。工业上把中间物料引回前一级并设置回流，才形成精馏塔。","ev":"因为流程过于庞大,设备费用\n很高，部分汽化需要加热剂，部分冷凝需要冷却剂，能量消耗大;每经过一次部分汽化和\n部分冷凝，都会生成一部分中间物流，从而使高纯产品的收率很低。","keys":[],"ref":"第 272 页","hint":"","score":3},{"i":289,"n":290,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-006","t":"single","mode":"","bloom":"理解","diff":"medium","q":"经过多次部分汽化和多次部分冷凝，最终能得到什么结果？","o":["产品纯度提高的同时产量也不断增大","只能提高重组分的纯度","过程不需要加热剂和冷却剂","可获得几乎纯态的轻、重组分，但气相量和液相量越来越少"],"a":["D"],"exp":"每进行一次部分汽化或部分冷凝都会产生中间物流，轻组分在气相中逐级增浓、重组分在液相中逐级增浓，故两端可接近纯态；但中间物料增多使高纯产品收率很低、气液相量越来越少。B 与收率低的事实相反，C 只说了一半，D 与需要加热、冷却不符。","ev":"通过多次部分汽化和多次部分冷凝，最终可以获得几乎纯态的易挥发组分和难挥发组分，但得到的气相量和液相量却越来越少。","keys":[],"ref":"第 272 页","hint":"","score":2},{"i":290,"n":291,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-028","t":"single","mode":"","bloom":"理解","diff":"easy","q":"工业上采用精馏操作的主要目的是什么？","o":["把混合液加热一次使其部分汽化","通过多次部分汽化、部分冷凝获得高纯度产品","只回收混合液中的难挥发组分","把混合液全部汽化为气相"],"a":["B"],"exp":"精馏利用各组分挥发度的差异，在塔内反复进行部分汽化和部分冷凝，使轻组分在气相中逐级增浓、重组分在液相中逐级增浓，从而得到高纯度产品。只加热一次部分汽化是平衡蒸馏，全部汽化则得不到分离，只回收重组分也不是精馏的全部目的。","ev":"精馏是利用混合液中各组分间\n挥发度的差异，通过多次部分汽化、部分冷凝实现液体\n混合物分离，获得高纯度产品的一种操作。","keys":[],"ref":"第 272 页","hint":"","score":2},{"i":291,"n":292,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-truefalse-008","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"平衡蒸馏中，料液经节流阀骤然减压后会变成过冷液体。","o":["正确","错误"],"a":["F"],"exp":"料液先在加热器中加热到高于闪蒸器压力下泡点的温度，经节流阀骤然减压后成为过热液体，高出泡点的那部分热量使液体部分汽化，然后气液两相在分离器中分开。变成过冷液体与减压汽化的过程相反，那样就不会有闪蒸发生。","ev":"经节流阀 3 骤然减压至内莱器内的压力，此时液体成为过热液体","keys":[],"ref":"第 272 页","hint":"","score":2},{"i":292,"n":293,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-014","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"连续精馏塔中，加料板以下的塔段（包括加料板）称为什么？","o":["精馏段","提馏段","回收段","预热段"],"a":["B"],"exp":"加料板以上到塔顶的塔段是精馏段，作用是让上升蒸气中的轻组分逐级增浓；加料板以下（含加料板）到塔釜的塔段是提馏段，作用是把下降液体中的轻组分提出来，使釜液中的重组分更纯。回收段是萃取精馏塔中萃取剂入口以上的特殊塔段，预热段则是原料预热器，都不是普通精馏塔的塔段划分。","ev":"加料板以上的塔段称为精馏段(rectifying section); 加料板以下的塔段(包括加料板)称为提馏段Cstripping section) 。","keys":[],"ref":"第 273 页","hint":"","score":2},{"i":293,"n":294,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-016","t":"single","mode":"","bloom":"理解","diff":"easy","q":"连续精馏装置连续加料、塔顶塔底连续出料，属于定态操作，它特别适用于什么场合？","o":["处理量小且产品组成经常变动的场合","只要求粗分离、产品纯度不高的场合","处理量大且对产品质量要求高的场合","只能处理单组分纯物料的场合"],"a":["C"],"exp":"连续精馏在稳定状态下连续进出料，操作稳定、产品组成均匀，适合大批量生产和高纯度要求。处理量小或物料种类、组成经常变动时应采用间歇精馏；只要求粗分离时用简单蒸馏或平衡蒸馏即可，不必上精馏装置；精馏处理的本来就是混合液，D 的说法不成立。","ev":"连续精馏装置在操作过程中连续加料，塔项、塔底连续出料，是一定态操作过程。因此该装置适用于处理产量大和对产品质量要求高的场合。","keys":[],"ref":"第 274 页","hint":"","score":2},{"i":294,"n":295,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-029","t":"single","mode":"","bloom":"理解","diff":"easy","q":"连续精馏装置中再沸器的作用是什么？","o":["把塔顶蒸气全部冷凝为液体","使釜液部分汽化，提供自塔底上升的蒸气","把原料液预热到规定温度","冷却塔顶产品并计量采出量"],"a":["B"],"exp":"再沸器是装在塔底的间壁式换热器，通常以饱和水蒸气为热源，使釜液部分汽化，产生的蒸气逐板上升与回流液接触传质；未汽化的液体作为塔底产品排出。塔顶蒸气的冷凝由冷凝器完成，原料预热由原料预热器完成，冷却塔顶产品由冷却器完成。","ev":"溶液被加热后部分汽化，产生的\n蒸气自塔底逐一经过各层塔板上升，与板上回流液体接触进行传质","keys":[],"ref":"第 274 页","hint":"","score":2},{"i":295,"n":296,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"精馏塔回流的主要作用是什么？","o":["提供不平衡的气液两相，构成气液接触传质的必要条件","提高塔釜温度","使所需理论板数降为零","代替再沸器提供上升蒸气"],"a":["A"],"exp":"塔顶回流液轻组分含量高、温度低，与自下而上的蒸气在塔板上接触，形成不平衡的气液两相，传热与传质才能持续进行；没有回流，板上液体无法维持，精馏分离就无从实现。回流不承担加热塔釜或产生上升蒸气的作用，更不能把理论板数降为零。","ev":"因此回流的主要作用就是提供不平衡的气液两相，从而构成气液两相接触传质的必要条件。","keys":[],"ref":"第 275 页","hint":"","score":2},{"i":296,"n":297,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-015","t":"single","mode":"","bloom":"理解","diff":"medium","q":"精馏塔板上液相中易挥发组分汽化进入气相所需的热量主要来自哪里？","o":["塔釜再沸器直接向该板供热","回流液带入的显热","塔板金属壁的导热","上升蒸气在板上部分冷凝放出的潜热"],"a":["D"],"exp":"自下层上升的蒸气温度较高、重组分较多，与板上温度较低、轻组分较多的液体接触时，蒸气部分冷凝放出潜热，正好供给液体部分汽化，于是轻组分由液相转入气相、重组分由气相转入液相。再沸器只在塔底提供上升蒸气，并不逐板供热；显热与板壁导热都不是板上汽化的主要热源。","ev":"其易挥发组分由液相转移至气相，所需能量由上升蒸气部分冷凝提供","keys":[],"ref":"第 275 页","hint":"","score":2},{"i":297,"n":298,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-truefalse-009","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"精馏塔内自下而上，上升蒸气中易挥发组分的含量逐级减少。","o":["正确","错误"],"a":["F"],"exp":"塔内越往上温度越低、轻组分越多，上升蒸气在每块塔板上与回流液体接触后，轻组分由液相转入气相，因此自下而上易挥发组分含量是逐级增多的，塔顶才能得到较纯的轻组分。题目把增浓方向说成了减少，正好颠倒。","ev":"每一块塔板上均有自下一层塔板上升的蒸气，且自下而上上升的蒸气中易挥发组分含量逐级增多 。","keys":[],"ref":"第 275 页","hint":"","score":2},{"i":298,"n":299,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-multiple-001","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"恒摩尔流假设的成立需要满足哪些条件？","o":["两组分的摩尔汽化相变焓相等","气液两相接触时因温度不同交换的热量可忽略不计","设备热损失可忽略不计","各层塔板的操作压力必须相等"],"a":["A","B","C"],"exp":"恒摩尔流假设是为了让同一塔段内上升蒸气与下降液体的摩尔流量保持恒定，因此要求两组分摩尔汽化焓相近、两相因温差交换的热量可忽略、设备散热可忽略。操作压力相等并不是该假设的条件，塔内各板压力本来就有差异。","ev":"为了简化精馏计算，引入恒摩尔流假设。该假设应满足以下条件。","keys":[],"ref":"第 276 页","hint":"","score":3},{"i":299,"n":300,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-010","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"理论板的含义是什么？","o":["塔内实际安装的塔板","只在提馏段设置的塔板","板效率为百分之百的实际塔板","离开塔板的气液两相达到平衡的塔板"],"a":["D"],"exp":"理论板是便于研究塔板传质而人为假定的理想化塔板，不论进入该板的两相组成如何，离开时气液两相在传热、传质两方面都达到平衡、温度相等。实际板受接触时间和非理想流动影响达不到平衡，所以实际板数总多于理论板数，B、D 把两者混为一谈。","ev":"理论板(theoretical plate)是指离开塔板的蒸气和液体呈平衡的塔板。","keys":[],"ref":"第 276 页","hint":"","score":2},{"i":300,"n":301,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-008","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"全塔物料衡算中，回收率的含义是什么？","o":["回流液流量与塔顶产品流量之比","塔釜产品中重组分的摩尔分数","回收的某组分数量占原料中该组分数量的百分数","塔顶产品流量与进料流量之比"],"a":["C"],"exp":"回收率针对某一组分而言，用产品中该组分的量除以原料中该组分的量再乘百分之百，用来衡量该组分被回收的程度。塔顶产品流量与进料流量之比是采出率，回流液流量与塔顶产品流量之比是回流比，塔釜组成只是浓度而不是回收率。","ev":"回收率是指回收原料中易挥发或难挥发组分的百分数。","keys":[],"ref":"第 277 页","hint":"","score":2},{"i":301,"n":302,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"按恒摩尔流假设，同一塔段内各板上升蒸气的摩尔流量恒定，但精馏段与提馏段之间因进料状态影响可以互不相等。","o":["正确","错误"],"a":["T"],"exp":"恒摩尔流假设只保证同一塔段内在无进料和出料时各板上升蒸气与下降液体的摩尔流量恒定；两段之间有进料，进料热状况会改变蒸气量，所以两段的上升蒸气流量不一定相同。原题把段内的恒定误当成全塔两段相等。","ev":"由于进料状态的影响，两段上升的蒸气摩尔流量不一定相同，下降的液体摩尔流量也不一定相同。","keys":[],"ref":"第 277 页","hint":"","score":2},{"i":302,"n":303,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-017","t":"single","mode":"","bloom":"应用","diff":"medium","q":"精馏段操作线在 x-y 图上的斜率等于什么（R 为回流比）？","o":["R/(R+1)","(R+1)/R","1/(R+1)","R"],"a":["A"],"exp":"由精馏段物料衡算可得 y 等于 R/(R+1) 乘 x 再加 xD/(R+1)，因此斜率是 R/(R+1)，截距是 xD/(R+1)，直线还经过对角线上的 (xD，xD) 点。回流比增大时该斜率随之增大并趋近于 1；1/(R+1) 只是截距中的系数，(R+1)/R 则是它的倒数，都不是斜率。","ev":"可见该直线过对角线上atzpszp)点，并以R/(R十1)为斜率,或在 y 轴上的截距为二2。","keys":[],"ref":"第 279 页","hint":"","score":2},{"i":303,"n":304,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-single-009","t":"single","mode":"","bloom":"理解","diff":"medium","q":"进料热状况参数 q 等于 0 时，对应的进料状态是哪一种？","o":["气液混合进料","饱和蒸气进料","饱和液体进料","冷液进料"],"a":["B"],"exp":"q 表示每摩尔原料汽化为饱和蒸气所需热量与摩尔相变焓之比。饱和蒸气进料的温度等于露点，q 等于 0，此时提馏段下降液量不变而上升蒸气量增加 F。饱和液体进料 q 等于 1，冷液进料 q 大于 1，气液混合进料 q 介于 0 与 1 之间。","ev":"饱和蒸气进料，即进料温度为露点的饱和蒸气","keys":[],"ref":"第 280 页","hint":"","score":2},{"i":304,"n":305,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-018","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"在回流比相同的条件下，q 值越大，提馏段操作线越远离平衡线。","o":["正确","错误"],"a":["T"],"exp":"q 值增大使提馏段下降液量 L′增大、上升蒸气量 V′减小，提馏段操作线斜率 L′除以 V′增大，操作线向左上方移动而远离平衡线，传质推动力增大，完成同样分离所需理论板数减少。这里比较的前提是回流比和分离要求相同，否则结论不成立。","ev":"v值越大精馏段操作线越短提人馏段操作线越远离平衡线","keys":[],"ref":"第 283 页","hint":"","score":2},{"i":305,"n":306,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-022","t":"single","mode":"","bloom":"应用","diff":"hard","q":"用逐板计算法求理论板数时，间接蒸汽加热的再沸器应如何处理？","o":["不计入理论板，也无需在板数中扣除","视为一块理论板，提馏段板数要把它的贡献扣除","视为两块理论板，因为气液两相都达到平衡","只有全回流操作时才把它算作理论板"],"a":["B"],"exp":"再沸器中液体被加热部分汽化，离开它的气液两相达到平衡，因此它相当于一块理论板。逐板计算时每使用一次相平衡关系就对应一块板，最后一块落在再沸器上，所以提馏段理论板数应等于使用相平衡关系的次数减一；塔顶全凝器只起冷凝作用，不计入理论板。","ev":"对于间接蒸汽加热的再沸器，认为离开它的气液两相达到平衡，故再沸器相当于一块理论板。","keys":[],"ref":"第 284 页","hint":"","score":2},{"i":306,"n":307,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-002","t":"truefalse","mode":"","bloom":"应用","diff":"medium","q":"图解法求理论板数时，梯级跨过两操作线交点后仍应继续沿精馏段操作线画下去。","o":["正确","错误"],"a":["F"],"exp":"梯级跨过两操作线交点的那块板就是进料板，从这块板起应改在提馏段操作线与平衡线之间作梯级，直到梯级达到或跨过塔釜组成点。若过了交点仍沿用精馏段操作线，各梯级的增浓、减浓程度都会变小，算出的理论板数偏多。","ev":"当某梯级跨越两操作线交点 g 时(此梯级为进料板) ，应及时更换操作线","keys":[],"ref":"第 285 页","hint":"","score":2},{"i":307,"n":308,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-multiple-003","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"在分离任务和进料条件一定时，增大回流比会带来哪些影响？","o":["两操作线远离平衡线，每块理论板的分离程度加大","塔顶产品组成必然达到百分之百","理论板数减少，设备费用降低","冷凝器与再沸器负荷增大，操作费用增加"],"a":["A","C","D"],"exp":"回流比增大使精馏段与提馏段操作线都远离平衡线，梯级变大，完成同样分离所需理论板数减少，设备费用下降；但上升蒸气量随回流比增大而增加，冷凝器和再沸器负荷上升，操作费用增加。产品组成还受理论板数和全塔物料衡算限制，不可能任意达到百分之百。","ev":"回流比增大，精馅段操作线与提馅段操作线均远离平衡线，每一梯级的水平线段与垂直线段都增长，说明每层理论板的分离程度加大，为完成一定的分离任务所需的理论板数减少","keys":[],"ref":"第 290 页","hint":"","score":3},{"i":308,"n":309,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-021","t":"single","mode":"","bloom":"理解","diff":"medium","q":"什么情况下可用水蒸气直接通入塔釜加热，从而省去再沸器？","o":["任何双组分物系都可以采用","易挥发组分是水、塔顶产品接近纯水的物系","操作压力必须低于常压的物系","难挥发组分是水、釜液接近纯水的物系"],"a":["D"],"exp":"直接蒸汽加热会把水蒸气的冷凝液混入釜液，只有当难挥发组分就是水、釜液接近纯水时，才不会污染塔底产品，这时可以直接把水蒸气通入塔釜，省掉再沸器。若难挥发组分不是水，冷凝水会稀释釜液、改变产品组成；该操作与是否减压没有必然关系。","ev":"当待分离的物系是由某种易挥发组分与水组成的混合物，且难挥发组分是水时，此时人允液近于纯水，故可将加热蒸汽直接通人蒸馏钨内加热釜液，从而省去再沸器。","keys":[],"ref":"第 290 页","hint":"","score":2},{"i":309,"n":310,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-010","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"直接蒸汽加热可以省去再沸器，但在进料和回流比相同的条件下，它所需的理论板数比间接蒸汽加热多。","o":["正确","错误"],"a":["T"],"exp":"直接蒸汽加热省去了再沸器，但水蒸气冷凝液混入釜液，使釜液组成比间接加热时更低，分离难度加大，因此达到同样回收率和塔顶组成需要更多理论板。省设备与省板数是两回事，把「少一个再沸器」当成「板数更少」是常见误解。","ev":"采用直接蒸汽加热时所需的理论板数比采用间接蒸汽加热时所需的理论塔板数多些","keys":[],"ref":"第 290 页","hint":"","score":2},{"i":310,"n":311,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-018","t":"single","mode":"","bloom":"理解","diff":"medium","q":"全回流操作时，精馏塔的精馏段操作线与提馏段操作线处于什么状态？","o":["保持平行，互不相交","交于进料板上的 q 点","一条为水平线，一条为垂直线","合二为一"],"a":["D"],"exp":"全回流时塔顶、塔底都不采出产品，也不进料，全塔没有精馏段与提馏段之分，两条操作线合并成一条。此时回流比趋于无穷大，操作线方程化为 y 等于 x，与对角线重合，距平衡线最远，每块理论板的分离程度最大，所需理论板数最少。","ev":"全塔无精馏段与提馏段之分，故两条操作线应合二为一。","keys":[],"ref":"第 291 页","hint":"","score":2},{"i":311,"n":312,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-004","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"全回流是回流比的下限，此时所需的理论板数最多。","o":["正确","错误"],"a":["F"],"exp":"全回流时操作线与对角线重合，距平衡曲线最远，每块理论板的分离程度最大，所需理论板数最少，因此它是回流比的上限而不是下限。最小回流比才是下限，此时两操作线交点落在平衡线上，所需理论板数为无穷多。题目把上下限说反了。","ev":"全回流时操作线距平衡曲线最远，说明每块理论板的分离程度最大，为完成同样的分离任务，所需理论板数可以最少，故是回流比的上限。","keys":[],"ref":"第 291 页","hint":"","score":2},{"i":312,"n":313,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-020","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"芬斯克（Fenske）公式用于计算什么？","o":["全回流条件下所需的最少理论板数","指定分离要求下的最小回流比","实际塔板数与塔径","冷凝器和再沸器的热负荷"],"a":["A"],"exp":"芬斯克公式由全回流时操作线与对角线重合的条件导出，用塔顶、塔底组成和平均相对挥发度直接算出全回流所需的最少理论板数，且不包括再沸器。把式中塔底组成换成进料组成，还能估算精馏段的最少板数与加料板位置；最小回流比要由 q 线与平衡线的交点求取，热负荷则靠热量衡算。","ev":"式(6-45a)及式(6-45b)称为芬斯克公式，用于理想物系计算全回流条件下采用全凝器时所需的最少理论板数。","keys":[],"ref":"第 293 页","hint":"","score":2},{"i":313,"n":314,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-012","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"全回流时塔顶冷凝液全部回流入塔，所以精馏塔的生产能力最大。","o":["正确","错误"],"a":["F"],"exp":"全回流时塔顶、塔底都不采出产品，没有产品也就没有生产能力，其生产能力为零。它的价值在于操作线与对角线重合、所需理论板数最少，常用于开工、调试和实验研究；正常生产必须采出产品，回流比要低于全回流。","ev":"因为全回流时无产品，其生产能力为零","keys":[],"ref":"第 293 页","hint":"","score":2},{"i":314,"n":315,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-031","t":"single","mode":"","bloom":"分析","diff":"medium","q":"下列哪一项不影响最小回流比？","o":["物系的相平衡关系","进料组成与进料热状态","分离要求，即塔顶和塔底产品组成","塔板的实际板效率"],"a":["D"],"exp":"最小回流比出现在两操作线交点落到平衡线上的时候，其大小由平衡线位置、进料组成、进料热状态 q 以及规定的塔顶、塔底组成共同决定。塔板效率只影响由理论板数折算实际板数，不改变理论上的最小回流比；提高板效率也不能使最小回流比降低。","ev":"由上可知，物系的相平衡关系、进料组成、进料热状态及分离要求均影响最小回流比\nRon的值。","keys":[],"ref":"第 294 页","hint":"","score":2},{"i":315,"n":316,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-011","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"操作回流比小于最小回流比时，精馏塔仍能维持气液接触，但达不到规定的分离要求。","o":["正确","错误"],"a":["T"],"exp":"回流比小于最小回流比时，塔内仍有气液两相流动，操作可以维持，只是操作线离平衡线太近甚至相交，无论增加多少块理论板都达不到规定的产品组成，产品不合格。最小回流比是完成规定分离任务的下限，不是塔能否开车的界限，这一点容易误解。","ev":"若操作中采用的回流比小于最小回流比，则此时操作仍然能够进行，但不可能达到规定的分离要求。","keys":[],"ref":"第 294 页","hint":"","score":2},{"i":316,"n":317,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-019","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"讨论最小回流比不能脱离规定的分离要求，要求的塔顶、塔底组成一变，最小回流比也随之变化。","o":["正确","错误"],"a":["T"],"exp":"最小回流比由操作线与平衡线的交点决定，而交点位置受规定的塔顶、塔底组成以及进料组成和进料热状况共同影响，分离要求提高时操作线更靠近平衡线，最小回流比随之增大。原题说它与分离要求和进料热状况无关，只保留了相平衡关系这一个因素。","ev":"精馅操作中的最小回流比是对一定的分离要求而言的，分离要求改变，\n最小回流比也会改变，脱离一定的分离要求而只谈最小回流比是毫无意义的。","keys":[],"ref":"第 294 页","hint":"","score":2},{"i":317,"n":318,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-019","t":"single","mode":"","bloom":"应用","diff":"medium","q":"精馏塔设计时，操作回流比通常取最小回流比的多少倍？","o":["0.5 至 0.8 倍","1.1 至 2.0 倍","3 至 5 倍","10 倍以上"],"a":["B"],"exp":"回流比接近最小回流比时理论板数趋于无穷多，设备费过高；回流比过大又使上升蒸气量、塔径以及冷凝器和再沸器负荷增加，操作费与设备费都上升。经验上取操作回流比为最小回流比的 1.1 至 2.0 倍，使总费用接近最低，难分离物系可取得更大一些。","ev":"在精馏设备的设计计算中，回流比可取经验值，通常操作回流比为最小回流比的 1.1一 2. 0 人入， 即 及一(1.1一2.0) Rn。","keys":[],"ref":"第 295 页","hint":"","score":2},{"i":318,"n":319,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-032","t":"single","mode":"","bloom":"理解","diff":"medium","q":"精馏塔的适宜回流比是指什么情况下的回流比？","o":["理论板数最少时的回流比","设备费用与操作费用之和最小时的回流比","冷凝器热负荷最小时的回流比","塔顶产品纯度最高时的回流比"],"a":["B"],"exp":"回流比增大使理论板数减少、设备费用下降，但上升蒸气量按 R 加 1 乘 D 增大，冷凝器和再沸器负荷及操作费用上升，两者之和存在最低点，对应适宜回流比。全回流时理论板数最少但没有产品，最小回流比时理论板数无穷多，都不能作为正常操作点。","ev":"由上述分析可知，精馅操作存在一适宜回流比(Coptimum reflux ratio) ，在该条件下操\n作，设备费用及操作费用之和为最小。","keys":[],"ref":"第 295 页","hint":"","score":2},{"i":319,"n":320,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-020","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"回流比越大，精馏装置的设备费用和操作费用都越低。","o":["正确","错误"],"a":["F"],"exp":"回流比增大使理论板数减少，设备费用在开始阶段下降；但上升蒸气量随回流比增大而增加，塔径、再沸器和冷凝器面积都要增大，当回流比超过某一值后设备费用反而上升，操作费用则始终随回流比增大而增加。因此总费用存在最低点，不能认为越大越省。","ev":"当尺增至某一值后，不仅操作费用增加，设备费用也随之增加","keys":[],"ref":"第 295 页","hint":"","score":2},{"i":320,"n":321,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-multiple-005","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于理论板数的简捷计算法，下列说法正确的有哪些？","o":["以吉利兰关联图为基础，误差较大，适合初步估算和方案比较","计算精度高于逐板计算法和图解法","关联图纵坐标中的理论板数不包括再沸器","只能在全回流条件下使用"],"a":["A","C"],"exp":"简捷法利用吉利兰关联图，把回流比、最小回流比与理论板数联系起来，计算快捷但误差较大，适合初步设计估算和方案比较，不能代替逐板法或图解法。关联图中的理论板数都不包括再沸器；它适用于一定回流比范围，并非只能在全回流下使用，所以 B、D 错误。","ev":"简捷算法虽然误差较大,但因简便，可快速地算出理论塔板数或粗略地寻求塔板数与回流比之间的关系，所以特别适用于初步设计计算 ，供方案比较用。","keys":[],"ref":"第 298 页","hint":"","score":3},{"i":321,"n":322,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-multiple-008","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"精馏装置可以采取哪些节能措施？","o":["设置中间再沸器或中间冷凝器","尽可能提高操作回流比","采用多效精馏","利用塔顶蒸气、塔底产品等的余热"],"a":["A","C","D"],"exp":"设置中间再沸器或中间冷凝器、采用多效精馏都能降低有效能耗，利用塔顶蒸气和塔底产品的余热预热进料或其他物料也属于余热回收。提高回流比会使上升蒸气量增大，再沸器和冷凝器负荷随之增加，是增加能耗而不是节能，故 B 错误。","ev":"除上述几种节能措施外，还可在精馏装置上设置中间再沸器或中间冷凝器，或采用多效精偏等方法来达到降低能耗\n的目的。","keys":[],"ref":"第 301 页","hint":"","score":3},{"i":322,"n":323,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-013","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"在采出率一定的条件下，只要不断加大回流比，就能把塔顶产品组成提高到任意纯度。","o":["正确","错误"],"a":["F"],"exp":"回流比增大能提高塔顶组成，但提高幅度受精馏段理论板数和分离能力的限制：即使达到全回流，塔顶组成也有确定的最高极限值。同时它还受全塔物料衡算的限制，极限为进料组成与进料量之积除以塔顶产品量，并且加大回流比会增加再沸器与冷凝器负荷，受换热面积制约。","ev":"对一定塔板数，即使回流比增至无穷大时(全回流)，znp 也有确定的最高极限值，在实际回流比下不可能超过此极限值。","keys":[],"ref":"第 302 页","hint":"","score":2},{"i":323,"n":324,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-023","t":"single","mode":"","bloom":"应用","diff":"medium","q":"间歇精馏在塔板数一定的条件下，如何维持馏出液组成恒定？","o":["保持回流比不变，任釜液组成下降","逐渐减小回流比，使馏出液组成回升","随釜液中轻组分浓度下降逐渐加大回流比","不断向釜内补充原料液"],"a":["C"],"exp":"间歇精馏原料一次加入，随蒸气引出釜液轻组分浓度不断下降；理论板数一定时，只有逐渐加大回流比才能把馏出液组成维持在规定的恒定值。回流比不变的操作方式只能让馏出液组成逐时降低；向釜内补料则违背间歇操作的前提，塔内并无提馏段可利用。","ev":"由于塔内理论板数为定值，只有采用逐渐加大回流比的办法，才能维持馅出液浓度不变","keys":[],"ref":"第 303 页","hint":"","score":2},{"i":324,"n":325,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-single-030","t":"single","mode":"","bloom":"理解","diff":"medium","q":"间歇精馏塔通常只设置哪一段？","o":["精馏段","提馏段","精馏段和提馏段都设","回收段"],"a":["A"],"exp":"间歇精馏的原料在操作前一次加入釜中，釜液组成随操作不断降低，塔内只需把上升蒸气逐级增浓，故只设精馏段。连续精馏在进料板以下设提馏段以回收难挥发组分，而间歇精馏的釜液最后一次性排出，不需要提馏段；回收段是萃取精馏中萃取剂入口至塔顶的塔段，与间歇精馏无关。","ev":"间鞭精馅只有精馏段没有提馏段。","keys":[],"ref":"第 303 页","hint":"","score":2},{"i":325,"n":326,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-truefalse-014","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"间歇精馏操作中，釜液中易挥发组分的浓度始终不变，直到操作结束。","o":["正确","错误"],"a":["F"],"exp":"间歇精馏原料一次加入釜中，随着蒸气不断引出，釜液中易挥发组分浓度不断降低，各层塔板上的气液组成也随时间改变，因此属于非定态操作。若要保持馏出液组成恒定，必须逐渐加大回流比；釜液浓度不变的说法与间歇精馏的基本特点相反。","ev":"原料在操作前一次加入釜中，参液中易挥发组分的浓度 随着操作的进行而不断降低，直到规定值后一次排出。","keys":[],"ref":"第 303 页","hint":"","score":2},{"i":326,"n":327,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-single-024","t":"single","mode":"","bloom":"分析","diff":"medium","q":"萃取精馏与恒沸精馏在第三组分作用上的主要区别是什么？","o":["萃取剂不与原料组分形成新恒沸物，且沸点比原料组分高得多","萃取剂要与原料组分形成沸点更低的新恒沸物","恒沸精馏的挟带剂沸点比原料组分高得多但不形成恒沸物","两者都依靠第三组分与原料发生化学反应"],"a":["A"],"exp":"两种特殊精馏都通过加入第三组分来提高相对挥发度，但恒沸精馏的挟带剂必须与一个或几个组分形成沸点更低的新恒沸物，借新恒沸物把组分带出；萃取精馏的萃取剂不形成恒沸物，而是靠对某组分较强的吸引作用降低其蒸气压，且沸点比原料组分高得多，从塔底排出后循环使用。B、C 把两者说反，D 与物理分离的本质不符。","ev":"同的是蔗取剂不与原料液中任何组分形成新的恒沸物。萃取剂与原溶液中任何一组分相比，其沸点要高得多。","keys":[],"ref":"第 306 页","hint":"","score":2},{"i":327,"n":328,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-single-033","t":"single","mode":"","bloom":"理解","diff":"medium","q":"萃取精馏塔中，回收段的板数主要取决于什么？","o":["原料液中轻组分的沸点","操作回流比的大小","塔径的大小","萃取剂的沸点"],"a":["D"],"exp":"回收段位于萃取剂入口至塔顶之间，作用是减少被塔顶蒸气带出的萃取剂。萃取剂沸点越高、越不易挥发，随蒸气带出的量越少，所需回收段板数也越少；原料组分沸点、回流比和塔径都不是决定回收段板数的主要因素。","ev":"板数的多少主要取决于菜取\n剂的沸点。沸点越高， 回收段的板数愈少。","keys":[],"ref":"第 306 页","hint":"","score":2},{"i":328,"n":329,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-single-034","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"各种形式塔板的主要区别在于什么？","o":["塔板的厚度","降液管的数目","气相通道的形式","溢流堰的高度"],"a":["C"],"exp":"塔板上供气体自下而上通过的通道称为气相通道，筛孔、泡罩、浮阀、舌形孔等就是不同的气相通道形式，它们对塔板压降、操作弹性和传质效率影响极大，是区分板型的主要标志。降液管、溢流堰和塔板厚度虽然也影响操作，但不是各种板型命名的依据。","ev":"气相通道的形式很多，对塔板性\n能的影响极大，各种形式塔板的主要区别就在于气相通道的形式不同。","keys":[],"ref":"第 307 页","hint":"","score":2},{"i":329,"n":330,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-truefalse-021","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"板式塔中气液两相在总体上应呈逆流流动，而在每一块塔板上应呈理想的错流流动。","o":["正确","错误"],"a":["T"],"exp":"总体逆流使塔内自上而下温度升高、轻组分减少，保证全塔有足够传质推动力；板上错流则让液体横穿塔板、气体穿过液层，延长接触路径并减少返混。常见误解是把两者都说成逆流，或认为板上也应逆流，实际上板上是错流接触、总体才是逆流。","ev":"板式塔中气液\n两相在总体上应呈逆流流动，而在每一块塔板上，气液两相呈理想的错流流动。","keys":[],"ref":"第 307 页","hint":"","score":2},{"i":330,"n":331,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-truefalse-016","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"液体在降液管内停留时间不足时，气泡来不及脱出就会被带入下一层塔板，这种现象称为气泡夹带。","o":["正确","错误"],"a":["T"],"exp":"气泡夹带属于与气相主体流动方向相反的返混，成因是液体在降液管内停留时间不足，气泡随液体进入下一层塔板，使传质推动力和塔板效率下降。原题描述的是上升气体把液体带到上层塔板，那是液沫夹带的特征，两者方向相反。","ev":"与气相主体流动方向相反的返混称为气泡夹带，这是由于液体在降液管中停留时间过短，气泡来不及解脱而被液体卷人下一层塔板所致 。","keys":[],"ref":"第 309 页","hint":"","score":2},{"i":331,"n":332,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-multiple-002","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"关于液泛的成因和后果，下列说法正确的有哪些？","o":["液体流量过大使降液管阻力增大，可能引起降液管液泛","液沫夹带把大量液体带到上层塔板，会加重降液管负荷并可能导致液泛","液泛发生时塔板效率会显著提高","气体流量过大使塔板压降增大，可能抬高降液管液位而引发液泛"],"a":["A","B","D"],"exp":"降液管液泛主要有两条途径：液量过大使降液管阻力增大、液位上升，或气速过大使板压降增大、液沫夹带增多，同样抬高降液管液位。液泛是气液两相流动的极限，发生时塔内压降急剧增大、塔效率急剧减小，所以 D 把结果说反了。","ev":"液体流量或气体流量过大均会引起降液管液泛。","keys":[],"ref":"第 310 页","hint":"","score":3},{"i":332,"n":333,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-multiple-006","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"关于板式塔的不正常操作，下列说法正确的有哪些？","o":["液泛发生时塔板效率会显著提高","气速过小可能造成严重漏液，使板上无法维持液层","液沫夹带和气泡夹带都会使塔板效率降低","液泛时塔内压降急剧增大，全塔无法正常操作"],"a":["B","C","D"],"exp":"液泛是气液两相流动的极限，发生时塔内压降急剧增大、塔效率急剧减小，最终全塔无法操作，因此 A 把结果说反了。气速过小时液体从筛孔直落，严重时板上不能积累液层，即严重漏液；液沫夹带和气泡夹带都属于返混，使传质推动力下降、板效率降低。","ev":"液泛是气液两相着向流动时的极限。液泛发生时，塔内压力降急剧增大，塔效率急剧减小","keys":[],"ref":"第 310 页","hint":"","score":3},{"i":333,"n":334,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"液泛只能由液体流量过大引起，与气速大小无关。","o":["正确","错误"],"a":["F"],"exp":"液泛有两条成因：液量过大使降液管阻力增大、液位上升，或气速过大使塔板压降增大、液沫夹带增多，把液体带到上层塔板并抬高降液管液位。因此气速过大同样能引发液泛，题目把成因说成只与液量有关是错误的。","ev":"当塔内气速过大时，气体将大量的液体带到上一层塔板，从而增加降液管的负荷，使降液管中的液位升高，最后导致液泛。","keys":[],"ref":"第 310 页","hint":"","score":2},{"i":334,"n":335,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-truefalse-015","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"筛板塔的气速低于漏液点时，部分液体会从筛孔直落，严重时板上无法维持液层。","o":["正确","错误"],"a":["T"],"exp":"气速过小时气体的动压不足以托住板上液体，部分液体便从筛孔直线落下，这就是漏液；严重时板上不能积累液层，塔无法正常操作，板效率明显下降。漏液与液泛的成因相反，前者是气速过小，后者是气速或液量过大。","ev":"当塔内气速过小时，部分液体从筛孔直线落下，称为漏液。严重时塔板上不能积累液层，从而使塔不能正常操作。","keys":[],"ref":"第 310 页","hint":"","score":2},{"i":335,"n":336,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-truefalse-005","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"同一块塔板上，气相默弗里效率与液相默弗里效率的数值必然相等。","o":["正确","错误"],"a":["F"],"exp":"默弗里效率分气相与液相两种，气相效率用气相组成的变化与理论板上的变化相比，液相效率用液相组成的变化相比，两者的基准不同，同一块板上数值一般不相等。全塔效率才是反映全塔平均传质效果的指标。","ev":"由计算可知，同一塔板，其气相单板效率与液相单板效率不同。","keys":[],"ref":"第 312 页","hint":"","score":2},{"i":336,"n":337,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-multiple-009","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"关于塔板负荷性能图，下列说法正确的有哪些？","o":["漏液线又称气相负荷下限线，气量低于此值会产生严重漏液","过量液沫夹带线以液沫夹带量 0.1 kg(液)/kg(干气) 为限定值","液泛线表示降液管中泡沫层高度达到最大许用值时的气液负荷关系","液体流量下限线对应液体在降液管内停留时间过短、气泡夹带严重"],"a":["A","B","C"],"exp":"负荷性能图由五条线围成正常操作范围：漏液线是气相负荷下限，低于它严重漏液；过量液沫夹带线以 0.1 kg 液每 kg 干气为限；液泛线由降液管泡沫层高度达到最大许用值的条件确定。液体流量下限线对应液量过小、板上流动严重不均匀，停留时间过短和气泡夹带是液体流量上限线，故 D 把上下限说反了。","ev":"表示降液管中泡沫层高度达到最大多\n许值时的气液负荷关系，由液泛条件确定。","keys":[],"ref":"第 315 页","hint":"","score":3},{"i":337,"n":338,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-single-011","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"工业上应用最早的板式塔塔板是哪一种？","o":["泡罩塔板","筛孔塔板","浮阀塔板","舌形塔板"],"a":["A"],"exp":"泡罩塔板以泡罩和升气管作为气体通道，是气液传质设备中应用最早的板型之一。筛板虽出现较早，但长期因担心漏液而未推广；浮阀塔板到二十世纪五十年代才出现，舌形塔板属于后起的喷射型塔板。","ev":"泡罩塔板(bubble-cap tray)是气液传质设备中应用最早的板型之一","keys":[],"ref":"第 316 页","hint":"","score":2},{"i":338,"n":339,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-truefalse-006","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"泡罩塔板结构简单、造价低廉，因此在大规模工业装置中广泛应用。","o":["正确","错误"],"a":["F"],"exp":"泡罩塔板虽然不易漏液、操作弹性较大，但结构复杂、制造成本高、安装检修不便，且气相通道曲折、塔板压降大、液泛气速低、生产能力小，目前已很少采用。结构简单、造价低廉的是筛孔塔板，题目把两者的特点弄反了。","ev":"但泡罩塔板结构复杂，制造成本高，安装检修不便。","keys":[],"ref":"第 316 页","hint":"","score":2},{"i":339,"n":340,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-single-025","t":"single","mode":"","bloom":"理解","diff":"medium","q":"浮阀塔板相对于泡罩塔板的主要改进是什么？","o":["取消了降液管，液体直接从筛孔流下","把升气管加高，使气体通道更加曲折","取消升气管，在塔板开孔上方安装可浮动的阀片","用固定舌片代替所有阀片，使气体定向喷射"],"a":["C"],"exp":"浮阀塔板保留了泡罩塔板操作弹性大的优点，但取消了升气管，在塔板开孔上方安装可上下浮动的阀片：气量小时开度小，仍能保持足够气速而少漏液；气量大时阀片浮起，压降不致过高，液泛气速提高。取消降液管、加高升气管和改用固定舌片分别属于穿流板、泡罩板和舌形塔板的特点，都不是浮阀塔板的改进。","ev":"浮阀塔板与泡置塔板相比其主要改进是取消了升气管，在塔板开和孔 (标准孔径 %39mmy) 的上方安装可浮动的阀片。","keys":[],"ref":"第 317 页","hint":"","score":2},{"i":340,"n":341,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-multiple-003","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"按对物料的加热方式划分，干燥过程包括哪些类型？","o":["传导干燥","对流干燥","冷冻干燥","辐射干燥"],"a":["A","B","D"],"exp":"按加热方式，干燥分为传导干燥、对流干燥、辐射干燥和介电加热干燥四类：传导靠传热壁面供热，对流靠干燥介质直接接触供热并带走蒸汽，辐射靠电磁波被物料吸收转化为热能。冷冻干燥属于先冻结再使水分升华的脱水方法，不在这四种加热方式之列。","ev":"根据对物料的加热方式不同，干燥过程又分为以下4种。","keys":[],"ref":"第 328 页","hint":"","score":3},{"i":341,"n":342,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-single-001","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"采用过滤、离心分离等机械方法去湿，其特点是什么？","o":["去湿彻底，但能量消耗很大","只能除去少量水分","依靠干燥剂吸附水分","可除去大量湿分、能量消耗较少，但去湿程度不高"],"a":["D"],"exp":"机械去湿靠过滤、离心分离等把大量游离湿分脱除，能耗较低，但达不到产品要求的最终含水量，所以工业上常先用机械去湿再用干燥。去湿彻底而能耗大是热能去湿，只能除去少量水分是吸附去湿，依靠干燥剂吸附也属于吸附法。","ev":"即采用过滤、离心分离等机械方法去湿。此法一般可除去大量的湿分，能量消耗较少，但去湿程度不高。","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":342,"n":343,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-single-010","t":"single","mode":"","bloom":"理解","diff":"easy","q":"吸附去湿方法的特点是什么？","o":["只能除去少量水分","可除去大量水分且去湿彻底","能量消耗最大，但去湿最彻底","依靠加热使水分汽化后被空气带走"],"a":["A"],"exp":"吸附去湿是用平衡水汽分压很低的干燥剂与湿物料并存，使水分经气相转入干燥剂内，受干燥剂容量限制只能除去少量水分。可除去大量湿分且能耗较低的是机械去湿，去湿彻底但能耗较大的是热能去湿，D 描述的正是热能去湿而不是吸附去湿。","ev":"用一些平衡水汽分压很低的干燥剂(如无水毛化钙、硅胶等) 与湿物料并存，使物料中水分经气相转入干燥剂内。该方法只能除去少量的水分。","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":343,"n":344,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-single-019","t":"single","mode":"","bloom":"理解","diff":"medium","q":"介电加热干燥的加热原理是什么？","o":["热能以传导方式通过传热壁面加热物料","将物料置于高频电场内，利用高频电场的交变作用加热物料","由辐射器产生的辐射能以电磁波形式发射到物料表面","干燥介质与湿物料直接接触，以对流方式供热"],"a":["B"],"exp":"介电加热干燥把湿物料放在高频电场中，物料中的极性分子在交变电场作用下反复极化、转动而发热，热量在物料内部产生，使湿分汽化。传导干燥靠传热壁面从外部供热，辐射干燥靠物料吸收电磁波，对流干燥靠干燥介质直接接触供热，三者都不是介电加热的机理。","ev":"介电加热干燥， 将需要干燥的物料置于高频电场内，利用高频电场的交变作用将湿物料加热，汽化湿分。","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":344,"n":345,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-single-020","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"化工生产中采用最普遍的干燥方式是哪一种？","o":["对流干燥","传导干燥","辐射干燥","介电加热干燥"],"a":["A"],"exp":"对流干燥中干燥介质与湿物料直接接触，以对流方式供热并把汽化出的湿分带走，可用热空气、烟道气或惰性气体作介质，设备简单、适应性强，是化工生产中最普遍的方式。传导、辐射和介电加热干燥分别依靠壁面传热、电磁波和交变电场供热，应用范围相对较窄。","ev":"在化工生产中，对流干燥是最普遍的方式","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":345,"n":346,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-truefalse-006","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"烟道气和惰性气体都可以充当对流干燥的介质，可见热空气并非唯一选择，湿分也不一定是水。","o":["正确","错误"],"a":["T"],"exp":"对流干燥靠干燥介质与湿物料直接接触供热并带走汽化的湿分，介质可按物料是否怕氧化、是否允许污染等条件选择，烟道气和惰性气体都可以使用，湿分也可以是水以外的其他溶剂。原题把热空气当成唯一可能的介质，把常见做法误说成唯一选择。","ev":"其中干燥介质可以是热空气，也可以是烟道气、惰性气体等，去除的湿分可以是水或是其他液体。","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":346,"n":347,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-002","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在对流干燥中，热空气起什么作用？","o":["既提供热量又带走汽化水分，是载热体也是载湿体","只提供热量，不带走水分","只带走水分，不提供热量","只起惰性保护作用"],"a":["A"],"exp":"预热后的空气与湿物料直接接触，以对流方式把热量传给物料使表面水分汽化，同时把产生的水汽带走；物料内部水分则在浓度梯度推动下迁至表面。因此空气既是载热体又是载湿体，干燥是传热与传质同时进行、方向相反的过程。","ev":"可见，空气既是载热体，也是载湿体，干燥是传热、传质同时进行的过程","keys":[],"ref":"第 329 页","hint":"","score":2},{"i":347,"n":348,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-011","t":"single","mode":"","bloom":"理解","diff":"easy","q":"湿空气的相对湿度反映的是什么？","o":["湿空气中水汽的绝对数量","湿空气温度的高低","湿空气的不饱和程度和吸收水汽的能力","湿空气总压的大小"],"a":["C"],"exp":"相对湿度是水汽分压与同温度下饱和蒸气压之比，它说明空气距离饱和还有多远，因而能反映吸湿能力：数值越小，偏离饱和越远，作为干燥介质的能力越强。水汽的绝对数量由湿度表示，温度与总压则是另外的状态参数，不能与相对湿度的含义混为一谈。","ev":"相对湿度表明湿空气的不饱和程度，反映湿空气吸收水汽的能力。","keys":[],"ref":"第 330 页","hint":"","score":2},{"i":348,"n":349,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-multiple-001","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于湿空气的焓，下列说法正确的是（ ）。","o":["湿空气的焓等于其中干空气的焓与水汽的焓之和","计算湿空气的焓时必须规定基准状态和基准温度","以0 ℃干空气和液态水为基准时，湿空气的焓随温度和湿度的增大而增大","湿空气的焓只与干球温度有关，与湿度无关"],"a":["A","B","C"],"exp":"湿空气是干空气与水汽的混合物，其焓按两组分的焓值相加得到，这是第一项的依据。焓是相对值，不规定基准状态和基准温度就无法取数，故第二项正确。以0 ℃干空气和液态水为基准时，焓的表达式中既有温度项，又有乘以湿度的汽化项，温度或湿度增大都会使焓增大，第三项正确。第四项漏掉了湿度的贡献，与焓的表达式不符。","ev":"湿空气的焓(Centhalpy)为其中干空气的焓及水汽的焓之和。","keys":[],"ref":"第 331 页","hint":"","score":3},{"i":349,"n":350,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-004","t":"single","mode":"","bloom":"应用","diff":"medium","q":"将不饱和湿空气等湿加热，其相对湿度如何变化？","o":["先增大后减小","减小，吸收水汽的能力增强","增大，吸收水汽的能力减弱","保持不变"],"a":["B"],"exp":"等湿加热时水汽分压和湿度都不变，但同温度下水的饱和蒸气压随温度升高而增大，相对湿度是水汽分压与饱和蒸气压之比，因此必然减小。相对湿度越小说明空气偏离饱和越远、吸湿能力越强，这正是干燥前要先预热空气的原因之一。","ev":"由例题可见，此湿空气温度提高后，湿度不变，但相对湿度减小，又可作为干燥介质。","keys":[],"ref":"第 331 页","hint":"","score":2},{"i":350,"n":351,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-012","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"湿比热容是指什么？","o":["1 kg 绝干空气温度升高 1 ℃ 所需的热量","1 kg 水汽温度升高 1 ℃ 所需的热量","1 kg 湿空气温度升高 1 ℃ 所需的热量","1 kg 干空气和其所带水汽温度升高 1 ℃ 所需的热量"],"a":["D"],"exp":"湿比热容以 1 kg 绝干空气为基准，同时计入它所带水汽的热容，所以是两者温度升高 1 ℃ 所需热量之和。只算干空气或只算水汽都不完整，以 1 kg 湿空气为基准时，其中所含干空气量随湿度变化，也不符合定义。由于干空气和水汽的比热容可视为常数，湿比热容只随空气的湿度变化。","ev":"湿比热容(humid heat)是指将 1kg 干空气和其所带的 万kg 水汽的温度升高 1C 所需的热量。","keys":[],"ref":"第 331 页","hint":"","score":2},{"i":351,"n":352,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-005","t":"single","mode":"","bloom":"理解","diff":"medium","q":"湿球温度实际代表的是什么温度？","o":["空气的真实温度","空气的露点温度","空气的绝热饱和温度","湿纱布表面水层的温度"],"a":["D"],"exp":"湿球温度计感温球包有润湿纱布，不饱和空气吹过时水分汽化使纱布水温下降，直到空气传给纱布的热量恰好等于水分汽化所需热量，纱布表面水温恒定，该平衡温度就是湿球温度。它并不代表空气真实温度，对空气水系统在数值上近似等于绝热饱和温度，但两者意义不同。","ev":"湿球温度并不代表空气的真实温度，而是湿纱布表面水层的温度","keys":[],"ref":"第 332 页","hint":"","score":2},{"i":352,"n":353,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-006","t":"single","mode":"","bloom":"理解","diff":"easy","q":"关于露点温度，下列表述正确的是（ ）。","o":["一定压力下，将不饱和空气等湿降温至饱和、出现第一滴露珠时的温度","一定压力下，将不饱和空气等压升温至饱和时的温度","湿纱布表面水层在空气流中达到稳定时的温度","空气与大量水绝热接触达到饱和时的温度"],"a":["A"],"exp":"露点温度对应等湿冷却到饱和的状态，降温过程中湿度不变，温度降到饱和值时才析出露珠。空气升温只会使相对湿度降低，不可能升到饱和，故第二项把方向说反了。湿纱布表面温度是湿球温度，与大量水绝热接触达到的是绝热饱和温度，两者都与露点不是同一个概念，所以只有第一项正确。","ev":"一定压力下，将不饱和空气等湿降温至饱和，出现第一滴露珠时的温度称为该空气的露点温度","keys":[],"ref":"第 333 页","hint":"","score":2},{"i":353,"n":354,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-truefalse-007","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"湿球温度与绝热饱和温度的物理意义完全不同，数值相近并不意味着两个参数可以互相替代。","o":["正确","错误"],"a":["T"],"exp":"数值近似相等只是空气-水系统在较高气速下的巧合：湿球温度是大量空气与少量水接触时湿纱布表面的平衡温度，空气状态基本不变；绝热饱和温度则是少量空气与大量水绝热接触达到饱和时的温度，空气本身降温增湿。原题由数值相近推出意义相同，混淆了两个不同的状态参数。","ev":"应予指出， 绝热饱和温度和湿球温度两者意义完全不同。","keys":[],"ref":"第 333 页","hint":"","score":2},{"i":354,"n":355,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在总压一定时，确定湿空气的状态需要几个独立参数？","o":["3 个","4 个","2 个","1 个"],"a":["C"],"exp":"湿度图中的任意一点都代表一个确定的湿空气状态，只要给出两个独立参数即可唯一确定，例如干球温度与相对湿度、干球温度与湿度、干球温度与露点或湿球温度。湿度与露点不独立，两者落在同一条等湿线上，不能同时用来确定状态点。","ev":"只要规定其中任意两个独立的参数，湿空气的状态就被唯一确定。","keys":[],"ref":"第 335 页","hint":"","score":2},{"i":355,"n":356,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"湿空气的相对湿度越大，其湿度也一定越大。","o":["正确","错误"],"a":["F"],"exp":"湿度只由水汽质量与绝干空气质量之比决定，而相对湿度是水汽分压与同温度下饱和蒸气压之比，后者随温度明显变化。湿度不变的空气升温后饱和蒸气压增大，相对湿度反而下降，所以相对湿度大并不代表湿度大，该说法把两个不同参数混为一谈。","ev":"由图中可见，当湿空气的湿度一定时，温度愈高，其相对湿度愈低","keys":[],"ref":"第 335 页","hint":"","score":2},{"i":356,"n":357,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"干燥计算中为什么多采用干基含水量？","o":["湿物料总质量在干燥过程中保持不变","绝干物料的质量在干燥过程中不变，计算方便","干基含水量的数值总是小于湿基含水量","干基含水量不受空气状态影响"],"a":["B"],"exp":"干燥过程中水分不断汽化，湿物料总质量逐渐减少，用湿基含水量计算时基准在变，很不方便；绝干物料的质量始终不变，以它为基准的干基含水量最便于物料衡算。干基含水量的数值一般大于同状态的湿基值，而且同样随干燥进程变化，所以 A、C、D 都不是采用干基的理由。","ev":"在工业生产中,通常用湿基含水量表示物料中水分的含量，但在干燥过程中湿物料的总量会因失去水分而逐渐减少，故用湿基含水量计算不方便，但绝干物料的质量是不变的，故干燥计算中多采用干基含水量。","keys":[],"ref":"第 338 页","hint":"","score":2},{"i":357,"n":358,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-single-014","t":"single","mode":"","bloom":"理解","diff":"medium","q":"温度一定时，空气的相对湿度越高，同一物料的平衡含水量如何变化？","o":["越小","不变","越大","先增大后减小"],"a":["C"],"exp":"平衡含水量是物料与空气长期接触后不再变化时的含水量。空气相对湿度越高，其中的水汽分压越大，物料要达到平衡就得保留更多水分，所以平衡含水量越大。相对湿度降低则平衡含水量减小；温度的影响是温度越高平衡含水量越小，但变化不大，不能与本问的温度条件混淆。","ev":"对于同一物料，平衡含水量又因所接触的空气状态不同而变化，温度一定时，空气的相对湿度越高，其平衡含水量越大","keys":[],"ref":"第 338 页","hint":"","score":2},{"i":358,"n":359,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-truefalse-002","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"物料中的平衡水分可以在该空气状态下用干燥方法除去。","o":["正确","错误"],"a":["F"],"exp":"平衡水分是在一定空气状态下与空气长期接触后仍残留在物料中的水分，它恰好与空气的湿度相对应，继续用同状态空气干燥无法使其降低。能被干燥除去的是超过平衡水分的自由水分，题目把平衡水分当成了可除去的水分，混淆了两者的界限。","ev":"物料的平衡含水量是一定空气状态下物料被干燥的极限 。","keys":[],"ref":"第 338 页","hint":"","score":2},{"i":359,"n":360,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-truefalse-012","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"空气的相对湿度保持一定时，升温只会让物料的平衡含水量略微下降，温度的影响通常可以忽略。","o":["正确","错误"],"a":["T"],"exp":"平衡含水量是物料在该空气状态下被干燥的极限，温度升高使物料表面水的平衡分压提高，同一相对湿度下对应的平衡含水量因而下降，但降幅有限，工程上常可忽略。原题把这一关系说成明显增大，变化方向和幅度都说错了。","ev":"相对湿度一定时，温度越高,平衡含水量越小，但变化不大","keys":[],"ref":"第 338 页","hint":"","score":2},{"i":360,"n":361,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-multiple-004","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"下列水分中，属于结合水分的有哪些？","o":["物料细胞壁内的水分","物料表面的附着水分","物料内可溶固体溶液中的水分","物料内毛细管中的水分"],"a":["A","C","D"],"exp":"结合水分包括细胞壁内的水分、可溶固体溶液中的水分和毛细管中的水分，它们靠化学力或物理化学力与物料结合，结合力强、蒸气压低，因而较难去除。物料表面的附着水分和大孔隙中的水分属于非结合水分，结合较弱、蒸气压等于纯水的饱和蒸气压，比结合水分容易除去。","ev":"结合水分包括物料细胞壁内的水分、物料内可溶固体物洲液中的水分及物料内毛细管中的水分等。","keys":[],"ref":"第 339 页","hint":"","score":3},{"i":361,"n":362,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在某空气状态下，可用干燥方法从物料中除去的水分是（ ）。","o":["物料中所含的全部结合水分","物料中所含的全部非结合水分","超过平衡水分的那一部分水分","低于平衡水分的那一部分水分"],"a":["C"],"exp":"平衡水分是该空气状态下物料被干燥的极限，只有超出这一极限的部分才能继续被空气带走，故自由水分等于物料含水量与平衡含水量之差。低于平衡水分的部分无论干燥多久都除不掉；结合与非结合水分是按水分和物料的结合方式划分的，非结合水分中仍有一部分会留作平衡水分，故后三项均不正确。","ev":"物料中所含大于平衡水分的那一部分水分，它可在该空气状态下用干燥方法除去，称为自由水分(free moisture) 。","keys":[],"ref":"第 339 页","hint":"","score":2},{"i":362,"n":363,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-truefalse-008","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"湿物料中所含的总水分由自由水分和结合水分两部分组成。","o":["正确","错误"],"a":["F"],"exp":"总水分按能否用干燥除去划分，等于自由水分与平衡水分之和；结合水分与非结合水分是按水分与物料的结合方式划分的另一组概念。两组概念的划分依据不同，不能交叉相加，把总水分说成自由水分加结合水分，等于把两种分类方法混在了一起。","ev":"物料中所含总水分为自由水分与平衡水分之和。","keys":[],"ref":"第 339 页","hint":"","score":2},{"i":363,"n":364,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-truefalse-009","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"物料的含水量低于该空气状态下的平衡含水量时，仍可继续用这种空气把它干燥。","o":["正确","错误"],"a":["F"],"exp":"平衡含水量是一定空气状态下物料被干燥的极限。物料含水量高于平衡含水量时才脱水被干燥，低于平衡含水量时反而会从空气中吸收水分而增湿；只有超过平衡含水量的那部分自由水分才能被除去，所以该说法把过程进行的方向说反了。","ev":"若物料的含水量 X 低于平衡含水量 X* ，则物料将吸水而增湿。","keys":[],"ref":"第 339 页","hint":"","score":2},{"i":364,"n":365,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"结合水分与非结合水分的界限由物料本身的性质决定，更换干燥介质不会改变这一划分。","o":["正确","错误"],"a":["T"],"exp":"这一组分类看的是水分与物料结合的牢固程度，所以只由物料性质决定；会随空气状态改变的是平衡水分与自由水分之间的界限。原题说结合水分与非结合水分的划分随干燥介质状态改变，把两组划分依据不同的概念混在了一起。","ev":"而结合水分与非结合水分是依据物料与水分的结合方式(或物料中所含水分去除的难易)而划分，仅与物料的性质有关，而与空气的状态无关。","keys":[],"ref":"第 340 页","hint":"","score":2},{"i":365,"n":366,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-single-015","t":"single","mode":"","bloom":"分析","diff":"medium","q":"干燥器废气出口温度不能过低的直接原因是什么？","o":["温度过低会使空气用量成倍增加","温度过低会使热效率超过100%","温度过低时物料会升温过快","废气接近饱和会析出水滴，使产品返潮并堵塞管路"],"a":["D"],"exp":"降低废气出口温度虽然可以减少废气带走的热量、提高热效率，但温度低到接近饱和时，湿空气会析出水滴，使干燥产品返潮而黏附在壁面上，造成管路堵塞和设备腐蚀。因此废气出口温度要比进干燥器空气的绝热饱和温度高出一定数值，不能一味降低。","ev":"废气出口温度过低以至接近饱和状态时，湿空气会析出水滴，使干燥产品返潮而黏附在壁面上，造成管路堵塞和设备腐蚀。","keys":[],"ref":"第 343 页","hint":"","score":2},{"i":366,"n":367,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-truefalse-004","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"等焓干燥过程只有在不补充热量、忽略热损失且物料不升温时才能成立，因此又称理想干燥过程。","o":["正确","错误"],"a":["T"],"exp":"这三个条件使空气在干燥器内放出的显热恰好等于水分汽化带回的潜热，空气的焓值保持不变，故此过程又称理想干燥过程。原题把这一理想化模型套到所有实际干燥过程上，忽略了实际干燥器存在散热和物料升温，焓值并不守恒。","ev":"即说明空气通过干燥器时经历等焓的变化过程。而实际操作中很难实现此过程，故等过程又称为理想干燥过程。","keys":[],"ref":"第 344 页","hint":"","score":2},{"i":367,"n":368,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-single-008","t":"single","mode":"","bloom":"应用","diff":"easy","q":"下列措施中能够提高恒速干燥阶段干燥速率的是（ ）。","o":["只增大湿物料的厚度","提高空气温度、降低空气湿度并提高空气流速","降低空气温度、提高空气湿度并降低空气流速","提高空气湿度并降低空气流速"],"a":["B"],"exp":"恒速阶段的干燥速率由物料表面水分的汽化控制，属于外部条件控制的过程，提高气温、降低湿度、加大流速都能增大传热与传质的推动力，从而加快表面汽化。第二、第三项方向相反，只会使干燥变慢；增大物料厚度影响的是内部水分迁移和降速阶段，对单位面积的恒速干燥速率没有提高作用。","ev":"显然，提高空气的温度 、降低空气的湿度或提高空气的流速，均能提高恒速干燥阶段的干燥速率。","keys":[],"ref":"第 348 页","hint":"","score":2},{"i":368,"n":369,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-truefalse-010","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"降速干燥阶段中，只要提高空气的温度和流速，就能显著提高干燥速率。","o":["正确","错误"],"a":["F"],"exp":"降速阶段的干燥速率主要取决于物料本身的结构、形状和尺寸，属于内部水分迁移控制，与外部干燥条件关系不大。此时提高气温和风速只能改善表面传热传质，而控制步骤是内部扩散阻力，因此效果有限。要强化该阶段，应减小物料尺寸或采用微波加热等措施。","ev":"降速干燥阶段又称为物料内部迁移控制阶段","keys":[],"ref":"第 348 页","hint":"","score":2},{"i":369,"n":370,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-single-016","t":"single","mode":"","bloom":"理解","diff":"medium","q":"同一物料的料层越厚，其临界含水量如何变化？","o":["越大","越小","不变","与料层厚度无关，只与空气温度有关"],"a":["A"],"exp":"临界含水量是恒速段结束、降速段开始时的含水量，它随物料性质、厚度和恒速段干燥速率而异。料层越厚，内部水分向表面迁移的路程越长，表面越早出现干区，因而在较高的平均含水量下就转入降速阶段，临界含水量越大。恒速段干燥速率越大，临界含水量也越高。","ev":"临界含水量因物料的性质、厚度和恒速阶段干燥速率的不同而异。","keys":[],"ref":"第 349 页","hint":"","score":2},{"i":370,"n":371,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-truefalse-005","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"物料的临界含水量越低，转入降速干燥阶段越早，所需干燥时间越长。","o":["正确","错误"],"a":["F"],"exp":"临界含水量是恒速段结束、降速段开始时的含水量。临界含水量越大，物料越早进入降速阶段，降速段需要除去的水分更多，完成相同任务的时间越长；临界含水量低意味着恒速段更长、总时间更短，题目把大小关系说反了。","ev":"临界含水量 Xec越大，则转入降速阶段越早，完成相同的干燥任务所需的干燥时间越长。","keys":[],"ref":"第 349 页","hint":"","score":2},{"i":371,"n":372,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-multiple-002","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于常用干燥器的特点，下列说法正确的是（ ）。","o":["洞道式干燥器适用于体积大、干燥时间长的物料","转筒式干燥器可连续操作，生产能力大，机械化程度高","喷雾干燥器热效率高、能耗小，适合处理量很大的物料","厢式干燥器结构简单、装卸灵活，适用于小批量、多品种物料的干燥"],"a":["A","B","D"],"exp":"厢式干燥器结构简单、装卸灵活、适应性强，正好适合小批量多品种生产；洞道式干燥器是厢式的连续化发展，物料随小车在长通道内前进，适合体积大、干燥时间长的物料；转筒式干燥器连续运转、生产能力大且机械化程度高。喷雾干燥器虽然干燥极快并适合热敏物料，但能量消耗大、热效率较低，第四项把缺点说成了优点。","ev":"厢式干燥器的优点是结构简单，装御灵活、方便，对各种物料的适应性强，适用于小批量、多品种物料的干燥","keys":[],"ref":"第 353 页","hint":"","score":3},{"i":372,"n":373,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-single-009","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"气流干燥器的主要优点是（ ）。","o":["物料停留时间均匀可控，特别适合降速干燥","热效率高且尾气不需回收","膏状物料可直接干燥且能耗很低","气固接触面积大、传热传质系数高、干燥速率大"],"a":["D"],"exp":"气流干燥器中颗粒悬浮在高速热气流内，气固接触面积大，传热系数和传质系数都高，因此干燥速率大、干燥时间短。其缺点是停留时间短且不够均匀，不适合需要较长降速干燥的物料；尾气夹带粉尘多、必须回收，热效率也不算高；膏状物料难以在气流中分散，所以后三项都不是它的优点。","ev":"气流干燥器的优点是气相、固相接触面积大，传热系数、传质系数高，干燥速率大","keys":[],"ref":"第 354 页","hint":"","score":2},{"i":373,"n":374,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-single-017","t":"single","mode":"","bloom":"理解","diff":"medium","q":"气流干燥器尤其适宜干燥哪一类物料？","o":["含水量很高、易结块的膏状物料","热敏性物料或临界含水量低的细粒、粉末物料","需要很长停留时间才能干燥的厚块物料","怕磨损且要求保持完整颗粒形状的物料"],"a":["B"],"exp":"气流干燥器中颗粒高度分散在高速热气流内，传热传质系数大、干燥时间短，且气固并流可采用高温介质，因此特别适合热敏性物料和临界含水量低的细粒或粉末物料。它的缺点是停留时间短且磨损较大，膏状物料难以分散，怕磨损的物料也不合适，其余选项都不符合。","ev":"气流干燥需适用于处理含非结合水及结块不严重又不怕磨损的粒状物料，尤其适宜于干燥热敏性物料或临界含水量低的细粒或粉末物料。","keys":[],"ref":"第 355 页","hint":"","score":2},{"i":374,"n":375,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-single-018","t":"single","mode":"","bloom":"应用","diff":"medium","q":"卧式多室流化床干燥器内设置垂直挡板的主要作用是什么？","o":["提高通过床层的气速","降低床层的温度","使颗粒逐室通过、停留时间趋于一致，产品干燥更均匀","阻止热风进入最后一室"],"a":["C"],"exp":"连续操作的流化床中颗粒运动随机，停留时间不一致会造成产品干燥程度不均。用垂直挡板把床层分成多室后，物料依次由第一室流到最后一室，挡板迫使颗粒逐室通过，停留时间趋于一致，干燥程度更均匀；各室还可以分别调节风温和风量。","ev":"由于挡板的作用，颗粒逐室通过，使其停留时间趋于一致，产品的干燥程度均匀。","keys":[],"ref":"第 355 页","hint":"","score":2},{"i":375,"n":376,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-multiple-005","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"为减少干燥过程的热量消耗，可采取哪些措施？","o":["干燥前用机械方法脱除一部分游离水，降低湿物料的初始含水量","适当提高干燥介质的进口温度","适当降低干燥介质的出口温度","把废气循环量尽可能加大"],"a":["A","B","C"],"exp":"干燥前机械去湿可减少进入干燥器的水分，直接降低汽化所需热量；提高介质进口温度或降低出口温度都能提高热效率，故 A、B、C 都正确。废气循环可以回收余热，但循环量过大会使干燥介质湿度升高、干燥速率下降、干燥时间延长，设备投资也增加，通常只把循环量控制在 20% 左右，故 D 说尽可能加大是错误的。","ev":"在热力干燥前，应尽量降低湿物料中的水分，可采用机械方法先脱除一部分游离水，如挤压脱水，或利用细胞型物料或液态物料的渗透压变化特性，先作渗透脱水等，减少过程的热能。也可以通过提高干燥介质的进口温度或降低其出口温度等手段提高热效率。","keys":[],"ref":"第 358 页","hint":"","score":3},{"i":376,"n":377,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-truefalse-011","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"废气循环能回收余热并降低预热器负荷，但循环量过大会使介质湿度升高、干燥速率下降，因此需要优化循环量。","o":["正确","错误"],"a":["T"],"exp":"把部分废气循环使用，可以回收其中的余热、减轻预热器负担，同时加大干燥器内空气流量；但废气含水汽多，循环量过大使干燥介质湿度上升，干燥速率下降、干燥时间延长，设备投资也增加。原题只看到回收余热的好处就断言循环量越大越有利，忽略了这些代价。","ev":"但是，废气循环使干燥介质的湿度增加，造成干燥速率下降，干燥时间延长，设备投资增加，故需考虑优化问题。","keys":[],"ref":"第 358 页","hint":"","score":2},{"i":377,"n":378,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-024","t":"single","mode":"","bloom":"理解","diff":"medium","q":"结晶时若加快冷却或蒸发速度，晶体外形通常会变成什么样？","o":["粗壮的粒状晶体","针状或薄片状晶体","规则的立方体","无定形粉末"],"a":["B"],"exp":"晶习受结晶条件控制：条件良好、冷却或蒸发缓慢时得到粗壮的粒状晶体，速度加快则易长成针状、薄片状晶体。温度和杂质也会改变晶体的颜色和形状，因此工程上常用调节结晶条件或加入晶习修改剂来控制产品外形，而不是任其自然。","ev":"例如在良好的结晶条件下，可得到粗壮的粒状晶体; 若加快冷却或蒸发速度则易形成针状、薄片状晶体","keys":[],"ref":"第 364 页","hint":"","score":2},{"i":378,"n":379,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-025","t":"single","mode":"","bloom":"理解","diff":"easy","q":"晶体区别于一般固体的本质特征是什么？","o":["内部质点作三维有序排列","外形一定是规则的多面体","由单一元素组成","一定是透明且能导电的固体"],"a":["A"],"exp":"晶体的本质在于内部原子、离子或分子作三维有序排列；在良好环境下它可以长成多面体外形，但外形只是外部表现，破碎后的小晶粒仍然保留有序结构。由单一元素组成、透明导电都不是晶体的必要条件，所以其余选项把外表或个别性质当成了本质。","ev":"晶体是一种其内部结构中的质点元素(原子、离子或分子)作三维有序排列的固态物质。","keys":[],"ref":"第 364 页","hint":"","score":2},{"i":379,"n":380,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"溶解度作为状态函数同时受温度和压力支配，只不过多数物系的压力效应微弱，工程上常把它略去。","o":["正确","错误"],"a":["T"],"exp":"作为状态函数，溶解度同时受温度和压力影响；不过对多数物系而言压力效应很小，工程上主要用溶解度随温度变化的曲线来描述相平衡。原题承认溶解度是状态函数，却断言它与压力完全无关，把可以忽略的影响说成了不存在。","ev":"随温度和压力而变。但大多数物质在一定溶液中的溶解度主要随温度而变化，随压力的变化很小，常可忽略","keys":[],"ref":"第 364 页","hint":"","score":2},{"i":380,"n":381,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-001","t":"single","mode":"","bloom":"应用","diff":"medium","q":"某物质的溶解度随温度变化很大，按溶解度曲线的特征，应优先采用哪种结晶方法？","o":["变温（冷却）结晶","蒸发结晶","升华结晶","沉淀结晶"],"a":["A"],"exp":"溶解度随温度变化大的物系，只要降温就能产生足够大的过饱和度，因此采用变温结晶最经济；蒸发结晶适用于溶解度随温度变化不大的物系，靠蒸掉溶剂来浓缩；升华结晶和沉淀结晶属于其他结晶方式，与溶解度曲线这条选择依据无关。","ev":"物质的溶解度曲线的特征会对结晶方法的选择起决定作用。例如，对于溶解度随温度变化大的物质，可采用变温方法来结晶分离，对于溶解度随温度变化不大的物质，则可采用蒸发结晶的方法来分离。","keys":[],"ref":"第 365 页","hint":"","score":2},{"i":381,"n":382,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-011","t":"single","mode":"","bloom":"理解","diff":"medium","q":"含有晶体的过饱和溶液因晶体之间相互碰撞，或晶体与搅拌器、容器壁碰撞而破碎产生微小晶体，这种成核方式属于哪一类？","o":["初级均相成核","初级非均相成核","二次成核","晶种长大"],"a":["C"],"exp":"二次成核依靠已有晶体参与，晶体之间碰撞或晶体与搅拌器、器壁碰撞破碎都能产生微小晶体，是工业结晶晶核的主要来源；初级均相成核是较高过饱和度下自发成核，初级非均相成核靠外来固体物诱导，晶种长大属于晶体成长而不是成核，三者都与题干所述的碰撞破碎不符。","ev":"二次成核则是指含有晶体的过饱和洲液由于晶体间的相互碰撞或晶体与搅拌器(或容吉壁)碰撞时导致晶体破碎产生微小晶体的过程。","keys":[],"ref":"第 366 页","hint":"","score":2},{"i":382,"n":383,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-027","t":"single","mode":"","bloom":"理解","diff":"medium","q":"关于杂质对晶体成长速率的影响，下列说法正确的是哪一项？","o":["杂质总是促进晶体成长","杂质总是抑制晶体成长","杂质有的抑制、有的促进，影响较复杂","杂质只改变晶习，不影响成长速率"],"a":["C"],"exp":"教材明确指出杂质对晶体成长速率的影响较复杂：有的杂质抑制成长，有的反而促进，起作用的浓度也相差很大，途径包括改变溶液结构、吸附阻挡晶面等。把它说成一律促进或一律抑制都不符合事实，而杂质显然也会影响成长速率，不只是改变晶习。","ev":"杂质对晶体成长速率的影响较复杂，有的杂质能抑制晶体的成长，有的却能促进成长","keys":[],"ref":"第 366 页","hint":"","score":2},{"i":383,"n":384,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"溶液处于介稳区时一定会自发产生大量晶核，因此无法通过加入晶种来控制产品粒度。","o":["正确","错误"],"a":["F"],"exp":"介稳区的特点正是溶液不会自发成核，只有越过超溶解度曲线进入不稳区，才会立即爆发成核；在介稳区内加入晶种，晶种可以作为现成表面继续长大，工业结晶正是利用这一点控制晶核数量和产品粒度。","ev":"介稳区内,溶液不会自发地产生晶核，但加入晶种(inoculation crystal) ，可使品种长大。","keys":[],"ref":"第 366 页","hint":"","score":2},{"i":384,"n":385,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-truefalse-008","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"一个特定物系的超溶解度曲线只有一条，不会随搅拌速率、冷却速率和晶种情况改变。","o":["正确","错误"],"a":["F"],"exp":"与只有一条明确溶解度曲线不同，超溶解度曲线受搅拌速率、冷却速率、有无晶种等多种工程因素影响，所以同一物系可有多条，位置在溶解度曲线之下；正因如此，设计结晶器前要按实际操作条件测出超溶解度曲线并定出介稳区。","ev":"所以超溶解度曲线可有多条，其位置在 CD 线之下, 与CD 的趋势大体一致，如 CD“ 线。","keys":[],"ref":"第 366 页","hint":"","score":2},{"i":385,"n":386,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-truefalse-015","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"初级成核速率远高于二次成核，且对过饱和度十分敏感，因此工业结晶主要靠二次成核提供晶核。","o":["正确","错误"],"a":["T"],"exp":"初级成核在较高过饱和度下自发爆发，速率大且对过饱和度敏感，容易产生大量细晶、使粒度分布变差；二次成核由已有晶体碰撞破碎产生，速率较慢而可控。工业结晶因而避免初级成核，主要以二次成核作为晶核来源，并配合介稳区操作。","ev":"初级成核的速率远大于二次成核的速率，而且受过他和度的影响十分敏感， 因此，一般结晶过程应尽量避免发生初级成核。工业结晶主要采用二次成核作为唱核的主要来源。","keys":[],"ref":"第 366 页","hint":"","score":2},{"i":386,"n":387,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-multiple-001","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"按结晶方法划分，结晶器可分为下列哪几种？","o":["冷却结晶器","蒸发结晶器","真空结晶器","多级型结晶器"],"a":["A","B","C"],"exp":"按结晶方法，教材把结晶器分为冷却、蒸发、真空三类，分别对应降温、蒸发浓缩和真空绝热冷却产生过饱和度；多级型结晶器是按流动方式划分的类别，与混合型、母液循环型并列，不属于按结晶方法的分类。","ev":"结晶器的种类很多，按结晶方法可分为冷却结晶器、蒸发结品器、真空结晶器: 按操作方式可分为间鞭式结晶器和连续式结晶器; 按流动方式可分为混合型结晶器、多级型结晶器、母液循环型结晶器。","keys":[],"ref":"第 367 页","hint":"","score":3},{"i":387,"n":388,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-002","t":"single","mode":"","bloom":"理解","diff":"medium","q":"外循环式冷却结晶器的主要优点是什么？","o":["循环泵对晶体的破碎作用小，产品粒度更均匀","器内不需要搅拌，晶体靠重力自然悬浮","冷却换热器面积大、传热速率大，便于控制溶液过饱和度","可在结晶器内直接完成过滤和干燥"],"a":["C"],"exp":"外循环式把冷却换热器移到釜外，换热面积和传热速率都比内循环式大，能及时移走结晶热，避免局部过饱和度过高；它的缺点恰恰是循环泵容易破碎晶体，所以 A 说反了，B 和 D 也不是它的结构特点。","ev":"图 8-4 为外循环式结晶器，它的优点是冷却换热器面积大，传热速率大，有利于溶液过饱和度的控制。","keys":[],"ref":"第 367 页","hint":"","score":2},{"i":388,"n":389,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"与冷却结晶相比，蒸发结晶在产生过饱和度上的根本不同点是什么？","o":["靠降低溶液温度、减小溶解度来达到过饱和","将溶液加热到沸点，靠溶剂汽化浓缩达到过饱和","靠加入晶种，使晶核在介稳区内大量生成","靠两种溶液混合发生化学反应生成沉淀"],"a":["B"],"exp":"蒸发结晶要先把溶液加热到沸点，溶剂不断汽化、溶液被浓缩，浓度超过溶解度后才析出晶体；冷却结晶才是靠降温减小溶解度。加入晶种只是控制粒度的辅助手段，化学反应析出属于沉淀结晶，都不是两者的根本区别。","ev":"蒸发结晶与冷却结品的不同之处在于前者需将溶液加热到沸点，并浓缩达过饱和而产生结晶。","keys":[],"ref":"第 367 页","hint":"","score":2},{"i":389,"n":390,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-012","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"带导流筒和搅拌桨的真空结晶器中，筒形挡圈把结晶器分成哪两个区域？","o":["加热区和冷却区","晶体成长区和澄清区","吸附区和解吸区","过滤区和干燥区"],"a":["B"],"exp":"挡圈内为晶体成长区，悬浮液在导流筒与挡圈的环隙间循环，晶粒在此继续长大；挡圈与器壁之间的环隙是澄清区，溶液基本不受搅拌干扰，大晶体沉降分离，细晶粒随母液排出后加热清除。其余选项把结晶器误当成换热、吸附或过滤设备。","ev":"简形挡圈将结晶吉分为晶体成长区和澄清区。","keys":[],"ref":"第 367 页","hint":"","score":2},{"i":390,"n":391,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-multiple-004","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"结晶过程强化可从下列哪些方面着手？","o":["测定溶解度曲线特别是介稳区","强化结晶过程的传热与传质","改良结晶器结构","把搅拌与循环速率提高到尽可能大"],"a":["A","B","C"],"exp":"教材从结晶相平衡、传热传质、设备与过程控制几个方面讨论结晶强化，测定溶解度曲线和介稳区、强化传热传质、改良结晶器结构都在其中；搅拌与循环速率并非越大越好，速率过大反而使晶粒破碎、不利于晶体成长，所以不能选 D。","ev":"结晶过程及其强化的研究可以从结晶相平衡、结品过程的传热传质(包括反应) 、设备及过程的控制等方面分别加以讨论。","keys":[],"ref":"第 368 页","hint":"","score":3},{"i":391,"n":392,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-014","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在结晶过程强化中，改良结晶器结构最常用且十分有效的措施是什么？","o":["降低溶液温度至冰点以下","把循环泵转速提高到最大","向母液中加入大量晶种","在结晶器内设置导流筒或挡筒"],"a":["D"],"exp":"导流筒或挡筒把结晶器分成成长区和澄清区，既强化筒内溶液的传热传质与反应，又让筒外晶体在较平稳的环境中长大，因此是最常用的结构改良手段；降温到冰点以下、盲目提高泵速和大量加入晶种都可能造成过量成核或晶体破碎，不属于结构改良措施。","ev":"在结晶器内采用导流简或挡简是改良结晶器最常用的也是十分有效的方法","keys":[],"ref":"第 368 页","hint":"","score":2},{"i":392,"n":393,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-single-026","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"除添加剂和杂质外，近期文献报道还有哪类外场对结晶过程有明显影响？","o":["磁场和声场","电场和磁场","微波和等离子体","激光和紫外线"],"a":["A"],"exp":"教材在结晶过程强化中除了讨论添加剂、杂质，还提到外加磁场、声场对结晶过程产生显著影响，属于引入其他能量强化结晶的思路。电场、微波、等离子体、激光和紫外线都不是该处列出的外场，不能凭想象替换。","ev":"最近，有文献报道，外加磁场、声场对结晶过程也产生显著的影响。","keys":[],"ref":"第 368 页","hint":"","score":2},{"i":393,"n":394,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-truefalse-002","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"结晶过程中若搅拌或循环速率过大，晶粒容易被破碎，反而不利于晶体成长。","o":["正确","错误"],"a":["T"],"exp":"搅拌和循环能强化传热传质，使溶液温度和浓度均匀，但速率必须控制在合适范围；速率过大时晶粒会被打碎，过大的速率本身也不利于晶体成长，所以不能认为搅拌越强越好。","ev":"但是应该注意控制速率，和否则晶粒易被破碎，过大的速率也不利于品体成长。","keys":[],"ref":"第 368 页","hint":"","score":2},{"i":394,"n":395,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-multiple-005","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"下列关于活性炭吸附剂的说法，哪些是正确的？","o":["具有非极性表面，适合吸附有机物","比表面积大，化学稳定性好，抗酸耐碱","属于亲水性的极性吸附剂，主要用于气体干燥","再生容易，可反复吸附再生使用"],"a":["A","B","D"],"exp":"活性炭表面非极性，对有机蒸气等亲有机物吸附能力强，且比表面积大、化学稳定性好、耐酸耐碱，高温再生后结构几乎不变、可反复使用，所以 A、B、D 正确；亲水性极性吸附剂是硅胶，主要用于气体和液体干燥，C 把活性炭与硅胶的特性弄混了。","ev":"活性炭具有非极性表面，可作为朴水性有机物质和亲有机物质的吸附剂。","keys":[],"ref":"第 369 页","hint":"","score":3},{"i":395,"n":396,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-multiple-007","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"工业吸附对吸附剂的要求包括下列哪些？","o":["具有较大的内表面，以提供较大的吸附容量","选择性高，对不同吸附质的吸附能力差异显著","比表面积越小越好，以降低流体通过床层的阻力","容易再生，以降低整个吸附操作的成本"],"a":["A","B","D"],"exp":"吸附发生在固体表面，内表面越大吸附容量越高；选择性越高，分离效果越好；再生容易则能降低操作成本，所以 A、B、D 都是教材列出的要求。比表面积小意味着吸附容量低，会迫使设备庞大或频繁再生，与工业要求正好相反。","ev":"吸附分离的效果很大程度上取决于吸附剂的性能，工业吸附要求吸附剂满足以下要求。","keys":[],"ref":"第 369 页","hint":"","score":3},{"i":396,"n":397,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"化学吸附与物理吸附一样都可以反复解吸再生，所以化学吸附也是可逆过程。","o":["正确","错误"],"a":["F"],"exp":"物理吸附靠分子间作用力，结合弱、解吸容易、过程可逆，工业吸附分离正是利用这一可逆性回收吸附剂；化学吸附靠化学键，吸附热大、速度慢，过程往往不可逆，不能像物理吸附那样轻易再生。","ev":"化学吸附仅为单分子层吸附，吸附速度慢，其过程往往是不可逆的，如加氨催化过程中催化剂对氢的吸附。","keys":[],"ref":"第 369 页","hint":"","score":2},{"i":397,"n":398,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-009","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"化学吸附放出的热量与化学反应热数量级相当，因此在相同覆盖率下它比物理吸附热得多，这是判别两类吸附的重要依据。","o":["正确","错误"],"a":["T"],"exp":"化学吸附靠化学键，放出的热量与化学反应热同数量级；物理吸附靠分子间作用力，吸附热只与相变热相当。因此在相同覆盖率下化学吸附热明显更高，这一差别常用来判别吸附类型；但它不是唯一判据，还要结合可逆性和吸附层数。","ev":"在相同的覆盖率下，它比物理吸附热高得多，这也是物理吸附与化学吸附区别的主要标志之一。","keys":[],"ref":"第 369 页","hint":"","score":2},{"i":398,"n":399,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-016","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"物理吸附只能形成单分子层，因此吸附量不会随分压升高而多层累积。","o":["正确","错误"],"a":["F"],"exp":"物理吸附靠分子间作用力，既可以是单分子层，也可以是多分子层，已吸附的分子还能继续吸附新分子；只有化学吸附才仅限于单分子层。把化学吸附的单层限制套到物理吸附上，正是本条要澄清的误解。","ev":"物理吸附可以是单分子层吸附，也可以是多分子层吸附，其吸附速率快， 吸附过程是可逆的","keys":[],"ref":"第 369 页","hint":"","score":2},{"i":399,"n":400,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"硅胶是亲水性的极性吸附剂，工业上主要用于什么场合？","o":["吸附有机蒸气并回收溶剂","从混合二甲苯中分离对二甲苯","高温下脱除酸性气体","气体和液体的干燥、溶液的脱水"],"a":["D"],"exp":"硅胶由硅酸钠水溶液经硫酸处理制成，表面亲水、极性较强，对水分以及不饱和烃、甲醇等有明显选择性，所以工业上主要用于气体和液体的干燥及溶液脱水；吸附有机蒸气并回收溶剂常用活性炭，从混合二甲苯中分离对二甲苯用合成沸石分子筛，高温脱除酸性气体也不是硅胶的典型用途。","ev":"硅胶是亲水性的极性吸附剂，对不饱和烃、甲醇、水分等有明显的选择性。主要用于气体和液体的干燥、溶液的脱水。","keys":[],"ref":"第 370 页","hint":"","score":2},{"i":400,"n":401,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-020","t":"single","mode":"","bloom":"理解","diff":"medium","q":"下列哪种吸附剂具有均匀孔径、选择性强，常用于石油馏分的分离和气体、液体的干燥？","o":["合成沸石分子筛","活性炭","硅胶","活性氧化铝"],"a":["A"],"exp":"合成沸石分子筛是强极性吸附剂，孔径均匀、选择性很强，工业上用于石油馏分分离和气体、液体干燥，还可从混合二甲苯中分离对二甲苯、从空气中分离氧；活性炭偏非极性，硅胶和活性氧化铝主要用于干燥脱水，孔径分布不如分子筛均匀。","ev":"因其具有一定的均匀孔径，故有很强的选择性。常用于石油馏分的分离、各种气体和液体的干燥等场合","keys":[],"ref":"第 370 页","hint":"","score":2},{"i":401,"n":402,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-028","t":"single","mode":"","bloom":"理解","diff":"medium","q":"单位体积吸附剂颗粒本身（包含颗粒内细孔）的质量称为什么？","o":["真实密度","表观密度","填充密度","颗粒孔隙率"],"a":["B"],"exp":"表观密度又称颗粒密度，体积只算颗粒本身，其中包含颗粒内细孔占据的空间。真实密度要扣除细孔体积，数值最大；填充密度把颗粒之间的空隙也计入体积，数值最小；颗粒孔隙率是细孔体积与颗粒体积之比，是无量纲参数而不是密度。","ev":"定义为单位体积吸附剂颗粒本身的质量。","keys":[],"ref":"第 370 页","hint":"","score":2},{"i":402,"n":403,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-010","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"吸附剂颗粒内部细孔占的体积份额越大，同样质量的颗粒所占体积越大，表观密度就越低。","o":["正确","错误"],"a":["T"],"exp":"表观密度按颗粒本身的体积计算，而颗粒体积中包含内部细孔所占的空间；孔隙率越大，同样质量的颗粒占据的体积越大，表观密度因此下降。原题把这一关系说成孔隙率越大表观密度越大，方向正好相反。","ev":"颗粒的孔阶率 e愈大，颗粒的表观密度愈小。","keys":[],"ref":"第 370 页","hint":"","score":2},{"i":403,"n":404,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-015","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"吸附剂的比表面积主要由哪一类孔隙提供？","o":["微孔","过渡孔","大孔","颗粒之间的空隙"],"a":["A"],"exp":"微孔孔径最小、数量最多，单位质量提供的表面积最大，所以比表面积主要由微孔贡献；大孔和过渡孔主要起通道作用，颗粒之间的空隙不属于吸附剂本身的孔结构。","ev":"吸附剂的比表面积以微孔提供的表面积;主，常采用气相吸附法测定。","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":404,"n":405,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-016","t":"single","mode":"","bloom":"理解","diff":"medium","q":"假设吸附剂表面均匀、被吸附分子间无作用，描述单分子层物理吸附的等温方程是哪一个？","o":["E.T 方程","朗格缪尔（Langmuir）方程","Freundlich 方程","哈金斯-尤拉方程"],"a":["B"],"exp":"朗格缪尔方程建立在单分子层、表面均匀、被吸附分子间无作用的假设上，吸附量随分压升高平缓趋近饱和；B.E.T 方程描述多分子层吸附，Freundlich 方程和哈金斯-尤拉方程属于其他经验或半经验等温式，假设前提不同。","ev":"成功地描述此种吸附情况的吸附等温方程有朗格廖尔(Langmuir)吸附等温方程","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":405,"n":406,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-004","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"气相吸附中，升高温度或降低压力，平衡吸附量都会减小。","o":["正确","错误"],"a":["T"],"exp":"吸附是放热过程，升温使吸附质更容易脱附，平衡吸附量下降；降低压力使气相中吸附质的分压减小，平衡吸附量同样下降。两个方向都指向吸附量减小，这与升温加压有利于吸附的直觉相反，但符合平衡规律。","ev":"通常情况下, 温度升高、压力下降会使吸附量下降","keys":[],"ref":"第 372 页","hint":"","score":2},{"i":406,"n":407,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-017","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当外扩散速率小于内扩散速率时，总吸附速率由哪一步决定？","o":["表面吸附速率","内扩散速率","内外扩散速率之和","外扩散速率"],"a":["D"],"exp":"串联过程的总速率由最慢的一步控制，外扩散比内扩散慢时，整个吸附就卡在从流体主体到颗粒外表面的传递上，称为外扩散控制；反之内扩散慢则为内扩散控制。表面吸附速率通常很快，不会成为控制步骤，取内外速率之和也不符合串联过程的控制规律。","ev":"当外扩散速率小于内扩散速率时，总吸附速率由外扩散速率决定","keys":[],"ref":"第 373 页","hint":"","score":2},{"i":407,"n":408,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-030","t":"single","mode":"","bloom":"理解","diff":"medium","q":"Giles 分类中，被吸附分子在吸附剂表面呈平行状态、稀溶液吸附多属的等温线是哪一型？","o":["S 型","H 型","C 型","L 型"],"a":["D"],"exp":"L 型即朗格缪尔型，被吸附分子在表面平行躺卧，吸附量随浓度升高平缓趋于饱和，一般稀溶液的吸附多属此类。S 型对应分子垂直方位吸附，H 型表示吸附剂与吸附质之间亲和力很高，C 型则是吸附量与浓度成直线、在两相间按一定比例分配。","ev":"L 型的吸附即朗格廖尔吸附，是指被吸附分子在吸附剂表面呈平行状态，一般稀溶液的吸附多属此类型。","keys":[],"ref":"第 373 页","hint":"","score":2},{"i":408,"n":409,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-017","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"液相吸附中，溶质在溶液中的溶解度越大，平衡吸附量反而越小。","o":["正确","错误"],"a":["F"],"exp":"教材指出液相吸附通常溶解度越大吸附量越大、温度越高吸附量越低，题干把溶解度的影响说反了。溶质在溶剂中越难溶解，越倾向于逃向固体表面，所以溶解度大的体系吸附量并不会更小；升温则会削弱吸附放热带来的有利趋势。","ev":"对吸附机理有很大影响。通常溶解度越大，吸附量就","keys":[],"ref":"第 373 页","hint":"","score":2},{"i":409,"n":410,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-multiple-002","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"下列哪些属于吸附操作的形式？","o":["移动床吸附操作","错流式吸附操作","模拟移动床吸附操作","固定床吸附操作"],"a":["A","C","D"],"exp":"教材把吸附操作分为接触过滤式、固定床、移动床、流化床和模拟移动床等形式，固定床、移动床和模拟移动床都在其中；错流式吸附不是教材列出的操作形式，只是按字面拼凑的干扰项。","ev":"吸附分离过程包括吸附过程和解吸过程。因要处理的流体浓度、性质及要求吸附的程度不同，故吸附操作有多种形式，如接触过滤式吸附操作、固定床吸附操作、移动床吸附操作、流化床吸附操作和模拟移动床吸附操作等。","keys":[],"ref":"第 374 页","hint":"","score":3},{"i":410,"n":411,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-018","t":"single","mode":"","bloom":"应用","diff":"medium","q":"接触过滤式吸附操作在搅拌下进行，颗粒外表面的膜阻力减小，因此它适用于哪种传质过程？","o":["液膜扩散控制的过程","内扩散控制的过程","表面吸附控制的过程","化学反应控制的过程"],"a":["A"],"exp":"搅拌使溶液湍动、减薄颗粒外表面的滞流膜，外扩散阻力随之减小，所以接触过滤式最适合液膜扩散控制的过程；若过程受内扩散或表面吸附控制，仅加强外部搅拌帮助有限，需要减小颗粒尺寸或改善孔结构。","ev":"因在接触式吸附操作时，使用搅拌使洲液呈消流状态，颗粒外表面的膜阻力减少，故该操作适用于液膜扩散控制的传质过程 。","keys":[],"ref":"第 374 页","hint":"","score":2},{"i":411,"n":412,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-029","t":"single","mode":"","bloom":"理解","diff":"medium","q":"吸附剂孔道直径很小时，吸附质分子以与孔壁碰撞为主的扩散称为什么？","o":["分子扩散","努森扩散","过渡扩散","表面扩散"],"a":["B"],"exp":"孔径远大于分子平均自由程时，分子靠相互碰撞迁移，称分子扩散；孔道直径很小时，分子与孔壁碰撞占主导，称努森扩散；孔径分布宽、两种机理并存时是过渡扩散；沿颗粒表面弹跳迁移的则是表面扩散。四者按孔径和控制机理区分，不能混淆。","ev":"扩散在以吸附质分子与孔道壁碰撞为主的过程中进行，此情况的扩散称为努森(Knudsen)扩散 。","keys":[],"ref":"第 374 页","hint":"","score":2},{"i":412,"n":413,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-004","t":"single","mode":"","bloom":"理解","diff":"medium","q":"下列哪一项是固定床吸附操作的主要缺点？","o":["吸附剂在塔内连续移动，磨损严重","操作范围窄，高流量下容易发生液泛","吸附剂与流体返混严重，分离效率低","传热性能差，颗粒较小时床层压降大，吸附与再生交替使生产效率较低"],"a":["D"],"exp":"固定床的吸附剂静止不动，流体穿过床层的压降随颗粒减小而增大，而且吸附、再生和冷却要分阶段切换，所以传热差、生产效率低；A 是移动床或流化床的磨损问题，C 描述的是某些气液接触设备在高流量下的液泛问题，与固定床吸附无关，B 则与固定床返混小的特点相反。","ev":"但固定床吸附操作的传热性能差，且当吸附剂颗粒较小时，流体通过床层的压降较大，因吸附、再生及冷却等操作需要一定的时间，故生产效率较低。","keys":[],"ref":"第 375 页","hint":"","score":2},{"i":413,"n":414,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-031","t":"single","mode":"","bloom":"理解","diff":"medium","q":"流化床吸附操作的主要缺点是什么？","o":["生产能力小，难以大型化","传热性能差，床层温度不均匀","吸附剂颗粒磨损严重","物料返混小，分离效率过高"],"a":["C"],"exp":"流化床中流体自下而上把吸附剂托起呈流态化，气固接触充分、生产能力大，但颗粒在剧烈运动中相互碰撞，磨损严重；受流态化条件限制，操作范围也变窄。生产能力小和传热性能差是固定床的缺点，返混小、分离效率高同样是固定床的优点，都不是流化床的特征。","ev":"该操作的生产能力大, 但吸附剂颗粒磨损程度严重","keys":[],"ref":"第 375 页","hint":"","score":2},{"i":414,"n":415,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-011","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"移动床吸附操作把吸附和再生放在同一塔内，设备投资比固定床少，但对吸附剂的强度和耐磨性要求更高。","o":["正确","错误"],"a":["T"],"exp":"教材在比较两种吸附操作时指出，移动床因吸附和再生过程在同一个塔中进行，设备投资费用比固定床少；但移动床对吸附剂的强度和耐磨性要求较高，颗粒在连续移动中容易破碎，这是它的代价。","ev":"与固定床相比，移动床吸附操作因吸附和再生过程在同一个塔中进行，所以设备投资费用少。","keys":[],"ref":"第 375 页","hint":"","score":2},{"i":415,"n":416,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-single-005","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"模拟移动床吸附塔一般由哪四个段组成？","o":["吸附段、第一精馏段、解吸段、第二精馏段","预饱和段、吸附段、洗涤段、熔融段","吸附段、再生段、冷却段、干燥段","进料段、反应段、分离段、回收段"],"a":["A"],"exp":"模拟移动床靠各段分工实现连续分离：吸附段吸附易吸附的组分，一精段对组分 A 精制并置换 B，解吸段用解吸剂把 A 解吸出来，二精段回收解吸剂；其余三组段名都不是该装置的组成部分。","ev":"模拟移动床的吸附塔一般由 4 个段组成: 吸附段、第一精馏段(简称一精段) 、解吸段和二精段","keys":[],"ref":"第 377 页","hint":"","score":2},{"i":416,"n":417,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-truefalse-005","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"强化吸附过程只能靠加大吸附塔尺寸，与吸附剂性能和吸附工艺的开发无关。","o":["正确","错误"],"a":["F"],"exp":"吸附速率与吸附剂性能密切相关，吸附操作是否经济、能否大型连续化又与吸附工艺有关，所以强化吸附应从开发新型吸附剂、改进吸附剂性能和开发新吸附工艺三方面入手；单纯加大塔尺寸只会让设备更庞大。","ev":"吸附速率与吸附剂的性能密切相关，吸附操作是否经济、大型并连续化等又与吸附工艺有关，所以强化吸附过程可从开发新型吸附剂、改进吸附剂性能和开发新的吸附工艺等方面从事。","keys":[],"ref":"第 377 页","hint":"","score":2},{"i":417,"n":418,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-multiple-003","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"下列哪些膜过程属于以压力差为推动力的膜过程？","o":["纳滤","超滤","反渗透","电渗析"],"a":["A","B","C"],"exp":"反渗透、纳滤、超滤、微滤都靠膜两侧压力差推动溶剂和小分子透过，只是膜孔结构和操作压力不同：反渗透膜几乎无孔、压力最高，微滤孔径最大、压力最低；电渗析靠电位差驱动离子迁移，不属于压力推动的膜过程。","ev":"反渗透、纳滤、超滤、微滤均为压力推动的膜过程，即在压力差的作用下，溶剂及小分子通过膜，而盐、大分子、微粒等被截留，其截留程度取决于膜结构。","keys":[],"ref":"第 381 页","hint":"","score":3},{"i":418,"n":419,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-multiple-008","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"与传统分离操作相比，膜分离具有哪些特点？","o":["通常在常温下进行，特别适合处理热敏性物料","设备中有大量高速运动部件，操作维护复杂","大多数膜分离过程不发生相变化，能耗较低","可以实现高纯度的分离"],"a":["A","C","D"],"exp":"膜分离的高纯度、多数过程无相变因而能耗低、常温操作适合热敏物料，都是教材列出的优点；它的设备本身没有运动部件，可靠性高、操作维护方便，所以 B 恰好说反。正因为这些特点，膜分离在热敏物料的浓缩和纯水制备中应用广泛。","ev":"膜分离是一个高效分离过程，可以实现高纯度的分离。","keys":[],"ref":"第 381 页","hint":"","score":3},{"i":419,"n":420,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-013","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"若某膜对某溶质的截留率为 0，意味着渗透物中该溶质浓度与原料液相同，膜对它没有分离作用。","o":["正确","错误"],"a":["T"],"exp":"截留率定义为原料液与渗透物中溶质浓度之差占原料液浓度的比例，数值越高截留越强；为 0 时渗透物浓度与原料液相同，说明溶质全部透过、膜对该溶质没有分离能力。中间数值表示部分截留。","ev":"截留率为0，则表示全部溶质透过膜，无分离作用。","keys":[],"ref":"第 382 页","hint":"","score":2},{"i":420,"n":421,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-019","t":"single","mode":"","bloom":"理解","diff":"medium","q":"非对称膜的分离性能主要或完全由哪一部分决定？","o":["多孔支撑层的厚度","膜两侧的压力差","很薄的致密皮层","支撑层的孔径分布"],"a":["C"],"exp":"非对称膜由极薄的致密皮层和多孔支撑层构成，起分离作用的是皮层，支撑层只提供强度；皮层很薄使传质阻力小，所以透过速率比对称膜高得多。压力差是操作推动力，支撑层的孔径不决定分离选择性。","ev":"非对称膜的分离主要或完全由很薄的皮层决定，传质阻力小，其透过速率较对称膜高得多","keys":[],"ref":"第 383 页","hint":"","score":2},{"i":421,"n":422,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-033","t":"single","mode":"","bloom":"理解","diff":"medium","q":"与一体化非对称膜相比，复合膜的突出优点是什么？","o":["皮层与支撑层必须采用同一种材料","可分别选用不同材料制备皮层与支撑层，使每层独立发挥最大作用","不需要多孔支撑层，机械强度更高","只能用于气体分离，不能用于水处理"],"a":["B"],"exp":"复合膜是在多孔支撑层上覆盖一层不同材料的致密皮层，因此可以把分离层和支撑层分别选材、分别优化，让每一层独立发挥最大作用。一体化非对称膜由同种材料制备，难以兼顾两层的要求；复合膜同样需要支撑层，也广泛用于反渗透等水处理过程。","ev":"对于复合膜，可优选不同的膜材料制备致密皮层与多孔支撑层， 使每一层独立地发挥最大作用。","keys":[],"ref":"第 383 页","hint":"","score":2},{"i":422,"n":423,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-multiple-006","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"评价反渗透膜性能的主要指标包括下列哪些？","o":["膜孔径分布","透过速率（透水率）","截留率（脱盐率）","抗压实性"],"a":["B","C","D"],"exp":"反渗透膜首先看透水率和脱盐率，高压操作又会使膜被压实、透水率下降，所以抗压实性也是重要指标，B、C、D 正确；反渗透膜的致密皮层几乎无孔，孔径分布不是评价它的主要参数，孔径和孔隙率主要用于表征微滤膜。","ev":"评价反渗透膜性能的主要参数为透过速率(透水率)与截留率(脱盐率)。此外,在高压下操作，压差对膜产生压实作用，造成透水率下降，因此抗压实性也是反渗透膜性能的一个重要指标。","keys":[],"ref":"第 384 页","hint":"","score":3},{"i":423,"n":424,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-006","t":"single","mode":"","bloom":"理解","diff":"medium","q":"反渗透膜能够截留大多数溶质（包括离子）而使溶剂通过，主要原因是什么？","o":["操作温度高，使盐分结晶析出而被挡住","膜孔带同种电荷，靠静电排斥挡住所有离子","致密皮层几乎无孔，溶剂和溶质在膜中的溶解、扩散速率差别大","膜孔径远大于水合离子，靠筛分截留离子"],"a":["C"],"exp":"反渗透膜的分离层是几乎无孔的致密皮层，溶剂和溶质在其中溶解、扩散的速率差别很大，溶剂优先透过；反渗透操作还要施加高于溶液渗透压的压差，溶剂才能反向透过。膜孔远大于离子就谈不上截留，静电排斥也不是反渗透膜的主要机理，升温更不会靠盐析出来截留。","ev":"反渗透膜的致密皮层几乎无孔，因此可以截留大多数溶质(包括离子)而使溶剂通过。","keys":[],"ref":"第 384 页","hint":"","score":2},{"i":424,"n":425,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"结构简单、安装操作方便、流动状态好但装填密度较小的膜组件是哪种？","o":["中空纤维膜组件","管式膜组件","板框式膜组件","螺旋卷式膜组件"],"a":["B"],"exp":"管式组件把膜做在支撑管内或外，管径较大，流动状态好、清洗方便，教材明确指出其装填密度较小；板框式组装简单、膜易更换，螺旋卷式结构紧凑，中空纤维装填密度最大，它们的结构特点或流动状态与题干不符。膜材料本身分高分子聚合物膜和无机膜两类，与膜组件的型式不是一回事。","ev":"管式膜组件的结构简单， 安装、操作方便，流动状态好,但装填密度较小","keys":[],"ref":"第 384 页","hint":"","score":2},{"i":425,"n":426,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-021","t":"single","mode":"","bloom":"理解","diff":"medium","q":"要使反渗透过程发生，在溶液侧施加的压差必须满足什么条件？","o":["等于溶液的渗透压","大于溶液的渗透压","小于溶液的渗透压","等于零"],"a":["B"],"exp":"渗透是纯溶剂自发向溶液侧流动，渗透压正是阻止这种流动所需的最小压差；只有在溶液侧施加比渗透压更大的压差，才能把溶剂从溶液侧压回纯溶剂侧，这就是反渗透。压差等于渗透压时系统处于渗透平衡，小于渗透压时仍发生正向渗透。","ev":"若在溶液侧施加一个大于渗透压的压差 Ap 时，则纯涂剂将从溶液侧回溶剂侧反加流动，此过程称为反渗透","keys":[],"ref":"第 384 页","hint":"","score":2},{"i":426,"n":427,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-032","t":"single","mode":"","bloom":"理解","diff":"medium","q":"装填密度最大、不需外加支撑材料，但膜易堵塞、清洗困难的膜组件是哪一种？","o":["板框式膜组件","螺旋卷式膜组件","管式膜组件","中空纤维膜组件"],"a":["D"],"exp":"中空纤维把膜做成很细的管状纤维，单位体积内可排布极大的膜面积，装填密度最大，纤维本身承压、不需另加支撑材料；代价是流道细，膜易堵塞且清洗困难。管式组件装填密度最小但流动状态好，板框式流动状态不良，螺旋卷式装填密度远不及中空纤维。","ev":"中空纤维膜组件装填密度极大，可达 10000一30000m2ym3s ，且不需外加支撑材料: 但膜易堵塞，清洗不容易。","keys":[],"ref":"第 384 页","hint":"","score":2},{"i":427,"n":428,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-012","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"把纯溶剂和溶液放在半透膜两侧，不施加外压时，溶剂会自发地从溶液侧流向纯溶剂侧，这种现象称为渗透。","o":["正确","错误"],"a":["F"],"exp":"不外加压力时，纯溶剂自发透过半透膜进入溶液侧，使溶液液位升高，这才叫渗透；反过来让溶剂从溶液侧回到纯溶剂侧必须施加比渗透压更大的压差，才是反渗透。题干把渗透的方向说反了。","ev":"纯溶剂将透过膜而自发地回洲液(或从低浓度溶液向高浓度溶液)一侧流动，这种现象称为渗透。","keys":[],"ref":"第 384 页","hint":"","score":2},{"i":428,"n":429,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-022","t":"single","mode":"","bloom":"理解","diff":"easy","q":"超滤与微滤的分离原理是什么？","o":["在压力差作用下按膜孔径大小进行筛分","靠电场作用使离子定向迁移","靠膜两侧水蒸气压差使水蒸气透过","靠溶质在膜中的溶解和扩散速率差异"],"a":["A"],"exp":"超滤和微滤都属于压力驱动的多孔膜过程，溶剂和小分子穿过膜孔、大于孔径的胶体和大分子被截留，本质是筛分；电场迁移是电渗析，蒸气压差是膜蒸馏，溶解-扩散则是反渗透和气体膜分离的机理。","ev":"超滤与微滤都是在压力差作用下根据膜孔径的大小进行筛分的分离过程","keys":[],"ref":"第 385 页","hint":"","score":2},{"i":429,"n":430,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-020","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"反渗透过程不发生相变、一般不需加热，虽然操作压力较高，仍被视为一种节能的分离技术。","o":["正确","错误"],"a":["T"],"exp":"反渗透靠压力差推动溶剂透过致密膜，过程中没有相变、一般不需加热，工艺简单、能耗低，因此被称为节能技术。操作压力高不等于能耗高，因为不需要像蒸发那样提供大量汽化潜热；这也是反渗透在海水淡化中广泛应用的原因。","ev":"反渗透是一种节能技术,过程中无相变，一般不需加热， 工艺过程简单，能耗低，操作和控制容易，应用范围广泛。","keys":[],"ref":"第 385 页","hint":"","score":2},{"i":430,"n":431,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-034","t":"single","mode":"","bloom":"理解","diff":"medium","q":"超滤溶液时，压差增大到一定程度后通量不再上升，此时对应的通量称为什么？","o":["临界通量","水通量","渗透通量","极限通量"],"a":["D"],"exp":"超滤纯水时通量与压差成正比，但超滤溶液时浓差极化和膜污染使边界层阻力随压差增大而增大，压差超过一定值后继续加压只增阻力、不增通量，这一上限就是极限通量。它说明靠提高压力无法无限提高生产能力，必须从减轻浓差极化和膜污染入手。","ev":"当压差达到一定值时，再提高压力，只是使边界层阻力增大，却不能增大通量，从而获得一极限通量","keys":[],"ref":"第 386 页","hint":"","score":2},{"i":431,"n":432,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-006","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"浓差极化抬高膜面处的渗透压，使溶剂在同样压差下更难透过膜，因此属于应当设法减轻的不利因素。","o":["正确","错误"],"a":["T"],"exp":"膜的选择透过性使被截留组分在膜面附近积累，形成浓度边界层，膜面渗透压随之升高，在相同压差下溶剂的透过速率降低，同时溶质更容易透过而使截留率下降。原题把浓差极化说成提高推动力的有利因素，与它使通量和截留率同时恶化的实际效果相反。","ev":"由此可见，浓差极化与膜污染均使膜透过速率下降，是操作过程的不利因素，应设法降低。","keys":[],"ref":"第 386 页","hint":"","score":2},{"i":432,"n":433,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-018","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"微滤膜的分离性能主要用截留分子量表示，与膜孔径和孔隙率无关。","o":["正确","错误"],"a":["F"],"exp":"截留分子量是超滤和纳滤常用的分离性能指标；微滤膜的表征参数主要是透过速率、膜孔径和孔隙率，其中膜孔径直接反映其截留能力。把超滤、纳滤的参数搬到微滤上，并否定孔径的作用，是常见的混淆。","ev":"表征微滤膜性能的参数主要是透过速率、膜孔径和孔隙率","keys":[],"ref":"第 386 页","hint":"","score":2},{"i":433,"n":434,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-008","t":"single","mode":"","bloom":"理解","diff":"medium","q":"气体在均质膜中靠溶解-扩散传递，渗透速率主要取决于什么？","o":["气体在膜表面的化学反应速率","气体的分子量和临界温度","膜两侧的电位差和电流密度","气体在膜中的溶解度和扩散系数"],"a":["D"],"exp":"均质膜没有明显的孔道，气体先溶解在膜上游表面，再在压差作用下扩散通过膜，最后在下游脱附，因此溶解度和扩散系数共同决定渗透快慢；电位差是电渗析的推动力，表面化学反应不是气体膜分离的控制因素。","ev":"在膜下游表面脱附，此时渗透速率主要取决于气体在膜中的溶解度和扩散系数。","keys":[],"ref":"第 387 页","hint":"","score":2},{"i":434,"n":435,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-023","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"评价气体分离膜性能的主要参数是哪两个？","o":["膜孔径和孔隙率","截留率和抗压实性","渗透系数和分离因数","透过速率和截留分子量"],"a":["C"],"exp":"渗透系数反映气体通过膜的难易，分离因数反映膜对不同组分的选择性，两者共同决定气体分离膜的性能；截留率和抗压实性主要评价反渗透膜，透过速率和截留分子量主要用于超滤膜，膜孔径和孔隙率用于微滤膜。","ev":"评价气体分离膜性能的主要参数是渗透系数和分离因数。","keys":[],"ref":"第 387 页","hint":"","score":2},{"i":435,"n":436,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-014","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"气体膜分离中，渗透速率快的组分在渗余侧富集。","o":["正确","错误"],"a":["F"],"exp":"气体膜分离靠各组分渗透速率的差异：渗透快的组分优先穿过膜，在渗透侧富集；渗透慢的组分留在膜的进料侧，即渗余侧富集。题干把两侧说反了，这是气体膜分离中最容易混淆的一处。","ev":"其中渗透快的组分在渗透侧富集，相应渗透慢的组分则在渗余侧富集","keys":[],"ref":"第 387 页","hint":"","score":2},{"i":436,"n":437,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-010","t":"single","mode":"","bloom":"分析","diff":"hard","q":"膜吸收采用疏水膜、膜孔被气体充满时，为把气液界面固定在膜的液相侧，两相压力应怎样控制？","o":["液相侧抽真空，气相侧保持常压","气相压力高于液相压力，以防止液体进入膜孔","液相压力高于气相压力，但压差不能大到使气体鼓泡或液体被压入膜孔","两相压力必须完全相等"],"a":["C"],"exp":"膜孔被气体充满时，只有液相压力高于气相压力，气液界面才会停在膜的液相侧；但压差过大会把液体压入膜孔或使气体在液体中鼓泡，所以要选合适压差。气相压力高于液相压力是膜孔被液体充满时的控制方式，两者不要混淆。","ev":"在这种情况下，液相的压力应高于气相的压力，选择合适的压差使气体不在液体中鼓泡，也不能把液体压入膜孔，而将气液界面固定在膜的液相侧。","keys":[],"ref":"第 388 页","hint":"","score":2},{"i":437,"n":438,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-single-009","t":"single","mode":"","bloom":"理解","diff":"medium","q":"膜蒸馏过程的推动力是什么？","o":["膜两侧的水蒸气压差，通常由两侧温度差实现","膜两侧的总压差，靠高压泵提供","膜两侧的电位差","膜两侧的溶质浓度差"],"a":["A"],"exp":"膜蒸馏用不被料液润湿的微孔疏水膜，液态水不能直接穿过膜孔，只有水蒸气在蒸气压差作用下从热侧扩散到冷侧并冷凝，所以它属于热推动膜过程；总压差推动的是反渗透等压力驱动过程，电位差则对应电渗析。","ev":"膜蒸馏过程的推动力是水蒸气压差,一般是通过膜两侧的温度差来实现， 所以膜蒸馏属于热推动膜过程。","keys":[],"ref":"第 389 页","hint":"","score":2},{"i":438,"n":439,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-truefalse-019","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"膜吸收中膜孔被液体充满时，应使液相压力高于气相压力，才能把气液界面固定在膜的气相侧。","o":["正确","错误"],"a":["F"],"exp":"膜孔被吸收剂充满时，界面必须停在膜的气相一侧，否则吸收剂会穿透膜流入气相，因此要让气相压力高于液相压力。题干的液相压力高于气相压力恰好说反。这与膜孔被气体充满的情形也不同：那时才要求液相压力高于气相压力，把界面固定在液相侧。","ev":"在这种情况下,气相的压力应高于液相的压力，以保证气液界面固定在膜的气相侧，防止吸收剂穿透膜而流向气相。","keys":[],"ref":"第 389 页","hint":"","score":2}]};</script>
