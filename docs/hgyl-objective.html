<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="tcMeta" content="#f3f1ec">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="化工原理 · 客观题专练">
<title>化工原理 · 客观题专练 · 复习题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b5a'/%3E%3Cpath d='M11 22V10h5a4 4 0 0 1 0 8h-5m5 0 4 4' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --sans: system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif: "Iowan Old Style","Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  --mono: ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;

  --paper:#f3f1ec;
  --surface:#fffefc;
  --surface2:#f7f4ee;
  --ink:#1b201e;
  --ink2:#49524f;
  --muted:#8a938f;
  --line:#e6e1d6;
  --line2:#d3ccbd;
  --accent:#1f6b5a;
  --accent-ink:#175246;
  --accent-soft:#e7f1ed;
  --ok:#187a55;
  --ok-soft:#e6f4ee;
  --bad:#b23a30;
  --bad-soft:#fbeae7;
  --shadow-sm:0 1px 2px rgba(27,32,30,.05);
  --shadow:0 1px 2px rgba(27,32,30,.04),0 14px 32px -20px rgba(27,32,30,.35);
  --r:16px;
  /* 可调字号：题干与选项、输入框跟随，正文其它元素保持不变 */
  --stem:18.5px;
  --body:15px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-fs="sm"]{--stem:16.5px;--body:13.8px}
html[data-fs="md"]{--stem:18.5px;--body:15px}
html[data-fs="lg"]{--stem:21px;--body:17px}
[data-theme="dark"]{
  --paper:#0f1214;
  --surface:#171b1e;
  --surface2:#1d2226;
  --ink:#e9edeb;
  --ink2:#b8c1be;
  --muted:#7d8885;
  --line:#272f33;
  --line2:#374247;
  --accent:#5ec0a5;
  --accent-ink:#8ad8c2;
  --accent-soft:#13302a;
  --ok:#57c496;
  --ok-soft:#122f29;
  --bad:#f08a7e;
  --bad-soft:#321a1a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
/* 横滑翻页不能被浏览器当成「后退」手势吃掉 */
html{overscroll-behavior-x:none}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb, var(--accent) 22%, transparent)}

/* ---------------------------------------------------------------- shell */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh;min-height:100dvh}

/* ---------------------------------------------------------------- side */
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  padding:26px 18px 20px;
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:22px;
  backdrop-filter:blur(8px);
}
.brand{display:flex;gap:12px;align-items:flex-start;padding:0 4px}
.mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 2px 8px -2px color-mix(in srgb, var(--accent) 55%, transparent);
}
.brand-t h1{
  margin:0;font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.45;
  letter-spacing:.01em;
}
.brand-t p{margin:3px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.02em}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-sm);
}
.ring{position:relative;width:72px;height:72px;flex:0 0 72px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--line2);opacity:.55}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring-t{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1;
}
.ring-t b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ring-t span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.ring-meta{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2)}
.ring-meta div{display:flex;align-items:center;gap:6px}
.ring-meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.mut{background:var(--line2)}

.filters{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.seg{
  display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;
}
.seg button{
  flex:1;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--ink2);
  transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{
  background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);
}
.seg.small button{padding:4px 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px}
.chips button{
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink2);
  background:var(--surface);transition:all .16s;
}
.chips button:hover{border-color:var(--line2);color:var(--ink)}
.chips button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;
}

.chapters{display:flex;flex-direction:column;gap:12px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.grp-t{
  font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  padding:0 8px 6px;text-transform:none;
}
.nav-item{
  width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:12.5px;color:var(--ink2);text-align:left;transition:background .15s,color .15s;
  border-left:2px solid transparent;
}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item[aria-current="true"]{
  background:var(--accent-soft);color:var(--accent-ink);font-weight:600;border-left-color:var(--accent);
}
.nav-item .cnt{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item[aria-current="true"] .cnt{color:var(--accent-ink);opacity:.75}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.side-foot button,.side-foot .hub-link{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
  font-size:12.5px;color:var(--ink2);text-align:left;transition:background .15s,color .15s;
}
.side-foot button:hover,.side-foot .hub-link:hover{background:var(--surface2);color:var(--ink)}
.side-foot svg{width:14px;height:14px;opacity:.7}
.side-foot .hub-link{margin-bottom:2px;color:var(--accent);font-weight:600}
.side-foot .hub-link:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}

/* ---------------------------------------------------------------- main */
.main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative}
.progress{position:sticky;top:0;height:2px;background:transparent;z-index:30}
.progress i{
  display:block;height:100%;width:0;background:var(--accent);
  transition:width .4s cubic-bezier(.2,.8,.2,1);
}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;min-width:0;white-space:nowrap}
.crumb span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:180px}
.crumb span:last-child{color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .sep{opacity:.45}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.timer{
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line);
}
.icon-btn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 15px;border-radius:9px;font-size:13px;font-weight:500;
  transition:all .16s;white-space:nowrap;
}
.btn.ghost{border:1px solid var(--line2);color:var(--ink2);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink2);color:var(--ink)}
.btn.primary{
  background:var(--accent);color:#fff;border:1px solid var(--accent);
  box-shadow:0 1px 2px color-mix(in srgb, var(--accent) 40%, transparent);
}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--accent);border-color:var(--accent)}
.only-mobile{display:none}

/* ---------------------------------------------------------------- stage */
.stage{
  flex:1;width:100%;max-width:860px;margin:0 auto;
  padding:38px 26px 28px;
}
.q{display:none;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
.q.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.num{
  font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;line-height:1;margin-right:2px;font-variant-numeric:tabular-nums;
}
.tag{
  font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.02em;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
}
.tag.t{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:500}
.tag.lv-easy{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%, transparent)}
.tag.lv-hard{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%, transparent)}
.mark-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--muted);padding:4px 8px;border-radius:7px;
  transition:all .15s;
}
.mark-btn:hover{background:var(--surface2);color:var(--ink2)}
.mark-btn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.mark-btn svg{width:13px;height:13px}

.stem{
  font-size:var(--stem);line-height:1.85;font-weight:500;letter-spacing:.005em;color:var(--ink);
  margin:0 0 26px;max-width:64ch;overflow-wrap:break-word;
}
.stem code,.ans code{
  font-family:var(--mono);font-size:.88em;background:var(--surface2);
  padding:1px 5px;border-radius:5px;border:1px solid var(--line);
}
.blank{display:inline-block;width:3.4em;border-bottom:1.5px solid var(--line2);vertical-align:-.12em;margin:0 .18em}
/* 上下标：题干、选项、解析里都可能出现化学式与指数 */
.stem sup,.opt .txt sup,.ans-row .v sup,.key-row sup,.sheet sup,.wrong-item .qt sup{font-size:.72em;line-height:0;vertical-align:super}
.stem sub,.opt .txt sub,.ans-row .v sub,.key-row sub,.sheet sub,.wrong-item .qt sub{font-size:.72em;line-height:0;vertical-align:sub}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);
  font-size:var(--body);line-height:1.65;
  transition:border-color .16s,background .16s,transform .16s,box-shadow .16s;
  box-shadow:var(--shadow-sm);
}
.opt:hover:not(.locked){border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.opt:active:not(.locked){transform:translateY(0) scale(.995);border-color:var(--accent)}
.opt .ltr{
  flex:0 0 24px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
  transition:all .16s;margin-top:1px;
}
.opt .txt{flex:1;min-width:0}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.locked{cursor:default}
.opt .flag{font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap;align-self:center}
.opt.is-ok .flag{color:var(--ok);font-weight:600}
.opt.is-bad .flag{color:var(--bad);font-weight:600}

/* text inputs */
.field{
  width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:var(--body);line-height:1.7;
  transition:border-color .16s,box-shadow .16s;resize:vertical;
}
/* 多行作答区按 rows 给初始高度；单行填空框保持一行高，别撑成大方块 */
textarea.field{min-height:calc(var(--rows,3) * 1.7em + 28px)}
.field::placeholder{color:var(--muted)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field[readonly]{background:var(--surface2);color:var(--ink2)}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0;display:flex;gap:6px;align-items:center}

/* actions under question */
.q-actions{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.q-actions .spacer{flex:1}
.self-grade{display:flex;gap:8px}
.self-grade button{
  padding:7px 14px;border-radius:9px;font-size:13px;border:1px solid var(--line2);
  color:var(--ink2);transition:all .16s;
}
.self-grade button:hover{border-color:var(--ink2);color:var(--ink)}
.self-grade button[data-self="yes"]:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.self-grade button[data-self="no"]:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

/* verdict + answer */
.verdict{
  display:none;align-items:center;gap:9px;margin-top:22px;
  font-size:14px;font-weight:600;
}
.q.graded .verdict{display:flex}
.verdict .ico{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;color:#fff;flex:0 0 20px;
}
.verdict.ok{color:var(--ok)}
.verdict.ok .ico{background:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict.bad .ico{background:var(--bad)}
.verdict.info{color:var(--ink2)}
.verdict.info .ico{background:var(--ink2)}
.verdict .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.verdict .redo{
  margin-left:auto;flex:0 0 auto;padding:4px 10px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
}
.verdict .redo:hover{border-color:var(--line2);color:var(--ink)}

.ans{display:none;margin-top:14px;padding:18px 20px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.q.graded .ans{display:block}
.ans-row{display:flex;gap:10px;font-size:13.5px;line-height:1.8;margin-bottom:8px}
.ans-row:last-child{margin-bottom:0}
.ans-row .k{
  flex:0 0 auto;min-width:46px;white-space:nowrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.06em;padding-top:2px;
}
.ans-row .v{flex:1;color:var(--ink);min-width:0}
.ans-row .v b{color:var(--accent-ink);font-weight:600}

/* 翻译题：输入框下的操作提示 */
.typeline{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.7}

/* 采分点：英文术语与中文释义分开排版，别挤成一串 */
.keys{margin:12px 0 10px;padding:11px 13px;border-radius:9px;background:var(--surface2)}
.keys-h{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}
.key-row{display:flex;gap:8px;align-items:baseline;line-height:2}
.key-row .ke{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);font-weight:600}
.key-row .kc{font-size:12.5px;color:var(--ink2)}
.key-row .kc::before{content:"·";margin-right:8px;color:var(--muted)}
/* 出处 */
.src{margin-top:10px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
blockquote.ev{
  margin:10px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--accent);
  font-size:12.5px;line-height:1.85;color:var(--ink2);
}
blockquote.ev::before{
  content:"原文依据";display:block;font-size:10px;letter-spacing:.12em;
  color:var(--muted);margin-bottom:2px;
}
.alt{display:block;margin-top:3px;color:var(--ink2);font-size:13px}
.alt i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

/* navbar */
.navbar{
  position:sticky;bottom:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 26px 30px;
  background:linear-gradient(to top, var(--paper) 62%, transparent);
}
.kbd-hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);white-space:nowrap;display:flex;gap:12px;align-items:center;
}
.kbd-hint kbd{
  font-family:var(--mono);font-size:10px;padding:0 4px;border:1px solid var(--line);
  border-radius:4px;background:var(--surface);color:var(--ink2);
}
@media (max-width:1100px){.kbd-hint{display:none}}
.pos{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.pos b{color:var(--ink);font-weight:600}

/* ---------------------------------------------------------------- result */
.result{display:none;flex:1;max-width:860px;width:100%;margin:0 auto;padding:44px 26px 60px}
.result.show{display:block;animation:rise .3s ease}
.res-head{display:flex;gap:34px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.big-ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.big-ring svg{transform:rotate(-90deg);display:block}
.big-ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big-ring .t b{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.big-ring .t span{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.res-title h2{margin:0 0 6px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.01em}
.res-title p{margin:0;color:var(--ink2);font-size:13.5px}
.res-title p.res-meta{margin-top:3px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.res-title p b.sc{font-family:var(--mono);font-size:19px;color:var(--accent-ink);font-weight:600;margin:0 1px}
.res-stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.res-stats div{font-size:12.5px;color:var(--muted)}
.res-stats b{display:block;font-size:21px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:1px}
.res-sec{margin-top:30px}
.res-sec h3{
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 12px;font-weight:600;
}
.bars{display:flex;flex-direction:column;gap:13px;max-width:640px}
/* 单元名长短悬殊（最长 60 字符），单行三段式必然截断，改成上下两行 */
.bar-row{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.bar-row .top{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.bar-row .lbl{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .frac{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 轨道用可见的浅色：surface2 与纸底几乎同色，0% 的行看上去会像没有轨道 */
.bar-row .track{display:block;width:100%;height:6px;border-radius:99px;background:color-mix(in srgb,var(--line2) 62%,transparent);overflow:hidden}
.bar-row .fill{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.wrong-list{display:flex;flex-direction:column;gap:8px}
.wrong-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;
  transition:border-color .16s,transform .16s;
}
.wrong-item:hover{border-color:var(--line2);transform:translateX(2px)}
.wrong-item .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:0 0 26px;padding-top:2px}
.wrong-item .qt{font-size:13.5px;line-height:1.6;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wrong-item .qt .tk{font-style:normal;font-size:10.5px;letter-spacing:.04em;color:var(--accent-ink);
  background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px}
.res-actions{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600}

.scrim{display:none}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:100;
  background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px 16px;border-radius:99px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------------------------------------------------------- 题号跳转 */
.pos-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:1px;
  min-width:66px;padding:7px 10px;border-radius:9px;border:1px solid transparent;
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,color .15s;
}
.pos-btn:hover{background:var(--surface2);border-color:var(--line);color:var(--ink2)}
.pos-btn b{color:var(--ink);font-weight:600;font-size:13px}
.pos-btn svg{width:13px;height:13px;flex:0 0 13px;opacity:.5;margin-right:5px}
.pos-btn:hover svg{opacity:.75}

.sheet-scrim{
  display:none;position:fixed;inset:0;z-index:70;
  background:rgba(12,14,13,.38);backdrop-filter:blur(2px);
}
.sheet-scrim.show{display:block;animation:fade .18s ease}
.sheet{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:75;
  max-height:76vh;max-height:76dvh;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  box-shadow:0 -14px 44px -14px rgba(0,0,0,.45);
  padding-bottom:var(--safe-b);
}
.sheet.show{display:flex;animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{
  display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line);
}
.sheet-h b{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.sheet-h .legend{margin-left:auto;display:flex;gap:11px;font-size:10.5px;color:var(--muted)}
.sheet-h .legend span{display:inline-flex;align-items:center;gap:4px}
.sheet-h .legend i{width:8px;height:8px;border-radius:2.5px;background:var(--line2)}
.sheet-h .legend i.ok{background:var(--ok)}
.sheet-h .legend i.bad{background:var(--bad)}
.sheet-tools{padding:11px 16px 0;display:flex;align-items:center}
.sheet-tools .seg{max-width:210px;width:100%}
.sheet-body{
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(20px + var(--safe-b));
}
.qgrid-grp{margin-bottom:15px}
.qgrid-grp:last-child{margin-bottom:0}
.qgrid-t{
  font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px 2px;
  display:flex;align-items:center;gap:8px;line-height:1.5;
}
.qgrid-t i{flex:1 1 12px;height:1px;background:var(--line);font-style:normal}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.qcell{
  position:relative;height:44px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  display:grid;place-items:center;transition:transform .12s,border-color .12s;
}
.qcell:active{transform:scale(.94)}
.qcell.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok);font-weight:600}
.qcell.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 42%,transparent);color:var(--bad);font-weight:600}
.qcell.pending{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.qcell.cur{outline:2px solid var(--accent);outline-offset:1px}
.qcell.marked::after{
  content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);
}
.qcell.cur.marked::after{background:var(--accent-ink)}

/* 翻页方向：左滑进入新题从右侧滑入，右滑返回从左侧 */
.stage[data-dir="l"] .q.active{animation:slideL .28s cubic-bezier(.2,.8,.2,1)}
.stage[data-dir="r"] .q.active{animation:slideR .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* 桌面端别让面板横贯整屏，收成居中浮层 */
@media (min-width:981px){
  .sheet{
    left:0;right:0;margin:0 auto;width:min(680px,92vw);
    bottom:28px;border:1px solid var(--line);border-radius:18px;
    padding-bottom:0;max-height:72vh;
  }
  .sheet-body{padding-bottom:18px}
  .sheet-scrim{background:rgba(12,14,13,.26)}
}

/* 超长英文单词（化学名）在窄屏会顶破容器 */
.stem,.opt .txt,.ans-row .v,blockquote.ev,.key-row,.wrong-item .qt{overflow-wrap:break-word}

/* ---------------------------------------------------------------- responsive */
@media (max-width:980px){
  /* 小屏上直接放大字号会溢出，按断点重算三档 */
  html[data-fs="sm"]{--stem:15.8px;--body:13.6px}
  html[data-fs="md"]{--stem:17.4px;--body:15.4px}
  html[data-fs="lg"]{--stem:20px;--body:17.4px}

  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;left:0;top:0;z-index:60;
    width:min(86vw,318px);height:100vh;height:100dvh;
    padding:calc(20px + var(--safe-t)) 16px calc(16px + var(--safe-b));
    transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    background:var(--surface);box-shadow:var(--shadow);
  }
  .side.open{transform:none}
  .scrim.show{
    display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.34);
    animation:fade .2s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .only-mobile{display:grid}

  .topbar{
    padding:calc(8px + var(--safe-t)) 14px 8px;gap:10px;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(14px) saturate(1.15);
  }
  .stage{padding:20px 16px calc(94px + var(--safe-b))}

  /* 底栏贴住视口底部：长页面滚动时始终可点，且不遮住正文末段 */
  .navbar{
    position:fixed;left:0;right:0;bottom:0;
    justify-content:space-between;gap:10px;
    padding:10px 14px calc(10px + var(--safe-b));
    background:color-mix(in srgb, var(--surface) 93%, transparent);
    backdrop-filter:blur(14px) saturate(1.15);
    border-top:1px solid var(--line);
    box-shadow:0 -10px 28px -22px rgba(0,0,0,.55);
  }
  .nav-prev{min-height:44px;padding:10px 16px;font-size:13.5px}
  .nav-next{min-height:44px;padding:10px 16px;font-size:13.5px;flex:1;max-width:200px}
  .pos-btn{min-height:44px;min-width:60px}

  /* 键盘弹出时收起底栏，别压在输入框上 */
  body.kbd .navbar{display:none}
  body.kbd .stage{padding-bottom:32px}
  .toast{bottom:calc(84px + var(--safe-b))}

  /* 抽屉整体滚动，章节列表别再套一层滚动区，否则手机上只剩三行可视 */
  .chapters{overflow:visible;flex:0 0 auto}
  .side-foot{margin-top:12px}
  .result{padding:26px 16px calc(48px + var(--safe-b))}
  .res-head{gap:20px}
}

@media (max-width:640px){
  #mode{display:none}
  .topbar{gap:8px}
  .crumb{font-size:11.5px}
  .crumb span:first-child,.crumb .sep{display:none}
  .timer{display:block;font-size:11px;padding:3px 7px}
  .btn{padding:8px 12px;font-size:13px;min-height:40px}
  .icon-btn{width:40px;height:40px}
  .icon-btn svg{width:18px;height:18px}

  .qhead{gap:7px;margin-bottom:16px}
  .num{font-size:22px}
  .tag{font-size:10.5px;padding:3px 7px}
  .mark-btn{padding:6px 4px}

  .stem{line-height:1.9;margin-bottom:18px}
  .opts{gap:10px}
  .opt{padding:14px;border-radius:13px;min-height:54px;flex-wrap:wrap}
  .opt .ltr{width:26px;height:26px;flex-basis:26px;margin-top:0}
  /* 判定标注换行到正文下方，避免把选项文字挤成窄条 */
  .opt .flag{flex:1 1 100%;margin:5px 0 0 38px;font-size:11px}
  .opt .flag:empty{display:none}

  .field{padding:13px 14px;font-size:max(16px, var(--body))}
  .q-actions{gap:8px;margin-top:16px}
  .q-actions .btn{flex:1;min-height:44px}
  .q-actions .hint{flex:1 1 100%;margin:0}
  .self-grade{display:flex;gap:8px;width:100%}
  .self-grade button{flex:1;min-height:46px;font-size:13.5px}

  .verdict{margin-top:18px;font-size:13.5px}
  .ans{padding:15px 14px;border-radius:13px;margin-top:12px}
  .ans-row{font-size:13px;gap:8px}
  .ans-row .k{min-width:42px;font-size:11px}
  .keys{padding:10px 12px}
  .key-row{line-height:1.9}
  blockquote.ev{font-size:12.5px;line-height:1.9;padding-left:12px}

  /* 结果页：环形缩小、数据两列、按钮整宽堆叠 */
  .res-head{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:26px}
  .big-ring{width:104px;height:104px;flex-basis:104px}
  .big-ring svg{width:104px;height:104px}
  .big-ring .t b{font-size:27px}
  .res-title h2{font-size:20px}
  .res-title p{font-size:12.5px;line-height:1.8}
  .res-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;width:100%;margin-top:14px}
  .res-stats b{font-size:19px}
  .res-actions{flex-direction:column;gap:8px;margin-top:24px}
  .res-actions .btn{width:100%;min-height:46px}
  .wrong-item{padding:11px 12px}
  .wrong-item .qt{-webkit-line-clamp:3}
  .bar-row .lbl{white-space:normal;line-height:1.5}
}

@media (max-width:400px){
  .topbar{padding-left:10px;padding-right:10px;gap:6px}
  .crumb{max-width:96px}
  .num{font-size:20px}
  .qgrid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
  .qcell{height:42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---------------------------------------------------------------- print */
@media print{
  body{background:#fff}
  .side,.topbar,.navbar,.scrim,.toast,.progress,.q-actions,.mark-btn,
  .sheet,.sheet-scrim,.pos-btn{display:none!important}
  .app{display:block}
  .stage{max-width:none;padding:0}
  .q{display:block!important;page-break-inside:avoid;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid #ddd}
  .ans,.verdict{display:block!important}
  .opt{box-shadow:none;break-inside:avoid}
  .result{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">Q</div>
      <div class="brand-t">
        <h1>化工原理 · 客观题专练</h1>
        <p>解析器 教材 OCR 全文 + 逐字回查 · 439 题</p>
      </div>
    </div>

    <div class="panel">
      <div class="ring">
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="track" cx="36" cy="36" r="30" fill="none" stroke-width="5"/>
          <circle class="bar" id="ringBar" cx="36" cy="36" r="30" fill="none" stroke-width="5"
                  stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="ring-t"><b id="ringNum">0</b><span id="ringAll">/ 0</span></div>
      </div>
      <div class="ring-meta">
        <div><span class="dot ok"></span><b id="okNum">0</b> 答对</div>
        <div><span class="dot bad"></span><b id="badNum">0</b> 答错</div>
        <div><span class="dot mut"></span><b id="leftNum">0</b> 未做</div>
      </div>
    </div>

    <div class="filters">
      <div class="flabel">范围</div>
      <div class="seg" id="scope">
        <button data-scope="all" aria-pressed="true">全部</button>
        <button data-scope="todo" aria-pressed="false">未做</button>
        <button data-scope="wrong" aria-pressed="false">错题</button>
        <button data-scope="marked" aria-pressed="false">标记</button>
      </div>
      <div class="flabel" style="margin-top:6px">题型</div>
      <div class="chips" id="types"></div>
      <div class="flabel" style="margin-top:10px">模式</div>
      <div class="seg small" id="mode2">
        <button data-mode="practice">练习</button>
        <button data-mode="exam">考试</button>
      </div>
      <div class="flabel" style="margin-top:10px">正文字号</div>
      <div class="seg small" id="fsSeg">
        <button data-fs-btn="sm">小</button>
        <button data-fs-btn="md">标准</button>
        <button data-fs-btn="lg">大</button>
      </div>
    </div>

    <nav class="chapters" id="chapters" aria-label="章节导航"></nav>

    <div class="side-foot">
      <a class="hub-link" href="hgyl.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回课程</a>
      <button id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
        打印 / 存为 PDF
      </button>
      <button id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        清空答题记录
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="progress"><i id="progBar"></i></div>
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="打开目录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="crumb">
        <span id="crumbCh">—</span><span class="sep">/</span><span id="crumbSec">—</span>
      </div>
      <div class="top-right">
        <div class="timer" id="timer">00:00</div>
        <div class="seg small" id="mode">
          <button data-mode="practice">练习</button>
          <button data-mode="exam">考试</button>
        </div>
        <button class="btn ghost" id="submitBtn">交卷</button>
        <button class="icon-btn" id="themeBtn" aria-label="切换深浅色"></button>
      </div>
    </header>

    <div class="stage" id="stage"></div>

    <div class="result" id="result"></div>

    <footer class="navbar" id="navbar">
      <button class="btn ghost nav-prev" id="prevBtn" disabled>上一题</button>
      <button class="pos-btn" id="posBtn" aria-label="打开题目列表，快速跳转" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
        </svg>
        <b id="posNow">1</b><span>/</span><span id="posAll">0</span>
      </button>
      <button class="btn primary nav-next" id="nextBtn">下一题</button>
      <div class="kbd-hint">
        <span><kbd>1</kbd>–<kbd>4</kbd> 选择</span>
        <span><kbd>←</kbd><kbd>→</kbd> 翻页</span>
        <span><kbd>M</kbd> 标记</span>
        <span><kbd>T</kbd> 主题</span>
      </div>
    </footer>
  </main>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="题目列表">
  <header class="sheet-h">
    <b>题目列表</b>
    <div class="legend">
      <span><i class="ok"></i>对</span>
      <span><i class="bad"></i>错</span>
      <span><i></i>未做</span>
    </div>
    <button class="icon-btn" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="sheet-tools">
    <div class="seg small" id="sheetScope">
      <button data-sheet-scope="unit" aria-pressed="true">按单元</button>
      <button data-sheet-scope="type" aria-pressed="false">按题型</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>

<script>window.__QUIZ__ = {"meta":{"id":"化工原理客观题专练","title":"化工原理 · 客观题专练","engine":"教材 OCR 全文 + 逐字回查","source":"《化工原理》（第四版），杨祖荣主编，刘丽英、刘伟副主编，化学工业出版社，2021","generated":"","chunks":9,"accepted":439,"rejected":[],"mock":false},"questions":[{"i":0,"n":1,"ch":"绪论","sec":"绪论","code":"","id":"ch00-single-001","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"化工产品的生产过程再复杂，归纳起来都由哪三个基本环节组成？","o":["原料预处理、化学反应、反应产物后处理","原料运输、反应器设计、产品包装","物料衡算、热量衡算、经济核算","分离、提纯、干燥"],"a":["A"],"exp":"教材开篇把种类繁多的化工生产归纳为三步：反应前要对原料进行预处理，避免催化剂中毒；然后是化学反应；反应后还要把未反应的原料与副产物分离，得到合格产品。B、D 只是其中某个环节的具体操作，C 是分析问题的工具而不是生产环节。","ev":"均可视为由原料预处理过程、化学反应过程和反应产物后处理 3 个基本环节组成。","keys":[],"ref":"第 1 页","hint":"","score":2},{"i":1,"n":2,"ch":"绪论","sec":"绪论","code":"","id":"ch00-single-002","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"工程上把流体输送、沉降、过滤、换热、蒸馏等具有共性的基本操作称为什么？","o":["反应工程","传递过程","单元操作","化工过程"],"a":["C"],"exp":"教材先指出一种产品的生产往往包含几十个物理加工过程，再按操作原理和特点把这些有共性的操作归纳起来，统一命名为单元操作。单元操作既讲过程原理，也讲实现它的设备，是全书的主线。","ev":"工程上将这些具有共性的基本操作称为单元操作(unit operation)。","keys":[],"ref":"第 1 页","hint":"","score":2},{"i":2,"n":3,"ch":"绪论","sec":"绪论","code":"","id":"ch00-multiple-001","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"教材指出，分析单元操作问题时贯穿全课程的「四个基本概念和一个观点」包括哪些？","o":["物料衡算","能量衡算","过程平衡与过程速率","经济核算的观点"],"a":["A","B","C","D"],"exp":"教材列出的是物料衡算、能量衡算、过程平衡、速率四个概念，再加一个经济核算的观点。四者分别解决「量守恒」「能守恒」「过程往哪走、走到哪为止」「过程走多快」的问题，经济核算则用于在可行方案中选最省的那个。","ev":"经常会用到下列 4 个基本概念和一个观点，即物料衡算、能量衡算、过程平衡和速率这 4 个基本概念和建立一个经济核算的观点","keys":[],"ref":"第 3 页","hint":"","score":3},{"i":3,"n":4,"ch":"绪论","sec":"绪论","code":"","id":"ch00-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"按教材的归纳，蒸发、蒸馏、吸收这些单元操作分别属于哪一类传递过程？","o":["蒸发属传质过程，蒸馏与吸收属传热过程","蒸发属传热过程，蒸馏与吸收属传质过程","三者都属于传质过程","三者都属于传热过程"],"a":["B"],"exp":"教材按理论基础把单元操作分成四类：蒸发靠加热汽化使溶液浓缩，理论基础是热量传递；蒸馏靠组分挥发度差异、吸收靠溶解度差异，理论基础都是质量传递。混淆点在于蒸发也涉及汽化，但它的目的是浓缩而不是分离组分。","ev":"传热过程 ”包括换热、蒸发等单元操作;","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":4,"n":5,"ch":"绪论","sec":"绪论","code":"","id":"ch00-single-004","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"教材把化工原理课程的任务具体化为四个方面，下列哪一项不属于这四项要求？","o":["根据工艺要求与物料特性合理选择单元操作及设备","根据选定的单元操作进行工艺计算和设备设计","熟悉操作原理、操作方法与调节参数，能处理常见故障","独立承担整个化工厂的总体设计与经济核算"],"a":["D"],"exp":"教材列出的四项要求是选型、设计计算、操作、开发创新，都围绕单元操作与设备本身。化工厂总体设计与全厂经济核算超出本课程范围，属于后续设计类课程的内容。","ev":"化工原理的任务是培养学生运用本学科基础理论及技能(如电算技能等)分析和解决化工","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":5,"n":6,"ch":"绪论","sec":"绪论","code":"","id":"ch00-single-005","t":"single","mode":"","bloom":"理解","diff":"medium","q":"按单元操作的理论基础划分，下列哪一组都属于流体动力过程（动量传递）？","o":["换热、蒸发","蒸馏、吸收","流体流动与输送、非均相物系分离","干燥、结晶"],"a":["C"],"exp":"流体动力过程以动量传递为理论基础，教材列出流体流动与输送、非均相物系分离等；换热与蒸发属于传热过程，蒸馏与吸收属于传质过程，干燥与结晶属于热、质同时传递过程，其余三组都混入了别的传递类别。","ev":"流体动力过程 ”包括流体流动与输送、非均相物系分离等单元操作，","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":6,"n":7,"ch":"绪论","sec":"绪论","code":"","id":"ch00-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"做物料衡算时，物料量一般用体积表示，因为气体体积便于测量。","o":["正确","错误"],"a":["F"],"exp":"教材特意提醒一般不用体积表示，因为体积会随温度和压强改变，衡算结果跟着漂。物料量应当用质量或物质的量表示，并把单位统一；只有在对温度压力都固定的系统里，体积才勉强可用。","ev":"物料量可用质量或物质的量表示，但一般不用体积表示。","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":7,"n":8,"ch":"绪论","sec":"绪论","code":"","id":"ch00-single-006","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"化工原理课程中讨论的能量衡算主要包括哪两类？","o":["物料衡算与热量衡算","机械能衡算与热能衡算","动能衡算与势能衡算","化学能衡算与电能衡算"],"a":["B"],"exp":"能量衡算以能量守恒为基础，课程重点讨论机械能衡算和热能衡算：机械能衡算在流体流动部分介绍，热量衡算放在传热、蒸馏和固体干燥等章；物料衡算属于质量守恒，不是能量衡算的一类。","ev":"本教材中讨论的能量衔算主要为机械能和热能衡算。","keys":[],"ref":"第 4 页","hint":"","score":2},{"i":8,"n":9,"ch":"绪论","sec":"绪论","code":"","id":"ch00-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"物系的平衡关系可以用来判断过程能否进行、进行的方向以及能够达到的极限。","o":["正确","错误"],"a":["T"],"exp":"平衡是过程推进的终点：两相温度相等时不再有净热量传递，气液达到平衡时不再有净质量传递。所以平衡关系既给出方向（从偏离平衡的一侧指向平衡），也给出极限（最多能走到平衡为止），判断依据就是实际状态与平衡状态的差距。","ev":"物系的平衡关系是指物系的传热或传质过程进行的方向和能达到的极限。","keys":[],"ref":"第 4 页","hint":"","score":2},{"i":9,"n":10,"ch":"绪论","sec":"绪论","code":"","id":"ch00-truefalse-002","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"传热过程的推动力是温度差，传质过程的推动力是实际浓度与平衡浓度之差。","o":["正确","错误"],"a":["T"],"exp":"教材把推动力定义为过程在某一瞬间距平衡状态的差值：传热看温差，传质看浓度偏离平衡的程度。推动力越大速率越快，这也是后面传热与传质计算共同的基本思路。","ev":"如传热推动力为温度差，传质推动力为实际浓度与平衡浓度之差。","keys":[],"ref":"第 4 页","hint":"","score":2},{"i":10,"n":11,"ch":"绪论","sec":"绪论","code":"","id":"ch00-truefalse-004","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"过程传递速率只取决于推动力，与过程阻力无关。","o":["正确","错误"],"a":["F"],"exp":"教材给出的关系是速率等于推动力除以阻力，两者共同决定快慢：提高推动力或减小阻力都能加快过程。阻力由过程机理、操作条件和物性决定，忽视阻力就无法解释为什么同样的温差下换热量会差很多。","ev":"显然提高推动力和减少过程阻力均可提高过程传递速率，但各有什么","keys":[],"ref":"第 4 页","hint":"","score":2},{"i":11,"n":12,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"连续介质假定在下列哪种情况下不再成立？","o":["高真空稀薄气体","高压下的液体","常温常压下的气体","管内作湍流流动的液体"],"a":["A"],"exp":"连续介质假定把流体看成由无数微小质团组成的连续体，要求质团尺寸远大于分子自由程。高真空稀薄气体中分子平均自由程可与设备尺寸相比，连续性被破坏，假定失效；其余三种情况分子密集，连续介质假定仍然适用。","ev":"应予以指出，连续介质假定对大多数工程情况是适用的，但在高真空稀薄气体的情况下，该假定不再成立。","keys":[],"ref":"第 6 页","hint":"","score":2},{"i":12,"n":13,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-single-014","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"关于质量力，下列说法正确的是哪一项？","o":["质量力只作用在流体表面上，与表面积成正比","质量力作用在每个质点上，大小与流体质量成正比，又称体积力","质量力就是流体对器壁的压力","质量力只在静止流体中存在"],"a":["B"],"exp":"质量力作用于流体每个质点，大小与质量成正比；对均匀流体也与体积成正比，故又称体积力，重力和离心力都是典型的质量力。只作用于表面、与表面积成正比的是表面力，压力属于表面力，其余选项都混淆了这两类力。","ev":"质量力(body foree)是作用于流体每个质点上的力，其大小与流体的质量成正比。对于均匀质量的流体，该力也与流体的体积成正比，故又称为体积力。","keys":[],"ref":"第 7 页","hint":"","score":2},{"i":13,"n":14,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-single-015","t":"single","mode":"","bloom":"理解","diff":"medium","q":"关于液体密度随压力和温度的变化，下列说法正确的是哪一项？","o":["液体密度随压力升高明显增大，与温度无关","液体密度随温度升高明显增大，与压力无关","液体可视为不可压缩流体，密度基本不随压力变化，但随温度变化","液体密度随温度和压力都剧烈变化，不能视为不可压缩流体"],"a":["C"],"exp":"液体分子排列紧密，压力变化对体积影响很小，工程上视为不可压缩流体，密度基本不随压力改变；但升温使体积膨胀，密度随温度升高而减小。其余选项要么夸大了压力的影响，要么把温度影响说反或完全忽略。","ev":"液体可视为不可压缩性流体，其密度基本上不随压力变化(极高压力除外)，但随温度变化。","keys":[],"ref":"第 7 页","hint":"","score":2},{"i":14,"n":15,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-truefalse-020","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"气体虽然属于可压缩性流体，但当压力变化率不大时，工程上仍可按不可压缩流体处理。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。气体密度随压力变化明显，可压缩性是它的固有属性；不过当两截面间的压力变化率不大时，密度变化很小，按不可压缩流体处理带来的偏差可以接受，伯努利方程等关系仍可近似使用。原来的错误说法把可压缩性绝对化，忽略了压力变化幅度这一前提条件。","ev":"但如果压力的变化率不大，该气体也可当作不可压缩性流体处理","keys":[],"ref":"第 7 页","hint":"","score":2},{"i":15,"n":16,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-single-001","t":"single","mode":"","bloom":"理解","diff":"easy","q":"关于流体黏度随温度的变化规律，下列说法正确的是哪一项？","o":["液体和气体的黏度都随温度升高而增大","液体和气体的黏度都随温度升高而降低","液体的黏度随温度升高而降低，气体的黏度随温度升高而增大","液体的黏度随温度升高而增大，气体的黏度随温度升高而减小"],"a":["C"],"exp":"液体分子间距小，升温使分子间引力减弱，故液体黏度下降；气体分子热运动随升温加剧，动量交换增强，故气体黏度上升。B 把两者的变化方向都弄反，C、D 则把它们当成同一种变化趋势，均不符合流体黏度的实际规律。","ev":"黏度也是流体的物性之一，其值由实验测定。流体的黏度不仅与流体的种类有关，还与温度、压力有关。液体的黏度随温度的升高而降低，压力对其影响可忽略不计; 气体的黏度随温度的升高而增大， 一般情况下也可忽略压力的影响,但在极高或极低的压力条件下需考虑其影响。","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":16,"n":17,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-single-033","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"运动黏度的单位是下列哪一项？","o":["m²/s","Pa·s","kg·m⁻³","N·m⁻²"],"a":["A"],"exp":"运动黏度是流体的黏度与密度之比，即 ν=μ/ρ，量纲为长度平方除以时间，单位是 m²/s。Pa·s 是动力黏度的单位，kg·m⁻³ 是密度单位，N·m⁻² 是压力单位，三者都不能表示运动黏度。","ev":"其单位为 m2/s。显然，运动黏度也是流体的物理性质","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":17,"n":18,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"牛顿黏性定律所描述的剪应力与法向速度梯度成正比的关系，只在流体分层流动的层流情形下成立。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。牛顿黏性定律的推导前提是流体一层一层平行向前，层间动量交换只靠分子黏性，所以只对层流成立；进入高度湍流后，质点脉动带来的动量传递占主导，剪应力必须借助湍流黏度另行表达。原来的错误说法把适用条件扩大到湍流主体，混淆了分子黏性与涡流黏性两种机理。","ev":"应当指出，牛顿黏性定律适用于流体分层流动的情形(称为层流，见 1.4)。","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":18,"n":19,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-truefalse-008","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"理想流体是自然界中真实存在的流体，黏度很小的水和空气就是理想流体。","o":["正确","错误"],"a":["F"],"exp":"理想流体是黏度为零的假想流体，实际流体都具有黏性，自然界中并不存在理想流体。把水、空气等黏度较小的流体在黏性影响可忽略时按理想流体处理，只是一种简化方法，不能说它们本身就是理想流体。","ev":"黏度为零的流体称为理想流体，而真实的流体都具有黏性，称为实际流体或黏性流体。","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":19,"n":20,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-002","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"静止流体中同一点处不同方向上的静压力在数值上有什么关系？","o":["竖直方向最大，水平方向最小","数值均相等，静压力各向同性","随作用面方位不同而各不相同","只在与器壁垂直的方向上相等"],"a":["B"],"exp":"静止流体内部同一点处，无论作用面取什么方位，静压力大小都相同，这一性质称为静压力各向同性；压力方向始终垂直于作用面并指向作用面。A 把压力大小与方位挂钩，C 认为随方位不同而不同，D 把各向同性误解为只对器壁成立，都不正确。","ev":"静压力与其作用面在空间的方位无关，只与该点位置有关，即作用于任意点处不同方向上的压力在数值上均相同，静压力各向同性。","keys":[],"ref":"第 11 页","hint":"","score":2},{"i":20,"n":21,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-018","t":"single","mode":"","bloom":"理解","diff":"medium","q":"流体静力学基本方程适用于下列哪类流体？","o":["重力场中静止、连续的同种可压缩流体，无需任何近似","重力场中静止、连续的同种不可压缩流体，气体压力变化不大时可近似适用","任何作定态流动的流体","只适用于静止的气体，不适用于液体"],"a":["B"],"exp":"该方程由静止流体微元受力平衡导出，前提是重力场中静止、连续的同种流体且密度为常数，液体最符合这一条件。气体密度随压力变化，只有压力变化不大、可按平均密度处理时才能近似应用；方程不涉及流动，也不能说只适用于气体。","ev":"应当指出，基力学基本方程适用于在重力场中静止、连续的同种不可压缩流体","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":21,"n":22,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-truefalse-009","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"静止流体中位置越高，流体的位能越大、静压能越小，二者之和保持不变。","o":["正确","错误"],"a":["T"],"exp":"静力学基本方程的能量形式表明，静止流体中位能与静压能之和即总势能为常数。位置升高时位能增大，静压能相应减小；位置降低时则相反。该说法正确描述了二者的转换关系，而不是把二者都说成随位置升高而增大。","ev":"在同一静止流体中，处在不同位置流体的位能和静压能各不相同 但二者之和即总势能保持不变。","keys":[],"ref":"第 12 页","hint":"","score":2},{"i":22,"n":23,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-truefalse-021","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"按静力学基本方程算出液封管插入深度后，实际安装时应比计算值略小一些，设备超压时气体才能顺利排出。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。液封的作用是设备内表压超过规定值时让气体从水封管排出，若插入过深，排气阻力增大、泄压不及时；因此实际插入深度取比计算值略小，正好保证达到规定压力即开始排气。原来的错误说法为了所谓密封可靠而取略大值，恰好破坏了安全泄压功能。","ev":"为安全起见，实际安装时管子插入水面下的深度应比计算值略小些。","keys":[],"ref":"第 15 页","hint":"","score":2},{"i":23,"n":24,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-016","t":"single","mode":"","bloom":"理解","diff":"medium","q":"判断流体流动是否为定态流动，依据是什么？","o":["流体是否在圆管内流动","各截面上的物理量是否随位置变化","流体的黏度是否随温度变化","各截面上的物理量是否随时间变化"],"a":["D"],"exp":"定态流动指各截面上的温度、压力、流速等物理量只随位置变化，不随时间变化；若这些量既随位置又随时间变化，则为非定态流动。位置变化是流动本身的分布问题，不能作为判据；黏度是否随温度变化也与定态与否无关。","ev":"若各截面上的温度、压力、流速等物理量仅随位置变化，而不随时间变化，则此种流动称为定态流动","keys":[],"ref":"第 16 页","hint":"","score":2},{"i":24,"n":25,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-034","t":"single","mode":"","bloom":"理解","diff":"medium","q":"工程计算中，平均流速是如何定义的？","o":["单位时间内流体质点流过的距离","流体的体积流量与管截面积之比","流体的质量流量与管截面积之比","管中心处的最大流速"],"a":["B"],"exp":"平均流速用体积流量除以管截面积得到，它把截面上不均匀的速度分布折算成一个代表值，便于连续性方程和流量计算。单位时间流过的距离是点速度的定义，质量流量除以截面积得到的是质量流速，管中心最大流速只是速度分布中的峰值。","ev":"定义平均流速为流体的体积流量与管截面积之比","keys":[],"ref":"第 16 页","hint":"","score":2},{"i":25,"n":26,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"不可压缩性流体在圆形管道中定态流动时，任意截面的流速与管内径呈什么关系？","o":["与管内径无关","与管内径成反比","与管内径的平方成正比","与管内径的平方成反比"],"a":["D"],"exp":"由连续性方程，不可压缩流体体积流量不变，流速与流通截面积成反比；圆管截面积与内径平方成正比，所以流速与内径平方成反比。A 漏掉了平方关系，B 把反比说成正比，D 忽略了管径变化对流速的影响。","ev":"即不可压缩性流体在圆形管道中任意截面的流速与管内径的平方成反比。","keys":[],"ref":"第 17 页","hint":"","score":2},{"i":26,"n":27,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-truefalse-002","t":"truefalse","mode":"","bloom":"应用","diff":"medium","q":"不可压缩流体在圆形管道中定态流动时，若管径缩小到原来的一半，截面上的流速将增大到原来的四倍。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。定态流动下不可压缩流体的体积流量守恒，流速与流通截面积成反比；圆管截面积正比于内径的平方，管径减半后截面积只剩四分之一，流速必然是原来的四倍。原来的错误说法把流速与管径当成正比关系，才会得出管径减半、流速也减半的结论。","ev":"式(1-20c)表明不可压缩性流体流经各截面时的体积流量也不变，流速 x 与管截面积成反比，截面积越小，流速越大;反之亦然。","keys":[],"ref":"第 17 页","hint":"","score":2},{"i":27,"n":28,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-004","t":"single","mode":"","bloom":"理解","diff":"medium","q":"引入能量损失和外加功后的伯努利方程式，适用于下列哪类流体？","o":["不可压缩实际流体","任何压力变化下的可压缩气体","只能用于理想流体","只能用于静止流体"],"a":["A"],"exp":"实际流体伯努利方程是在理想流体机械能衡算的基础上，扣除黏性造成的能量损失并计入输送机械的外加功得到的，因此适用于不可压缩实际流体。可压缩气体只有在两截面绝对压力变化率小于 20% 时才可近似按不可压缩处理，故 A 错；B 忽略了方程已包含损失项，C 把运动方程误当成静力学方程。","ev":"式(1-23)、式(1-23a)为不可压缩实际流体的机械能衔算式，是理想流体伯努利方程的引申，习惯上也称为伯努利方程式。","keys":[],"ref":"第 19 页","hint":"","score":2},{"i":28,"n":29,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-multiple-001","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"关于伯努利方程所反映的能量关系，下列说法正确的有哪些？","o":["理想流体在流动过程中总机械能沿程保持不变","位能、动能和静压能之间可以相互转换","实际流体因黏性产生能量损失，方程中需计入压头损失","流体静止时伯努利方程不再成立"],"a":["A","B","C"],"exp":"理想流体无黏性、无外加功时，各截面总机械能相等，但这三种能量可以互相转换，例如管径变大处动能减小、静压能增大。实际流体有黏性，必须计入能量损失，有输送机械时还要加外加功。流体静止时流速为零、无损失，伯努利方程退化为静力学基本方程，因此 D 错误。","ev":"但各截面上每种形式的能量并不一定相等，它们之间可以相互转换。","keys":[],"ref":"第 20 页","hint":"","score":3},{"i":29,"n":30,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-single-035","t":"single","mode":"","bloom":"理解","diff":"medium","q":"伯努利方程与流体静力学基本方程之间是什么关系？","o":["两者互相独立，没有任何联系","静力学基本方程是伯努利方程在湍流时的特例","伯努利方程在流体静止时退化为静力学基本方程","伯努利方程只适用于静止流体"],"a":["C"],"exp":"伯努利方程是流动流体的机械能衡算式，当流速为零、没有能量损失和外加功时，方程中动能项和损失项消失，留下的位能与静压能关系正是流体静力学基本方程。因此静止状态只是流动状态的特殊情形，不能说两者无关，也不能把适用对象说反。","ev":"由此可见，伯努利方程除表示流体的运动规律外，还表示流体静止状态的规律","keys":[],"ref":"第 20 页","hint":"","score":2},{"i":30,"n":31,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-017","t":"single","mode":"","bloom":"应用","diff":"medium","q":"应用伯努利方程时，关于基准水平面的选取，下列说法正确的是哪一项？","o":["基准水平面可以任意选取，但必须与地面平行，宜选两截面中较低者","基准水平面必须选在两截面中较高者所在的高度","基准水平面必须通过管中心线且与地面垂直","基准水平面一旦选定就不能改变计算结果"],"a":["A"],"exp":"伯努利方程中真正起作用的是两截面的位能差，所以基准面可任意选取，只要求与地面平行；为计算方便，通常取较低截面所在水平面。基准面取法不同只改变各位能项的数值，不会改变两截面间的位能差，故其余选项错误。","ev":"选取基准水平面的目的是为了确定流体位能的大小，实际上在伯努利方程中所反映的是两截面的位能差","keys":[],"ref":"第 21 页","hint":"","score":2},{"i":31,"n":32,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-multiple-009","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于雷诺实验观察到的现象和流动型态，下列说法正确的有哪些？","o":["流速较小时，有色液体沿轴线呈一条轮廓清晰的细直线，不与周围水混合","流速增大后，有色细流出现波动，但轮廓仍清晰","流速进一步增大，有色细流断裂散开并迅速与水混合","只要进入过渡区，流动就一定是层流"],"a":["A","B","C"],"exp":"雷诺实验依次呈现三种现象：低速时有色液成清晰细直线，对应层流；流速增大后细流波动但仍不混合；流速再增大则细流断裂散开，管内颜色均匀，对应湍流。过渡区只是流型不稳定的区域，可能出现层流也可能出现湍流，并非一定是层流。","ev":"流速较小时，有色液体在管内沿着轴线方向成一条轮廓清晰的细直线，平稳地流过整个玻璃管，完全不和玻璃管内低速度水相混合","keys":[],"ref":"第 24 页","hint":"","score":3},{"i":32,"n":33,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-005","t":"single","mode":"","bloom":"理解","diff":"easy","q":"雷诺数的物理意义是什么？","o":["压力与重力的比值","动能与静压能的比值","惯性力与黏性力的比值","黏性力与惯性力的比值"],"a":["C"],"exp":"雷诺数由流速、管径、密度和黏度组成，其中密度与流速体现惯性效应、黏度体现黏性效应，故 Re 表示惯性力与黏性力的对比，Re 越大流动越湍动。B 把分子分母颠倒，C、D 把 Re 误认为其他力或能量的比值。","ev":"雷诺数有明确的物理意义，它表示流体流动中惯性力与黏性力的对比关系","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":33,"n":34,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"雷诺数体现惯性力与黏性力的对比，其值越大意味着惯性作用相对越强，流动的湍动程度越高。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。雷诺数由惯性力与黏性力的比值构成，数值增大说明黏性抑制扰动的能力相对变弱、惯性作用相对增强，流体因此更容易失去稳定而湍动，故 Re 越大湍动越剧烈，通常对应湍流区。原来的错误说法把两种力的主次关系颠倒，误以为 Re 越大黏性力越占优势、流动越接近层流。","ev":"雷诺数有明确的物理意义，它表示流体流动中惯性力与黏性力的对比关系","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":34,"n":35,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-truefalse-010","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"过渡区是介于层流与湍流之间的第三种流动型态。","o":["正确","错误"],"a":["F"],"exp":"按雷诺数可划分层流区、过渡区和湍流区三个区域，但流动型态只有层流和湍流两种。过渡区只是流型不稳定的区域，可能保持层流，也可能因扰动提前变为湍流，它并不代表一种独立的流型。","ev":"必须指出，根据 Re 数的大小将流动分为 3 个区域: 层流区、过渡区、湍流区，但流动类型只有两种: 层流与消流。","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":35,"n":36,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-truefalse-004","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"流体在圆管内流动时，无论层流还是湍流，管壁处流速均为零，管中心处流速最大。","o":["正确","错误"],"a":["T"],"exp":"壁面处的流体黏附在静止壁面上，速度为零；越靠近管中心，黏性阻滞越弱，速度越大，到管中心达到最大。层流时速度分布为抛物线，湍流时中心区域较平坦，但管壁为零、管中心最大的基本关系不变。","ev":"无论是层流或是湍流，管壁处质点速度均为零，越靠近管中心速度越大，到管中心处为最大。","keys":[],"ref":"第 26 页","hint":"","score":2},{"i":36,"n":37,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-019","t":"single","mode":"","bloom":"理解","diff":"medium","q":"流体在圆管内作层流流动时，截面平均速度与管中心最大速度是什么关系？","o":["平均速度等于最大速度","平均速度约为最大速度的 0.82 倍","平均速度等于最大速度的一半","平均速度等于最大速度的四分之一"],"a":["C"],"exp":"层流时速度分布为抛物线，积分求得的平均速度正好是管中心最大速度的一半。0.82 倍是湍流时指数取 1/7 的近似结果，不能用于层流；平均速度等于最大速度则相当于速度分布完全均匀，也不符合层流抛物线的特点。","ev":"即层流流动时平均速度为管中心最大速度的一半。","keys":[],"ref":"第 27 页","hint":"","score":2},{"i":37,"n":38,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-006","t":"single","mode":"","bloom":"理解","diff":"medium","q":"流体沿固体壁面流动时，流动边界层指的是哪个区域？","o":["离壁面较远、流速基本不变的主流区域","壁面附近流速变化较大、存在明显速度梯度的薄层","管中心流速最大的区域","整个管截面上的流动区域"],"a":["B"],"exp":"边界层是壁面黏性阻滞形成的薄层，层内速度从壁面处的零迅速增大到接近主体流速，速度梯度大，流动阻力主要集中在这里。A 描述的是边界层外的主流区，C 是速度最大的管轴附近，D 把边界层扩大成了整个截面。","ev":"由于边界层的形成将流体沿壁面的流动分成两个区域: 一个是壁面附近流速变化较大的边界层区域，一个是离壁面较远、流速基本不变的主流区域。","keys":[],"ref":"第 28 页","hint":"","score":2},{"i":38,"n":39,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-020","t":"single","mode":"","bloom":"理解","diff":"medium","q":"与层流相比，流体在圆管内作湍流流动时速度分布有什么特点？","o":["速度分布更不均匀，管中心速度梯度更大","速度分布仍为严格抛物线","管壁处速度不为零","管中心附近速度分布较均匀，靠近管壁处速度梯度较大"],"a":["D"],"exp":"湍流时质点脉动和碰撞使动量交换强烈，管中心附近速度趋于均匀，速度曲线顶部平坦；而紧靠管壁处受黏性阻滞，速度梯度很大。层流才是严格抛物线；无论层流还是湍流，管壁处速度都为零，故其余选项错误。","ev":"由图可见，湍流时截面上的速度分布较层流时均匀，速度分布曲线已不再是严格的抛物线，此时靠近管壁处速度梯度较大，而管中心附近速度分布均匀。","keys":[],"ref":"第 28 页","hint":"","score":2},{"i":39,"n":40,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-036","t":"single","mode":"","bloom":"理解","diff":"hard","q":"关于湍流黏度，下列说法正确的是哪一项？","o":["它是流体的物性，只随温度变化","它不是流体的物性，而与流动状况密切相关","它与动力黏度完全相同，可以互相替代","它只与管壁绝对粗糙度有关"],"a":["B"],"exp":"湍流黏度反映的是质点脉动造成的动量传递，其大小随流动状况变化，并不是由流体种类决定的物性；动力黏度才是物性，反映分子运动造成的动量传递。二者形式相似但本质不同，不能互相替代，也不能说湍流黏度只由粗糙度决定。","ev":"但必须指出，二者本质上并不同，黏度/ 是流体的物性，反映了分子运动造成的动量传递，而湍流黏度不再是流体的物性，它反映的是质点脉动所造成的动量传递，与流体的流动状况密切相关。","keys":[],"ref":"第 28 页","hint":"","score":2},{"i":40,"n":41,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-truefalse-011","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"流体沿平板壁面向前流动时，受壁面阻滞影响的区域逐渐扩大，边界层厚度沿程不断增加。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。壁面对流体的阻滞加上黏性的传递，使速度受到影响的范围沿流动方向不断向主流区扩展，所以边界层厚度随流动方向增大。原来的错误说法把增厚说成减薄，与流动边界层逐步发展的过程正好相反，把变化趋势弄颠倒了。","ev":"随着流体沿壁面向前流动,流速受影响的区域逐渐扩大","keys":[],"ref":"第 28 页","hint":"","score":2},{"i":41,"n":42,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-single-021","t":"single","mode":"","bloom":"理解","diff":"medium","q":"湍流流动时，层流内层的厚度随雷诺数增大如何变化？","o":["随 Re 增大而减薄","随 Re 增大而增厚","与 Re 无关，只与管径有关","先增厚后减薄，与 Re 无确定关系"],"a":["A"],"exp":"层流内层是紧贴壁面、靠分子黏性维持的薄层。Re 越大，湍动越剧烈，质点脉动把层流内层不断削薄，故其厚度随 Re 增大而减小。这一减薄会使壁面粗糙度更容易暴露于湍流主体，从而增大摩擦系数。","ev":"层流内层的厚度与流体的油动程度有关，流体的濠动程度越高，即 Re 越大，层流内层越薄。","keys":[],"ref":"第 29 页","hint":"","score":2},{"i":42,"n":43,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-truefalse-022","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"湍流边界层内部全部为湍流，紧靠壁面处不存在层流流动。","o":["正确","错误"],"a":["F"],"exp":"湍流边界层内虽然大部分区域为湍流，但紧贴壁面处受壁面阻滞和黏性支配，仍保留一层作层流流动的薄层，称为层流内层。层流内层很薄，却是传热和传质的主要阻力所在，不能因为边界层整体为湍流就否认它的存在。","ev":"壁面处仍有一薄层流体作层流流动，称为层流内层","keys":[],"ref":"第 29 页","hint":"","score":2},{"i":43,"n":44,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-truefalse-012","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"流体在倾斜直管中定态流动时，两截面间的直管阻力等于两截面总势能之差，而不等于两截面静压能之差。","o":["正确","错误"],"a":["T"],"exp":"直管阻力表现为流体总势能的减少，总势能包括静压能与位能。水平管中两截面位能相同，阻力才恰好等于静压能之差；倾斜管中两截面存在位差，必须把位能变化计入，故不能只看静压能之差。","ev":"仅当水平安装时，流动阻力恰好等于两截面的静压能之差","keys":[],"ref":"第 30 页","hint":"","score":2},{"i":44,"n":45,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-007","t":"single","mode":"","bloom":"应用","diff":"medium","q":"流体在圆管内作层流流动时，直管阻力（单位质量流体的能量损失）与流速的几次方成正比？","o":["与流速无关","二次方","1.75 次方","一次方"],"a":["D"],"exp":"层流时摩擦系数等于 64/Re，而 Re 与流速的一次方成正比，代回范宁公式后阻力与流速的一次方成正比。A 的二次方对应完全湍流粗糙管的阻力平方区，B 的 1.75 次方是光滑管湍流的近似，D 显然与阻力随流量增大的事实不符。","ev":"式(1-39)表明层流时阻力与速度的一次方成正比。","keys":[],"ref":"第 31 页","hint":"","score":2},{"i":45,"n":46,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-022","t":"single","mode":"","bloom":"理解","diff":"medium","q":"范宁公式中的摩擦系数与哪些因素有关？","o":["只与流体的密度有关","与雷诺数及管壁状况有关","只与管长和管径有关","只与流体的黏度有关"],"a":["B"],"exp":"摩擦系数是范宁公式中表示阻力大小的无量纲系数，层流时只随雷诺数变化，湍流时还随管壁相对粗糙度变化，因此笼统地说与雷诺数和管壁状况有关。管长、管径已经出现在公式的其他因子中，密度和黏度则通过雷诺数间接影响。","ev":"称为摩擦系数(friction coefficient) ，其值与流体流动的雷诺数 Re 及管壁状况有关。","keys":[],"ref":"第 31 页","hint":"","score":2},{"i":46,"n":47,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-037","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"量纲分析法的基础是什么？","o":["量纲一致性原则","牛顿第二定律","能量守恒定律","几何相似原理"],"a":["A"],"exp":"量纲分析法要求物理方程式两边不仅数值相等，而且每一项的量纲都相同，这一量纲一致性原则是整理变量、组合无量纲特征数的基础。牛顿第二定律和能量守恒是具体物理规律，几何相似只是模型实验的一类条件，都不能代替量纲一致性这一前提。","ev":"量纲分析法的基础是量纲一致性原则，即每一个物理方程式的两边不仅数值相等，而且每一项都应具有相同的量纲。","keys":[],"ref":"第 32 页","hint":"","score":2},{"i":47,"n":48,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-truefalse-023","t":"truefalse","mode":"","bloom":"应用","diff":"medium","q":"在过渡区查取摩擦系数时，为安全起见，宁可把摩擦系数估计得大一些。","o":["正确","错误"],"a":["T"],"exp":"过渡区流型不稳定，层流和湍流的摩擦系数曲线都可能适用，难以准确判断实际值。工程计算中通常把湍流曲线延伸来查取摩擦系数，宁可把阻力估大一些，以免选泵或管径偏小导致输送能力不足。","ev":"对于阻力计算，宁可估计大一些，一般将滑流时的曲线延伸，以查取、) 值。","keys":[],"ref":"第 33 页","hint":"","score":2},{"i":48,"n":49,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-023","t":"single","mode":"","bloom":"理解","diff":"medium","q":"流体在圆管内作层流流动时，管壁绝对粗糙度对摩擦系数有什么影响？","o":["粗糙度越大，摩擦系数越大","粗糙度越大，摩擦系数越小","摩擦系数与粗糙度无关，只与雷诺数有关","摩擦系数只与粗糙度有关，与雷诺数无关"],"a":["C"],"exp":"层流时流体分层平行于管轴流动，层流层覆盖了管壁的凸出部分，流速又慢，质点不会与粗糙元碰撞，故摩擦系数只取决于雷诺数，等于 64/Re。粗糙度只在湍流时通过相对粗糙度影响摩擦系数。","ev":"故此时摩扩系数与管壁粗糙度无关，仅与 Re 有关。","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":49,"n":50,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-038","t":"single","mode":"","bloom":"应用","diff":"hard","q":"光滑管湍流时，能量损失约与流速的几次方成正比？","o":["一次方","1.75 次方","二次方","零次方"],"a":["B"],"exp":"光滑管湍流的摩擦系数可用布拉修斯式计算，摩擦系数约与 Re 的 0.25 次方成反比，而 Re 与流速的一次方成正比，代入范宁公式后能量损失约与流速的 1.75 次方成正比。一次方是层流的结果，二次方是阻力平方区的结果，零次方意味着与流速无关，均不符合光滑管湍流。","ev":"此时能量损失 Wi 约与速度 x 的 1. 75 次方成正比。","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":50,"n":51,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-039","t":"single","mode":"","bloom":"理解","diff":"medium","q":"管壁粗糙度使流动阻力增大的主要原因是什么？","o":["管壁导热增强，流体温度升高","流体密度因粗糙度而增大","流体质点与管壁凸出部分碰撞，增加了能量损失","粗糙度使管内径变小，流量增大"],"a":["C"],"exp":"粗糙元突出于壁面，当层流内层不足以覆盖它们时，流体质点会与凸出部分碰撞，产生额外涡流和能量损失，因此阻力增大。粗糙度并不会改变流体密度或显著改变管径，导热增强与机械能损失也不是同一回事。","ev":"管壁粗糙度对流动阻力或摩擦系数的影响，主要是由于流体在管内流动时流体质点与管壁凸出部分相碰撞而增加了流体的能量损失","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":51,"n":52,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-truefalse-013","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"管壁绝对粗糙度对流动阻力的影响要用相对粗糙度来衡量，同样的绝对粗糙度在管径较大时影响较弱。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。粗糙元能否扰动流体，取决于凸出高度相对于管径所占的比例，所以摩擦系数图采用的参数是相对粗糙度而不是绝对粗糙度；绝对粗糙度相同时，管径越大该比值越小，对阻力的影响也随之减弱。原来的错误说法割裂了粗糙度与管径的联系，只盯着绝对值，才得出与管径无关的结论。","ev":"其影响程度与管径的大小有关，因此在摩扩系数图中参数为相对粗糙度 s/d ，而不是绝对粗糙度 se。","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":52,"n":53,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-truefalse-024","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"层流内层越厚，管壁粗糙度对流动阻力的影响越大。","o":["正确","错误"],"a":["F"],"exp":"层流内层越厚，越能把管壁的凸出部分覆盖住，流体质点不易与粗糙元碰撞，粗糙度对阻力的影响反而越小；当层流内层厚度大于绝对粗糙度时，管路接近水力光滑管。该说法把厚度的作用完全说反了。","ev":"则此时管壁粗糙度对流动阻力的影响与层流时相近，此为水力光滑管。","keys":[],"ref":"第 34 页","hint":"","score":2},{"i":53,"n":54,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-024","t":"single","mode":"","bloom":"理解","diff":"medium","q":"关于非圆形管的当量直径，下列说法正确的是哪一项？","o":["当量直径可用于计算非圆形管的流通面积","当量直径可用于由流量求平均流速","当量直径只适用于圆形管","当量直径只用于非圆形管流动阻力的计算，不能用于求流通面积和流速"],"a":["D"],"exp":"当量直径等于四倍流通截面积除以润湿周边，引入它的目的只是让非圆形管的阻力计算能沿用圆管公式。它并不等于真实的几何直径，用来求流通面积或流速会得到错误结果，因此不能混用。","ev":"注意: 当量直径只用于非圆形管道流动阻力的计算 ，而不能用于求取流通面积及流速。","keys":[],"ref":"第 37 页","hint":"","score":2},{"i":54,"n":55,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-026","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"关于闸阀的特点，下列说法正确的是哪一项？","o":["结构复杂，流动阻力大，调节精度高","结构简单，流动阻力小，但调节精度较差，常用于大直径管路","只允许流体单方向通过，用于防止倒流","依靠阀盘升降调节流量，密闭性最好"],"a":["B"],"exp":"闸阀靠闸板升降调节流量，流道直、阻力小、结构简单，但闸板位置不易精确控制，调节精度较差，适合大直径管路的切断和粗略调节。结构复杂、调节性好的是截止阀，只允许单向通过的是止逆阀。","ev":"闸阀是利用闸板的上升或下降调节管路中流体的流量，其结构简单，流动阻力小，调节精度较差，常用于大直径管路","keys":[],"ref":"第 38 页","hint":"","score":2},{"i":55,"n":56,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-single-025","t":"single","mode":"","bloom":"分析","diff":"hard","q":"流体流经突然缩小的管件时，能量损失主要来自哪里？","o":["主要来自缩脉之后流道重新扩大时的边界层分离","主要来自收缩段内流体的加速","主要来自流体与管壁的摩擦","突然缩小没有能量损失"],"a":["A"],"exp":"突然缩小时流道收缩、流体在顺压下加速，收缩段本身损失不大；但流体因惯性继续收缩到缩脉，随后流道重新扩大，在逆压下发生边界层分离并产生旋涡，这部分损失才是主要的。加速本身是动能增加，不是能量损失。","ev":"突然缩小时的能量损失主要还在于突然扩大","keys":[],"ref":"第 39 页","hint":"","score":2},{"i":56,"n":57,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-truefalse-019","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"管件与阀门的局部阻力系数可以由理论推导确定，不必依赖实验测定。","o":["正确","错误"],"a":["F"],"exp":"管件和阀门内流动复杂，伴有边界层分离和旋涡，局部阻力系数与管件形状、尺寸、开度和流型等多种因素有关，难以理论计算，一般由实验测定后列成表格供查用。理论推导只适用于少数简单情形，不能代替实验。","ev":"管件与阀门的局部阻力系数一般由实验测定","keys":[],"ref":"第 39 页","hint":"","score":2},{"i":57,"n":58,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-multiple-002","t":"multiple","mode":"","bloom":"分析","diff":"hard","q":"关于直管阻力和局部阻力的计算，下列说法正确的有哪些？","o":["层流时摩擦系数只与雷诺数有关","同一管件可同时用阻力系数法和当量长度法叠加计算","局部阻力可用阻力系数法或当量长度法计算","范宁公式对层流和湍流均适用，只是摩擦系数取值不同"],"a":["A","C","D"],"exp":"范宁公式把阻力表示成动能的倍数，形式对层流和湍流通用，差别在摩擦系数的求法；层流时摩擦系数为 64/Re，只随雷诺数变化。局部阻力的两种算法本质是同一件事的两种表达，同一管件只能选其中一种，C 的叠加计算会把阻力算大，故 C 错。","ev":"计算局部阻力时，可用阻力系数法，亦可用当量长度法。对同一管件，可用任一种计算，但不能用两种方法重复计算","keys":[],"ref":"第 41 页","hint":"","score":3},{"i":58,"n":59,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-008","t":"single","mode":"","bloom":"应用","diff":"medium","q":"某简单管路由几段不同内径的管子串联而成，流体在其中定态流动，整个管路的总能量损失应如何确定？","o":["等于各管段能量损失之和","等于各管段中最大的一段","等于各管段能量损失的平均值","只按管径最小的一段计算"],"a":["A"],"exp":"简单管路没有分支和汇合，各管段依次串联，流体逐段消耗机械能，因此总能量损失等于各段直管阻力与局部阻力损失之和。管径不同时各段流速不同，必须分段计算后再相加；A、B 分别取最大段和平均值，C 只算最小管径段，都会漏算或少算阻力。","ev":"整个管路的总能量损失等于各段能量损失之和","keys":[],"ref":"第 42 页","hint":"","score":2},{"i":59,"n":60,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-029","t":"single","mode":"","bloom":"应用","diff":"medium","q":"设计型管路计算中，适宜流速的选择应遵循什么原则？","o":["使每年的操作费与按使用年限计算的设备折旧费之和为最小","流速越大越好，以减小管径、节省设备费","流速越小越好，以减小流动阻力","按管内径的大小随意选取，与费用无关"],"a":["A"],"exp":"流速大则管径小、设备费低，但阻力大、操作费高；流速小则相反。经济合理的流速应使操作费与设备折旧费之和最小，而不是单独追求某一项最小。因此管径要综合设备投资和运行能耗确定。","ev":"适宜流速的选择应使每年的操作费与按使用年限计算的设备折旧费之和为最小","keys":[],"ref":"第 43 页","hint":"","score":2},{"i":60,"n":61,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-030","t":"single","mode":"","bloom":"应用","diff":"medium","q":"在管路计算中，下列哪种情况可以不采用试差法而直接求解？","o":["已知流量求管径，且摩擦系数未知","流动已处于阻力平方区或层流区","流动处于过渡区且摩擦系数随 Re 变化","只知道管路两端压差而不知道流量"],"a":["B"],"exp":"试差法用于摩擦系数与流速互相依赖、无法直接求解的场合。阻力平方区中摩擦系数只与相对粗糙度有关，层流区中摩擦系数只与 Re 成反比，都可先确定摩擦系数再解析求解；过渡区和未知流量求管径通常仍需试差。","ev":"若已知流动处于阻力平方区或层流区，则无须试差， 可直接由解析法求解。","keys":[],"ref":"第 43 页","hint":"","score":2},{"i":61,"n":62,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-040","t":"single","mode":"","bloom":"应用","diff":"medium","q":"对于密度大或黏度大的流体，管路中的流速应如何选取？","o":["取大一些，以减小管径","与清水完全相同","越大越经济，不必考虑阻力","取小一些，以减小流动阻力"],"a":["D"],"exp":"密度大或黏度大的流体流动阻力大，若流速取得过大，能量损失和操作费用会显著增加，因此适宜流速应取小一些。流速取大虽能减小管径、降低设备费，但操作费上升，不能简单说越大越经济，也不能照搬清水的流速范围。","ev":"密度大或黏度大的流体,流速取小一些","keys":[],"ref":"第 43 页","hint":"","score":2},{"i":62,"n":63,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-041","t":"single","mode":"","bloom":"分析","diff":"hard","q":"简单管路中阀门关小后，阀门上游 A 截面处的压力将如何变化？","o":["升高","降低","不变","先降低后升高"],"a":["A"],"exp":"阀门关小使局部阻力增大、管路流量减小。从上游容器到 A 截面这一段，流量减小使该段阻力减小，而容器液位和总机械能不变，因此 A 截面处压力升高；阀门下游侧则因流量减小使下游段阻力减小，压力降低。","ev":"流速降低使两截面间的流动阻力到/,减小,则 A 截面处的压力训A将升高","keys":[],"ref":"第 44 页","hint":"","score":2},{"i":63,"n":64,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-truefalse-014","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"在简单管路中，某一局部阻力发生变化只会影响该局部处的流动，不会改变整条管路的流量。","o":["正确","错误"],"a":["F"],"exp":"管路是一个整体，任一处的局部阻力变化都会改变管路所需压头与流量的对应关系，从而改变工作点。例如关小阀门会使局部阻力增大、流量减小，并进一步引起阀门前后压力重新分布，因此不能把局部变化与系统割裂开。","ev":"可见，管路中任一处的变化必将带来总体的变化，因此必须将管路系统当作整体考虑。","keys":[],"ref":"第 44 页","hint":"","score":2},{"i":64,"n":65,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-009","t":"single","mode":"","bloom":"应用","diff":"medium","q":"计算并联管路的阻力时，正确的做法是什么？","o":["取各支管阻力的平均值作为并联管路阻力","只按管径最大的支管计算，忽略其他支管","任选一根支管计算，各支管能量损失相等，不能把各支管阻力相加","把各支管的阻力逐段相加作为并联管路的总阻力"],"a":["C"],"exp":"并联管路的分流点与汇合点之间，流体无论走哪根支管，单位质量流体的能量损失都相等，所以任选一根支管计算即可。若把各支管阻力相加，等于让流体同时走完所有支管，与实际并联流动不符；取平均值或只取最大管径支管都没有依据。","ev":"所以，计算并联管路阻力时，可任选一根支管计算，但绝不能将各支管阻力加合在一起作为并联管路的阻力。","keys":[],"ref":"第 46 页","hint":"","score":2},{"i":65,"n":66,"ch":"第1章 流体流动与输送机械","sec":"1.6 管路计算","code":"1.6","id":"ch01-single-027","t":"single","mode":"","bloom":"分析","diff":"medium","q":"并联管路中，某支管的流量大小主要取决于什么？","o":["支管在并联系统中的安装顺序","支管上阀门的颜色和材质","支管的管径、管长和阻力系数，管径越小、管长越长、阻力系数越大则流量越小","各支管流量必定相等，与管径和管长无关"],"a":["C"],"exp":"并联各支管两端的总机械能差相同，即能量损失相等，流量比由管径、管长和阻力系数共同决定。管径小、管子长、局部阻力系数大的支管阻力大，分到的流量就小；安装顺序和外观与流量无关，各支管流量也不会自动相等。","ev":"由此可知，在并联管路中,各支管的流量比与管径、管长、阻力系数有关。支管越长、管径越小、阻力系数武大，其流量越小，反之亦然。","keys":[],"ref":"第 46 页","hint":"","score":2},{"i":66,"n":67,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-single-028","t":"single","mode":"","bloom":"应用","diff":"medium","q":"用一台泵同时向两条分支管路输送液体时，泵应提供的压头如何确定？","o":["取两条支路所需压头中的较小者","取两条支路所需压头的平均值","等于两条支路所需压头之和","取两条支路所需压头中的较大者"],"a":["D"],"exp":"泵的压头必须同时满足两条支路的输送要求，若只按较小者选泵，压头不足的支路无法达到规定流量，故应取各支路所需压头中的较大者。压头不是可以叠加的阻力，取平均值也没有依据。","ev":"为了保证同时完成两支路的输送任务，和泵所提供的压头应同时满足两支路所需的压头。","keys":[],"ref":"第 47 页","hint":"","score":2},{"i":67,"n":68,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-truefalse-005","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"分支管路中，各支管流量之和等于总管流量，但各支管的能量损失不一定相等。","o":["正确","错误"],"a":["T"],"exp":"分支管路的总管流量确实等于各支管流量之和；分支点处总机械能为定值，各支管终了时的总机械能与该支管能量损失之和相等。各支管终点的高度和压力可以不同，所以损失和流量不一定相等；只有并联管路的各支管损失才相等。","ev":"虽然各支管的流量不等，但在分支处 O 点的总机械能为一定值，表明流体在各支管流动终了时的总机械能与能量损失之和必相等","keys":[],"ref":"第 47 页","hint":"","score":2},{"i":68,"n":69,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-multiple-004","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于测速管的安装和使用，下列说法正确的有哪些？","o":["测量点应位于均匀流段，上下游直管长度最好大于 50 倍管内径","测速管适合测量含固体杂质的流体，压差读数较大","测速管管口截面必须垂直于流体流动方向","测速管外径不应超过管内径的 1/50"],"a":["A","C","D"],"exp":"测速管依靠内外管测得的冲压能与静压能之差求点速度，因此要求测点处流动均匀、管口正对流向，外径也要远小于管径以免干扰流场。含固体杂质时测压孔容易被堵塞，且测速管压差读数较小常需放大，所以 B 的说法与教材相反。","ev":"必须保证测量点位于均匀流段,一般要求测量点上上、下游的直管长度最好大于 50 倍管内径，至少也应大于 8一12 倍。","keys":[],"ref":"第 49 页","hint":"","score":3},{"i":69,"n":70,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-truefalse-015","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"流体流经孔板时流束先收缩后扩大，出口处的涡流会消耗机械能，因此下游静压力无法恢复到孔板前的数值。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。孔板使流束在缩脉处加速降压，随后虽能恢复到原来的管截面和流速，但截面突然缩放产生的涡流会消耗掉一部分机械能且无法回收，于是下游静压力低于孔板前，形成永久压力降。原来的错误说法只看到流速复原，就以为压力也能复原，忽略了这项不可逆损失。","ev":"孔板出口处由于流通截面突然缩小与扩大而形成涡流，消耗一部分能量","keys":[],"ref":"第 50 页","hint":"","score":2},{"i":70,"n":71,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-multiple-005","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于孔板流量计，下列说法正确的有哪些？","o":["结构简单，制造与安装方便","主要缺点是能量损失较大","流量系数恒定不变，与雷诺数和面积比无关","流体通过孔板后产生的永久压力降随面积比减小而增大"],"a":["A","B","D"],"exp":"孔板结构简单、安装方便，但流体在孔板前后突然收缩和扩大形成大量涡流，能量损失较大，且下游静压不能完全恢复，形成永久压力降；面积比越小，孔速越高，永久压力降越大。流量系数并非常数，它随雷诺数和面积比变化，故 C 错误。","ev":"孔板流量计结构简单，制造与安装方便，其主要缺点是能量损失较大。","keys":[],"ref":"第 52 页","hint":"","score":3},{"i":71,"n":72,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-truefalse-016","t":"truefalse","mode":"","bloom":"记忆","diff":"easy","q":"孔板流量计上游和下游所需稳定直管的长度相同，均为管径的 5 倍。","o":["正确","错误"],"a":["F"],"exp":"孔板前流体尚未受节流元件扰动，需要较长的直管使流速分布稳定，上游直管至少为管径的 10 倍；孔板后流束已经过孔口，所需稳定段较短，下游为管径的 5 倍。上下游要求并不相同。","ev":"孔板流量计安装时，上、下游需要有一段内径不变的直管作为稳定段，上游长度至少为管径的 10 倍， 下游长度为管径的 5 倍。","keys":[],"ref":"第 52 页","hint":"","score":2},{"i":72,"n":73,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-multiple-010","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于文丘里流量计，下列说法正确的有哪些？","o":["用渐缩、渐扩管代替孔板，能量损失较小","测量原理与孔板流量计相同，属于差压式流量计","流量系数比孔板小，相同压差下流量也更小","加工容易、造价低，安装时不占管长"],"a":["A","B"],"exp":"文丘里流量计用渐缩渐扩段代替孔板，流道变化平缓、涡流少，能量损失小，流量系数比孔板大，相同压差下流量更大；其测量原理与孔板相同，同属差压式流量计。缺点是加工难、精度要求高、造价高且安装要占去一定管长，因此 C、D 两项都与事实相反。","ev":"文丘里流量计的测量原理与孔板流量计相同，也属差压式流量计。","keys":[],"ref":"第 53 页","hint":"","score":3},{"i":73,"n":74,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-single-010","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在相同压差计读数下，文丘里流量计的流量比孔板流量计大，主要原因是什么？","o":["文丘里管的喉管面积一定大于孔板开孔面积","文丘里管渐缩渐扩，能量损失小，流量系数较大","文丘里流量计不需要流量系数","文丘里流量计的压差计读数被放大了"],"a":["B"],"exp":"文丘里管用渐缩、渐扩段代替孔板，流道变化平缓、涡流少，能量损失小，流量系数明显大于孔板，故同样压差下流量更大。A 与流量大小无必然关系，C 错在文丘里同样要引入流量系数，D 混淆了压差计读数与流量系数的区别。","ev":"由于文丘里流量计的能量损失较小，其流量系数较孔板大，因此相同压差计读数尺 时流量比孔板大。","keys":[],"ref":"第 53 页","hint":"","score":2},{"i":74,"n":75,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-single-031","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"文丘里流量计的主要缺点是什么？","o":["流量系数太小，相同压差下流量比孔板小","不能测量气体流量","加工较难、精度要求高、造价高，安装需占一定管长","能量损失比孔板流量计大"],"a":["C"],"exp":"文丘里管用渐缩渐扩段代替孔板，流道变化平缓、涡流少，能量损失小、流量系数大，相同压差下流量比孔板大。其代价是加工难度大、精度要求高、造价高，并且渐缩渐扩段需要占据较长的管段，故其余选项与其特点相反。","ev":"文丘里流量计的缺点是加工较难、精度要求高，因而造价高，安装时需占去一定管长位置。","keys":[],"ref":"第 53 页","hint":"","score":2},{"i":75,"n":76,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-single-042","t":"single","mode":"","bloom":"理解","diff":"medium","q":"转子流量计的转子稳定在不同高度时，环隙流速和流通面积如何变化？","o":["环隙流速随流量增大，流通面积不变","环隙流速和流通面积都随流量增大","环隙流速和流通面积都保持不变","环隙流速恒定，流通面积随流量增大"],"a":["D"],"exp":"转子稳定悬浮时，两端压差始终等于转子重力所对应的值，因此环隙流速恒定；流量增大时转子升高，锥形玻璃管处的环隙面积增大，流量与环隙面积成正比。环隙流速恒定而流通面积变化，正是转子流量计称为截面式流量计的原因。","ev":"即无论转子停在任何位置，其环隙流速 wo 为恒定。","keys":[],"ref":"第 54 页","hint":"","score":2},{"i":76,"n":77,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-single-043","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"当被测流体与转子流量计的标定条件不符时，应进行什么操作？","o":["更换转子","改变管路直径","刻度换算","无需处理，直接读数"],"a":["C"],"exp":"转子流量计的刻度是在出厂前用特定流体标定的，一般液体用水、气体用空气。当被测流体的密度、温度、压力等条件与标定条件不符时，同一刻度对应的流量会改变，必须按实际流体参数进行刻度换算，不能直接读数，也不是更换转子或改变管径能解决的。","ev":"当被测流体与上述条件不符时，应进行刻度换算。","keys":[],"ref":"第 54 页","hint":"","score":2},{"i":77,"n":78,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-truefalse-006","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"转子流量计属于差压式流量计，其转子两端压差随流量增大而增大。","o":["正确","错误"],"a":["F"],"exp":"转子流量计在转子稳定悬浮时，升力始终与转子重力平衡，因此转子两端压差为常数，与流量大小无关。流量增大时转子升高、环隙面积增大，属于恒压差、变流通面积的截面式流量计；压差随流量变化的是孔板等差压式流量计。","ev":"当流量变化时，力平衡关系式(1-70)并未改变，也即转子上、下两端面的压差为常数，所以转子流量计的特点为恒压差、恒环隙流速而变流通面积，属截面式流量计","keys":[],"ref":"第 54 页","hint":"","score":2},{"i":78,"n":79,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-truefalse-025","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"孔板流量计和转子流量计都依靠恒定压差来测量流量。","o":["正确","错误"],"a":["F"],"exp":"孔板流量计是恒流通面积、变差压的差压式流量计，流量越大，孔板前后压差越大；转子流量计才是恒压差、变流通面积的截面式流量计。该说法把两种流量计的工作原理混为一谈，正好说反。","ev":"转子流量计的特点为恒压差、恒环隙流速而变流通面积，属截面式流量计;，而孔板流量计则是恒流通面积，其压差随流量变化，为差压式流量计。","keys":[],"ref":"第 54 页","hint":"","score":2},{"i":79,"n":80,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-multiple-006","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"关于离心泵的主要部件及其作用，下列说法正确的有哪些？","o":["底阀属于离心泵的主要部件，其作用是调节流量","离心泵的主要部件是叶轮、泵壳和轴封装置","叶轮高速旋转把原动机的能量传给液体，主要提高液体的静压能","蜗壳形泵壳汇集液体，并使部分动能转变为静压能"],"a":["B","C","D"],"exp":"离心泵的三个主要部件是叶轮、泵壳和轴封装置。叶轮传递能量，泵壳汇集液体并实现动能向静压能的转换，轴封防止泄漏和空气吸入。底阀只是吸入管路上的附件，用于灌泵时防止液体倒流，不是主要部件，也不用来调节流量。","ev":"离心泵的主要部件有 3 个，即叶轮、泵壳及轴封装置","keys":[],"ref":"第 56 页","hint":"","score":3},{"i":80,"n":81,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-single-032","t":"single","mode":"","bloom":"理解","diff":"medium","q":"离心泵叶轮高速旋转，把原动机的能量传给液体，所提高的能量主要是什么？","o":["液体的位能","液体的动能，静压能几乎不变","液体的内能","液体的静压能，动能也同时有所提高"],"a":["D"],"exp":"叶轮高速旋转对液体做功，使液体的静压能和动能都提高，其中以静压能为主，这也是叶轮采用后弯叶片的原因。位能由安装高度和管路决定，不是叶轮直接提高的对象；内能主要来自能量损失产生的热量，也不是叶轮输送液体所要提高的能量。","ev":"叶轮通过高速旋转将原动机的能量传给液体，以提高液体的静压能与动能(主要为静压能) 。","keys":[],"ref":"第 56 页","hint":"","score":2},{"i":81,"n":82,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"离心泵具有自吸能力，启动前不灌泵也能正常输送液体。","o":["正确","错误"],"a":["F"],"exp":"离心泵启动前若泵壳内存有空气，空气密度远小于液体，旋转产生的离心力很小，叶轮中心形成的低压不足以把液体吸入泵内，这种现象称为气缚。因此离心泵无自吸能力，启动前必须先灌泵，使泵壳和吸入管路充满液体。","ev":"此种现象称为气缚(air binding)，表明离心泵无自吸能力。","keys":[],"ref":"第 56 页","hint":"","score":2},{"i":82,"n":83,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-multiple-007","t":"multiple","mode":"","bloom":"分析","diff":"hard","q":"离心泵输送的液体密度增大时，其性能会发生哪些变化？","o":["流量不变","压头不变","轴功率随密度成正比增大","效率显著下降"],"a":["A","B","C"],"exp":"离心泵的流量取决于叶轮尺寸和转速，压头由离心力产生的压力与密度之比决定，二者都与液体密度无关；密度改变时压头与流量的特性曲线不变。轴功率与密度成正比，因此密度增大时轴功率增大；效率与密度基本无关，不会显著下降。","ev":"离心泵的效率与液体的密度基本无关，所以7-dv 曲线保持不变。但离心泵的轴功率随液体的密度变化,由式(1-79)可知，轴功率与密度成正比","keys":[],"ref":"第 60 页","hint":"","score":3},{"i":83,"n":84,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-truefalse-017","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"被输送液体的黏度增大时，离心泵的流量、压头与效率都会下降，而轴功率反而上升。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。黏度增大会加大液体在泵内的摩擦和能量损失，泵所能提供的流量与压头随之下降、效率降低；同时叶轮要额外克服黏性摩擦，轴功率不降反升，特性曲线因此需要修正。原来的错误说法看到流量和压头下降就顺势推断轴功率也减小，把两者的变化方向弄反了。","ev":"被输送液体的黏度增加，液体在泵内的能量损失随之增大，导致泵的流量、压头、效率均下降，而轴功率上升","keys":[],"ref":"第 60 页","hint":"","score":2},{"i":84,"n":85,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-multiple-008","t":"multiple","mode":"","bloom":"分析","diff":"hard","q":"关于离心泵的并联与串联操作，下列说法正确的有哪些？","o":["两台相同泵并联时，同一压头下总流量为单台泵的两倍，但受管路特性制约实际不到两倍","两台相同泵串联时，同一流量下总压头为单台泵的两倍，但实际不到两倍","高阻输送管路宜采用并联组合","低阻输送管路宜采用并联组合"],"a":["A","B","D"],"exp":"并联操作是在同一压头下叠加流量，串联操作是在同一流量下叠加压头，理论上分别成倍增加，但受管路特性曲线制约，实际增量都小于单台的两倍。低阻管路特性平坦，宜并联；高阻管路特性陡峭，宜串联，故 C 把组合方式选反了。","ev":"对于低阻输送管路，并联组合优于串联，而对于高阻输送管路，串联组合优于并联。","keys":[],"ref":"第 65 页","hint":"","score":3},{"i":85,"n":86,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-single-011","t":"single","mode":"","bloom":"理解","diff":"medium","q":"离心泵发生汽蚀的根本原因是什么？","o":["叶轮叶片数目太少，扬程不够","泵内压力高于大气压，液体被压出过快","泵的转速低于额定转速，流量不足","泵内最低压力降至操作温度下液体的饱和蒸气压，液体汽化或溶解气体析出"],"a":["D"],"exp":"当泵内叶轮入口附近的最低压力降到输送温度下的饱和蒸气压时，液体汽化形成气泡，气泡进入高压区迅速凝结，周围液体高速撞击叶片，造成汽蚀。A 与实际压力过低相反，B、D 可能使工况偏离但不能解释气泡的产生，不是根本原因。","ev":"离心泵发生汽蚀的原因是泵内最低压力等于操作温度下液体的饱和营气压。","keys":[],"ref":"第 66 页","hint":"","score":2},{"i":86,"n":87,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-single-044","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"输送易燃、易爆或剧毒液体时，宜选用下列哪类离心泵？","o":["清水泵","屏蔽泵或磁力泵","油泵","杂质泵"],"a":["B"],"exp":"屏蔽泵把叶轮与电机连为一体并密封在同一壳体内，不需要轴封；磁力泵靠磁力传递动力，也容易实现无泄漏，二者都适合输送易燃、易爆或剧毒液体。清水泵和油泵仍有轴封泄漏风险，杂质泵主要用于含固体颗粒的物料。","ev":"屏蔽和泵又称为无密封泵，是将叶轮与电机连为一体，密封在同一壳体内，不需要轴封装置，可用于输送易燃、易爆或剧毒的液体。","keys":[],"ref":"第 69 页","hint":"","score":2},{"i":87,"n":88,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-multiple-003","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于往复泵和离心式通风机，下列说法正确的有哪些？","o":["离心通风机的全风压等于静风压与动风压之和","往复泵的理论流量取决于活塞面积、冲程和往复次数","往复泵可以像离心泵那样关小出口阀门来调节流量","往复泵的流量只与泵特性有关，压头只取决于管路状况"],"a":["A","B","D"],"exp":"往复泵是容积式泵，活塞扫过的体积决定理论流量，活塞面积、冲程和往复次数一定则流量一定，具有正位移特性，压头由管路需求决定。通风机全风压为静风压与动风压之和。关小出口阀门不能调节往复泵流量，反而会使泵缸压力急升，故 A 错。","ev":"往复和泵的流量仅与泵特性有关，而提供的压头只取决于管路状况，这种特性称为正位移特性，具有这种特性的泵称为正位移式和泵。","keys":[],"ref":"第 71 页","hint":"","score":3},{"i":88,"n":89,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-truefalse-027","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"齿轮泵适于输送含有固体颗粒的悬浮液。","o":["正确","错误"],"a":["F"],"exp":"齿轮泵靠两个齿轮啮合形成容积变化输送液体，流量小但压头高，适合黏稠液体甚至膏状物料；固体颗粒会卡在齿间、加剧齿轮和泵壳磨损，因此不宜输送含固体颗粒的悬浮液。该说法与齿轮泵的适用场合相反。","ev":"齿轮和泵的流量小但压头高，适于输送黏稠液体甚至膏状物料，但不宜输送含有固体颗粒的悬浮液。","keys":[],"ref":"第 73 页","hint":"","score":2},{"i":89,"n":90,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-multiple-011","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"按出口表压和压缩比分类，关于气体输送机械，下列说法正确的有哪些？","o":["通风机出口表压不大于 15 kPa，压缩比不大于 1.15","鼓风机出口表压为 15～300 kPa，压缩比为 1.15～4","压缩机出口表压大于 300 kPa，压缩比大于 4","真空泵的出口压力远高于大气压，压缩比大于 4"],"a":["A","B","C"],"exp":"气体输送机械按出口表压和压缩比划分：通风机出口表压不超过 15 kPa、压缩比不超过 1.15；鼓风机出口表压 15～300 kPa、压缩比 1.15～4；压缩机出口表压大于 300 kPa、压缩比大于 4。真空泵用于在容器内造成真空，出口压力为大气压或略高于大气压，并非远高于大气压。","ev":"通风机(fan)出口表压不大于 15kPa，压缩比不大于 1. 15;","keys":[],"ref":"第 74 页","hint":"","score":3},{"i":90,"n":91,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-single-045","t":"single","mode":"","bloom":"记忆","diff":"medium","q":"旋涡泵适用于下列哪种场合？","o":["大流量、低扬程的清水输送","含固体颗粒的悬浮液输送","高黏度膏状物料的输送","小流量、高扬程且黏度不高的清洁液体"],"a":["D"],"exp":"旋涡泵靠叶轮与泵壳间的反复旋涡运动获得较高压头，但效率较低，适用于流量小、压头高且黏度不高的清洁液体。含固体颗粒的悬浮液、高黏度膏状物料会堵塞或加剧磨损，大流量低扬程场合则应选普通离心泵。","ev":"旋涡泵适用于输送流量小、压头高且黏度不高的清洁液体。","keys":[],"ref":"第 74 页","hint":"","score":2},{"i":91,"n":92,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-single-012","t":"single","mode":"","bloom":"理解","diff":"medium","q":"与离心泵相比，计算离心式通风机的全风压时为什么不能忽略动风压？","o":["气体出口速度很大，动风压在总风压中占相当比例","气体密度很小，静风压恒为零","通风机叶轮转速很低，静风压无法建立","通风机输送的是液体，不存在静风压"],"a":["A"],"exp":"离心泵进、出口动能差很小，常可忽略；通风机输送气体，出口速度很大，动风压在全风压中占比不可忽视，因此全风压必须取静风压与动风压之和。A、B 错在静风压并非为零，C 把通风机输送的介质说成了液体。","ev":"泵进、出口处的动能差很小,可以忽略，但在离心通风机中, 气体出口速度很大，故动风压不能忽略。","keys":[],"ref":"第 75 页","hint":"","score":2},{"i":92,"n":93,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-truefalse-018","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"罗茨鼓风机的风量随出口压力升高而明显减小，因此可以用出口阀门调节风量。","o":["正确","错误"],"a":["F"],"exp":"罗
