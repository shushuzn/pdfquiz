茨鼓风机是容积式鼓风机，具有正位移特性，风量与转速成正比而与出口压力无关，关小出口阀门不能调节风量，反而会使出口压力升高，故一般采用旁路调节。出口还应安装稳压罐和安全阀，防止超压。","ev":"罗茨鼓风机为容积式鼓风机，具有正位移特性，其风量与转速成正比，而与出口压力无关，一般采用旁路调节流量。","keys":[],"ref":"第 76 页","hint":"","score":2},{"i":93,"n":94,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-truefalse-026","t":"truefalse","mode":"","bloom":"应用","diff":"medium","q":"离心式通风机的风压与所输送气体的密度无关，选用时不必进行换算。","o":["正确","错误"],"a":["F"],"exp":"离心式通风机的风压与气体密度成正比，产品样本通常按 101.3 kPa、20℃ 的空气标定。若使用条件下气体密度不同，必须把使用条件下的风压换算到标定条件，再按样本选择风机；否则选出的风机风压会偏离实际需要。","ev":"通风机的风压与密度成正比，当使用条件与通风机标定条件不符时，需将使用条件下的风压换算为标定条件下的风压，才能选择风机。","keys":[],"ref":"第 76 页","hint":"","score":2},{"i":94,"n":95,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-single-001","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"非均相物系中，处于分散状态的物质与处于连续状态的物质分别称为什么？","o":["滤饼、滤液","分散相、连续相","连续相、分散相","分散介质、分散相"],"a":["B"],"exp":"分散相是被分散在物系中的颗粒或液滴，如含尘气体中的固体颗粒；连续相是连成整体的介质，如气体或液体。B 把两者颠倒，C 的分散介质是连续相的另一种叫法，D 是过滤得到的滤饼与滤液，都不符合定义。","ev":"在非均相物系内，处于分散状态的物质称为分散相，如悬浮液和含尘气体中的固体颗粒; 处于连续状态的物质称为连续相，如悬浮液中的液体和含尘气体中的气体。","keys":[],"ref":"第 89 页","hint":"","score":2},{"i":95,"n":96,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-single-002","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"工业上遇到的大多数固体颗粒为非球形颗粒，通常用哪两个参数表示其特性？","o":["比表面积和孔隙率","真密度和堆积密度","筛分目数和筛余量","当量直径和球形度"],"a":["D"],"exp":"非球形颗粒形状不规则，难以用单一尺寸说明，教材用体积当量直径或表面积当量直径表示其大小，再用球形度表示形状与球形的差异程度。孔隙率属于颗粒床层参数，真密度和堆积密度是密度概念，筛分目数与筛余量用于测定粒径分布。","ev":"工业上遇到的固体颗粒大多是非球形颗粒，非球形颗粒虽然不像球形颗粒那样容易地求出体积、表面积和比表面积，但可以用当量直径和球形度来表示其特性。","keys":[],"ref":"第 89 页","hint":"","score":2},{"i":96,"n":97,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-single-010","t":"single","mode":"","bloom":"理解","diff":"medium","q":"球形度用于表示非球形颗粒的形状与球形颗粒的差异程度，其定义是什么？","o":["非球形颗粒的表面积与其体积之比","与实际颗粒体积相等的球形颗粒表面积与该颗粒表面积之比","实际颗粒的体积当量直径与表面积当量直径之比","与颗粒体积相等的球形颗粒体积与实际颗粒体积之比"],"a":["B"],"exp":"球形度从表面积角度衡量颗粒与球形的接近程度，分子是体积相同时球形颗粒的表面积，分母是实际颗粒的表面积。同体积颗粒中球形表面积最小，所以任何非球形颗粒的球形度都小于1。A 把比表面积误当成球形度，C 混入了两个当量直径的比值，D 用体积相比恒等于1，都不符合定义。","ev":"颗粒的球形度(sphericity)表示实际颗粒的形状与球形颗粒的差异程度，定义为与实际颗粒体积相等的球形颗粒表面积与该颗粒表面积之比，即","keys":[],"ref":"第 90 页","hint":"","score":2},{"i":97,"n":98,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-single-011","t":"single","mode":"","bloom":"应用","diff":"medium","q":"设计气-固分离装置的管路和灰斗时，其倾斜度应如何选取？","o":["小于粒子的自然倾斜角","按设备直径确定，与颗粒性质无关","大于粒子的自然倾斜角","与自然倾斜角相等即可"],"a":["C"],"exp":"散粒性用颗粒堆成的自然倾斜角衡量，粒径越小、含水量越高，该角度越大。管路和灰斗的倾斜度只有大于自然倾斜角，颗粒才能靠自重下滑而不滞留，否则容易积料堵塞。小于该角度必然造成物料停积，B 忽视了颗粒性质的影响，D 没有考虑细颗粒含水后倾斜角增大的情况。","ev":"选择或设计气-固分离装置时应使管路和灰斗的倾斜度大于粒子的自然倾斜角，以防堵塞。","keys":[],"ref":"第 91 页","hint":"","score":2},{"i":98,"n":99,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"颗粒贮存与加工设备的容积应按包含颗粒间空隙的堆积密度估算，而不是按颗粒本身的真密度估算。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。贮存和加工时颗粒自然堆积，颗粒之间的空隙也占据体积，设备容积必须与这种堆积状态相匹配，所以计算依据是包含空隙的堆积密度；堆积密度小于真密度，用真密度估算会低估所需容积。原来的错误说法把两者对调，选错了密度基准。","ev":"设计颗粒贮存设备及加工设备时，要以堆积密度为准。","keys":[],"ref":"第 91 页","hint":"","score":2},{"i":99,"n":100,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-truefalse-006","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"颗粒的黏附性会使颗粒相互聚集，因此对分离设备的捕集是不利的。","o":["正确","错误"],"a":["F"],"exp":"黏附性使颗粒碰撞后聚集，聚集成较大颗粒反而更容易被重力沉降、电除尘或袋式过滤捕集，所以黏附性对分离设备中的捕集是有利的。真正受影响的是清灰环节：电除尘器和袋式过滤器的分离效率很大程度上取决于极板或滤袋的清灰能力，不能因此笼统地说黏附性不利。","ev":"颗粒之间的黏附性使粒子在相互碰撞中导致颗粒的聚集。显然，黏附性对颗粒在各种分离设备中的捕集有利。","keys":[],"ref":"第 91 页","hint":"","score":2},{"i":100,"n":101,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"进行沉降计算时，在什么条件下可近似按自由沉降处理？","o":["颗粒含量较少且设备尺寸足够大","颗粒浓度大且颗粒间距很小","容器直径与颗粒直径相接近","颗粒形状不规则且粒径很细"],"a":["A"],"exp":"自由沉降指颗粒沉降时不受周围颗粒和器壁的影响。颗粒含量少、设备尺寸远大于颗粒时，颗粒间干扰和器壁效应都可忽略，才能按自由沉降计算；B 属于干扰沉降，C 会产生明显的器壁效应，D 只影响阻力系数，并不等于自由沉降条件。","ev":"一般来说，当颗粒含量较少，设备尺寸又足够大的情况下可认为自由沉降。","keys":[],"ref":"第 92 页","hint":"","score":2},{"i":101,"n":102,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-single-005","t":"single","mode":"","bloom":"理解","diff":"easy","q":"含尘气体进入降尘室后能够实现分离，主要依靠什么？","o":["气体穿过滤布被过滤","流通截面扩大、流速减小，颗粒有足够停留时间沉降","气体被加热后尘粒升华","尘粒在室内发生化学反应而凝聚"],"a":["B"],"exp":"降尘室借重力沉降除尘：气体进入后流通截面扩大，水平气速降低，颗粒在重力作用下向室底沉降，只要气体停留时间不小于颗粒沉降至底所需时间，尘粒就能被除去。升温升华、化学反应凝聚和滤布过滤分别属于其他转化或分离过程，不是降尘室的原理。","ev":"含尘气体进入降尘室后,流通截面扩大，流速减小，颗粒在重力作用下沉降。","keys":[],"ref":"第 95 页","hint":"","score":2},{"i":102,"n":103,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"容器尺寸不够大时，壁面和底面对沉降的阻滞会使颗粒的实际沉降速度低于自由沉降速度。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。器壁和容器底面增加了颗粒沉降时的阻力，颗粒下落受到额外阻碍，实际速度因此小于在无限大流体中的自由沉降速度；只有容器尺寸远大于颗粒时才能忽略这种效应。原来的错误说法把影响方向说反，误以为器壁会加快沉降。","ev":"当容器较小时，容器的壁面和底面均能增加颗粒沉降时的抽力.使颗粒的实际沉降速度较自由沉降速度低。","keys":[],"ref":"第 95 页","hint":"","score":2},{"i":103,"n":104,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-single-004","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当分散相与连续相密度差较小或颗粒细小时，为什么常改用离心沉降？","o":["离心沉降不需要任何分离设备","离心沉降只能用于气体除尘","重力沉降速度太低，离心力可显著加快沉降","离心力场中颗粒不再受流体阻力"],"a":["C"],"exp":"密度差小或颗粒细时，重力提供的推动力有限，沉降速度很低，设备会变得庞大；离心加速度可远大于重力加速度，使沉降速度成倍提高，设备尺寸也随之减小。离心沉降同样受阻力作用，也需要旋液分离器、离心机等设备，且液固与气固体系都有应用。","ev":"当分散相与连续相密度差较小或颗粒细小时，在重力作用下沉降速度很低。","keys":[],"ref":"第 97 页","hint":"","score":2},{"i":104,"n":105,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-single-012","t":"single","mode":"","bloom":"理解","diff":"medium","q":"用于中等浓度悬浮液浓缩的沉降槽，通常称为什么？","o":["澄清器","水力分粒器","旋液分离器","浓缩器或增稠器"],"a":["D"],"exp":"沉降槽借重力沉降从悬浮液中分离固体颗粒，用途不同名称也不同：处理低浓度悬浮液、以得到澄清液为主时称澄清器，用于中等浓度悬浮液浓缩时称浓缩器或增稠器。水力分粒器是用于分级的旋液分离器的别称，旋液分离器靠离心沉降工作，两者都不是沉降槽的别名。","ev":"如用于低浓度悬浮液分离时亦称为澄清器(clarifier): 用于中等浓度悬浮液的浓缩时，常称为浓缩器或增稠器(thickener)。","keys":[],"ref":"第 97 页","hint":"","score":2},{"i":105,"n":106,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-truefalse-004","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"旋风分离器的出灰口和集尘室必须保持严密，否则漏入的气体会把锥底已收集的粉尘重新卷起，使分离效果明显变差。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。旋风分离器内器壁处静压最高、筒体中心最低，锥底附近处于低压区，密封不严时外部气体被吸入后会自下而上扰动已沉降的粉尘，把它们重新带回气流。原来的错误说法把这种漏气当成无关紧要的小事，严重低估了它对分离效率的破坏。","ev":"因此，如果出灰口或集尘室密封不严，很容易漏入气体，将已收集在锥底的粉尘重新卷起，严重降低分离效果。","keys":[],"ref":"第 99 页","hint":"","score":2},{"i":106,"n":107,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-single-006","t":"single","mode":"","bloom":"分析","diff":"medium","q":"为什么旋风分离器的总效率不能准确代表其分离性能？","o":["总效率在工业上无法测定","总效率只与压降大小有关","总效率恒等于粒级效率","总效率随含尘气体粒径分布而变，未反映各粒级的分离效果"],"a":["D"],"exp":"总效率是进出口总尘量之比，测定方便，但含尘气体粒径分布不同时，同一设备会得到不同总效率，不能说明它对各粒径颗粒的分离能力。粒级效率按粒径分段表示分离效果，更能反映性能；总效率可以测定，也不等于粒级效率，更不只由压降决定。","ev":"总效率是工程计算中常用的,也是最容易测定的分离效率，但是它却不能准确代表该分离器的分离性能。","keys":[],"ref":"第 100 页","hint":"","score":2},{"i":107,"n":108,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-single-013","t":"single","mode":"","bloom":"分析","diff":"medium","q":"与短粗形旋风分离器相比，细长形旋风分离器的性能特点是什么？","o":["压降较小、处理量较大，分离效率也较高","压降较大、处理量不大，但分离效率较高","压降和处理量都较大，分离效率较低","压降、处理量和分离效率均与短粗形相同"],"a":["B"],"exp":"旋风分离器的压降和分离效率都与形状有关：细长形内气流旋转路径长、旋转圈数多，细小颗粒更容易到达器壁，故分离效率高，但阻力大、处理量小；短粗形正好相反，压降小、处理量大而效率低。A 把两种形状的优点拼在一起，C 把压降与效率的对应关系说反了。","ev":"一般来说，短粗形的旋风分离器压降较小，处理量大.但分离效率低: 细长形的则压降较大，处理量不大，但分离效率高。","keys":[],"ref":"第 100 页","hint":"","score":2},{"i":108,"n":109,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-truefalse-008","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"过滤介质的孔径必须小于被截留颗粒的直径，否则细小颗粒一定会全部穿过滤布进入滤液。","o":["正确","错误"],"a":["F"],"exp":"过滤介质的微细孔道直径未必小于被截留颗粒，过滤初期确实会有细小颗粒穿过而使滤液浑浊，但部分颗粒会在孔道中架桥，逐渐把通道堵住并形成滤饼，此后滤液即变清净。因此孔径偏大不等于完全不能截留，初期得到的浑浊滤液返回重滤即可。","ev":"过滤介质的微细孔道的直径未必一定小于被截留的颗粒直径，在过滤操作开始阶段，会有一些细小颗粒穿过介质而使滤液浑浊","keys":[],"ref":"第 102 页","hint":"","score":2},{"i":109,"n":110,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-multiple-001","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"良好的过滤介质除满足分离要求外，还应具备哪些性能？","o":["足够的机械强度","尽可能小的流过阻力","较高的耐腐蚀性和一定的耐热性","表面越粗糙越好，以便把滤饼牢牢挂住"],"a":["A","B","C"],"exp":"过滤介质要承受两侧压强差，所以需要足够的机械强度；阻力小可降低能耗、提高过滤速率；耐腐蚀性和耐热性决定其适用范围。教材还要求表面光滑，使滤饼容易剥离，故 D 恰好说反了。","ev":"良好的过滤介质除能达到所需分离要求外，还应具有足够的机械强度、尽可能小的流过阻力、较高的耐腐蚀性和一定的耐热性，最好表面光滑，使滤饼剥离容易。","keys":[],"ref":"第 103 页","hint":"","score":3},{"i":110,"n":111,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-multiple-003","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"工业上常用的过滤介质包括下列哪些？","o":["织物介质","多孔性固体介质","液态介质","堆积介质"],"a":["A","B","D"],"exp":"常用过滤介质分为三类：由天然或合成纤维、金属丝编织的织物介质最常用，价格便宜且清洗更换方便；由陶瓷、金属或玻璃粉末烧结而成的多孔性固体介质；由砂石、木炭、石棉粉等堆积而成的堆积介质，多用于深层过滤。液态介质不能截留固体颗粒，不能充当过滤介质。","ev":"工业中常使用的过滤介质有以下几种。","keys":[],"ref":"第 103 页","hint":"","score":3},{"i":111,"n":112,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"深层过滤适用于处理什么样的悬浮液？","o":["处理量大、颗粒小且固含量低","固含量高且颗粒较粗","含纤维状杂质很多的料浆","需要回收滤饼作产品的场合"],"a":["A"],"exp":"深层过滤时颗粒不形成滤饼，而是被截留在较厚介质的孔隙内，因此适合处理量大、颗粒细、固含量低的悬浮液，如自来水净化和纺丝液除杂。固含量高的悬浮液很快堵塞孔隙，工业上多用滤饼过滤；需要回收滤饼时也以滤饼过滤为主。","ev":"这种过滤常用于处理量大而悬浮液中颗粒小、固含量低(体积百分数小于0.1%%)的情况。","keys":[],"ref":"第 103 页","hint":"","score":2},{"i":112,"n":113,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"滤饼过滤刚开始时得到的滤液往往浑浊，可以直接作为产品收集。","o":["正确","错误"],"a":["F"],"exp":"过滤初期介质孔道尚未被颗粒架桥封堵，细小颗粒会穿过介质使滤液浑浊，这部分滤液应返回重滤，待滤饼形成后滤液才变清净。滤饼本身才是真正有效的过滤介质，不能把初期浑浊滤液直接当产品。","ev":"通常操作初期得到的浑浊滤液在滤饼形成之后应返回重滤。","keys":[],"ref":"第 103 页","hint":"","score":2},{"i":113,"n":114,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-truefalse-002","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"恒速过滤保持过滤速率不变，因此只要不断加大压强差，任何滤饼都能把恒速过滤进行到底。","o":["正确","错误"],"a":["F"],"exp":"对可压缩滤饼，压强差增大会使滤饼空隙率下降、流动阻力急剧增加，为维持恒定速率所需的压强差会升得很高，设备和操作都难以承受，所以恒速过滤往往无法进行到底。实际中常采用先恒速后恒压的操作方式。","ev":"但对于可压缩滤饼，随着过滤时间的延长， 压强差会增加许多，因此. 恒速过滤无法进行到底。","keys":[],"ref":"第 104 页","hint":"","score":2},{"i":114,"n":115,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-single-015","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"板框压滤机的滤板和滤框外侧铸有小钮，其中 2 个钮表示什么？","o":["洗涤板","非洗涤板","滤布压紧装置","滤框"],"a":["D"],"exp":"板框外侧的小钮是组装时的识别标记：1 个钮为非洗涤板，2 个钮为框，3 个钮为洗涤板。装配时按非洗涤板、框、洗涤板、框的顺序交替排列，才能形成料浆通道、滤液通道和洗涤通道。把小钮数目与部件对应清楚，可以避免装错板框而影响过滤和洗涤操作。","ev":"如 1 个钮为非洗涤板、2 个钮为框、3 个钮为洗涤板","keys":[],"ref":"第 106 页","hint":"","score":2},{"i":115,"n":116,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-multiple-004","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于板框压滤机，下列说法正确的是哪些？","o":["结构简单、制造方便","连续操作、生产效率高","过滤面积大、承受压强差较高","间歇操作、劳动强度大"],"a":["A","C","D"],"exp":"板框压滤机由滤板和滤框交替排列组成，结构简单、制造方便，过滤面积大且能承受较高的压强差，适合过滤细小颗粒和黏度较高的料浆。它的缺点是间歇操作、生产效率低、劳动强度大。B 把缺点说成了优点，连续操作是转鼓真空过滤机等设备的特点。","ev":"板框压滤机的优点是结构简单、制造方便、过滤面积大、承受压强差较高，因此可用于过滤细小颗粒及黏度较高的料浆。缺点是间歇操作，生产效率低，劳动强度大。","keys":[],"ref":"第 108 页","hint":"","score":3},{"i":116,"n":117,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-single-008","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"板框压滤机的主要优点是什么？","o":["真空吸滤且滤饼含液量低","转速高且离心分离因数大","结构简单、过滤面积大、承受压强差较高","连续操作且生产能力大"],"a":["C"],"exp":"板框压滤机由滤板和滤框交替排列，结构简单、制造方便，过滤面积大，还能承受较高的压强差，适合过滤细小颗粒和黏度较高的料浆。它的缺点是间歇操作、生产效率低、劳动强度大；连续操作、真空吸滤和高转速分别属于转鼓真空过滤机和离心机的特点。","ev":"板框压滤机的优点是结构简单、制造方便、过滤面积大、承受压强差较高，因此可用于过滤细小颗粒及黏度较高的料浆。","keys":[],"ref":"第 108 页","hint":"","score":2},{"i":117,"n":118,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-single-009","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"转鼓真空过滤机的主要优点是什么？","o":["可在任意高温下操作","连续操作、生产能力大，适于处理量大而容易过滤的料浆","间歇操作且过滤面积大","结构简单且不需要附属设备"],"a":["B"],"exp":"转鼓真空过滤机靠分配头使各扇形格依次完成过滤、洗涤、吸干、吹松和卸饼，转鼓每转一周即完成一个周期，因此能连续操作、生产能力大。它的附属设备较多、投资高、滤饼含液量高，而且真空操作下料浆温度不能过高，所以其余选项都不成立。","ev":"转鼓真空过滤机的优点是连续操作，生产能力大，适于处理量大而容易过滤的料浆。","keys":[],"ref":"第 110 页","hint":"","score":2},{"i":118,"n":119,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-single-014","t":"single","mode":"","bloom":"理解","diff":"medium","q":"三足式过滤离心机的主要优点是什么？","o":["构造简单，可灵活掌握运转周期","连续操作，生产能力大","转速很高，分离因数可达数十万","卸料完全自动，不需要人工操作"],"a":["A"],"exp":"三足式离心机转鼓直径较大而转速不高，结构简单，运转周期可按物料情况灵活掌握，适合小批量间歇生产。它卸料时需人工操作，转动部件在机座下部，检修不便；连续操作和大生产能力属于刮刀卸料式等机型，数十万的分离因数则是高速管式离心机的特点。","ev":"它的转鼓直径较大，转速不高(小于 2000r/min) ，与其他形式离心机相比，具有构造简单，可灵活掌握运转周期等优点。","keys":[],"ref":"第 110 页","hint":"","score":2},{"i":119,"n":120,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-truefalse-005","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"过滤离心机的转鼓上开有许多小孔、内壁附有过滤介质，靠离心力使滤液穿过介质排出而固体被截留。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。过滤离心机与转鼓沉降离心机外形相似，差别就在转鼓：前者鼓壁开孔并覆有过滤介质，离心力推动滤液穿过介质和小孔排出，固体截留在鼓内；后者鼓壁不开孔，靠离心沉降把固体沉积在壁上。原来的错误说法把两者说成都没有孔，抹掉了这一关键区别。","ev":"过滤离心机(filtration centrifuge)与转鼓沉降离心机非常相似，所不同的是，过滤离心机转鼓上开有许多小孔，内壁附以过滤介质,，在离心力作用下进行过滤。","keys":[],"ref":"第 110 页","hint":"","score":2},{"i":120,"n":121,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-multiple-002","t":"multiple","mode":"","bloom":"记忆","diff":"medium","q":"加入混凝剂或絮凝剂强化沉降时，常用的作用机理包括哪些？","o":["吸附电中和","吸附架桥","降低颗粒密度使颗粒上浮","压缩双电层"],"a":["A","B","D"],"exp":"教材把化学药剂强化沉降的机理归为压缩双电层、吸附电中和、吸附架桥和沉淀物网捕四种：前三种分别通过减薄扩散层、中和表面电荷和长链架桥使细颗粒聚集。降低颗粒密度会使颗粒更难下沉，与沉降强化的目的相反。","ev":"加入这些化学药剂后的沉降机理可分为压缩双电层、吸附电中和、吸附架桥、沉淀物网捕4种。","keys":[],"ref":"第 111 页","hint":"","score":3},{"i":121,"n":122,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-single-017","t":"single","mode":"","bloom":"理解","diff":"medium","q":"沉降强化中使用的混凝剂与絮凝剂，在化学组成上的主要区别是什么？","o":["混凝剂是低分子电解质，絮凝剂是高分子聚合物","混凝剂是高分子聚合物，絮凝剂是低分子电解质","两者都是高分子表面活性剂，只是分子量不同","两者都是无机酸，靠改变溶液的 pH 起作用"],"a":["A"],"exp":"混凝剂是硫酸亚铁、硫酸铝一类低分子电解质，靠压缩双电层和电中和使颗粒脱稳；絮凝剂是明胶、聚丙烯酰胺一类高分子聚合物，靠长链在颗粒间架桥，形成粗大絮凝体。B 把两者说反，C 把混凝剂也当成高分子表面活性剂，D 把两类药剂都误认为无机酸，都不符合教材分类。","ev":"混凝剂通常是一些低分子电解质，如硫酸亚铁、硫酸铝、毛化铁、氧化铝等,絮凝剂则是指一些高分子聚合物，如明胶、聚丙炳酰胺、聚合硫酸铁等。","keys":[],"ref":"第 111 页","hint":"","score":2},{"i":122,"n":123,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-single-016","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"动态过滤所采用的典型设备是什么？","o":["板框压滤机","转鼓真空过滤机","旋叶压滤机","三足式过滤离心机"],"a":["C"],"exp":"旋叶压滤机由旋转叶轮和相邻的固定滤面组成，料浆在压差推动下逐级增浓，是动态过滤的典型设备。板框压滤机和转鼓真空过滤机都属于传统的滤饼过滤设备，滤饼在介质上静止堆积、不断增厚；三足式离心机靠离心力过滤，也不属于动态过滤。","ev":"动态过滤的典型设备为旋叶压滤机(rotary vane filter) 。","keys":[],"ref":"第 112 页","hint":"","score":2},{"i":123,"n":124,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-truefalse-009","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"强化沉降时，混凝剂和絮凝剂的投加量越多，沉降效果越好。","o":["正确","错误"],"a":["F"],"exp":"混凝剂和絮凝剂的加入量并非越多越好，投加量过多会使效果反而下降，甚至使已经聚集的颗粒重新稳定分散。不同料浆的最佳投加量差别很大，必须通过实验确定。一味加大投加量既浪费药剂，也可能抵消压缩双电层、吸附架桥等机理带来的强化效果。","ev":"但是，混凝剂或妹凝剂的加入量并非越多越好。投加量过多，效果反而下降","keys":[],"ref":"第 112 页","hint":"","score":2},{"i":124,"n":125,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-truefalse-010","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"动态过滤中料浆以平行或旋转的方式冲刷过滤面，滤饼难以在介质上停积，因此过滤阻力能保持在较低水平。","o":["正确","错误"],"a":["T"],"exp":"该说法正确。动态过滤借助外力使料浆相对过滤面作平行或旋转运动，剪切作用不断带走刚形成的滤饼，介质上几乎不积存滤饼，阻力自然下降，这正是它区别于传统滤饼过滤的关键。原来的错误说法照搬传统过滤滤饼不断增厚、阻力持续上升的图景，与动态过滤的特点正好相反。","ev":"因此, 在过滤介质上不积存或积存少量的滤饼，有效地降低了过滤阻力。","keys":[],"ref":"第 112 页","hint":"","score":2},{"i":125,"n":126,"ch":"第2章 非均相物系分离","sec":"2.4 过程强化与展望","code":"2.4","id":"ch02-truefalse-011","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"处理含固量低、颗粒微细的悬浮液时，膜分离往往比传统过滤更有效，已用于制药和饮料的无菌过滤。","o":["正确","错误"],"a":["T"],"exp":"膜分离对含固量低、微细粒子的悬浮液特别有效，制药及饮料的无菌过滤、酶的分离和纯水制备都是它的典型应用。传统过滤面对细颗粒时滤饼阻力大、滤液容易浑浊，膜分离则靠选择性透过层截留，更适合这类难分离物料。","ev":"膜分离技术对含固量低、微细粒子的悬浮液分离特别有效，在医药、食品工业上已获得了广泛使用","keys":[],"ref":"第 113 页","hint":"","score":2},{"i":126,"n":127,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-001","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"下列哪一项不属于传热的三种基本方式？","o":["热传导","热对流","热辐射","热扩散"],"a":["D"],"exp":"教材指出，有温差时热能会以热传导、热对流和热辐射三种方式中的一种或多种从高温处传向低温处。热扩散描述的是浓度梯度引起的物质迁移，属于传质范畴，不是热量传递方式。","ev":"由热力学第二定律可知，只要在物体内部或物体间有温度差存在，热能就必然以热传导(heat conduction) 、热对流(heat convection)和热辐射(heat radiation) 三种方式中的一种或多种从高温处向低温处传递。","keys":[],"ref":"第 117 页","hint":"","score":2},{"i":127,"n":128,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-002","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"工业生产中换热器内两种流体的接触方式有哪三种？","o":["直接接触式、蓄热式、间壁式","逆流、并流、折流","管程、壳程、错流","夹套式、蛇管式、套管式"],"a":["A"],"exp":"按两流体是否混合及换热方式，教材把接触方式分为直接接触式、蓄热式和间壁式，其中间壁式在工业上最常用。逆流、并流、折流是流动型式，管程与壳程是列管式换热器的流道，夹套、蛇管、套管则是间壁式换热器的具体结构。","ev":"换热器中两流体接触方式有以下三种。","keys":[],"ref":"第 118 页","hint":"","score":2},{"i":128,"n":129,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"傅里叶定律表达式中负号的含义是什么？","o":["温度沿传热方向升高","导热速率一定为负值","传热方向与温度梯度方向相反","热导率取负值"],"a":["C"],"exp":"温度梯度规定沿温度升高的方向为正，而热量总是从高温传向低温，所以导热方向与温度梯度方向相反，表达式前加负号正是表示这一点。热导率是正值物性，导热速率的大小也取正值。","ev":"导热速率与微元所在处的温度梯度成正比，其中负号的含义是传热方向与温度梯度的方向相反。","keys":[],"ref":"第 119 页","hint":"","score":2},{"i":129,"n":130,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-012","t":"single","mode":"","bloom":"理解","diff":"medium","q":"温度梯度是向量，其正方向是如何规定的？","o":["沿等温面切线方向，指向温度降低","沿等温面法线方向，指向温度降低","沿等温面切线方向，指向温度升高","沿等温面法线方向，指向温度升高"],"a":["D"],"exp":"温度梯度定义为温度场内某点沿等温面法线方向的温度变化率，是垂直于等温面的向量；按教材规定，其正方向为温度升高的方向。沿等温面切线方向温度不变化，梯度不可能沿切线；导热方向与温度梯度相反，靠公式中的负号表示，并不改变梯度的正方向。","ev":"可见，温度梯度是指温度场内某一点在等温面法线方向上的温度变化率，是与等温面垂直的 向量，其正方向规定为温度升高的方向。","keys":[],"ref":"第 119 页","hint":"","score":2},{"i":130,"n":131,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-026","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"关于传热速率与热通量，下列说法正确的是哪一项？","o":["热通量是单位时间内通过单位传热面积传递的热量","热通量等于传热速率乘以传热面积","传热速率是单位时间内通过单位传热面积传递的热量","传热速率与热通量的单位完全相同"],"a":["A"],"exp":"传热速率指单位时间内通过传热面传递的热量，热通量则是单位时间内通过单位传热面积传递的热量，二者相差一个传热面积，所以热通量等于传热速率除以面积。A 正确；B 把除法说成乘法；C 把两个概念对调；D 中传热速率单位为 W，热通量单位为 W·m⁻²，量纲并不相同。","ev":"传热速率 Q(rate of heat transfer)是指在传热设备中单位时间内通过传热面传递的热量，而热通量 g Cheat flux)是指单位时间内通过单位传热面积传递的热量。","keys":[],"ref":"第 119 页","hint":"","score":2},{"i":131,"n":132,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-multiple-007","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"热导率的数值与下列哪些因素有关？","o":["物质的结构","物质的组成","温度与压强","材料表面可见的颜色"],"a":["A","B","C"],"exp":"热导率是物质的基本物理性质，其数值与物质的结构、组成、温度、压强等许多因素有关，可用实验方法测定，故 A、B、C 正确。材料表面可见的颜色反映的是对可见光的反射特性，并不决定导热能力，D 不是热导率的影响因素。","ev":"作为物质的基本物理性质之一，热导率的数值与物质的结构、组成、温度、压强等许多因素有关，可用实验的方法测得。","keys":[],"ref":"第 120 页","hint":"","score":3},{"i":132,"n":133,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-004","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"一般情况下，金属、液体和气体的热导率从大到小的顺序是什么？","o":["金属、气体、液体","金属、液体、气体","气体、液体、金属","液体、金属、气体"],"a":["B"],"exp":"教材指出一般金属的热导率最大，液体较小，气体最小。这是因为金属靠自由电子导热，液体靠分子振动，气体分子间距大、碰撞传能能力弱；气体热导率小对导热不利，却因此常被用作保温材料中的隔热介质。","ev":"一般说来，金属的热导率最大，液体的较小，气体的最小。","keys":[],"ref":"第 120 页","hint":"","score":2},{"i":133,"n":134,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"大多数金属材料的热导率温度系数为负值，即热导率随温度升高而减小；多数非金属材料则相反。","o":["正确","错误"],"a":["T"],"exp":"教材指出固体热导率与温度近似成线性关系，温度系数对大多数金属为负值，对大多数非金属为正值，因此不能一概认为温度升高热导率就增大。把金属和非金属的温度系数混为一谈，是本题常见的错误。","ev":"a 为温度系数，1/C ，对大多数金属材料为负值，而对大多数非金属材料则为正值。","keys":[],"ref":"第 120 页","hint":"","score":2},{"i":134,"n":135,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-005","t":"single","mode":"","bloom":"理解","diff":"medium","q":"单层平壁定态导热，若热导率按常数处理，壁内温度沿壁厚如何分布？","o":["按对数规律分布","按抛物线规律分布","壁内温度处处相等","按线性规律分布"],"a":["D"],"exp":"定态下通过各等温面的热通量相同，热导率又取常数，因此温度梯度为常数，温度沿壁厚按线性规律变化。按对数规律分布是圆筒壁的特征；抛物线分布和温度处处相等都不符合一维定态平壁导热的条件。","ev":"可见，平壁定态热传导中，若材料热导率按常数处理，则平壁内温度按线性规律分布。","keys":[],"ref":"第 122 页","hint":"","score":2},{"i":135,"n":136,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"单层平壁定态导热中，下列哪种情况会使导热热阻增大？","o":["增大平壁的导热面积","减小平壁的厚度","选用热导率更小的材料","提高平壁两侧的温度差"],"a":["C"],"exp":"平壁导热热阻等于壁厚除以热导率与导热面积的乘积，壁厚越大、面积越小、热导率越小，热阻就越大，因此选用热导率更小的材料会使热阻增大。增大导热面积和减小壁厚都使热阻减小；提高温差只增大导热推动力，并不改变热阻本身。","ev":"另外，导热层厚度越大，导热面积和热导率越小，则导热热阻越大。","keys":[],"ref":"第 122 页","hint":"","score":2},{"i":136,"n":137,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-006","t":"single","mode":"","bloom":"分析","diff":"medium","q":"单层圆筒壁定态导热中，通过各等温面的导热速率和热通量如何变化？","o":["导热速率相等，热通量随半径增大而减小","导热速率和热通量都随半径增大而减小","导热速率随半径增大而增大，热通量不变","导热速率和热通量都保持不变"],"a":["A"],"exp":"定态下没有热量积累，通过各等温面的导热速率必然相等；但等温面面积随半径增大，热通量等于导热速率除以面积，所以热通量随半径增大而减小。平壁面积不变，热通量才保持不变，不要把两者混淆。","ev":"在圆筒壁的一维定态热传导中,通过各等温面的导热速率亦相等，但导热热通量随等温面半径的增大而减小。","keys":[],"ref":"第 123 页","hint":"","score":2},{"i":137,"n":138,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-027","t":"single","mode":"","bloom":"理解","diff":"medium","q":"单层圆筒壁定态导热且热导率取常数时，壁内温度沿半径方向如何变化？","o":["按线性规律分布","按对数规律变化","按抛物线规律分布","沿半径方向处处相等"],"a":["B"],"exp":"圆筒壁的等温面面积随半径增大而增大，导热速率不变而热通量沿半径减小，温度梯度不再是常数，积分结果是温度随半径按对数规律变化，故 B 正确。线性分布是平壁在热导率为常数时的特征；抛物线分布和温度处处相等都不满足一维定态导热的条件。","ev":"可见，壁内各等温面温度沿半径方向按对数规律变化。","keys":[],"ref":"第 123 页","hint":"","score":2},{"i":138,"n":139,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-truefalse-002","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"多层平壁定态导热时，总温差按各层热阻的大小分配，热阻越大的层温度降也越大。","o":["正确","错误"],"a":["T"],"exp":"定态导热时各层的温度降等于导热速率与该层热阻的乘积，热阻越大分到的温度降越大，总温差就是这样按热阻比例分配的。原题说各层温度降相同，只有各层热阻恰好相等时才成立，把特例当成了普遍规律。","ev":"另外,也正是因为各层的导热速率相等，哪层的温差(推动力)越大，哪层的热阻也越大，反之亦然。","keys":[],"ref":"第 125 页","hint":"","score":2},{"i":139,"n":140,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"对流传热中，热阻主要集中在哪里？","o":["过渡区","管道中心","紧邻壁面的层流内层","湍流主体"],"a":["C"],"exp":"湍流主体中流体质点剧烈混合，温度趋于均匀，热阻很小；紧邻壁面的层流内层只能靠导热传递热量，而流体热导率通常不大，所以该层虽然很薄，热阻和温度梯度却很大。强化对流传热的关键之一就是减薄层流内层。","ev":"尽管层流内层很薄，但由于其中发生的是借分子热运动的导热且流体热导率往往不大，所以该区域热阻很大，温度梯度很大。","keys":[],"ref":"第 126 页","hint":"","score":2},{"i":140,"n":141,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"对流传热就是热对流，二者都是指流体内部因温度不同而产生的环流。","o":["正确","错误"],"a":["F"],"exp":"热对流是流体内部质点相对运动引起的热量传递，而对流传热特指流动着的流体与固体壁面之间的传热过程。工程上讨论的对流传热系数描述的是流体与壁面之间的换热，二者概念范围不同，不能等同。","ev":"对流传热不同于一般意义上的热对流，而是特指流动着的流体与固体壁面之间的热量传递过程。","keys":[],"ref":"第 126 页","hint":"","score":2},{"i":141,"n":142,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-multiple-001","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"影响对流传热系数的主要因素包括哪些？","o":["引起流动的原因","流体的性质","传热面的情况","换热器的安装高度"],"a":["A","B","C"],"exp":"教材把影响因素归为四类：强制对流还是自然对流、流体的密度黏度热导率比热容等性质、传热面的形状尺寸与摆放方式、以及流动型态和湍动程度。安装高度并不直接进入关联式，故 D 不属于主要因素。","ev":"影响对流传热系数的因素包括: 引起流动的原因、流体本身的性质、传热面的情况和流体流动状况等方面。","keys":[],"ref":"第 127 页","hint":"","score":3},{"i":142,"n":143,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-029","t":"single","mode":"","bloom":"理解","diff":"easy","q":"一般情况下，强制对流传热系数与自然对流传热系数相比如何？","o":["强制对流远低于自然对流","两者总是相等","大小只取决于壁面材料","强制对流远高于自然对流"],"a":["D"],"exp":"强制对流由泵或风机等外力造成，流体的湍动程度和壁面附近的温度梯度都远大于自然对流，所以对流传热系数远高于自然对流，D 正确。自然对流只靠流体内部密度差引起的环流，强度有限；两者数量级不同，不会总相等，系数也不由壁面材料单独决定。","ev":"一般来说,强制对流所造成的流体湍动程度和壁面附近的温度梯度远大于自然对流，因而其对流传热系数远高于自然对流传热系数。","keys":[],"ref":"第 127 页","hint":"","score":2},{"i":143,"n":144,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-multiple-008","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于流体物性对对流传热的影响，下列说法正确的有哪些？","o":["黏度越小，层流内层越薄","密度越大，层流内层越厚","热导率越大，导热性能越好","热容越大，相同温变时吸收或放出的热量越多"],"a":["A","C","D"],"exp":"黏度越小，壁面附近流体越容易流动，层流内层越薄；热导率越大，层流内层中的导热能力越强；热容越大，相同温度变化下能吸收或放出更多热量，故 A、C、D 正确。密度越大惯性力越大，反而使层流内层变薄，B 的说法与教材相反。","ev":"流体的黏度越小则层流内层越薄;，热导率越大，则导热性能越好; 热容越大，则相同流体温变时吸收或放出的热量越多; 流体的密度越大则惯性力越大","keys":[],"ref":"第 128 页","hint":"","score":3},{"i":144,"n":145,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-008","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在自然对流传热的特征数关联式中，代表自然对流影响的是哪个准数？","o":["Pr","Gr","Nu","Re"],"a":["B"],"exp":"Re 代表流动型态与湍动程度，Pr 代表流体物性对传热的影响，Gr 代表自然对流的影响，Nu 是包含对流传热系数的待定特征数。自然对流靠密度差引起的环流，Gr 越大环流越强，故应选 Gr。","ev":"Gr 为格拉晓夫(Grashof)数，代表自然对流对对流传热的影响。","keys":[],"ref":"第 128 页","hint":"","score":2},{"i":145,"n":146,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-truefalse-017","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"气体被加热时，层流内层中温度较高、黏度较小，因此对流传热系数增大。","o":["正确","错误"],"a":["F"],"exp":"气体的黏度随温度升高而增大，加热时层流内层温度高、黏度大，液层增厚，对流传热系数反而减小，所以该说法错误。液体通常表现为温度升高黏度减小，不能把液体的规律直接套用到气体上。","ev":"气体的欠度通常是随温度升高而加大的，当气体被加热时，层流内层中的温度高、黏度大，故层流内层厚度大，对流传热系数小","keys":[],"ref":"第 129 页","hint":"","score":2},{"i":146,"n":147,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-015","t":"single","mode":"","bloom":"应用","diff":"medium","q":"管内强制湍流换热时，若管长与管径之比小于50，按长管关联式计算的结果应如何修正？","o":["乘以大于1的系数，因为短管内层流内层较薄、热阻较小","乘以小于1的系数，因为短管内流动未充分发展","不必修正，长径比不影响对流传热系数","把特征尺寸改为管长后直接计算"],"a":["A"],"exp":"长径比小于50时进口段占比较大，流动未充分发展，层流内层较薄、热阻较小，实际对流传热系数高于按充分发展长管公式算得的值，所以原计算结果偏低，应乘以大于1的系数。乘小于1的系数用于过渡区的修正；忽略长径比影响或改取管长作特征尺寸都不符合关联式的用法。","ev":"因短管内流动未充分发展，层流内层较薄，热阻小，按式(3-30)计算的结 果会偏低。通常的处理方法是将其计算结果乘以大于 1.0 的系数","keys":[],"ref":"第 130 页","hint":"","score":2},{"i":147,"n":148,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-028","t":"single","mode":"","bloom":"理解","diff":"medium","q":"流体垂直流过管束时，在同样的雷诺数下，错列与直列的平均对流传热系数相比如何？","o":["错列时更大","直列时更大","两者完全相同","只与管径有关，与排列方式无关"],"a":["A"],"exp":"错列排列时流体绕流受到的扰动更大，边界层反复被破坏，因此在相同雷诺数下平均对流传热系数比直列大，故 A 正确。直列时流道较直、扰动弱，系数较小；两种排列的流动与换热情况不同，系数不可能相同，也不只由管径决定。","ev":"又由于错列时流体受扰动更大，因而在同样的 Re 下，错列的平均对流传热系数要比直列时大。","keys":[],"ref":"第 133 页","hint":"","score":2},{"i":148,"n":149,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-009","t":"single","mode":"","bloom":"理解","diff":"medium","q":"滴状冷凝的传热系数比膜状冷凝大很多，工业冷凝器为什么仍按膜状冷凝设计？","o":["膜状冷凝的传热系数更大","滴状冷凝在工业上根本无法出现","膜状冷凝不需要冷凝液膜","滴状冷凝难以持久维持，运行一段时间后一般转为膜状冷凝"],"a":["D"],"exp":"滴状冷凝时液滴不能润湿壁面，壁面可直接暴露给蒸气，热阻小、传热系数大；但这种状态难以长期保持，运行一段时间后一般发展为膜状冷凝。因此工业冷凝器按膜状冷凝设计，强化方向是设法减薄液膜。","ev":"所以工业冷凝器的设计皆按膜状冷凝来处理。","keys":[],"ref":"第 137 页","hint":"","score":2},{"i":149,"n":150,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-truefalse-004","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"由于滴状冷凝传热系数高，工业冷凝器设计时应按滴状冷凝计算。","o":["正确","错误"],"a":["F"],"exp":"滴状冷凝虽热阻小、传热系数大，但工业上难以持久维持，运行一段时间后一般转为膜状冷凝，所以冷凝器按膜状冷凝设计。膜状冷凝的热阻几乎全部集中在液膜内，减薄液膜才是强化方向。","ev":"因而滴状冷凝的传热系数比膜状冷凝时大很多。","keys":[],"ref":"第 137 页","hint":"","score":2},{"i":150,"n":151,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-014","t":"single","mode":"","bloom":"分析","diff":"medium","q":"蒸气冷凝时混入微量不凝性气体，为什么会使冷凝传热系数大幅下降？","o":["不凝性气体在液膜表面浓集形成气膜，额外增加热阻","不凝性气体使蒸气的冷凝温度显著升高","不凝性气体与冷凝液发生化学反应","不凝性气体降低了冷凝液的密度"],"a":["A"],"exp":"不凝性气体不能在壁面上冷凝，会在液膜表面逐渐浓集并形成一层气膜；气体热导率很小，这层气膜相当于串联了一个很大的附加热阻，使冷凝传热系数显著下降。冷凝温度主要由压力决定，不会因微量不凝气明显升高；化学反应和密度变化也不是教材给出的原因。","ev":"蒸气冷凝于壁面时，如果蒸气中含有微量的不凝性气体，如空 气等，则它会在液膜表面浓集形成气膜。这相当于额外附加了一层热阻","keys":[],"ref":"第 139 页","hint":"","score":2},{"i":151,"n":152,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-truefalse-008","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"层流液膜冷凝时，冷凝液膜两侧的温差增大会使液膜变厚，平均冷凝传热系数反而下降。","o":["正确","错误"],"a":["T"],"exp":"温差加大虽然使冷凝量增加，但凝结的液体增多后液膜变厚，导热热阻上升，平均冷凝传热系数随之降低。原题把温差增大说成提高冷凝传热系数的因素，只看到冷凝量增加，忽略了液膜增厚这一主导后果。","ev":"液膜层流情况下,者 Az 增大，则莱气冷凝速率加大，液膜厚度增 厚， 平均冷凝传热系数降低。","keys":[],"ref":"第 139 页","hint":"","score":2},{"i":152,"n":153,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-truefalse-009","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"蒸气流速较高且与液膜流向相同时，会阻碍液膜流动、使冷凝传热系数下降。","o":["正确","错误"],"a":["F"],"exp":"流向相同时蒸气的摩擦力会加速液膜流动，使液膜变薄，冷凝传热系数增大；流向相反时才会阻碍液膜流动、使液膜变厚、传热系数减小。正因为如此，设计冷凝器时常把蒸气入口设在设备上部，使蒸气与液膜同向。","ev":"蒸气与液膜流向相同时，会加速液膜流动，使液膜变薄，传热系数 增大","keys":[],"ref":"第 139 页","hint":"","score":2},{"i":153,"n":154,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-multiple-004","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"为强化蒸气冷凝传热，下列哪些措施符合减薄冷凝液膜的思路？","o":["在冷凝壁面上涂覆一层低热导率的涂层","在垂直壁面上开纵向沟槽","在壁面上安装金属丝或翅片，使冷凝液向其附近集中","对水平管束尽量减少垂直方向上的管排数目"],"a":["B","C","D"],"exp":"蒸气冷凝的主要热阻集中在冷凝液膜，强化应从减薄液膜入手：垂直壁面开纵向沟槽、安装金属丝或翅片使冷凝液汇集、减少水平管束垂直方向的管排数，都能减薄液膜并提高传热系数。涂覆低热导率涂层只会额外增加热阻，与强化方向相反。","ev":"前已述及，蓉气冷凝过程的主要热阻集中于冷族液膜，故设法减薄冷凝液膜的厚度是强 化该过程的正确思路。","keys":[],"ref":"第 140 页","hint":"","score":3},{"i":154,"n":155,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-single-016","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"工业上的沸腾设备一般应维持在哪个区域工作？","o":["自然对流区","不稳定膜状沸腾区","稳定膜状沸腾区","核状沸腾区"],"a":["D"],"exp":"核状沸腾区气泡不断生成、长大并脱离壁面，对贴壁液层扰动强烈，沸腾传热系数较大，而壁温又不高，所以工业沸腾设备一般维持在该区。自然对流区传热系数小；膜状沸腾区气膜热阻大、传热系数急剧下降，稳定膜状沸腾还要求很高的壁温。","ev":"工业上的沸腾设备一般应维持在核状沸腾区工作，此阶段沸腾传热系数较大且上,不高。","keys":[],"ref":"第 141 页","hint":"","score":2},{"i":155,"n":156,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-multiple-005","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于换热器的热量平衡方程与总传热速率方程，下列说法正确的有哪些？","o":["只用一个热量平衡方程就能确定冷、热流体的两个出口温度","热量平衡方程反映热流体放热与冷流体吸热之间的能量守恒关系","总传热速率方程把换热量与总传热系数、传热面积和平均温差联系起来","两式联立是解决间壁式换热过程计算问题的核心"],"a":["B","C","D"],"exp":"热量平衡方程体现能量守恒，但方程中常有两个出口温度未知，单独使用无法求解，所以 A 错误。总传热速率方程给出换热量与总传热系数、传热面积和平均温差的关系，与热量平衡方程联立才能同时确定两个未知温度，这正是设计型和操作型计算的出发点。","ev":"热量平衡方程反映了传热过程的基本规律，但方程中至少有冷、热流体的两个出口温度 往往是未知的，故单独使用该方程无法解决传热过程的基本问题。为此，还要利用总传热系 数和总传热速率方程。","keys":[],"ref":"第 142 页","hint":"","score":3},{"i":156,"n":157,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-single-019","t":"single","mode":"","bloom":"理解","diff":"easy","q":"建立换热器热量平衡方程时，热流体放出的热量等于冷流体吸收的热量，这一关系成立的前提是什么？","o":["两种流体都必须发生相变","换热器保温良好，热损失可以忽略","两种流体的质量流量必须相等","换热器必须采用逆流操作"],"a":["B"],"exp":"热量平衡方程的依据是能量守恒，只有换热器保温或隔热良好、热损失可以忽略时，热流体放出的热量才等于冷流体吸收的热量。流体有无相变只影响方程的具体形式，流量相等和逆流操作都不是建立该方程的前提。","ev":"热损失可以忽略，则在换热器中单位时间内热流体放出的热量等于冷 流体吸收的热量。","keys":[],"ref":"第 142 页","hint":"","score":2},{"i":157,"n":158,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-single-030","t":"single","mode":"","bloom":"理解","diff":"medium","q":"同一台管式换热器，分别取换热管内表面和外表面为基准计算总传热系数，结果如何？","o":["两个数值相同，因为换热过程没有改变","两个数值不同，但它们描述的是同一个换热过程","取内表面为基准的数值一定更大","只有取外表面为基准才符合能量守恒"],"a":["B"],"exp":"总传热系数定义式中的传热面积随所选基准而变，所以同一台换热器以内表面和外表面为基准会得到不同的数值，但两者描述的是同一个换热过程，B 正确。数值大小取决于内外表面积之比，不能一概说内表面基准更大；基准选择只影响数值表达，不影响能量守恒。","ev":"由式(3-61)可以看出，对同一个(管式)换热器，如所选用的基本传热面不同，总传热系数 开 具有不同的数值。","keys":[],"ref":"第 143 页","hint":"","score":2},{"i":158,"n":159,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-truefalse-018","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"同一台换热器无论取内表面还是外表面为基准，总传热系数的数值都相同，因此基准可以随意选取。","o":["正确","错误"],"a":["F"],"exp":"总传热系数与所选基准传热面绑定，取内表面或外表面会得到不同数值，所以不能说数值相同、可以随意选取。工程上习惯以换热管外表面为基准，此时传热面积也必须取外表面积，二者必须一致。","ev":"在传热计算中习惯上采用换热管的外表面为基准，本章中如不做特别说明，所用的天 值均是以换热管的外表面为基准的。","keys":[],"ref":"第 143 页","hint":"","score":2},{"i":159,"n":160,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-single-017","t":"single","mode":"","bloom":"理解","diff":"medium","q":"换热面上的污垢层虽然很薄，却会使传热明显恶化，主要原因是什么？","o":["污垢层使传热面积大幅减小","污垢层热导率很小，附加热阻大","污垢层使管壁厚度减小","污垢层使流体流速显著增大"],"a":["B"],"exp":"污垢层厚度虽小，但其热导率往往远小于金属管壁，按热阻等于厚度除以热导率计算，仍会形成可观的附加热阻，使总传热系数下降。污垢不会明显减小传热面积，也不会减薄管壁；结垢后流道变小，流速通常不会显著增大。","ev":"污拍层虽然很薄，但由于其热导率往往很小.因而对传热过程的影响不 容忽视。","keys":[],"ref":"第 144 页","hint":"","score":2},{"i":160,"n":161,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-multiple-002","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"间壁式换热器的总热阻由哪些热阻组成？","o":["管壁导热热阻","管外污垢热阻与管外对流传热热阻","换热器外壳向环境的辐射热阻","管内对流传热热阻与管内污垢热阻"],"a":["A","B","D"],"exp":"以换热管外表面为基准时，总热阻是五项基本热阻的加和：管外对流传热、管外污垢、管壁导热、管内污垢和管内对流传热，A、B、C 已把它们列全。外壳向环境的散热属于设备热损失，不在两流体间传热的总热阻之内。","ev":"由式(3-63)可以看出，实际上两流体通过换热管的换热过程总热阻是 5 项基本热阻的加和，即管外流体的对流传热热阻、管外表面的污垢热阻、管壁热阻、管内表面污垢热阻、管内流体的对流传热热阻。","keys":[],"ref":"第 145 页","hint":"","score":3},{"i":161,"n":162,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-truefalse-005","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"总传热系数总是接近两侧对流传热系数中较大的那个。","o":["正确","错误"],"a":["F"],"exp":"总热阻由两侧对流传热热阻、污垢热阻和管壁热阻串联而成，总传热系数小于任一侧的对流传热系数，并接近其中较小的那个，因为小对流传热系数对应大热阻、占总热阻的份额大。要提高总传热系数，应优先提高较小的一侧。","ev":"总传热系数小于两侧流体的对流传热系数，且总是接近于较小的对流传热系数。","keys":[],"ref":"第 145 页","hint":"","score":2},{"i":162,"n":163,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-single-010","t":"single","mode":"","bloom":"理解","diff":"medium","q":"冷、热流体进出口温度一定时，下列流型中平均传热温差最大的是哪一种？","o":["逆流","并流","折流","错流"],"a":["A"],"exp":"逆流时换热器两端温差都较大，对数平均温差最高；并流时一端温差很小，平均温差最小；折流和错流的平均温差介于两者之间，需在逆流基础上乘以小于1的温差校正系数。因此在同样任务下逆流所需传热面积最小。","ev":"在流体进、出口温度一定的情况下，逆流的平均温差最大","keys":[],"ref":"第 150 页","hint":"","score":2},{"i":163,"n":164,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-single-018","t":"single","mode":"","bloom":"理解","diff":"medium","q":"折流或错流换热器平均温差的校正系数 φ 代表什么？","o":["总传热系数接近经验值的程度","污垢热阻占总热阻的比例","该流型接近逆流的程度","换热管排列的紧凑程度"],"a":["C"],"exp":"折流和错流先按逆流算出对数平均温差，再乘以校正系数 φ 得到实际平均温差，φ 越接近1说明该流型的平均温差越接近逆流。综合传热与阻力两方面，教材建议 φ 最好大于0.9、不能低于0.8；它与总传热系数、污垢热阻和管子排列无关。","ev":"温差校正因子 2 代表了某种流型在给定工况下接 近逆流的程度。综合利弊，最好使 p 大于 0.9，不能低于 0. 8。","keys":[],"ref":"第 150 页","hint":"","score":2},{"i":164,"n":165,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-truefalse-006","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"工艺上要求冷流体被加热时不得超过某一温度，此时宜采用并流操作。","o":["正确","错误"],"a":["T"],"exp":"并流时冷流体出口温度受热流体出口温度限制，不会超过热流体出口温度，可避免冷流体局部过热；这正是并流相对逆流的优点。代价是平均传热温差较小，完成同样任务需要更大的传热面积。","ev":"例如，工艺上要求冷流体被加热时不得超过某一温度或热流体被冷却时不得低于某一温度，则宜采用并流。","keys":[],"ref":"第 150 页","hint":"","score":2},{"i":165,"n":166,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-truefalse-010","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"换热器采用折流是为了提高平均传热温差。","o":["正确","错误"],"a":["F"],"exp":"采用折流的目的是提高对流传热系数，从而提高总传热系数，以便提高传热速率或减小传热面积；折流的平均温差反而比逆流小，是以牺牲平均温差为代价换取传热系数的提高。所以设计时要权衡两者，并把温差校正系数控制在0.8以上。","ev":"采用折流的目的是为了提高对流传热系数，从而提高总传热系数，以此来达到提高 传热速率或减小传热面积的目的，但这是以牺牲平均温差为代价的。","keys":[],"ref":"第 150 页","hint":"","score":2},{"i":166,"n":167,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-truefalse-011","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"换热面两侧对流传热系数相差很大时，壁温总是接近对流传热系数较小一侧的流体温度。","o":["正确","错误"],"a":["F"],"exp":"传热面两侧的温度降之比等于两侧热阻之比，哪侧热阻大哪侧温度降就大；壁温总是接近于对流传热系数较大、热阻较小一侧的流体温度。对流传热系数小的一侧热阻大、温度降大，其流体温度与壁温的差距反而大。","ev":"即壁温总是接近于对流传热系数较大或者说热阻较小 一侧流体的温度。","keys":[],"ref":"第 154 页","hint":"","score":2},{"i":167,"n":168,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-truefalse-019","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"当设备壁面较薄且热导率很大时，计算壁温可近似认为壁面两侧温度相等。","o":["正确","错误"],"a":["T"],"exp":"壁薄且热导率大时管壁的导热热阻很小，两侧壁温差别可以忽略，工程上常作等壁温的简化处理，故该说法正确。若壁较厚或材料热导率小，壁面两侧温差不能忽略，就应分别计算两侧壁温。","ev":"如果设备壁面不是很厚，且热导率很大，则在计算壁温时常采用简化处理，认为壁面两侧的温度基本相等","keys":[],"ref":"第 154 页","hint":"","score":2},{"i":168,"n":169,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-single-031","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"表面磨光的铜反射率可达0.97，它最接近哪一种理想物体？","o":["黑体","透热体","白体（镜体）","灰体"],"a":["C"],"exp":"反射率接近1、吸收率和透过率接近0的理想物体称为绝对白体或镜体，磨光铜表面正接近这一状态，故 C 正确。黑体要求吸收率为1，透热体要求透过率为1，都与磨光金属的高反射特征相反；灰体指吸收率不随波长变化，并不等同于高反射表面。","ev":"实际物体也只能一定程度地接近白体，如表面磨光的铜，其反射率为 0. 97。","keys":[],"ref":"第 155 页","hint":"","score":2},{"i":169,"n":170,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-truefalse-020","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"多原子气体和不对称双原子气体对热辐射线没有选择性，能透过全部波段的辐射能。","o":["正确","错误"],"a":["F"],"exp":"只有单原子气体和对称双原子气体才可近似视为透热体；多原子气体和不对称双原子气体能有选择地吸收和发射某些波段的辐射能，故该说法错误。把水蒸气、二氧化碳等气体当作完全透明，会低估烟气与壁面之间的辐射换热。","ev":"而多原子气体和不对称的双原子气体则能有选择地吸收和发射某些波段范围的辐射能。","keys":[],"ref":"第 155 页","hint":"","score":2},{"i":170,"n":171,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-single-020","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"同一种金属材料，表面氧化后的黑度与表面磨光时相比如何变化？","o":["氧化后黑度更大","氧化后黑度更小","两者黑度完全相同","黑度只与温度有关，与表面状态无关"],"a":["A"],"exp":"黑度与材料种类、表面温度和表面状况有关，表面氧化材料的黑度值比表面磨光材料的大，非金属固体的黑度一般也比金属大。磨光表面反射能力强，接近黑体的程度低，黑度反而小；黑度并非只由温度决定，粗糙度和氧化程度都会改变它。","ev":"表面氧化材料的黑度值比表面磨光材料的大， 非金属国体材料的黑度值一般比金属大","keys":[],"ref":"第 156 页","hint":"","score":2},{"i":171,"n":172,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-single-032","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"下列哪一项不属于黑度的主要影响因素？","o":["物体的种类","表面温度","表面氧化程度","物体的体积大小"],"a":["D"],"exp":"黑度是表征实际物体接近黑体程度的表面辐射性质，主要与物体种类、表面温度和表面状况有关，粗糙度、氧化程度都会改变黑度，所以 A、B、C 都是影响因素。物体的体积大小不进入黑度的定义，同一材料不论大小，其表面黑度基本相同，因此 D 不属于主要影响因素。","ev":"黑度是物体的一种性质，主要与物体的种类、表面温度、表面状况(如粗糙度、表面氧化程度等)等因素有关","keys":[],"ref":"第 156 页","hint":"","score":2},{"i":172,"n":173,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-truefalse-012","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"黑体辐射能力随绝对温度的升高按四次方规律急剧增大，这一规律与导热、对流中的线性关系截然不同。","o":["正确","错误"],"a":["T"],"exp":"斯蒂芬-玻尔兹曼定律指出，黑体的辐射能力与绝对温度的四次方成正比，温度提高一倍，辐射能力就增大到原来的十六倍。原题把它说成与绝对温度的一次方成正比，忽略了四次方带来的强烈非线性，也低估了高温下辐射的地位。","ev":"斯蒂芬-玻尔效曼定律表明.黑体的辐射能力遵循绝对温度的四次方律. 这是与热传导 和对流完全不同的规律。","keys":[],"ref":"第 156 页","hint":"","score":2},{"i":173,"n":174,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-truefalse-013","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"表面磨光的金属，其黑度通常比同种金属表面氧化时小。","o":["正确","错误"],"a":["T"],"exp":"黑度与表面状况密切相关，表面氧化材料的黑度值比表面磨光材料的大；磨光表面反射能力强，接近黑体的程度低，黑度小。常用材料表中磨光铜、磨光铝的黑度都明显低于其氧化状态，可作为佐证。","ev":"表面氧化材料的黑度值比表面磨光材料的大， 非金属国体材料的黑度值一般比金属大","keys":[],"ref":"第 156 页","hint":"","score":2},{"i":174,"n":175,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-single-021","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在散热物体周围设置隔热板，为什么能减少辐射热损失？","o":["隔热板把辐射能全部吸收后不再向外辐射","隔热板使总辐射系数减小，且板温高于周围环境","隔热板提高了散热物体的表面温度","隔热板把辐射传热转变成了导热"],"a":["B"],"exp":"设置隔热板后，散热物体不再向温度较低的环境直接辐射，而是向温度较高的近处隔热板辐射，总辐射系数减小，两者的温差也减小，所以辐射热损失下降。隔热板仍会向外辐射，不会把能量全部截留；它既不提高热源温度，也不是把辐射变成导热。","ev":"在散热物体周围设置隔热板，使散热物体向周围“大环境”的辐射传热转变为向很近的物 体辐射。这种转变不仅使辐射传热的总辐射系数减小，而且隔热板的温度也高于周围的“大 环境”，因而能减少辐射热损失 。","keys":[],"ref":"第 159 页","hint":"","score":2},{"i":175,"n":176,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-multiple-003","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"为消除或减小热应力，列管式换热器可采用哪些结构型式？","o":["U形管式","夹套式","带补偿圈的固定管板式","浮头式"],"a":["A","C","D"],"exp":"固定管板式靠补偿圈的弹性变形吸收部分热膨胀；浮头式让一端管板自由伸缩，可彻底消除热应力并便于抽出管束；U 形管式使每根管子两端固定在同一管板上、可自由伸缩。夹套式是容器外壁加热结构，不属于热补偿型式。","ev":"因此，必须在换热器结构设计上采取消除或减小热应力的措施，称之为热补偿。","keys":[],"ref":"第 162 页","hint":"","score":3},{"i":176,"n":177,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-multiple-006","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"与列管式换热器相比，板式换热器具有哪些优点？","o":["总传热系数大","结构紧凑，单位体积提供的传热面积大","允许的操作压力很高","可增减板片以调节传热面积"],"a":["A","B","D"],"exp":"板片压成波纹后流体湍动程度高，总传热系数大；结构紧凑，单位体积传热面积约为列管式的数倍；还可根据需要增减板片调节面积，安装检修也方便。板式换热器的短板正是操作压力较低，一般不超过2MPa，操作温度也不能太高，所以 C 错误。","ev":"主要优点是: 总传热系数大，这是因为换热板被压制成波纹或沟槽，流体流过时消动程度 高，例如水-水换热时开 值约为列管换热器的 1.5一2.0 倍; 结构紧凑， 单位体积提供的传 热面积约为列管式换热器的6 倍: 操作灵活，可根据需要调节板片数以增减传热面积","keys":[],"ref":"第 165 页","hint":"","score":3},{"i":177,"n":178,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-single-011","t":"single","mode":"","bloom":"理解","diff":"medium","q":"板式换热器的主要缺点是什么？","o":["不能通过增减板片调节传热面积","单位体积提供的传热面积小","允许操作压力较低，操作温度不能太高","传热系数低且结构不紧凑"],"a":["C"],"exp":"板式换热器板片压成波纹，湍动强、总传热系数大，结构紧凑，还可增减板片调节面积，所以 B、C、D 都说反了。它的短板是垫片耐压耐温有限，操作压力一般不超过 2 MPa，温度过高时垫圈易损坏渗漏。","ev":"其主要缺点是允许的操作压力较低，一般不允许超过 2MPa，操作温度不能太高","keys":[],"ref":"第 165 页","hint":"","score":2},{"i":178,"n":179,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-single-022","t":"single","mode":"","bloom":"应用","diff":"medium","q":"两侧流体的对流传热系数相差很大时，宜在传热系数小的一侧采用什么强化措施？","o":["减小该侧的传热面积","增大该侧流道的直径以降低流速","在该侧采用翅片管扩展传热面并增强湍动","在该侧壁面涂覆绝热层"],"a":["C"],"exp":"两侧对流传热系数之比达到3∶1或更大时，热阻主要集中在系数小的一侧；在该侧加装翅片既可扩大传热面积，又能增加流体湍动，从而有效提高传热效果。减小面积、降低流速或涂绝热层都会使该侧的传热进一步恶化。","ev":"当两种流体的对流传热系数相差较大时(例如，用饱和水长气加热空气) ，传热过 程的热阻主要在空气一侧。若气体在管外流动，则在管外安装翅片，这样既可扩大传热面 积，又可增加空气的湍动，从而提高换热器的传热效果。一般来说，当两种流体的对流传热 系数之比为3 : 1 或更大时，宜采用翅片式换热管。","keys":[],"ref":"第 166 页","hint":"","score":2},{"i":179,"n":180,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-single-033","t":"single","mode":"","bloom":"理解","diff":"medium","q":"板翅式换热器在工业使用中的主要缺点是什么？","o":["承压能力很低，不能超过0.5MPa","单位体积能容纳的传热面积太小","制造工艺复杂、流道小易堵塞，检修清洗困难","只能用于两种流体直接混合的场合"],"a":["C"],"exp":"板翅式换热器翅片密集、流道很小，虽然结构紧凑、传热系数高，但制造工艺复杂，内漏后难修复，且易堵塞、检修清洗困难，故 C 正确。翅片对隔板起支撑作用，承压能力可达5MPa，A 说反了；其单位体积传热面积是列管式的数十倍，B 也错；它属于间壁式换热器，并不要求两种流体混合。","ev":"其主要缺点是制造工艺复杂，内漏后难修复，流动阻力较大;，流道很小，易堵塞， 检修清洗困难，故要求换热介质清洁。","keys":[],"ref":"第 166 页","hint":"","score":2},{"i":180,"n":181,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-truefalse-015","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"板翅式换热器的翅片既扩展传热面又支撑隔板，因此其承压能力并不低。","o":["正确","错误"],"a":["T"],"exp":"板翅式换热器以平隔板和翅片构成单元体，翅片是两平面隔板的有力支撑，使结构强度较好，可承受5MPa的压力。它的主要缺点在制造工艺复杂、流道小易堵塞、检修清洗困难，而不是承压能力差。","ev":"由于翅片是两平面隔板的有力支撑，该换热器强度较 好，可承受 5MPa 的压力。","keys":[],"ref":"第 166 页","hint":"","score":2},{"i":181,"n":182,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-single-034","t":"single","mode":"","bloom":"理解","diff":"medium","q":"被冷却的流体宜走壳程，主要理由是什么？","o":["壳程流速较低，可避免流体降温过快","壳程拆卸方便，便于机械清洗","壳程承压能力高于管程","便于外壳向周围散热，增强冷却效果"],"a":["D"],"exp":"壳程的外侧就是换热器外壳，流体走壳程时热量可以直接经外壳向周围环境散失，有利于冷却，所以 D 正确。壳程内装有折流挡板、结构复杂，清洗并不比管程方便；壳程流速和承压能力也不是安排被冷却流体走壳程的主要理由。","ev":"被冷却的流体宜走壳程，这便于外壳向周围的散热，增强冷却效果","keys":[],"ref":"第 167 页","hint":"","score":2},{"i":182,"n":183,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"列管式换热器中，黏度较大或流量较小的流体宜走壳程，以便在较低 Re 下达到湍流。","o":["正确","错误"],"a":["T"],"exp":"壳程装有折流挡板，流体反复错流通过管束，湍动程度高，在较小 Re 下即可达到湍流，从而提高对流传热系数。黏度大或流量小的流体若走管程往往长期处于层流，所以宜安排在壳程。","ev":"黏度大的液体或流量较小的流体宜走壳程，使在低 Re 值下达到湍流，以提高对流传热系数;","keys":[],"ref":"第 167 页","hint":"","score":2},{"i":183,"n":184,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-truefalse-014","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"易结垢的流体宜走壳程，因为壳程清洗比管程方便。","o":["正确","错误"],"a":["F"],"exp":"教材的安排原则是不洁和易结垢的流体宜走管程，因为管内清洗比较方便；壳程装有折流挡板、结构复杂，清洗反而困难。黏度大或流量小的流体才宜走壳程，以便在较低雷诺数下达到湍流。","ev":"不洁交和易结拍的流体宜走管程，因为管内清洗比较方便，","keys":[],"ref":"第 167 页","hint":"","score":2},{"i":184,"n":185,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-single-023","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"列管式换热器中，哪种管子排列方式管外清洗方便、适用于壳程流体易结垢的场合？","o":["正三角形排列","正方形排列","同心圆排列","任意排列方式效果都相同"],"a":["B"],"exp":"正三角形排列结构紧凑，同直径壳体可排更多管子，但管外清洗困难；正方形排列管外清洗方便，适用于壳程流体易结垢的情况，只是对流传热系数小于正三角形排列。同心圆排列不是教材所列的主要排列方式，各排列的清洗难易也不相同。","ev":"正方形排列时管外清洗方便,适用于壳程流体易结垢的情况","keys":[],"ref":"第 168 页","hint":"","score":2},{"i":185,"n":186,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-single-024","t":"single","mode":"","bloom":"理解","diff":"medium","q":"列管式换热器壳程折流挡板间距过大，会带来什么后果？","o":["流体不能垂直流过管束，管外侧对流传热系数下降","壳程流速过高，动力消耗过大","传热面积显著增大","管程对流传热系数急剧增大"],"a":["A"],"exp":"挡板间距过大时，流体不能保证垂直流过管束，壳程对流传热系数下降；间距过小则制造检修困难、流动阻力增大，因此间距一般取壳体内径的0.2至1.0倍。间距过大不会使壳程流速升高，也不改变传热面积或管程的对流传热系数。","ev":"间距太大，不能保证流体垂直流过管束，使 管外侧传热系数下降， 间距太小，难于制造和检修,流动阻力亦大。","keys":[],"ref":"第 169 页","hint":"","score":2},{"i":186,"n":187,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-truefalse-021","t":"truefalse","mode":"","bloom":"评价","diff":"medium","q":"换热器选型时，只要初选设备的传热面积略大于计算所需面积即可，不必再留裕量。","o":["正确","错误"],"a":["F"],"exp":"所选换热器面积原则上大于计算面积即可完成任务，但计算公式有误差、操作条件也可能波动，工程上一般要求留有15%至25%的裕量，故该说法错误。裕量不足时，换热器在结垢或负荷提高后就可能达不到工艺要求。","ev":"为保险，一般要求所选换热器的传热面积有15%一25%的裕量","keys":[],"ref":"第 170 页","hint":"","score":2},{"i":187,"n":188,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-multiple-009","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"除夹点技术外，换热网络的优化设计方法还有哪些？","o":["有效能分析法","数学规划法","场协同理论","离心沉降法"],"a":["A","B"],"exp":"教材在夹点技术之外还介绍了有效能分析法和数学规划法：前者用有效能平衡评价换热网络的有效能利用效率，后者建立数学模型并借助计算机从众多结构中选择最优结构，故 A、B 正确。场协同理论用于分析强化传热的机理，离心沉降属于非均相物系分离，都不是换热网络的优化设计方法。","ev":"此外，换热网络的优化设计方法还有有效能分析法和数学规划法。","keys":[],"ref":"第 173 页","hint":"","score":3},{"i":188,"n":189,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-single-025","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"冷却水在换热面上形成的碳酸钙、硫酸钙垢层，按结垢机理属于哪一类污垢？","o":["颗粒污垢","生物污垢","腐蚀污垢","结晶污垢"],"a":["D"],"exp":"结晶污垢是溶解于流体中的无机盐在换热表面结晶而形成的沉积物，常发生在过饱和或冷却时，冷却水侧的碳酸钙、硫酸钙和二氧化硅结垢层就是典型例子。颗粒污垢由悬浮固体微粒积聚而成，生物污垢由微生物产生，腐蚀污垢由流体腐蚀表面形成，均与此不符。","ev":"结晶污垢是指溶解于流体中的无机盐在换热表面上结晶而形成的沉积 物， 通常发生在过饱和或冷却时。典型的污垢如冷却水侧的碳酸钙 、硫酸钙和二氧化硅结垢","keys":[],"ref":"第 173 页","hint":"","score":2},{"i":189,"n":190,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-truefalse-016","t":"truefalse","mode":"","bloom":"评价","diff":"medium","q":"采取强化传热措施时要综合考虑制造费用和能量消耗，不计成本地提高传热速率往往得不偿失。","o":["正确","错误"],"a":["T"],"exp":"强化传热在提高传热速率的同时，往往要增加换热面积、提高流速或加大输送动力，制造费用与能量消耗都会上升。原题把强化措施说成只有收益没有代价，主张不计成本地追求最高传热速率，忽略了经济核算这一前提。","ev":"传热固然重要，但不计成本地育目提高传热速率很可能导致得不偿失","keys":[],"ref":"第 173 页","hint":"","score":2},{"i":190,"n":191,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-single-001","t":"single","mode":"","bloom":"理解","diff":"easy","q":"关于蒸发操作的过程本质，下列说法正确的是哪一项？","o":["蒸发属于机械分离过程，靠过滤介质截留溶质","蒸发操作属于传热过程，蒸发设备为传热设备","蒸发属于纯粹的化学变化过程，加热是为了引发溶质分解","蒸发属于输送过程，主要设备是离心泵"],"a":["B"],"exp":"蒸发是使溶剂汽化、溶质留在溶液中的分离操作，其速率取决于溶剂的汽化速率，而汽化速率又由传热速率决定，所以蒸发操作属于传热过程，蒸发设备是传热设备。机械分离靠过滤或离心实现，化学变化会生成新物质，输送过程由泵完成，三者都不是蒸发的本质。工业上蒸发广泛应用于化工、轻工、食品、医药等领域，主要用于浓缩稀溶液制取产品、浓缩同时回收溶剂以及制备纯净溶剂。","ev":"此种蒸发过程即是间壁两侧恒温的传热过程。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":191,"n":192,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-single-009","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"海水淡化属于蒸发操作的哪一类应用目的？","o":["浓缩稀溶液直接制取固体产品","获得纯净的溶剂","浓缩溶液同时回收溶剂","提高溶液的沸点"],"a":["B"],"exp":"教材把蒸发的目的归为三类：浓缩稀溶液制取产品、浓缩同时回收溶剂、获得纯净的溶剂，海水淡化正属于第三类，即从海水中蒸出纯净水。制取固体产品靠浓缩后冷却结晶，回收溶剂针对有机溶剂，提高沸点不是蒸发的目的。","ev":"为了获得纯净的溶剂，例如海水淡化等。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":192,"n":193,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-single-010","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"按操作压力划分，蒸发操作可分为哪三类？","o":["单效、双效、多效蒸发","常压蒸发、加压蒸发、减压蒸发","间歇蒸发、连续蒸发、半连续蒸发","自然循环、强制循环、单程蒸发"],"a":["B"],"exp":"按操作压力可分为常压、加压和减压即真空蒸发三类；单效与多效是按效数划分，间歇与连续是按蒸发模式划分，自然循环、强制循环和单程型则是按溶液在加热室内的流动情况划分蒸发器。题干问的是操作压力，故应选常压、加压和减压。","ev":"按操作压力分”可分为常压蒸发操作、加压蒸发操作和减压(真空)蒸发操作，即在 常压(大气压)下，高于或低于大气压下操作。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":193,"n":194,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-truefalse-006","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"蒸发操作中溶剂只是部分汽化，溶质并不汽化而留在溶液中。","o":["正确","错误"],"a":["T"],"exp":"蒸发是从溶液中分离出部分溶剂的单元操作，溶质不挥发，始终留在溶液里，因此蒸发属于挥发性溶剂与不挥发性溶质的分离过程。若溶剂全部汽化、溶质析出成固体，则更接近蒸干或结晶，而不是通常所说的蒸发。","ev":"工程上，蒸发过程只是从溶液中分 离出部分溶剂，而溶质仍留在溶液中、 因此,蒸发操作即为溶液中的挥发性深 剂与不挥发性溶质的分离过程。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":194,"n":195,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"蒸发过程的能耗较小，因此节能不是蒸发操作需要考虑的问题。","o":["正确","错误"],"a":["F"],"exp":"蒸发是溶剂汽化过程，溶剂的汽化潜热很大，因此蒸发是一个大能耗单元操作，节能是设计和操作蒸发装置时必须考虑的重要问题。多效蒸发、二次蒸汽的引出利用、热泵蒸发和冷凝水热量回收都是围绕节能采取的措施。","ev":"能量回收”蒸发过程是溶剂汽化过程，由于溶剂汽化潜热很大，所以蒸发过程是一 个大能耗单元操作。 因此，节能是蒸发操作应予考虑的重要问题。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":195,"n":196,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-truefalse-009","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"蒸发操作中，即使溶质是热敏性的，只要延长在高温下的停留时间也不会影响产品质量。","o":["正确","错误"],"a":["F"],"exp":"热敏性溶质在高温下停留时间过长容易分解变质，因此蒸发器设计和操作都要尽量缩短物料在高温区的停留时间，故该说法错误。这也正是单程型蒸发器适合处理热敏性物料的原因。","ev":"有些溶质是热敏性的，在高温下停留时间过长易变质","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":196,"n":197,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-008","t":"single","mode":"","bloom":"理解","diff":"medium","q":"单效蒸发装置中，分离室出来的二次蒸汽在进入混合冷凝器之前，先经过哪个设备？","o":["顶部除沫器","中央循环管","大气腿","真空泵"],"a":["A"],"exp":"二次蒸汽从分离室顶部排出时夹带液滴，先经顶部除沫器除去雾沫，再进入混合冷凝器与冷水直接接触冷凝，冷凝水最后经大气腿排出。中央循环管是蒸发器内部的溶液循环通道，大气腿位于冷凝器底部，真空泵抽除的是不凝性气体，它们都不在二次蒸汽进入冷凝器之前的流程上。","ev":"分离室分离出的蒸汽(又称二次蒸汽，以区别于加热蒸汽或生蒸汽)，先经顶部除沫器除沫，再进入混合冷凝器 3 与冷水相混，被直接冷凝后，通过大气腿 7 排出。","keys":[],"ref":"第 182 页","hint":"","score":2},{"i":197,"n":198,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-002","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"单效蒸发器传热面积的设计计算依据是下列哪一项？","o":["溶质的物料衡算方程","离心泵的特性曲线","传热速率方程","填料塔的泛点气速关联式"],"a":["C"],"exp":"单效蒸发设计计算通常包括蒸发水量、加热蒸汽消耗量和传热面积三项，其中传热面积由传热速率方程求得，热负荷由热量衡算得到，总传热系数和传热平均温度差按蒸发操作的特点确定。物料衡算用来求蒸发水量和完成液浓度，泵特性曲线用于选泵，泛点气速关联式用于填料塔设计，都不能直接求出传热面积。","ev":"蒸发器的传热面积可通过传热速率方程求得","keys":[],"ref":"第 183 页","hint":"","score":2},{"i":198,"n":199,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-011","t":"single","mode":"","bloom":"理解","diff":"medium","q":"同一压强下，下列哪种溶液的沸点升高通常较大？","o":["无机物溶液，且浓度较高","有机物溶液，且浓度较高","无机物溶液，且浓度很低","任何溶液都与浓度无关"],"a":["A"],"exp":"沸点升高主要取决于溶质性质和浓度，一般有机物溶液的沸点升高较小，无机物溶液较大；稀溶液不大，但随浓度增高而显著增大。因此无机物且浓度较高的溶液沸点升高最大；说与浓度无关则违背了浓度越高影响越显著的规律。","ev":"影响A 的主要因素为溶液的性质及其浓度。一般情况下，有机物溶液的 A“较小; 无机物溶液的A“较大; 稀溶液的A “不大,但随浓度增高，A“值增高较大。","keys":[],"ref":"第 183 页","hint":"","score":2},{"i":199,"n":200,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"计算蒸发器传热温度差时，可以不考虑溶液浓度和液位深度的影响，直接按纯水沸点计算。","o":["正确","错误"],"a":["F"],"exp":"溶液的沸点除受液面压力影响外，还受浓度和液位深度影响：浓度引起沸点升高，液位深度引起液柱静压头损失，两者都使溶液沸点高于纯水沸点、有效温度差减小。因此计算传热温度差时必须计入各项温度差损失，不能直接按纯水沸点计算。","ev":"应该指出,溶液的沸点不仅受蒸发吉内液面压力影响，而且受溶液浓度、液位深度等因素影响。","keys":[],"ref":"第 183 页","hint":"","score":2},{"i":200,"n":201,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-012","t":"single","mode":"","bloom":"分析","diff":"medium","q":"蒸发器总热阻的主要部分通常是什么？","o":["管外蒸汽冷凝热阻","管壁导热热阻","蒸发器外壳向环境的散热热阻","管内溶液沸腾的对流传热热阻与管内污垢热阻"],"a":["D"],"exp":"蒸发时加热面处溶液水分汽化、浓度上升，溶质易析出并附着于表面形成污垢，管内污垢热阻往往是总热阻的主要部分；管内沸腾对流传热系数也是影响总传热系数的主要因素。蒸汽冷凝热阻和管壁热阻一般较小，外壳散热属于热损失，不计入两流体间的总热阻。","ev":"由于蒸发过程中加热面处洲液中的水分汽化,浓度上升， 因此溶液很易超过饱和状态，溶质析出并包庄固体杂质，附着于表面，形成污垢，所以尺; 往往是蒸发器总热阻的主要部分。","keys":[],"ref":"第 185 页","hint":"","score":2},{"i":201,"n":202,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-multiple-003","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"与常压蒸发相比，真空蒸发具有哪些特点？","o":["使溶液黏度降低，总传热系数提高","降低溶液沸点，增大传热推动力","可减少或防止热敏性物料的分解","可利用低温位的水蒸气作热源"],"a":["B","C","D"],"exp":"真空蒸发降低溶液沸点，使加热蒸汽与溶液的温差增大，传热推动力提高，同时可减少或防止热敏性物料分解，并可利用低温位水蒸气作热源。沸点降低会使溶液黏度增高、总传热系数下降，所以 A 说反了；真空蒸发还需增加真空设备和动力消耗。","ev":"真空莱发可以降低溶液沸点，增大传热推动力，提高蒸发器的生产强度 ， 同时由于沸点较低，可减少或防止热敏性物料的分解。另外，真空蒸发可降低对加热热源的 要求，即可利用低温位的水蒸气作热源。","keys":[],"ref":"第 186 页","hint":"","score":3},{"i":202,"n":203,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"采用真空蒸发的主要目的之一是下列哪一项？","o":["提高溶液沸点，从而增大传热温度差","降低溶液沸点，增大传热推动力，并可利用低温位水蒸气作热源","取消冷凝器，把二次蒸汽直接排入大气","提高加热蒸汽的压力等级"],"a":["B"],"exp":"真空蒸发降低分离室压力，使溶液沸点下降，加热蒸汽温度与溶液沸点之差增大，传热推动力提高，同时可降低对加热热源的要求、利用低温位水蒸气。提高沸点与真空操作相反，真空系统必须保留冷凝器和真空装置而不能直接排空，提高加热蒸汽压力属于提高热源温度的措施，不是真空蒸发的目的。","ev":"另外，真空蒸发可降低对加热热源的要求，即可利用低温位的水蒸气作热源。","keys":[],"ref":"第 186 页","hint":"","score":2},{"i":203,"n":204,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-truefalse-004","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"真空蒸发降低溶液沸点后，溶液的黏度会随之降低，因此传热系数一定增大。","o":["正确","错误"],"a":["F"],"exp":"真空蒸发虽能降低沸点、增大传热推动力，但沸点降低会使溶液黏度增高，传热系数可能下降，这是真空蒸发不利的一面。因此不能认为沸点降低后黏度降低、传热系数一定增大，设计时须综合考虑推动力与传热系数两方面的影响。","ev":"但是，应该指出,溶液沸点降低，其黏度会增高","keys":[],"ref":"第 186 页","hint":"","score":2},{"i":204,"n":205,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-multiple-002","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"为使蒸发器保持在高强度下操作，可采取的措施有哪些？","o":["合理设计蒸发器，实现良好的溶液循环流动","及时排除加热室中的不凝性气体","定期清洗蒸发器加热室内管","尽量提高完成液的浓度"],"a":["A","B","C"],"exp":"良好的溶液循环能提高对流传热系数，及时排除不凝性气体可避免其在加热表面形成气膜，定期清洗加热管可除去垢层，三者都能提高总传热系数，从而保持较高的生产强度。提高完成液浓度会使溶液黏度增大、沸点升高，传热条件变差，生产强度反而下降，故D错误。","ev":"这些已在前面论述，因此，合理设计蒸发器以实现良好的溶液循环流动、及时排除加热室中不凝性气体、定期清洗蒸发器(加热室内管)均是提高和保持阁发器在高强度下操作的重要措施。","keys":[],"ref":"第 187 页","hint":"","score":3},{"i":205,"n":206,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"多效蒸发并流加料流程中，料液能从前一效自动流入后一效，主要依靠什么？","o":["外加循环泵的扬程","压缩机的压缩作用","真空泵的抽吸作用","相邻两效之间的压强差"],"a":["D"],"exp":"并流流程中各效的操作压强依次降低，料液借相邻两效的压强差自动流入后一效，不需要用泵输送。循环泵是强制循环蒸发器的部件，压缩机用于热泵蒸发，真空泵用于抽除不凝性气体、维持末效真空，都不能作为并流输料的动力。","ev":"料液可借相邻两效的压强差自动流入后一效，而不需用泵输送","keys":[],"ref":"第 188 页","hint":"","score":2},{"i":206,"n":207,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-single-004","t":"single","mode":"","bloom":"理解","diff":"medium","q":"平流加料三效蒸发流程最适用于处理哪类溶液？","o":["蒸发过程中有结晶析出的溶液","热敏性很强、允许停留时间极短的溶液","黏度随温度变化很大、必须采用逆流加热的溶液","需要把二次蒸汽逐效利用的溶液"],"a":["A"],"exp":"平流流程中各效都加入原料液并分别排出完成液，高浓度溶液不必在效间输送，从而避免因降温而析出结晶，所以适用于易结晶物料。热敏性物料宜用单程型蒸发器，黏度随温度变化大的场合宜用逆流流程，二次蒸汽逐效利用是并流流程的特点。","ev":"这种流程适用于处理易结晶物料，例如食盐水溶液等的蒸发。","keys":[],"ref":"第 188 页","hint":"","score":2},{"i":207,"n":208,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-truefalse-002","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"蒸发器加热室排出的高温冷凝水应返回锅炉房重新使用，这样既节省能源又节省水源。","o":["正确","错误"],"a":["T"],"exp":"加热蒸汽冷凝水温度高、水质好，返回锅炉房可回收其显热，同时减少软化水的消耗，既节能又节水。回用时应监测水质，防止蒸发器损坏或阀门泄漏污染锅炉补水系统，但回收利用本身是正确的。","ev":"这些水理应返回锅炉房重新使用，这样既节省能源又节省水源。","keys":[],"ref":"第 188 页","hint":"","score":2},{"i":208,"n":209,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-truefalse-005","t":"truefalse","mode":"","bloom":"记忆","diff":"medium","q":"平流加料三效蒸发流程中，蒸汽的走向与并流流程相同，而原料液和完成液分别从各效加入和排出。","o":["正确","错误"],"a":["T"],"exp":"平流流程各效都通入加热蒸汽，蒸汽总体走向与并流相同，但原料液分别加入各效、完成液也分别从各效排出，各效浓度都较高。正因如此，它适用于易结晶物料，可避免高浓度溶液在效间输送时因降温而析出晶体。","ev":"其特点是蒸汽的走向与并流相同，但原料液和完成液则分别从各效加入和排出。","keys":[],"ref":"第 188 页","hint":"","score":2},{"i":209,"n":210,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-multiple-001","t":"multiple","mode":"","bloom":"分析","diff":"medium","q":"多效蒸发中，随着效数增加，下列变化正确的有哪些？","o":["单位蒸汽消耗量减少","操作费用降低","有效温度差减小、设备投资费用增大","总传热系数按效数成比例增大"],"a":["A","B","C"],"exp":"效数增加后，蒸发同样水量所需的加热蒸汽量减少，单位蒸汽消耗量下降，操作费用随之降低；但温度差损失增大、有效温度差减小，增加一效还要增加设备，投资费用上升，因此存在最佳效数。总传热系数取决于溶液性质、沸腾状况和蒸发器结构，不会随效数成比例增大，D错误。单位蒸汽消耗量越小，说明加热蒸汽的经济性越好，这也是多效蒸发的意义所在。","ev":"由表 4-2 并综合前述情况后可知，随着效数的增加，单位蒸汽的消耗量会减少，即操作费用降低，但是有效温度差也会减少(即温度差损失增大)，使设备投资费用增大。","keys":[],"ref":"第 194 页","hint":"","score":3},{"i":210,"n":211,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-single-005","t":"single","mode":"","bloom":"理解","diff":"medium","q":"中央循环管式蒸发器中，溶液自然循环的流动方向是下列哪一种？","o":["加热管束内向下、中央循环管内向上","加热管束和中央循环管内均向上","加热管束内向上、中央循环管内向下","加热管束和中央循环管内均向下"],"a":["C"],"exp":"加热管束内单位体积溶液的受热面积大、汽化率高，气液混合物密度小，因而向上流动；中央循环管直径大、受热面积小，其中混合物密度大，因而向下流动，两者形成自然循环。其余选项的方向与实际相反或两管同向，无法形成密度差推动的循环。","ev":"这样造成了混合液在管束中向上、在中央循环管向下的自然循环流动。","keys":[],"ref":"第 194 页","hint":"","score":2},{"i":211,"n":212,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"物料在循环型蒸发器中滞留量大、受热时间长，所以这类设备不宜用于处理热敏性物料。","o":["正确","错误"],"a":["T"],"exp":"循环型蒸发器中溶液反复循环，滞留量大，物料在高温区停留时间长，热敏性成分容易分解变质，因此这类蒸发器不适合处理热敏性物料。原题把这一缺点当成优点，结论正好说反，处理热敏物料应改用单程型蒸发器。","ev":"循环型蒸发器有一个共同的缺点，即蒸发器内溶液的滞留量大，物料在高温下停留时间长，这对处理热敏性物料甚为不利。","keys":[],"ref":"第 195 页","hint":"","score":2},{"i":212,"n":213,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-single-006","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"单程型蒸发器特别适用于蒸发哪类物料？","o":["易结晶物料","高黏度物料","易结垢物料","热敏性物料"],"a":["D"],"exp":"单程型蒸发器中物料沿加热管壁成膜流动，一次通过即达到浓缩要求，停留时间仅数秒至十几秒，离开加热器后又及时冷却，所以特别适用于热敏性物料。易结晶、易结垢和高黏度物料需要较长的停留时间与强制流动，更适合强制循环型等循环型蒸发器。","ev":"另外，离开加热器的物料又得到及时冷却，故特别适用于热敏性物料的蒸发。","keys":[],"ref":"第 196 页","hint":"","score":2},{"i":213,"n":214,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-truefalse-008","t":"truefalse","mode":"","bloom":"评价","diff":"medium","q":"蒸发器选型时只要总传热系数高即可，不必考虑物料的热敏性、黏度和结垢倾向。","o":["正确","错误"],"a":["F"],"exp":"选型要在满足生产任务要求、保证产品质量的前提下，兼顾生产能力大、结构简单、维修方便和经济性好等因素。热敏性物料要求停留时间短，易结晶、易结垢和高黏度物料对蒸发器型式有不同要求，只看总传热系数会选错设备。","ev":"蒸发器的结构类型较多，选用和设计时，要在满足生产任务要求、保证产品质量的前提 下， 尽可能兼顾生产能力大、结构简单、维修方便及经济性好等因素。","keys":[],"ref":"第 197 页","hint":"","score":2},{"i":214,"n":215,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"蒸发系统内的负压主要是怎样形成的？","o":["由真空泵抽气直接形成","由加热蒸汽喷射形成","由二次蒸汽在冷凝器中冷凝形成","由大气腿的液封形成"],"a":["C"],"exp":"蒸发器中的负压主要是二次蒸汽在冷凝器中被冷凝，体积急剧减小而形成的；真空装置只负责抽除漏入的空气、溶解的不凝性气体和冷却水饱和温度下的水蒸气，以维持真空度。大气腿起液封排液作用，加热蒸汽喷射和真空泵抽气都不是负压的主要来源。","ev":"需要指出的是，蒸发怖中的负压主要是由于二次车汽冷凝所致，而真空装置仅是抽吸蒸 发系统泄漏的空气、物料及冷却水中溶解的不凝性气体和冷却水饱和温度下的水蒸气等， 以维持蒸发操作的真空度。","keys":[],"ref":"第 199 页","hint":"","score":2},{"i":215,"n":216,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-multiple-004","t":"multiple","mode":"","bloom":"记忆","diff":"easy","q":"吸收操作在化工生产中的应用目的包括下列哪些？","o":["直接制取无水乙醇","分离混合气体并回收有用的组分","除去气体混合物中的有害组分以精制气体","制备某种气体的溶液"],"a":["B","C","D"],"exp":"吸收操作的应用目的包括分离混合气体并回收有用组分、除去有害组分以精制气体、制备某种气体的溶液以及治理工业废气，故B、C、D正确。用工业乙醇水溶液精制无水乙醇属于蒸馏操作，依据的是组分挥发性的差异，不是吸收，故A错误。","ev":"吸收操作是分离气体混合物的重要方法，它在化工、医药、冶金等生产过程中应用十分广泛，其应用目的有以下几种。","keys":[],"ref":"第 207 页","hint":"","score":3},{"i":216,"n":217,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-single-001","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"关于化学吸收，下列说法正确的是哪一项？","o":["化学吸收中溶质仅靠溶解度差异实现分离","溶质与溶剂发生明显化学反应的吸收操作称为化学吸收","化学吸收不需要吸收剂再生","化学吸收的选择性比物理吸收差"],"a":["B"],"exp":"化学吸收是溶质与溶剂发生明显化学反应的吸收操作，反应可大幅度提高吸收能力，并使吸收具有较高的选择性；物理吸收才是主要靠溶解度差异实现分离。化学吸收剂通常要求反应可逆以便再生，若反应不可逆则吸收剂消耗大，只用于溶质含量很低又需彻底去除的场合，故其余三项均错误。按溶质与溶剂是否发生明显化学反应，吸收分为物理吸收和化学吸收；按溶质组分数还可分为单组分吸收和多组分吸收。吸收在化工、医药、冶金等领域广泛用于分离回收有用组分、除去有害组分、制备气体溶液和治理工业废气。","ev":"如果在吸收过程中, 溶质与溶剂发生明显化学反应，则此吸收操作称为化学吸收(chemical absorption) 。","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":217,"n":218,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-single-002","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"选择吸收剂时，对吸收剂挥发度的要求是下列哪一项？","o":["操作温度下吸收剂的蒸气压要高，便于汽化","挥发度越大越好，可加快传质速率","操作温度下吸收剂的蒸气压要低，不易挥发","挥发度对吸收过程没有影响，可不考虑"],"a":["C"],"exp":"吸收剂应不易挥发，即操作温度下蒸气压要低。这样既可减少吸收过程中吸收剂的损失，又可避免在气体中引入新的杂质。挥发度高会使吸收剂随气体流失并污染产品，并不会加快传质；挥发度是选用吸收剂的重要指标，并非与过程无关。","ev":"吸收剂应不易挥发，即操作温度下吸收剂的蒸气压要低。","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":218,"n":219,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-single-012","t":"single","mode":"","bloom":"理解","diff":"medium","q":"选择吸收剂时，要求溶剂对溶质有较大的溶解度，其直接表现是什么？","o":["一定温度和浓度下溶质的平衡分压要高","一定温度和浓度下溶质的平衡分压要低","操作温度下溶剂的蒸气压要高","溶质在气相中的分压要高"],"a":["B"],"exp":"溶解度大意味着在相同温度和液相浓度下，液面上方溶质的平衡分压较低，气相传质推动力较大，完成同样任务所需的吸收剂用量和循环量较小。平衡分压高说明溶解度小，不利于吸收；溶剂蒸气压高表示挥发度大，是选择吸收剂时应避免的；气相分压由工艺条件决定，不能用来衡量溶剂的溶解能力。","ev":"溶剂对混合气体中的溶质应有较大的浴解度，即在一定的温度和浓度下，溶质的平衡分压要低。","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":219,"n":220,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-single-013","t":"single","mode":"","bloom":"理解","diff":"medium","q":"选择吸收剂时，要求溶质的溶解度对温度、压力敏感，主要目的是什么？","o":["低温或高压下吸收、高温或低压下解吸，便于吸收剂再生","使吸收剂在高温高压下都不溶解溶质","提高吸收剂的挥发度，便于回收溶质","降低吸收剂的黏度，减少输送功耗"],"a":["A"],"exp":"要求溶解度对操作条件敏感，是为了在低温或高压下溶解度大、平衡分压低，有利于吸收；而在高温或低压下溶解度迅速下降，溶质容易解吸出来，吸收剂再生方便。选项B与再生的目的相反；挥发度和黏度是吸收剂另外两项独立的要求，不能解释为什么要对温度、压力敏感。","ev":"溶质在吸收剂中的溶解度对操作条件(温度、压力)要敏感，即涂质在吸收剂中的溶解度在低温或高压下大，溶质的平衡分压低，而在高温或低压下溶解度要迅速下降。这样，被吸收的气体组分解吸容易，吸收剂再生方便。","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":220,"n":221,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-single-025","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"若混合气体中只有一个组分在吸收剂中有一定溶解度，其余组分可认为不溶，这种吸收过程称为什么？","o":["单组分吸收","多组分吸收","化学吸收","非等温吸收"],"a":["A"],"exp":"只有一个组分在吸收剂中有一定溶解度、其余组分溶解度可忽略时，属于单组分吸收。多组分吸收是两个或多个组分都明显溶解，如洗油吸收焦炉气中的苯和甲苯；化学吸收按溶质与溶剂是否发生明显化学反应划分；非等温吸收按吸收过程液相温度是否显著变化划分，三者分类依据不同。","ev":"若混合气体中只有一个组分在吸收剂中有一定的溶解度，其余组分可认为不溶于吸收剂， 溶解度可以忽略，这种吸收过程称为单组分吸收","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":221,"n":222,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-truefalse-007","t":"truefalse","mode":"","bloom":"理解","diff":"easy","q":"吸收剂的黏度越大，越有利于传质，且流体输送功耗越小。","o":["正确","错误"],"a":["F"],"exp":"恰好相反，吸收剂黏度低才有利于传质，因为黏度低时液膜传质阻力较小、液体流动顺畅，泵的输送功耗也小。黏度增大使液膜阻力增大、流动阻力上升，传质速率和输送能力都会下降，所以黏度是选择吸收剂时必须考虑的一项指标。","ev":"吸收剂黏度要低，有利于传质，且流体输送功耗小。","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":222,"n":223,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-truefalse-016","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"吸收剂的选择性越好，意味着它对混合气体中所有组分都具有较强的吸收能力。","o":["正确","错误"],"a":["F"],"exp":"选择性强调的是差别吸收，即对溶质吸收能力强，而对其他组分不吸收或吸收甚微。这样可减少有用惰性组分的损失，提高解吸后溶质的纯度；若对所有组分都强吸收，就失去了分离作用。把选择性理解为对所有组分都吸收，正好说反了。","ev":"吸收剂对混合气体中的溶质要有良好的吸收能力，而对其他组分应不吸收或吸收甚徽,以减少有用惰性组分的损失或提高解吸后溶质的纯度","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":223,"n":224,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-026","t":"single","mode":"","bloom":"理解","diff":"easy","q":"气体吸收过程的推动力是什么？","o":["气液两相的温度差","溶质在气相中的浓度与其接触的液相呈平衡的气相浓度之差","两相的总压差","吸收剂用量与最小用量之差"],"a":["B"],"exp":"吸收的推动力是溶质在气相的实际浓度与和液相成平衡的气相浓度之差，偏离越大推动力越大。温度差是传热过程的推动力；总压差主要推动流体流动，不是相际传质推动力；吸收剂用量与最小用量之差只反映操作余量，不能直接表示某截面的推动力。","ev":"而气体吸收过程的推动力是溶质在气相的浓度与其接触的液相呈平衡的气相浓度差","keys":[],"ref":"第 209 页","hint":"","score":2},{"i":224,"n":225,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-015","t":"single","mode":"","bloom":"分析","diff":"hard","q":"对双组分混合气体的单组分物理吸收系统，气液两相达到平衡时，温度、总压、气相组成和液相组成中独立变量有几个？","o":["1个","2个","3个","4个"],"a":["C"],"exp":"由相律，组分数为3（溶质A、吸收剂S、惰性气体B），相数为2，自由度等于3减2加2等于3，即在温度、总压、气相组成和液相组成四个变量中只有三个是独立变量，另一个由它们决定。因此溶解度可以表示为总压、温度和气相组成的函数，选项A、B、D都不符合相律的结果。","ev":"即气液两相达到平衡时，在温度、总压、气相组成和液相组成中，只有 3 个是独立变量，另一个变量是它们的函数。","keys":[],"ref":"第 210 页","hint":"","score":2},{"i":225,"n":226,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-017","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当总压不太高时，在温度一定的条件下，气体的溶解度可近似看作下列哪一项的函数？","o":["总压","溶质的分压或气相摩尔分数","吸收剂用量","填料层高度"],"a":["B"],"exp":"当总压不太高时，压力变化对平衡关系的影响可忽略，温度一定时溶解度只随溶质的分压或气相摩尔分数变化，这就是溶解度曲线的依据。总压已被排除，吸收剂用量和填料层高度属于操作与设备参数，不决定平衡时的溶解度。","ev":"当总压不太高(一般小于 0.5MPa)时，压力的变化对平衡关系的影响可忽略不计。于是，当温度一定时，溶解度z 或cx仅为分压户*或摩尔分数 y 的函数","keys":[],"ref":"第 210 页","hint":"","score":2},{"i":226,"n":227,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-003","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当物系一定时，亨利系数随温度升高的一般变化规律是下列哪一项？","o":["亨利系数减小，气体溶解度增大","亨利系数不变，气体溶解度不变","亨利系数先减小后增大，气体溶解度先增大后减小","亨利系数增大，气体溶解度减小"],"a":["D"],"exp":"亨利系数只是温度的函数，大多数物系温度上升时亨利系数增大；由亨利定律可知，平衡分压一定时液相摩尔分数减小，即气体溶解度降低。温度降低则亨利系数减小、溶解度增大，这正是低温有利于吸收的原因。温度降低时亨利系数减小、溶解度增大，方向与升高温度相反；认为亨利系数不变或先减后增的说法都不符合其随温度单调变化的一般规律。","ev":"当物系一定时，亨利系数仅是温度的函数，对于大多数物系，温度上升, 巨 值增大，气体溶解度减少。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":227,"n":228,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-027","t":"single","mode":"","bloom":"理解","diff":"medium","q":"同种气体在水和某些有机溶剂中的溶解度相差很大，这主要说明哪个因素对相平衡有显著影响？","o":["气相中溶质的组成","操作总压","溶剂的性质","填料层的比表面积"],"a":["C"],"exp":"同种气体在同一温度、同一分压下换用不同溶剂，溶解度截然不同，说明溶剂性质是影响相平衡的重要因素，选用不同吸收剂吸收效果会大不相同。气相组成和总压也会影响溶解度，但题中对比的变量是溶剂种类；填料比表面积只影响传质速率，不改变平衡溶解度。","ev":"同种气体在不同溶剂中溶解度截然不同。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":228,"n":229,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-truefalse-008","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"亨利系数只与温度有关，与溶质的性质、气相分压及溶剂特性无关。","o":["正确","错误"],"a":["F"],"exp":"只是在物系一定时，亨利系数才可看作仅随温度变化；对于不同溶质、不同溶剂以及不同气相分压范围，亨利系数并不相同，因为吸收系统多为非理想溶液，只有在溶液浓度很低时亨利系数才是常数。因此把亨利系数说成只与温度有关、与溶质和溶剂性质无关是不对的。","ev":"所以亨利系数不仅随温度而变化，同时也随溶质的性质、深质的气相分压及溶剂特性而变化。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":229,"n":230,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-truefalse-009","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"亨利定律只适用于理想溶液，非理想溶液即使浓度很低也不能应用。","o":["正确","错误"],"a":["F"],"exp":"亨利定律描述的是稀溶液上方溶质的平衡分压与液相摩尔分数的正比关系，非理想溶液在浓度很低时同样可以应用，只是亨利系数需由实验测定；对于理想溶液，该关系才可在整个浓度范围内成立。因此把亨利定律限定为只适用于理想溶液是不正确的。","ev":"但吸收操作涉及的系统多为非理想溶液，此时亨利系数不等于纯溶质的饱和蒸气压，而且在溶液浓度很低的情况下亨利系数才是常数。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":230,"n":231,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-truefalse-017","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"只要温度一定，亨利定律就能适用于任意总压和任意浓度的溶液。","o":["正确","错误"],"a":["F"],"exp":"亨利定律只适用于总压不太高、溶质浓度较低的稀溶液。压力很高或浓度较大时，气相偏离理想气体、液相偏离稀溶液，平衡分压与液相摩尔分数不再保持简单正比关系。温度一定只是亨利定律成立的条件之一，不能据此把它推广到任意压力和任意浓度。","ev":"在温度一定条件下，当气体总压不超过5X105Pa 时，吸收操作用于分离低浓度气体混合物，大多数气体溶解后形成的溶液浓度也较低。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":231,"n":232,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-016","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当温度、压力一定时，相平衡常数 m 越大，说明什么？","o":["该气体在溶剂中的溶解度越小","该气体在溶剂中的溶解度越大","该气体的亨利系数越小","该气体的溶解度与 m 无关"],"a":["A"],"exp":"相平衡常数定义为平衡时气相摩尔分数与液相摩尔分数之比，m 越大表示与一定液相组成平衡的气相组成越高，也就是液相能够溶解的溶质量越少；m 等于亨利系数除以总压，难溶气体的亨利系数大、m 也大。因此选项B、D错误，选项C把亨利系数的变化方向说反了。","ev":"当温度、压力一定时,，z: 值愈大，该气体的溶解度愈小，故浆 值反映了不同气体洲解度的大小。","keys":[],"ref":"第 213 页","hint":"","score":2},{"i":232,"n":233,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-004","t":"single","mode":"","bloom":"理解","diff":"easy","q":"气液两相接触时，传质方向由什么决定？","o":["两相实际浓度与平衡浓度的相对偏离方向","气体的总压高低","吸收塔内填料的类型","吸收剂的黏度大小"],"a":["A"],"exp":"传质方向总是使系统向达到平衡的方向进行：气相实际组成高于与液相平衡的气相组成时发生吸收，反之则发生解吸，因此判据是实际浓度与平衡浓度的相对大小，两者之差即为传质推动力，差值越大推动力越大、传质速率越快。总压和温度通过改变平衡关系间接影响方向，填料类型和吸收剂黏度只影响传质速率，不能决定传质方向。","ev":"总之，传质方向使系统向达到平衡的方向进行。","keys":[],"ref":"第 214 页","hint":"","score":2},{"i":233,"n":234,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-truefalse-001","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"吸收过程能达到的极限是气液两相达到平衡，因此出塔吸收液的浓度和出塔气体的浓度都受相平衡关系限制。","o":["正确","错误"],"a":["T"],"exp":"传质进行到气液两相平衡时就停止了，此时两相浓度并不相等，而是满足相平衡关系；所以吸收液离塔浓度不会超过与进塔气体平衡的液相浓度，出塔气体浓度也不会低于与吸收剂入口平衡的气相浓度。原题把极限说成两相浓度相等，混淆了平衡与相等。","ev":"平衡状态是传质过程的极限。相平衡关系限制了吸收液离塔时的最高浓度和气体混合物离塔时的最低浓度。","keys":[],"ref":"第 214 页","hint":"","score":2},{"i":234,"n":235,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-single-014","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当压力不太高时，提高操作压力有利于吸收，主要原因是什么？","o":["亨利系数随总压升高而减小","吸收剂挥发度随总压升高而减小","气体扩散系数随总压升高而增大","相平衡常数随总压升高而减小，溶质溶解度增大"],"a":["D"],"exp":"当总压不太高时，亨利系数主要随温度变化，受总压影响很小；而相平衡常数等于亨利系数除以总压，总压升高使相平衡常数减小，平衡线下移，溶质在液相中的溶解度增大，所以有利于吸收。吸收剂挥发度和气体扩散系数不是压力升高促进吸收的主要原因。","ev":"由上述计算结果可以看出，当压力不太高时，提高操作压力，由于相平衡常数显著地下降，导致溶质在液相中的溶解度增加，故有利于吸收。","keys":[],"ref":"第 215 页","hint":"","score":2},{"i":235,"n":236,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-multiple-005","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"关于单相内传质的两种基本形式，下列说法正确的有哪些？","o":["分子扩散在静止或层流流体中靠分子运动进行","对流传质只能发生在静止流体中","对流传质靠流体质点的宏观运动传递组分","分子扩散以浓度梯度为推动力"],"a":["A","C","D"],"exp":"单相内传质分为分子扩散和对流传质：分子扩散发生在静止或层流流体中，靠分子无规则热运动、以浓度梯度为推动力；对流传质则依靠流体质点的宏观运动，把组分从高浓度区带向低浓度区。对流传质必须伴随流体流动或搅拌，不可能只发生在静止流体中，故B错误。","ev":"不论溶质在气相还是液相，它在单一相里的传质有两种基本形式，一种是在静止或呈层流流动的流体中, 溶质以浓度梯度为推动力，靠分子运动进行传质，称为分子扩散Cmolecular diffusion); 另一种是当流体流动或搅拌时， 由于流体质点的宏观运动，使组分从高浓度向低浓度传质，称为对流传质(mass transfer by convection) 。","keys":[],"ref":"第 216 页","hint":"","score":3},{"i":236,"n":237,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-005","t":"single","mode":"","bloom":"理解","diff":"medium","q":"菲克定律表达式中的负号表示什么？","o":["扩散通量一定为负值，表示溶质反向传递","扩散方向与浓度梯度方向相反，扩散沿浓度降低的方向进行","扩散系数为负值","负号没有物理意义，只是数学书写习惯"],"a":["B"],"exp":"浓度梯度指向浓度升高的方向，而扩散总是从高浓度向低浓度进行，所以扩散通量与浓度梯度方向相反，负号正是表示这一方向关系。扩散通量的正负取决于所取坐标方向，并非一定为负；扩散系数是物性参数，恒为正值；负号具有明确的物理意义，不是书写习惯。","ev":"式(5-27)中的负号表示扩散方向与浓度梯度方向相反， 扩散沿着浓度降低的方向进行。","keys":[],"ref":"第 216 页","hint":"","score":2},{"i":237,"n":238,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-006","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在等摩尔反向扩散过程中，组分A的浓度沿扩散方向如何分布？","o":["呈抛物线分布","呈指数分布","呈线性分布","先增大后减小"],"a":["C"],"exp":"等摩尔反向扩散时A、B两组分以相等的量反向传递，总浓度处处不变，扩散通量为常数，积分后组分A的浓度沿扩散方向呈线性分布。单向扩散时由于存在总体流动，浓度分布为曲线，这是两种扩散形式的重要区别；抛物线、指数和先增后减都不符合等摩尔反向扩散的结论。","ev":"从式(5-31)可以看出，在等摩尔反向扩散过程中,组分 A 的浓度沿扩散方向呈线性分布。","keys":[],"ref":"第 218 页","hint":"","score":2},{"i":238,"n":239,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-018","t":"single","mode":"","bloom":"理解","diff":"easy","q":"等摩尔反向扩散的规律通常用于描述下列哪种过程？","o":["用水吸收难溶气体","气体通过静止惰性气体的单向扩散","双组分蒸馏中两组分的反向扩散","填料层内的涡流扩散"],"a":["C"],"exp":"双组分蒸馏中，易挥发组分汽化进入气相的同时，难挥发组分以近似相等的摩尔量冷凝进入液相，两组分反向扩散且摩尔汽化潜热近似相等，因此可按等摩尔反向扩散处理。吸收中溶质通过静止惰性组分的扩散属于单向扩散；涡流扩散是湍流中的宏观混合，不是分子扩散的基本形式。","ev":"等摩尔反方向扩散这种形式通常发生在蒸馏过程中。","keys":[],"ref":"第 218 页","hint":"","score":2},{"i":239,"n":240,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-028","t":"single","mode":"","bloom":"理解","diff":"medium","q":"单向扩散中，因分子扩散而不是依靠外力引起的宏观流动称为什么？","o":["分子扩散","涡流扩散","热扩散","总体流动"],"a":["D"],"exp":"组分B不溶于液相，在界面处被截留并积累，使界面附近总压降低，气相主体与界面之间形成小压差，从而推动A、B混合气体整体向界面宏观流动，这种流动称为总体流动。它由分子扩散自发引起，不靠外力；分子扩散靠分子热运动，涡流扩散靠湍流质点脉动，热扩散由温度梯度产生。","ev":"上述总体流动是因分子扩散而不是依靠外力引起的雪观流动。","keys":[],"ref":"第 218 页","hint":"","score":2},{"i":240,"n":241,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-truefalse-002","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"单向扩散中的漂流因子小于1，说明总体流动使传质速率比单纯分子扩散减小。","o":["正确","错误"],"a":["F"],"exp":"漂流因子是单向扩散时总体流动使传质速率较单纯分子扩散增大的倍数，其值总是大于1。因为主体流动带着溶质一起向界面运动，使传质速率增大；溶质浓度越高，总体流动的影响越大、漂流因子越偏离1；浓度很低时漂流因子接近1，总体流动可忽略。","ev":"其值为单向扩散时总体流动使传质速率较单纯分子扩散增大的倍数。","keys":[],"ref":"第 219 页","hint":"","score":2},{"i":241,"n":242,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-truefalse-018","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"与等摩尔反向扩散不同，单向扩散中组分A的浓度沿扩散方向呈曲线分布。","o":["正确","错误"],"a":["T"],"exp":"等摩尔反向扩散中两组分等量反向传递，总浓度处处相同，扩散通量为常数，浓度沿扩散方向呈线性分布。单向扩散中惰性组分不穿过界面，存在总体流动，传质通量中包含漂流因子的影响，积分结果使浓度沿扩散方向呈曲线分布，所以两种扩散形式的浓度分布不同。","ev":"在单向扩散过程中,组分 A 的浓度沿扩散方向的分布为曲线","keys":[],"ref":"第 219 页","hint":"","score":2},{"i":242,"n":243,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-019","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"分子扩散系数的物理意义是什么？","o":["单位时间通过单位面积的物质量","单位浓度差下的扩散距离","单位面积上的扩散阻力","单位浓度梯度下的扩散通量"],"a":["D"],"exp":"由菲克定律可知，扩散系数等于单位浓度梯度下的扩散通量，它反映某组分在一定介质中扩散能力的大小，是物质的特性常数。单位时间通过单位面积的物质量是扩散通量本身；扩散系数既不是距离，也不是阻力，其单位可由通量除以浓度梯度导出。","ev":"由菲克定律得到扩散系数的物理意义为单位浓度梯度下的扩散通量，单位为 m2/s。","keys":[],"ref":"第 220 页","hint":"","score":2},{"i":243,"n":244,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-029","t":"single","mode":"","bloom":"理解","diff":"medium","q":"关于分子扩散系数，下列说法正确的是哪一项？","o":["随物系种类、温度、浓度或总压的不同而变化","只随温度变化，与物系种类和总压无关","与浓度梯度成正比，浓度梯度越大扩散系数越大","对所有物系都相同，是普适常数"],"a":["A"],"exp":"扩散系数是物质特性常数，但这里的常数是对一定物系和条件而言，它随物系种类、温度、浓度或总压的不同而变化。扩散系数与浓度梯度是两个不同概念，菲克定律中通量与浓度梯度成正比，而扩散系数本身不随浓度梯度改变；不同物系的扩散系数差异很大，不存在普适值。","ev":"扩散系数随物系种类、温度、浓度或总压的不同而变化。","keys":[],"ref":"第 220 页","hint":"","score":2},{"i":244,"n":245,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-single-007","t":"single","mode":"","bloom":"理解","diff":"medium","q":"液体的扩散系数比气体的扩散系数小得多，其主要原因是什么？","o":["液体的温度一定比气体低","液体的黏度比气体小","液体中溶质的浓度总是很低","液体中的分子比气体中的分子密集得多"],"a":["D"],"exp":"液体中分子排列密集、分子间作用力大，溶质分子在液体中迁移受到的阻碍远大于在气体中，因此液体扩散系数一般比气体小几个数量级。温度低不是根本原因，而且液体黏度通常比气体大而不是小；浓度高低只影响扩散系数的数值，不是两者相差悬殊的根源。","ev":"这主要是由于液体中的分子比气体中的分子密集得多的缘故。","keys":[],"ref":"第 223 页","hint":"","score":2},{"i":245,"n":246,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-truefalse-010","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"涡流扩散系数与分子扩散系数一样，都是物性常数。","o":["正确","错误"],"a":["F"],"exp":"分子扩散系数是物质的物性常数，只随物系、温度和压力等变化；涡流扩散系数则不是物性常数，它随流体流动状态和所处位置而改变，数值难以准确测定。正因为涡流扩散系数不是物性常数，工程上才把分子扩散与涡流扩散合并处理，引入有效膜模型。","ev":"必须指出，涡流扩散系数与分子扩散系数不同，D.。 不是物性常数，其值随流体流动状态及所处的位置等条件而变化","keys":[],"ref":"第 224 页","hint":"","score":2},{"i":246,"n":247,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-truefalse-011","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"有效膜模型把复杂的对流传质简化为通过一层虚拟膜的分子扩散，全部对流传质阻力都折算在这层膜内。","o":["正确","错误"],"a":["T"],"exp":"有效膜模型仿照对流传热的处理方法，把界面以外的复杂对流传质折算成通过一层虚拟膜的分子扩散，膜内不再保留涡流扩散。原题说阻力均匀分布在整个流动空间且膜内同时存在涡流扩散，正好背离了模型把阻力集中到膜内的简化前提。","ev":"上述处理方法的实质是把对流传质的阻力全部集中在一层虚拟的膜层内，膜层内的传质形式仅为分子扩散。","keys":[],"ref":"第 224 页","hint":"","score":2},{"i":247,"n":248,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-multiple-007","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"对流传质系数的大小取决于下列哪些因素？","o":["物系性质","操作条件","单位体积填料的持液量","流动状态"],"a":["A","B","D"],"exp":"对流传质系数与对流传热系数类似，取决于物系性质、操作条件和流动状态，界面状态也有影响。物系决定扩散系数等性质，操作条件影响物性和浓度，流动状态决定膜层厚薄。单位体积填料持液量是填料塔的流体力学参数，不是对流传质系数的直接决定因素，故C不选。","ev":"与对流传热系数类似，对流传质系数取决于物系、操作条件、界面和流动状态等因素","keys":[],"ref":"第 225 页","hint":"","score":3},{"i":248,"n":249,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-multiple-003","t":"multiple","mode":"","bloom":"理解","diff":"medium","q":"双膜理论的基本假设包括下列哪些内容？","o":["相界面两侧分别存在稳定的气膜和液膜","膜内流体为层流，溶质以分子扩散方式连续通过两膜","气液主体中溶质浓度均匀，主要以涡流扩散形式传质","相界面不断破灭更新，溶质靠涡流扩散穿过界面"],"a":["A","B","C"],"exp":"双膜理论假设：气液两相间存在稳定相界面，界面两侧分别为稳定的气膜和液膜；膜内为层流，溶质以分子扩散连续通过两膜；膜外主体充分湍动、浓度均匀，以涡流扩散传质；界面处达到平衡且无扩散阻力。界面不断更新是溶质渗透理论等模型的观点，正是双膜理论未考虑的局限，故D错误。","ev":"相互接触的气液两相之间存在一个稳定的相界面，相界面两侧分别存在着稳定的气膜和液膜。膜内流体流动状态为层流，溶质 A 以分子扩散方式连续通过气膜和液膜，由气相主体传递到液相主体。","keys":[],"ref":"第 226 页","hint":"","score":3},{"i":249,"n":250,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-single-008","t":"single","mode":"","bloom":"理解","diff":"medium","q":"双膜理论在什么条件下与实际对流传质情况较为符合？","o":["流体流速不太高、两相界面稳定时","流体流速很大、界面不断更新时","气液两相剧烈湍动、没有稳定界面时","系统在真空条件下操作时"],"a":["A"],"exp":"双膜理论假设界面两侧存在稳定的气膜和液膜，膜内为层流、溶质以分子扩散通过，因此只在流速不太高、相界面稳定时与实际较为符合。流速很大时界面不断破灭和更新，实际传质结果与双膜理论不一致，这正是该理论的局限性；真空操作与界面是否稳定没有必然联系。","ev":"当流体流速不太高时，两相有一稳定相界面，用双膜理论描述两流体间的对流传质与实际情况较为符合。","keys":[],"ref":"第 226 页","hint":"","score":2},{"i":250,"n":251,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-single-022","t":"single","mode":"","bloom":"理解","diff":"medium","q":"在定态传质过程中，溶质在气相和液相中的传质速率关系是什么？","o":["气相传质速率大于液相传质速率","液相传质速率大于气相传质速率","两者相等","两者之差等于界面处的溶解速率"],"a":["C"],"exp":"定态传质时界面上没有溶质的积累，所以溶质在气相中的传质速率必然等于在液相中的传质速率，这也是联立气、液单相传质速率方程求界面组成的依据。若两者不等，界面上就会发生溶质积累或亏空，过程不可能维持定态；界面溶解速率本身也包含在相等的传质速率之中。","ev":"定态传质过程 ，界面上无溶质的积累，所以溶质在气相中的传质速率等于在液相中的传速率","keys":[],"ref":"第 227 页","hint":"","score":2},{"i":251,"n":252,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-truefalse-019","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"总传质速率方程以同一相的实际浓度与另一相的平衡浓度之差作为总传质推动力。","o":["正确","错误"],"a":["T"],"exp":"总传质速率方程是为了避开难测的界面参数而建立的，因此推动力不取同一相内实际浓度与界面浓度之差，而取一相的实际浓度与另一相平衡浓度之差，例如气相实际组成与液相平衡组成之差。这样只需知道两相主体浓度和平衡关系，就能计算传质速率。","ev":"为避开界面参数，仿照对流传热的处理方法，根据双膜理论，建立以一相实际浓度与另一相平衡浓度差为总传质推动力的总传质速率方程式。","keys":[],"ref":"第 227 页","hint":"","score":2},{"i":252,"n":253,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-single-009","t":"single","mode":"","bloom":"理解","diff":"medium","q":"根据双膜理论，当界面阻力为零时，总传质阻力等于什么？","o":["气相传质阻力与液相传质阻力之差","气相传质阻力与液相传质阻力之和","仅等于气相传质阻力","仅等于液相传质阻力"],"a":["B"],"exp":"双膜理论把相际传质阻力看作气膜阻力和液膜阻力串联叠加，界面无阻力时总传质阻力等于气相传质阻力与液相传质阻力之和，这就是双阻力概念。两项是串联相加而不是相减；只有当一相阻力远大于另一相时，才可近似忽略小的一项，但不能由此认为总阻力只等于某一相阻力。总传质速率可用总传质系数乘以对应的总推动力表示，总传质系数与总阻力的关系正好互为倒数。","ev":"从以上总传质系数与单相传质系数的关系式可以看出，当界面阻力为零或界面处达到气-液平衡时，总传质阻力等于气相传质阻力与液相传质阻力之和","keys":[],"ref":"第 228 页","hint":"","score":2},{"i":253,"n":254,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-truefalse-012","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"总传质系数或总传质阻力可以与任意形式的推动力搭配使用。","o":["正确","错误"],"a":["F"],"exp":"总传质速率等于总传质系数乘以对应的总传质推动力，推动力用气相浓度差还是液相浓度差表示，总传质系数的定义和数值就不同，两者必须相互对应。若随意搭配，例如用气相总传质系数去乘液相浓度差，得到的速率既不是气相也不是液相的传质速率，因而是错误的。","ev":"但要注意总传质 阻力或两相传质阻力必须与推动力相对应。","keys":[],"ref":"第 228 页","hint":"","score":2},{"i":254,"n":255,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-single-020","t":"single","mode":"","bloom":"应用","diff":"medium","q":"当吸收过程为气膜控制时，提高吸收速率最有效的措施是什么？","o":["增大气体流速或增加气相湍流程度","提高液体流速或增加液相湍动程度","增大吸收剂黏度","降低气体流速使流动更稳定"],"a":["A"],"exp":"气膜控制时传质阻力主要集中在气相，因此应减少气相传质阻力，增大气体流速或增强气相湍流程度可以减薄气膜、降低阻力，从而有效提高总传质速率。提高液速主要针对液膜控制；增大吸收剂黏度会使液膜阻力更大；降低气速反而减薄不了气膜，吸收会变差。","ev":"对于气相阻力控制的吸收过程，要想提高吸收的传质速率，应减少气相传质阻力。如增大气体流速或增加气相湍流程度，能有效地降低传质阻力，从而提高总传质速率。","keys":[],"ref":"第 229 页","hint":"","score":2},{"i":255,"n":256,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-single-021","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"用水吸收二氧化碳、氧气等难溶气体时，吸收过程通常属于哪种控制？","o":["气膜控制","液膜控制","界面阻力控制","双膜控制"],"a":["B"],"exp":"难溶气体在液相中的溶解度小，亨利系数大，相平衡常数也大，传质阻力主要集中在液相，因此属于液膜控制。此时提高吸收速率应增大液体流速或增强液相湍动；气膜控制常见于氨等易溶气体的吸收，界面阻力通常很小，一般不作为控制步骤。","ev":"如用水吸收二氧化碳、氧气等吸收过程就是典型的液相阻力控制过程。","keys":[],"ref":"第 229 页","hint":"","score":2},{"i":256,"n":257,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-single-030","t":"single","mode":"","bloom":"应用","diff":"medium","q":"当气液两相传质阻力相当、溶质为中等溶解度时，提高吸收速率应采取什么措施？","o":["只增大气体流速","只提高液体流速","同时提高气液两相的湍动程度","降低吸收剂流量以延长接触时间"],"a":["C"],"exp":"两相阻力相当属于双膜阻力控制，气膜和液膜阻力都不能忽略，只有同时增强气液两相的湍动程度，才能同时减小两侧阻力、有效提高总传质速率。只提高气速或只提高液速只能改善一相；降低吸收剂流量会使液膜阻力和推动力状况恶化，不利于吸收。","ev":"对于气液两相传质阻力相当的吸收过程，称为双膜阻力控制过程，此情况多为溶质是中等的溶解度。提高该吸收过程传质速率的办法是同时增加气液两相的滑动程度","keys":[],"ref":"第 229 页","hint":"","score":2},{"i":257,"n":258,"ch":"第5章 气体吸收","sec":"5.4 双膜理论与总传质速率","code":"5.4","id":"ch05-truefalse-013","t":"truefalse","mode":"","bloom":"分析","diff":"hard","q":"吸收由气膜控制时，平衡线的斜率较小。","o":["正确","错误"],"a":["T"],"exp":"气膜控制意味着传质阻力主要集中在气相，对应的平衡线斜率较小，气相总推动力近似等于气相内的推动力，界面浓度接近液相主体浓度。反之，液膜控制时平衡线斜率较大，液相总推动力近似等于液相内的推动力。这个关系常用于判断控制步骤和选择强化措施。","ev":"吸收由气膜控制时，因为平衡线斜率比较小,如图 5-16(a)所示","keys":[],"ref":"第 229 页","hint":"","score":2},{"i":258,"n":259,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-single-010","t":"single","mode":"","bloom":"理解","diff":"medium","q":"逆流吸收操作线的位置和斜率由什么决定？","o":["由系统的平衡关系决定","由塔型和操作温度、压力决定","仅由液-气比及塔底、塔顶溶质组成决定","由填料的比表面积决定"],"a":["C"],"exp":"操作线由全塔和塔段的物料衡算导出，因此只与吸收操作的液-气比以及塔底、塔顶溶质组成有关，与平衡关系、塔型及操作温度、压力无关。平衡关系决定平衡线的位置，用于计算推动力；塔型和填料比表面积影响传质系数与塔高，但不改变操作线。","ev":"因逆流吸收操作线是通过物料衡算获得的，故此操作线仅与吸收操作的液-气比、塔底及塔顶溶质组成有关","keys":[],"ref":"第 232 页","hint":"","score":2},{"i":259,"n":260,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-single-031","t":"single","mode":"","bloom":"分析","diff":"hard","q":"关于最小液-气比所对应的汽-液平衡位置，下列说法正确的是哪一项？","o":["一定发生在塔底","一定发生在塔顶","与平衡曲线的形状无关","不一定在塔底，取决于平衡曲线的形状"],"a":["D"],"exp":"最小液-气比对应塔内某截面推动力为零、所需塔高无穷大的状态。当平衡线形状使操作线与平衡线在塔底相交时，极限点在塔底；若操作线在塔中部与平衡线相切，切点才是极限位置。因此极限平衡位置不一定在塔底，而与平衡曲线形状和分离要求有关。","ev":"由此可见，最小液-气比确定的汽-液平衡并非一定发生在塔底，在分离要求一定的前提下，与平衡曲线的形状有关。","keys":[],"ref":"第 233 页","hint":"","score":2},{"i":260,"n":261,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-truefalse-006","t":"truefalse","mode":"","bloom":"分析","diff":"medium","q":"增大吸收剂用量可以降低塔高，但液-气比过大时吸收剂消耗和输送、再生费用会剧增，所以液-气比并非越大越经济。","o":["正确","错误"],"a":["T"],"exp":"加大液-气比使操作线远离平衡线、推动力增大，塔高随之下降；但超过一定程度后塔高降幅已不明显，而吸收剂用量、输送动力与再生费用却迅速上升，设备费与操作费之和存在最低点。原题只说用量越大操作费用越低，忽略了吸收剂消耗这一面。","ev":"但液-气比增加到一定程度后，塔高减小的幅度就不显著，而吸收剂消耗量却过大，造成输送及吸收剂再生等操作费用剧增。","keys":[],"ref":"第 233 页","hint":"","score":2},{"i":261,"n":262,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-truefalse-005","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"传质单元数越大，说明吸收过程越难进行，完成一定分离任务所需的填料层越高。","o":["正确","错误"],"a":["T"],"exp":"传质单元数的分子是气相或液相组成变化即分离要求，分母是吸收推动力，因此它反映了吸收过程的难易程度：推动力越小、分离要求越高，传质单元数越大。填料层高度等于传质单元高度与传质单元数的乘积，传质单元数越大，所需填料层越高。","ev":"所以传质单元数反映了吸收过程的难易程度。","keys":[],"ref":"第 236 页","hint":"","score":2},{"i":262,"n":263,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-truefalse-015","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"吸收因数法要求气液平衡关系服从亨利定律，即平衡线为通过原点的直线。","o":["正确","错误"],"a":["T"],"exp":"吸收因数法是在平衡线为通过原点的直线这一前提下，由传质单元数定义式导出解析式的，所以要求平衡关系服从亨利定律；若平衡线是不通过原点的直线，也可推导出形式相同的公式。平衡线为曲线时则不宜直接用吸收因数法，而应采用图解积分等方法。","ev":"若气液平衡关系在吸收过程所涉及的组成范围内服从亨利定律，即平衡线为通过原点的直线，根据传质单元数的定义式(5-90)可导出其解析式。","keys":[],"ref":"第 238 页","hint":"","score":2},{"i":263,"n":264,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-single-032","t":"single","mode":"","bloom":"理解","diff":"medium","q":"解吸因数S增大时，吸收操作线和气相总传质单元数如何变化？","o":["操作线远离平衡线，传质单元数减小","操作线靠近平衡线，推动力减小，传质单元数增大","操作线靠近平衡线，推动力增大，传质单元数减小","操作线位置和传质单元数都不变"],"a":["B"],"exp":"解吸因数是平衡线斜率与操作线斜率之比，S增大意味着液-气比相对减小或平衡线斜率相对增大，操作线向平衡线靠近，塔内推动力减小。在分离要求不变时，推动力越小，完成同样任务所需的气相总传质单元数越大，填料层越高。说推动力增大或传质单元数减小，都与S增大的影响相反。","ev":"S 越大,吸收操作线越靠近平衡线，则吸收过程的推动力越小，Noc 值增大","keys":[],"ref":"第 239 页","hint":"","score":2},{"i":264,"n":265,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-single-023","t":"single","mode":"","bloom":"理解","diff":"medium","q":"当气液平衡线为曲线时，计算传质单元数通常采用哪种方法？","o":["对数平均推动力法","吸收因数法","等板高度法","图解积分法"],"a":["D"],"exp":"平衡线为曲线时，塔内各截面的吸收推动力不按直线规律变化，不能直接套用对数平均推动力法或吸收因数法的解析式；此时可把推动力的倒数对气相组成作图，用图解积分求传质单元数。等板高度法是估算填料层高度的方法，不用于直接计算传质单元数。","ev":"当物系的平衡线为曲线时，即使操作线为直线， 吸收塔内不同截面处的推动力也不同","keys":[],"ref":"第 240 页","hint":"","score":2},{"i":265,"n":266,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-single-011","t":"single","mode":"","bloom":"记忆","diff":"easy","q":"计算吸收塔塔径时，气体体积流量应如何选取？","o":["取全塔中最小值，通常以出塔气量为依据","取进塔与出塔气量的算术平均值","取塔顶气量的二分之一","取全塔中最大值，通常以进塔气量为依据"],"a":["D"],"exp":"塔径按空塔气速和气体体积流量计算，气量沿塔高逐渐变化，设计时取全塔最大值，通常以进塔气量为依据，以保证全塔各截面都能顺利通过。取最小值或平均值会使塔径偏小、塔内气速过高，甚至引起液泛；取塔顶气量的一半没有依据。","ev":"计算时气量通常取全塔中最大值，即以进塔气量为设计塔径的依据。","keys":[],"ref":"第 241 页","hint":"","score":2},{"i":266,"n":267,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-truefalse-003","t":"truefalse","mode":"","bloom":"理解","diff":"medium","q":"在X-Y图上，解吸操作线位于平衡线的上方。","o":["正确","错误"],"a":["F"],"exp":"吸收时气相实际组成高于平衡组成，故吸收操作线在平衡线上方；解吸是吸收的逆过程，溶质由液相向气相转移，气相实际组成低于平衡组成，故解吸操作线在平衡线下方。解吸的推动力为平衡组成与实际组成之差，方向与吸收相反。","ev":"在 XY图上，吸收过程的操作线在平衡线的上方，解吸过程的操作线在平衡线的下方.","keys":[],"ref":"第 245 页","hint":"","score":2},{"i":267,"n":268,"
