 the resin is removed and is mixed with a hardener composed of 1 g of wood flour, 0.05 g of calcium phosphate, and 0.2 g of ammonium chloride.","keys":[{"en":"hardener","cn":"固化剂"},{"en":"wood flour","cn":"木粉"},{"en":"ammonium chloride","cn":"氯化铵"}],"ref":"UNIT 10 Preparations of Amino Resins in Laboratory · 精练","hint":"","score":5},{"i":22,"n":23,"ch":"PART A 高分子化学与物理","sec":"UNIT 10 Preparations of Amino Resins in Laboratory","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"Add 10 to 15 drops of thymolphthalein indicator solution to the flask containing the sample, and adjust the color of the solution to a faint blue with 0.1N NaOH.","o":[],"a":["向盛有试样的烧瓶中加入 10~15 滴百里酚酞指示剂溶液，并用 0.1N NaOH 将溶液颜色调至浅蓝色。"],"exp":"","ev":"Add 10 to 15 drops of thymolphthalein indicator solution to the flask containing the sample, and adjust the color of the solution to a faint blue with 0.1N NaOH.","keys":[{"en":"thymolphthalein","cn":"百里酚酞"},{"en":"indicator solution","cn":"指示剂溶液"},{"en":"faint blue","cn":"浅蓝色"}],"ref":"UNIT 10 Preparations of Amino Resins in Laboratory · 精练","hint":"","score":5},{"i":23,"n":24,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"In multicomponent polymerizations by a free radical mechanism, polymer molecules will usually have a composition different than that of the monomer mixture from which they were formed.","o":[],"a":["在自由基机理的多组分聚合中，聚合物分子的组成通常不同于生成它们的单体混合物的组成。"],"exp":"","ev":"In multicomponent polymerizations by a free radical mechanism, polymer molecules will usually have a composition different than that of the monomer mixture from which they were formed.","keys":[{"en":"多组分聚合、自由基机理这一前提","cn":""},{"en":"聚合物与单体混合物组成不同","cn":""},{"en":"由该单体混合物生成","cn":""}],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":24,"n":25,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"For these results, the feed composition was selected to give an initial polymer composition of 28 wt% acrylonitrile, and the mean residence time in each type of reactor was adjusted to give 60% overall conversion.","o":[],"a":["为得到这些结果，所选取的进料组成使初始聚合物中丙烯腈含量为 28 wt%，同时把各类反应器中的平均停留时间调节到使总转化率达到 60%。"],"exp":"","ev":"For these results, the feed composition was selected to give an initial polymer composition of 28 wt% acrylonitrile, and the mean residence time in each type of reactor was adjusted to give 60% overall conversion.","keys":[{"en":"进料组成使初始聚合物含 28 wt% 丙烯腈","cn":""},{"en":"平均停留时间被调节","cn":""},{"en":"总转化率为 60%","cn":""}],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":25,"n":26,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The perfect mixer gives a uniform composition distribution at the average value of 28% acrylonitrile while a batch reactor shows a spread with compositions ranging up to 31%.","o":[],"a":["全混反应器给出的是均匀的组成分布，位于 28% 丙烯腈这一平均值处；而间歇反应器则出现分布展宽，组成最高可达 31%。"],"exp":"","ev":"The perfect mixer gives a uniform composition distribution at the average value of 28% acrylonitrile while a batch reactor shows a spread with compositions ranging up to 31%.","keys":[{"en":"全混：28% 处均匀分布","cn":""},{"en":"间歇釜：分布展宽","cn":""},{"en":"组成上限 31%","cn":""}],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":26,"n":27,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The state of complete segregation is easily imagined for any residence time distribution; simply consider the individual fluid elements to be encapsulated so that they experience the gross flow patterns of the vessel without any interchange of molecules.","o":[],"a":["对任意停留时间分布而言，完全离析状态都很容易设想：只需把各个流体微元视为被封装起来，它们经历容器的宏观流动型式，但彼此之间不发生任何分子交换。"],"exp":"","ev":"The state of complete segregation is easily imagined for any residence time distribution; simply consider the individual fluid elements to be encapsulated so that they experience the gross flow patterns of the vessel without any interchange of molecules.","keys":[{"en":"对任意停留时间分布均可设想","cn":""},{"en":"流体微元被封装","cn":""},{"en":"无分子交换","cn":""}],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":27,"n":28,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The measures of product polymer properties typically available to the reactor engineer are the molecular weight distribution, expressed in terms of the distribution function itself or in terms of the moments of this distribution, and the composition and sequence distributions in the case of copolymers.","o":[],"a":["反应器工程师通常可获得的产物聚合物性能指标是分子量分布（用分布函数本身或该分布的矩来表示），以及在共聚物情况下的组成分布和序列分布。"],"exp":"","ev":"The measures of product polymer properties typically available to the reactor engineer are the molecular weight distribution, expressed in terms of the distribution function itself or in terms of the moments of this distribution, and the composition and sequence distributions in the case of copolymers.","keys":[{"en":"分子量分布：分布函数或矩","cn":""},{"en":"共聚物的组成与序列分布","cn":""},{"en":"工程师可用的性能指标","cn":""}],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":28,"n":29,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The equations for the concentrations of polymer of chain length k can be transformed by a number of related methods, termed here transformation techniques, into a finite set whose solution yields both the moments of the polymer chain length distribution as well as the polymer chain length distribution (PLD) itself.","o":[],"a":["链长为 k 的聚合物浓度方程可通过若干彼此相关的方法（此处称为变换技术）化为一组有限方程，其解既给出聚合物链长分布的矩，也给出聚合物链长分布（PLD）本身。"],"exp":"","ev":"The equations for the concentrations of polymer of chain length k can be transformed by a number of related methods, termed here transformation techniques, into a finite set whose solution yields both the moments of the polymer chain length distribution as well as the polymer chain length distribution (PLD) itself.","keys":[{"en":"变换技术（相互关联的方法）","cn":""},{"en":"化无限集为有限方程组","cn":""},{"en":"解同时给出矩与链长分布","cn":""}],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":29,"n":30,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"Statistical approaches have the advantages of simplicity and directness in some cases, as well as occasionally revealing certain characteristics of the polymerization process which is marked by a purely deterministic treatment.","o":[],"a":["统计方法在某些情况下具有简单、直接的优点，并且有时还能揭示出聚合过程的某些特征，这些特征在纯确定性处理中是不易显现的。"],"exp":"","ev":"Statistical approaches have the advantages of simplicity and directness in some cases, as well as occasionally revealing certain characteristics of the polymerization process which is marked by a purely deterministic treatment.","keys":[{"en":"简单、直接的优点","cn":""},{"en":"偶能揭示过程特征","cn":""},{"en":"与纯确定性处理对照","cn":""}],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":30,"n":31,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"Statistical techniques frequently do not work explicitly in terms of time as a variable, which is inconvenient since engineers usually wish to make predictions as a function of time.","o":[],"a":["统计技术常常不以时间作为显含变量来处理，这一点很不方便，因为工程师通常希望作出随时间变化的预测。"],"exp":"","ev":"Statistical techniques frequently do not work explicitly in terms of time as a variable, which is inconvenient since engineers usually wish to make predictions as a function of time.","keys":[{"en":"不以时间为显含变量","cn":""},{"en":"由此带来不便","cn":""},{"en":"工程上需按时间函数预测","cn":""}],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":31,"n":32,"ch":"PART C 高分子材料与应用","sec":"UNIT 22 Mechanical Properties of Polymers","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"If an isotropic polymer is subjected to an imposed external stress, it undergoes a structural rearrangement called orientation.","o":[],"a":["对各向同性的聚合物施加外应力时，它会发生一种称为取向的结构重排。"],"exp":"","ev":"If an isotropic polymer is subjected to an imposed external stress, it undergoes a structural rearrangement called orientation.","keys":[{"en":"isotropic","cn":"各向同性的"},{"en":"imposed external stress","cn":"施加的外应力"},{"en":"structural rearrangement","cn":"结构重排"},{"en":"orientation","cn":"取向"}],"ref":"UNIT 22 Mechanical Properties of Polymers · 精练","hint":"","score":5},{"i":32,"n":33,"ch":"PART C 高分子材料与应用","sec":"UNIT 22 Mechanical Properties of Polymers","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"Uniaxial orientation is accomplished by stretching a thread, strip or bar in one direction, usually this process is carried out at a temperature just above the glass transition point.","o":[],"a":["单轴取向是通过沿一个方向拉伸丝、带或棒来实现的，该过程通常在略高于玻璃化转变温度的温度下进行。"],"exp":"","ev":"Uniaxial orientation is accomplished by stretching a thread, strip or bar in one direction, usually this process is carried out at a temperature just above the glass transition point.","keys":[{"en":"uniaxial orientation","cn":"单轴取向"},{"en":"glass transition point","cn":"玻璃化转变点"},{"en":"stretching","cn":"拉伸"}],"ref":"UNIT 22 Mechanical Properties of Polymers · 精练","hint":"","score":5},{"i":33,"n":34,"ch":"PART C 高分子材料与应用","sec":"UNIT 22 Mechanical Properties of Polymers","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The degree of crystallinity does not change much during drawing if one starts from a specimen with a developed crystallinity (before drawing); if on the other hand, the crystallinity of the undrawn filament is not, or only moderately, developed, crystallinity can be greatly induced by drawing.","o":[],"a":["如果起始试样（拉伸前）已具有充分发展的结晶度，则拉伸过程中结晶度变化不大；反之，若未拉伸丝的结晶度尚未发展或仅中等程度发展，则拉伸可以大大诱发结晶。"],"exp":"","ev":"The degree of crystallinity does not change much during drawing if one starts from a specimen with a developed crystallinity (before drawing); if on the other hand, the crystallinity of the undrawn filament is not, or only moderately, developed, crystallinity can be greatly induced by drawing.","keys":[{"en":"degree of crystallinity","cn":"结晶度"},{"en":"drawing","cn":"拉伸"},{"en":"undrawn filament","cn":"未拉伸丝条"}],"ref":"UNIT 22 Mechanical Properties of Polymers · 精练","hint":"","score":5},{"i":34,"n":35,"ch":"PART C 高分子材料与应用","sec":"UNIT 22 Mechanical Properties of Polymers","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The so called draw ratio is the ratio of the length of the drawn to that of the undrawn filament; it is about 4 to 5 for many polymers, but may be as high as 40 for linear polyolefins and as low as 2 in the case of regenerated cellulose.","o":[],"a":["所谓拉伸比是指拉伸后丝条长度与未拉伸丝条长度之比；对许多聚合物而言约为 4~5，但线型聚烯烃可高达 40，而再生纤维素则低至 2。"],"exp":"","ev":"The so called draw ratio is the ratio of the length of the drawn to that of the undrawn filament; it is about 4 to 5 for many polymers, but may be as high as 40 for linear polyolefins and as low as 2 in the case of regenerated cellulose.","keys":[{"en":"draw ratio","cn":"拉伸比"},{"en":"linear polyolefins","cn":"线型聚烯烃"},{"en":"regenerated cellulose","cn":"再生纤维素"}],"ref":"UNIT 22 Mechanical Properties of Polymers · 精练","hint":"","score":5},{"i":35,"n":36,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The polymer is the pure material which results from the process of polymerisation and is usually taken as the family name for materials which have long chain like molecules and this includes rubber.","o":[],"a":["聚合物是聚合过程所得到的纯净材料，通常用作具有长链状分子的材料的统称，橡胶也包含在内。"],"exp":"","ev":"The polymer is the pure material which results from the process of polymerisation and is usually taken as the family name for materials which have long chain like molecules and this includes rubber.","keys":[{"en":"polymerisation","cn":"聚合"},{"en":"long chain like molecules","cn":"长链状分子"},{"en":"family name","cn":"统称（族名）"}],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":36,"n":37,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"This cycle of softening by heat and solidifying when cooled can be repeated more or less indefinitely and is a definite advantage in that it is the basis of most processing methods for these materials.","o":[],"a":["这种受热软化、冷却固化的循环可以或多或少无限次地重复，这无疑是一大优点，因为它是这类材料大多数加工方法的基础。"],"exp":"","ev":"This cycle of softening by heat and solidifying when cooled can be repeated more or less indefinitely and is a definite advantage in that it is the basis of most processing methods for these materials.","keys":[{"en":"cycle of softening","cn":"软化循环"},{"en":"solidifying","cn":"固化"},{"en":"processing methods","cn":"加工方法"}],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":37,"n":38,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"The first stage results in the formation of long chain like molecules similar to those present in thermoplastics, but still capable of further reaction.","o":[],"a":["第一阶段生成与热塑性塑料中相似的长链状分子，但这些分子仍能进一步反应。"],"exp":"","ev":"The first stage results in the formation of long chain like molecules similar to those present in thermoplastics, but still capable of further reaction.","keys":[{"en":"the first stage","cn":"第一阶段"},{"en":"thermoplastics","cn":"热塑性塑料"},{"en":"capable of further reaction","cn":"能进一步反应"}],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":38,"n":39,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"trans_en_cn","bloom":"理解","diff":"medium","q":"For the purposes of this article, the following definition is offered: engineering plastics are thermoplastics that maintain dimensional stability and most mechanical properties above 100°C and below 0°C.","o":[],"a":["就本文而言，给出如下定义：工程塑料是指在 100°C 以上和 0°C 以下仍能保持尺寸稳定性和大部分力学性能的热塑性塑料。"],"exp":"","ev":"For the purposes of this article, the following definition is offered: engineering plastics are thermoplastics that maintain dimensional stability and most mechanical properties above 100°C and below 0°C.","keys":[{"en":"engineering plastics","cn":"工程塑料"},{"en":"dimensional stability","cn":"尺寸稳定性"},{"en":"mechanical properties","cn":"力学性能"}],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":39,"n":40,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe how benzene and polyethylene behave when they are heated, in English.","o":[],"a":["Benzene is a simple, low molecular weight compound, and its behavior on heating is well defined. Solid benzene melts to liquid benzene at 5.5 degrees Celsius, and on further heating the liquid boils and becomes gaseous benzene. Polyethylene, a polymer, does not behave in this way. It does not melt sharply at one particular temperature into a clean liquid. Instead, it becomes increasingly softer as the temperature rises and finally turns into a very viscous, tacky molten mass. If this hot, viscous melt is heated further, it is converted into various gases, but the material obtained is no longer polyethylene; the polymer has decomposed."],"exp":"","ev":"Solid benzene, for instance, melts to become liquid benzene at 5.5°C and, on further heating, boils into gaseous benzene.","keys":[],"ref":"UNIT 1 What are Polymers? · 精练","hint":"","score":5},{"i":40,"n":41,"ch":"PART A 高分子化学与物理","sec":"UNIT 2 Chain Polymerization","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the overall kinetics of radical chain polymerization in English.","o":[],"a":["Radical chain polymerization is a chain reaction that consists of three steps: initiation, propagation and termination. The initiation step involves two reactions. In the first, an initiator or catalyst species I dissociates homolytically to yield a pair of radicals R, and the rate constant for this catalyst dissociation is kd. In the second, one of these radicals adds to the first monomer molecule M to produce the chain initiating species M, and the rate constant for this step is ki. For the polymerization of CH2=CHY, the radical adds to the double bond and gives R-CH2-CH(Y). Propagation repeats this addition many times, and termination ends the active center."],"exp":"","ev":"The initiation step is considered to involve two reactions.","keys":[],"ref":"UNIT 2 Chain Polymerization · 精练","hint":"","score":5},{"i":41,"n":42,"ch":"PART A 高分子化学与物理","sec":"UNIT 3 Step Growth Polymerization","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the mechanism of free-radical chain polymerization from initiation to termination. in English.","o":[],"a":["Free-radical chain polymerization starts when an initiator produces a primary radical, which adds a monomer molecule to form M₁•. Propagation then proceeds by the successive addition of hundreds or thousands of monomer molecules, each addition creating a new radical larger by one monomer unit. The propagation constant is large, 10² to 10⁴ L/(mol·s), so high polymer is built up very rapidly. Growth ends by termination, in which two radicals react by coupling or disproportionation to give dead polymer. Termination constants of 10⁶ to 10⁸ L/(mol·s) are far larger than k_p, yet propagation is not prevented, because radicals are present at very low concentration, about 10⁻⁸ molar."],"exp":"","ev":"The chain nature of the process resides in the propagation step (Eq. (2.4)) in which large numbers of monomer molecules are converted to polymer for each initial radical species produced in the first step (Eq. (2.1)).","keys":[],"ref":"UNIT 3 Step-Growth Polymerization · 精练","hint":"","score":5},{"i":42,"n":43,"ch":"PART A 高分子化学与物理","sec":"UNIT 6 Polymer Solution","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the random-coil conformation of a dissolved polymer molecule and the statistical parameters used to express the size of the coil. in English.","o":[],"a":["In solution a polymer molecule is a randomly coiling mass whose conformations occupy many times the volume of its segments alone; the average segment density inside the coil is only of the order of 10⁻¹ to 10⁻⁵ g/cm³. The coil exists because chain bonds rotate relatively freely and because an enormous number of conformations is accessible to the molecule. Only the fully extended conformation has a length that can be calculated directly, the contour length. Otherwise the coil size must be described statistically, either by the root-mean-square end-to-end distance or by the radius of gyration, the root-mean-square distance of chain elements from the center of gravity. For an unperturbed linear chain r² = 6s²; for extended chains r² > 6s². The radius of gyration is often preferred because it can be measured experimentally."],"exp":"","ev":"In solution, a polymer molecule is a randomly coiling mass most of whose conformations occupy many times the volume of its segments alone.","keys":[],"ref":"UNIT 6 Polymer Solution · 精练","hint":"","score":5},{"i":43,"n":44,"ch":"PART A 高分子化学与物理","sec":"UNIT 7 Morphology of Solid Polymers","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe in English how spherulitic textures form when a polymer melt is cooled and what the lamellar morphology implies about the melt.","o":[],"a":["When a polymer melt is cooled, crystallization is initiated at nuclei located at different points of the specimen. Spherulitic textures are then formed by the growth of dominant lamellae from a central nucleus in all directions, by twisting of these lamellae along fibrils, the intervening spaces being filled in by subsidiary lamellae and possibly low molecular weight material. Such specimens are unoriented in the macroscopic sense and show isotropic bulk mechanical properties, yet they are not homogeneous microscopically and appear spherulitic under a polarizing microscope. Neutron diffraction shows only small changes in the radius of gyration of the chains on crystallization, so the highly entangled topology existing in the melt must be substantially retained in the semicrystalline state; one model proposes crystallization by straightening of coil sequences without long range diffusion."],"exp":"","ev":"Spherulitic textures are then formed by the growth of dominant lamellae from a central nucleus in all directions by twisting of these lamellae along fibrils, the intervening spaces being filled in by subsidiary lamellae and possibly low molecular weight material.","keys":[],"ref":"UNIT 7 Morphology of Solid Polymers · 精练","hint":"","score":5},{"i":44,"n":45,"ch":"PART A 高分子化学与物理","sec":"UNIT 10 Preparations of Amino Resins in Laboratory","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe in English the preparation of a urea-formaldehyde adhesive, from the charge to the hardened sample.","o":[],"a":["50 g (1 mole) of urea and 137 g (1.7 mole) of formalin (37%) are charged into a 500-ml reaction kettle fitted with a mechanical stirrer and a reflux condenser. The pH of the mixture is adjusted with 2N NaOH to between 7 and 8, as determined by universal indicator paper, and the mixture is refluxed for 2 hr, the free formaldehyde content being determined at each 0.5-hr interval. A Dean-Stark trap is then introduced between the flask and the condenser, about 40 ml of water is distilled into it and discarded, and the solution is acidified with 5 drops of glacial acetic acid. 44 g of furfuryl alcohol and 0.55 g of triethanolamine are added, and the solution is heated at 90℃ for 15 min. After cooling, a 15-g portion is mixed with a hardener of wood flour, calcium phosphate and ammonium chloride and set aside to harden at room temperature."],"exp":"","ev":"After the mixture has refluxed for 2 hrs, a Dean-Stark trap is introduced between the flask and the reflux condenser.","keys":[],"ref":"UNIT 10 Preparations of Amino Resins in Laboratory · 精练","hint":"","score":5},{"i":45,"n":46,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the two limits of micromixing and the piston flow reactor models used to represent them in English.","o":[],"a":["Complete segregation is the lower limit, at which there is no molecular mixing at all: the individual fluid elements can be imagined as encapsulated, so that they follow the gross flow patterns of the vessel without any interchange of molecules, as beads in a continuous suspension do. Such a reactor can be modelled as a piston flow reactor with multiple side exits, distributed so as to match an arbitrary residence time distribution, which is equivalent to many piston flow elements in parallel. The upper limit is maximum mixedness, the greatest molecular level mixing possible with a given residence time distribution; Zwietering modelled it as a piston flow reactor with multiple side entrances."],"exp":"","ev":"Zwietering showed that complete segregation and maximum mixedness represent bounds on the amount of mixing possible between molecules that have spent different times in the reactor.","keys":[],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":46,"n":47,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the deterministic route from a postulated kinetic mechanism to the chain length distribution in English.","o":[],"a":["The first step is the postulation of a kinetic mechanism governing the reactions that comprise the polymerization. For a particular reactor type this mechanism leads, through the mass balance equations, to a set of equations governing the evolution of the concentration of polymer of a given chain length. This set could be solved directly, usually numerically, to yield the entire distribution, but the procedure is tedious and lengthy because the equations form an infinite set. Alternatively, moment equations can be developed, and since colligative methods of analysis yield data related to the moments, a truncated set may suffice. Transformation techniques convert the equations into a finite set whose solution yields both the moments and the chain length distribution itself."],"exp":"","ev":"The equations could be solved directly, usually by numerical means, to yield the entire distribution of polymer chain lengths.","keys":[],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":47,"n":48,"ch":"PART C 高分子材料与应用","sec":"UNIT 22 Mechanical Properties of Polymers","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the process of uniaxial orientation of polymers and its effects on their properties in English.","o":[],"a":["Uniaxial orientation is produced by stretching a thread, strip or bar in one direction, usually at a temperature just above the glass transition point. The polymer chains tend to line up parallel to the direction of stretching, although in reality only a small fraction of the chain segments becomes perfectly oriented. Nearly all polymeric objects already retain some orientation from forming, but this is negligible compared with the orientation imposed by drawing. Orientation has a pronounced effect on the physical properties: oriented polymers have varying properties in different directions, that is, they are anisotropic, and with increasing orientation the tensile strength and stiffness increase while the anisotropy increases as well. Oriented fibres are therefore strong in the direction of their long axis but relatively weak perpendicular to it, which is why this process is of the utmost importance in the production of man made fibres."],"exp":"","ev":"Oriented fibres are strong in the direction of their long axis, but relatively weak perpendicular to it.","keys":[],"ref":"UNIT 22 Mechanical Properties of Polymers · 精练","hint":"","score":5},{"i":48,"n":49,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"describe","bloom":"应用","diff":"medium","q":"Describe the structure and behaviour of a thermoplastic material when it is heated and cooled in English.","o":[],"a":["In a thermoplastic material the long chain like molecules are held together by relatively weak Van der Waals forces, and a useful image of the structure is a mass of randomly distributed long strands of sticky wool. When the material is heated, the intermolecular forces are weakened, so it becomes soft and flexible and eventually, at high temperatures, it is a viscous melt; when it is allowed to cool it solidifies again. This cycle can be repeated more or less indefinitely, and that is the basis of most processing methods for these materials. The drawback is that their properties are heat sensitive. Like candle wax, they can be repeatedly softened by heat and will solidify when cooled. Examples are polyethylene, polyvinyl chloride, polystyrene, nylon and polycarbonate."],"exp":"","ev":"When the material is heated the intermolecular forces are weakened so that it becomes soft and flexible and eventually, at high temperatures, it is a viscous melt.","keys":[],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":49,"n":50,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why does polyvinyl alcohol behave so differently from sodium chloride when it is added to water, and what is the underlying cause?","o":[],"a":["Sodium chloride, a low molecular weight compound, dissolves in water only up to a saturation point; any further salt does not go into solution but settles at the bottom as solid, and the viscosity of the saturated solution is not much different from that of water. Polyvinyl alcohol behaves quite differently. Its globules first absorb water, swell and become distorted in shape, and only after a long time do they go into solution. No saturation point is ever reached, so a very large quantity of the polymer can be added, and the mixture finally assumes a soft, dough-like consistency of high viscosity."],"exp":"","ev":"Also, we can add a very large quantity of the polymer to the same quantity of water without the saturation point ever being reached.","keys":[{"en":"saturation point","cn":"饱和点"},{"en":"viscosity","cn":"粘度"},{"en":"swell","cn":"溶胀"}],"ref":"UNIT 1 What are Polymers? · 精练","hint":"","score":5},{"i":50,"n":51,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"qa","bloom":"分析","diff":"hard","q":"How is a branch introduced into a growing polyester chain, and how does branching change the number of chain ends?","o":[],"a":["In the formation of a polyester, difunctional acids and difunctional alcohols allow the chain to grow, because each such molecule is incorporated into the chain with ester linkages at both ends. Trifunctional acids or alcohols give a linear molecule by reacting through only two of their functional groups. If the third group reacts and the chain continues to grow, a branch has been introduced into the original chain. Branching can also arise adventitiously when an atom is abstracted from the original linear molecule and growth starts from the resulting active site. At low degrees of branching, a molecule with i branches has i+2 chain ends instead of two."],"exp":"","ev":"If the third reacts and the resulting chain continues to grow, a branch has been introduced into the original chain.","keys":[{"en":"trifunctional","cn":"三官能度的"},{"en":"ester linkage","cn":"酯键"},{"en":"adventitious branching","cn":"偶然支化"}],"ref":"UNIT 1 What are Polymers? · 精练","hint":"","score":5},{"i":51,"n":52,"ch":"PART A 高分子化学与物理","sec":"UNIT 2 Chain Polymerization","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why are the initiators used in polymerization often called polymerization catalysts even though they are not true catalysts?","o":[],"a":["Initiators are often called polymerization catalysts because very small amounts of them bring about the formation of a large amount of polymeric material, in a ratio of about 1 : 1 000 to 1 : 10 000, so that polymerization can be regarded, from a superficial point of view, as a catalytic reaction. In the strictest sense, however, they are not true catalysts. The initiator enters into the reaction as a real partner and can be found chemically bound in the reaction product, that is, in the polymer. Besides radical and ionic initiators, metal complex initiators such as Ziegler catalysts also play an important role."],"exp":"","ev":"For this reason, the initiators used in polymerization reactions are often designated as polymerization catalysts, even though, in the strictest sense, they are not true catalysts because the polymerization initiator enters into the reaction as a real partner and can be found chemically bound in the reaction product, i.e., the polymer.","keys":[{"en":"initiator","cn":"引发剂"},{"en":"in the strictest sense","cn":"严格地讲"},{"en":"Ziegler catalysts","cn":"齐格勒催化剂"}],"ref":"UNIT 2 Chain Polymerization · 精练","hint":"","score":5},{"i":52,"n":53,"ch":"PART A 高分子化学与物理","sec":"UNIT 2 Chain Polymerization","code":"","t":"qa","bloom":"分析","diff":"hard","q":"How is the initiation reaction brought about, and what does an initiator do to the monomer?","o":[],"a":["The initiation reaction is the activation process of the double bond, and it can be brought about by heating, irradiation, ultrasonics, or by initiators. The initiation of a chain reaction is observed most clearly with radical or ionic initiators, which are energy rich compounds. Such a compound adds a suitable unsaturated compound, that is, a monomer, and keeps the activated radical or ionic state, so that further monomer molecules can be added in the same manner. Only a relatively small activation energy is needed for the individual growth steps, so a single activation step converts a large number of olefin molecules."],"exp":"","ev":"The initiation reaction, which is the activation process of the double bond, can be brought about by heating, irradiation, ultrasonics, or initiators.","keys":[{"en":"initiation","cn":"引发"},{"en":"activation","cn":"活化"},{"en":"irradiation","cn":"辐照"}],"ref":"UNIT 2 Chain Polymerization · 精练","hint":"","score":5},{"i":53,"n":54,"ch":"PART A 高分子化学与物理","sec":"UNIT 3 Step Growth Polymerization","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why is the polymerization rate proportional to the square root of the initiation rate instead of to the initiation rate itself?","o":[],"a":["The rate of polymerization is given by R_p = k_p[M](R_i/2k_t)^{1/2}, so it depends on the square root of the initiation rate, not on R_i itself. The steady-state assumption sets the rate of initiation equal to the rate of termination, R_i = 2k_t[M•]², which allows the unknown radical concentration to be eliminated. Because termination is bimolecular, the radical concentration varies as the one-half power of R_i. Doubling the initiation rate therefore raises the polymerization rate only by the factor √2. This behavior is a direct consequence of the bimolecular termination reaction between radicals."],"exp":"","ev":"Doubling the rate of initiation does not double the polymerization rate; the polymerization rate is increased only by the factor √2.","keys":[{"en":"steady-state assumption","cn":"稳态假设"},{"en":"square root of the initiation rate","cn":"引发速率的平方根"},{"en":"bimolecular termination","cn":"双分子终止"}],"ref":"UNIT 3 Step-Growth Polymerization · 精练","hint":"","score":5},{"i":54,"n":55,"ch":"PART A 高分子化学与物理","sec":"UNIT 3 Step Growth Polymerization","code":"","t":"qa","bloom":"分析","diff":"hard","q":"How does termination by disproportionation differ from termination by coupling, and how are the two modes treated kinetically?","o":[],"a":["In coupling, two radical chains combine at their radical centers to form a single dead polymer molecule whose length is the sum of the two original chains, as shown by Mₙ• + Mₘ• → M_{n+m}. In disproportionation, a hydrogen radical that is beta to one radical center is transferred to the other radical center, so two polymer molecules are produced, one saturated and one unsaturated. Disproportionation is the rarer mode. Both modes follow the same kinetic expression, so the overall termination constant is written as k_t = k_tc + k_td, and the rate equation needs no specification of which mode operates."],"exp":"","ev":"This results in the formation of two polymer molecules—one saturated and one unsaturated.","keys":[{"en":"coupling","cn":"偶合（终止）"},{"en":"disproportionation","cn":"歧化（终止）"},{"en":"dead polymer","cn":"死聚物"}],"ref":"UNIT 3 Step-Growth Polymerization · 精练","hint":"","score":5},{"i":55,"n":56,"ch":"PART A 高分子化学与物理","sec":"UNIT 6 Polymer Solution","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why does the activation energy of flow of long-chain polymers become independent of molecular weight, although for low-molecular-weight liquids it is related to the latent heat of vaporization?","o":[],"a":["For a low-molecular-weight liquid the activation energy for viscous flow is linked to the latent heat of vaporization, because removing a molecule from its neighbors is part of both processes; this is evidence that the jumping unit is a single molecule. In a homologous series, the flow activation energy stops rising with the heat of vaporization and levels off at a value independent of molecular weight. This is taken to mean that in long chains the unit of flow is much smaller than the complete molecule: a segment of about 5 to 50 carbon atoms. Flow then occurs by successive jumps of segments until the whole chain has shifted."],"exp":"","ev":"This is taken to mean that in long chains the unit of flow is considerably smaller than the complete molecule.","keys":[{"en":"activation energy for viscous flow","cn":"粘性流动活化能"},{"en":"latent heat of vaporization","cn":"蒸发潜热"},{"en":"segment","cn":"链段"}],"ref":"UNIT 6 Polymer Solution · 精练","hint":"","score":5},{"i":56,"n":57,"ch":"PART A 高分子化学与物理","sec":"UNIT 6 Polymer Solution","code":"","t":"qa","bloom":"分析","diff":"hard","q":"What is shear thinning, how does it arise, and how does it differ from dilatant behavior?","o":[],"a":["In a Newtonian liquid the viscosity is independent of the rate of shear. Polymer solutions and melts usually deviate from this. Shear thinning, or pseudoplastic behavior, is a reversible decrease in viscosity as the shear rate rises; it results from the tendency of the applied force to disturb the long chains from their favored equilibrium conformation, causing elongation in the direction of shear, so that they flow more easily. The opposite effect, shear thickening or dilatant behavior, in which viscosity increases with increasing shear rate, is not observed in polymers."],"exp":"","ev":"Shear thinning results from the tendency of the applied force to disturb the long chains from their favored equilibrium conformation, causing elongation in the direction of shear.","keys":[{"en":"shear thinning","cn":"剪切变稀"},{"en":"pseudoplastic","cn":"假塑性的"},{"en":"dilatant behavior","cn":"膨胀（流）型行为"}],"ref":"UNIT 6 Polymer Solution · 精练","hint":"","score":5},{"i":57,"n":58,"ch":"PART A 高分子化学与物理","sec":"UNIT 7 Morphology of Solid Polymers","code":"","t":"qa","bloom":"分析","diff":"hard","q":"By what experimental methods is the extent and type of crystallinity in a polymer determined, and how are the results usually expressed?","o":[],"a":["Crystallinity is not judged by appearance but measured experimentally. The extent and type of crystallinity in a polymer is determined by methods such as density, X-ray and electron diffraction, infrared spectroscopy and nuclear magnetic resonance. Since most polymers are only partially crystalline, the results are usually interpreted in a simplified manner as a weight percent or a volume percent crystallinity. This is obtained by comparison with measurements made on completely crystalline and on completely amorphous polymer samples. The value therefore expresses how far a given specimen lies between the two extremes of order and disorder."],"exp":"","ev":"The extent and type of crystallinity in a polymer is experimentally determined by methods such as density, X-ray and electron diffraction, infrared spectroscopy, and nuclear magnetic resonance.","keys":[{"en":"crystallinity","cn":"结晶度"},{"en":"X-ray diffraction","cn":"X 射线衍射"},{"en":"weight or volume percent crystallinity","cn":"重量或体积百分比结晶度"}],"ref":"UNIT 7 Morphology of Solid Polymers · 精练","hint":"","score":5},{"i":58,"n":59,"ch":"PART A 高分子化学与物理","sec":"UNIT 7 Morphology of Solid Polymers","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why may the fringed-micelle and folded-chain theories be used together, and which polymers does each serve best?","o":[],"a":["The two theories are often considered mutually exclusive, but they need not be considered so. It is usually practical to adopt a working model of polymer crystallinity which employs the features of both concepts. The folded-chain theory is especially well suited for highly crystalline polymers, which can be regarded as one-phase crystalline systems containing defects such as imperfect folds, irregularities in packing, chain entanglements, loose chain ends, dislocations and occluded impurities. Polymers of medium to low crystallinity are better treated by the fringed-micelle concept as two-phase systems, in which crystallites are imbedded in uncrystallized amorphous polymer. The crystallites in such polymers may themselves have folded-chain lamellar structure."],"exp":"","ev":"The folded chain theory is especially well suited for highly crystalline polymers where one can consider them to be one phase crystalline systems with defects.","keys":[{"en":"mutually exclusive","cn":"相互排斥的"},{"en":"one phase crystalline system","cn":"单相结晶体系"},{"en":"two phase system","cn":"两相体系"}],"ref":"UNIT 7 Morphology of Solid Polymers · 精练","hint":"","score":5},{"i":59,"n":60,"ch":"PART A 高分子化学与物理","sec":"UNIT 10 Preparations of Amino Resins in Laboratory","code":"","t":"qa","bloom":"分析","diff":"hard","q":"How is the free formaldehyde content of an amino resin sample determined in the laboratory?","o":[],"a":["A weighed 2 to 3 g sample of resin is added to 100 ml of water in a 250 ml Erlenmeyer flask and swirled until it dissolves; ethanol may be added if the resin will not dissolve. The solution is cooled to 4℃ in an ice bath, 10 to 15 drops of thymolphthalein are added, and the colour is adjusted to a faint blue with 0.1N NaOH. A cold acid sulfite solution, made from 25 ml of 1M Na2SO3 and 10.00 ml of standard 1N HCl, is then transferred into the flask, and the contents are titrated with standard 1N NaOH to the thymolphthalein endpoint. The free formaldehyde content is calculated from the quantity of HCl consumed."],"exp":"","ev":"Add a weighed 2 to 3g sample of resin into 100 ml of water in a 250 ml Erlenmeyer flask, and swirl the contents of the flask until they are dissolved completely.","keys":[{"en":"free formaldehyde","cn":"游离甲醛"},{"en":"acid sulfite","cn":"酸式亚硫酸盐"},{"en":"endpoint","cn":"终点"}],"ref":"UNIT 10 Preparations of Amino Resins in Laboratory · 精练","hint":"","score":5},{"i":60,"n":61,"ch":"PART A 高分子化学与物理","sec":"UNIT 10 Preparations of Amino Resins in Laboratory","code":"","t":"qa","bloom":"分析","diff":"hard","q":"What is observed when urea and formalin are acidified, and how is the precipitate examined?","o":[],"a":["Urea is mixed with formalin in a test tube and the tube is shaken until the urea has dissolved. The pH of the solution is then adjusted to 4 by adding 4 drops of 0.5N H2SO4, and the time required for precipitation to occur is observed, showing how quickly urea reacts with formaldehyde when the solution is acidic. Part of the precipitate is then removed and its solubility in water is compared with that of a sample of monomethylolurea. Amino resins in general are reaction products of amino derivatives with aldehydes under acidic or basic conditions, and the urea-formaldehyde resin is the most important representative of this class."],"exp":"","ev":"Adjust the pH of the solution to 4 by the addition of 4 drops of 0.5N H₂SO₄, and observe the time required for precipitation to occur.","keys":[{"en":"precipitation","cn":"沉淀"},{"en":"monomethylolurea","cn":"单羟甲基脲"},{"en":"acidic conditions","cn":"酸性条件"}],"ref":"UNIT 10 Preparations of Amino Resins in Laboratory · 精练","hint":"","score":5},{"i":61,"n":62,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"qa","bloom":"分析","diff":"hard","q":"In Fig. 16.1, what quantity characterises the level of macromixing, and what do perfect mixing, batch operation and a segregated stirred tank each give?","o":[],"a":["The level of macromixing is characterised by the dimensionless variance σ², which represents the fraction of the system volume that is stirred; intermediate residence time distributions correspond to a stirred tank in series with a piston flow reactor. For a feed chosen to give an initial polymer composition of 28 wt% acrylonitrile and a mean residence time giving 60% overall conversion, the perfect mixer gives a uniform composition distribution at the average value of 28%, the batch reactor gives a spread extending up to 31%, and the segregated stirred tank gives the broadest distribution, whose tail approaches pure polyacrylonitrile."],"exp":"","ev":"The magnitude of σ² represents the fraction of the system volume that is stirred.","keys":[{"en":"σ² 表示被搅拌的体积分数","cn":""},{"en":"全混：28% 均匀分布","cn":""},{"en":"离析釜分布最宽、拖尾趋近纯聚丙烯腈","cn":""}],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":62,"n":63,"ch":"PART B 高分子材料工程","sec":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why do the completely segregated and maximum mixedness reactors predict different yields even though their residence time distributions are identical?","o":[],"a":["Both limits can be modelled as piston flow reactors, one with multiple side exits and one with multiple side entrances, and both reproduce the same residence time distribution, yet they generally predict different reaction yields because the timing of mixing differs. In the completely segregated reactor, molecules that have spent different times in the vessel meet only in the exit stream, so mixing is as late as possible. In the maximum mixedness reactor the same mixing happens at the entrance points, that is, as early as possible. Zwietering showed these two conditions bound the mixing possible between molecules of different ages."],"exp":"","ev":"These two piston flow models have the same residence time distribution but in general will predict different reaction yields.","keys":[{"en":"二者停留时间分布相同","cn":""},{"en":"离析：混合最晚（出口）","cn":""},{"en":"最大混合度：混合最早（入口）","cn":""}],"ref":"UNIT 16 Copolymer Composition Distributions Affected by Micromixing · 精练","hint":"","score":5},{"i":63,"n":64,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"qa","bloom":"分析","diff":"hard","q":"What does the assumption of equal reactivity state, and why is it essential in solving the material balances for the anionic polymerization of styrene?","o":[],"a":["The material balances for the various polymer species in a batch reactor give an infinite set of equations, and no real simplification is possible until an assumption is made. Fundamental to all analyses of polymerization kinetics is the assumption of equal reactivity, that is k_j = k for all j > 0, so the rate constant does not depend on chain length. This proves to be a reasonable assumption, although unequal reactivity, that is chain-length dependent reactivity, is often important in high conversion free radical polymerization; it need not be considered here. With fast initiation, no impurities and no termination or transfer, propagation is the only reaction of interest."],"exp":"","ev":"Fundamental to all analyses of polymerization kinetics is the assumption of equal reactivity, i.e. k_j = k for all j > 0.","keys":[{"en":"无限方程组需先作假设","cn":""},{"en":"等活性：k_j = k（与链长无关）","cn":""},{"en":"高转化自由基聚合中非等活性才重要","cn":""}],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":64,"n":65,"ch":"PART B 高分子材料工程","sec":"UNIT 17 Introduction to Modelling of Polymerization Kinetics","code":"","t":"qa","bloom":"分析","diff":"hard","q":"What are the advantages and disadvantages of the statistical approach compared with the mass balance approach?","o":[],"a":["The statistical approach bypasses the mass balance equations and pictures the chain as growing by selecting monomer according to some statistical distribution. It has the advantages of simplicity and directness in some cases and can sometimes reveal features that a mass balance approach does not. Its disadvantages are that it relies too heavily on intuition, so it lacks the methodic reliability of the mass balance approach, and that it frequently does not work explicitly in terms of time as a variable, which is inconvenient since engineers wish to predict behaviour as a function of time. It is also less easily adapted to different reactor configurations."],"exp":"","ev":"This approach had the disadvantage of relying too heavily on intuition and so lacked the methodic reliability of the mass balance approach.","keys":[{"en":"绕过质量衡算、按统计分布选单体","cn":""},{"en":"优点：简单直接、可揭示新特征","cn":""},{"en":"缺点：依赖直觉、不以时间为显含变量","cn":""}],"ref":"UNIT 17 Introduction to Modelling of Polymerization Kinetics · 精练","hint":"","score":5},{"i":65,"n":66,"ch":"PART C 高分子材料与应用","sec":"UNIT 22 Mechanical Properties of Polymers","code":"","t":"qa","bloom":"分析","diff":"hard","q":"How is a neck formed when a semi-crystalline filament is cold drawn?","o":[],"a":["Cold drawing, as practised on nylon 6.6 and 6, is carried out more or less adiabatically, so the drawing energy is dissipated as heat instead of being conducted away, and the temperature of the thread rises while its viscosity falls. The thread then reaches its yield stress, at which point it becomes mechanically unstable. A neck is thus formed: instead of becoming thinner gradually, the thread thins suddenly over a short distance. Because the undrawn thread may contain spherulites, rupture can also occur at spherulite boundaries, which is why their presence is a disadvantage."],"exp":"","ev":"As the polymer thread reaches its yield stress, it becomes mechanically unstable and a neck is formed.","keys":[{"en":"cold drawing","cn":"冷拉伸"},{"en":"yield stress","cn":"屈服应力"},{"en":"neck","cn":"细颈"}],"ref":"UNIT 22 Mechanical Properties of Polymers · 精练","hint":"","score":5},{"i":66,"n":67,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"qa","bloom":"分析","diff":"hard","q":"What is the difference between a polymer and a plastic?","o":[],"a":["A polymer is the pure material that results from the process of polymerisation, and the word is usually taken as the family name for materials with long chain like molecules, rubber included. Pure polymers are seldom used on their own, however; it is when additives are present that the term plastic is applied. Additives may be there simply because impurities left by the polymerisation process would be uneconomic to remove, or they may be added deliberately, as stabilisers, lubricants, fillers or pigments, to enhance the properties of the material. The two words are therefore often treated as synonymous, but in fact a distinction exists."],"exp":"","ev":"Pure polymers are seldom used on their own and it is when additives are present that the term 'plastic' is applied.","keys":[{"en":"additives","cn":"添加剂"},{"en":"impurities","cn":"杂质"},{"en":"synonymous","cn":"同义的"}],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":67,"n":68,"ch":"PART C 高分子材料与应用","sec":"UNIT 29 Synthetic Plastics","code":"","t":"qa","bloom":"分析","diff":"hard","q":"Why can a thermosetting material not be softened again by heating, while a thermoplastic can?","o":[],"a":["In a thermoplastic the long chain like molecules are held together only by relatively weak Van der Waals forces, so heating weakens the intermolecular forces, the material becomes soft and flexible and finally a viscous melt, and cooling solidifies it again. In a thermoset the chemical reaction has two stages: the first forms long chain like molecules still capable of further reaction, and during moulding the second stage sets up a close network structure in which the chains are interlinked by strong bonds. Because these bonds are strong chemical bonds, heat cannot soften the material again; excess heat only makes it char and degrade, just as a hard-boiled egg cannot be softened again."],"exp":"","ev":"During the second stage the long molecular chains have been interlinked by strong bonds so that the material cannot be softened again by the application of heat.","keys":[{"en":"network structure","cn":"网络结构"},{"en":"interlinked","cn":"相互交联"},{"en":"char and degrade","cn":"焦化降解"}],"ref":"UNIT 29 Synthetic Plastics · 精练","hint":"","score":5},{"i":68,"n":69,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"term","bloom":"","diff":"","q":"聚合物","o":[],"a":["polymer"],"exp":"词性 n.；教材原释义：聚合物[体];高聚物","ev":"To contrast the difference, the molecular weight of common salt is only 58.5, while that of a polymer can be as high as several hundred thousands, even more than thousand thousands.","keys":[{"en":"polymer","cn":"聚合物"}],"ref":"UNIT 1 What are Polymers? · 词汇表","hint":"","score":1},{"i":69,"n":70,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"term","bloom":"","diff":"","q":"性能","o":[],"a":["behavior"],"exp":"词性 n.；教材原释义：性能,行为","ev":"It is essentially the 'giantness' of the size of the polymer molecule that makes its behavior different from that of a commonly known chemical compound such as benzene.¹ Solid benzene, for instance, melts to become liquid benzene at 5.5°C and, on further heating, boils into gaseous benzene.","keys":[{"en":"behavior","cn":"性能"}],"ref":"UNIT 1 What are Polymers? · 词汇表","hint":"","score":1},{"i":70,"n":71,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"term","bloom":"","diff":"","q":"双官能度的","o":[],"a":["difunctional"],"exp":"词性 a.；教材原释义：双[双]官能度的","ev":"The presence of difunctional acids and difunctional alcohols allows the polymer chain to grow.","keys":[{"en":"difunctional","cn":"双官能度的"}],"ref":"UNIT 1 What are Polymers? · 词汇表","hint":"","score":1},{"i":71,"n":72,"ch":"PART A 高分子化学与物理","sec":"UNIT 1 What are Polymers?","code":"","t":"term","bloom":"","diff":"","q":"溶解","o":[],"a":["dissolution"],"exp":"词性 n.；教材原释义：溶解","ev":"Another striking difference with respect to the behavior of a polymer and that of a low molecular weight compound concerns the dissolution process.","keys":[{"en":"dissolution","cn":"溶解"}],"ref":"UNIT 1 What are Polymers? · 词汇表","hint":"","score":1},{"i":72,"n":73,"ch":"PART A 高分子化学与物理","sec":"UNI
