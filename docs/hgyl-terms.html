<script>window.__QUIZ__ = {"meta":{"id":"化工原理术语与概念","title":"化工原理 · 术语与概念","engine":"教材 OCR 全文 + 逐字回查","source":"《化工原理》（第四版），杨祖荣主编，刘丽英、刘伟副主编，化学工业出版社，2021","generated":"","chunks":9,"accepted":48,"rejected":[],"mock":false},"questions":[{"i":0,"n":1,"ch":"绪论","sec":"绪论","code":"","id":"ch00-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"单元操作","o":[],"a":["按操作原理和特点归纳出来的、在各类化工生产中反复出现的基本物理操作，如流体输送、沉降、过滤、换热、蒸馏、吸收、干燥等。每个单元操作都包含过程原理和相应设备两部分内容。"],"exp":"关键词是「共性」和「基本物理操作」：它不针对某一种产品，而是把不同生产过程中原理相同的步骤抽出来统一研究，因此可以做成通用设备，也才有一门统一的化工原理课。","ev":"工程上将这些具有共性的基本操作称为单元操作(unit operation)。","keys":[],"ref":"第 1 页","hint":"","score":2},{"i":1,"n":2,"ch":"绪论","sec":"绪论","code":"","id":"ch00-term-002","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"物料衡算","o":[],"a":["以质量守恒为基础，对划定的衡算系统列出「输入量减输出量等于积累量」的方程，用来求未知的物料量。计算前要先圈定衡算范围、选定计算基准并统一单位。"],"exp":"要写出三件事：依据是质量守恒，形式是输入减输出等于积累，步骤是先定系统再定基准。基准通常取不再变化的量，连续过程以单位时间为基准，间歇过程以一批为基准。","ev":"根据质量守恒定律，进入与离开某一过程或设备的物料的质量之差应等于积累在该过程或设备中的物料质量，即","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":2,"n":3,"ch":"绪论","sec":"绪论","code":"","id":"ch00-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"过程传递速率","o":[],"a":["过程进行的快慢，用单位时间内过程进行的变化量表示，例如单位时间传递的热量或单位时间单位面积传递的物质量。它等于推动力除以阻力。"],"exp":"定义里要体现「快慢」和「单位时间的变化量」，并给出速率与推动力、阻力的关系。速率越大设备生产能力越大，完成同样产量所需设备越小，所以工程上往往比平衡问题更受关注。","ev":"过程传递速率是指过程进行的快慢，通常用单位时间内过程进行的变化量表示。","keys":[],"ref":"第 4 页","hint":"","score":2},{"i":3,"n":4,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"黏度","o":[],"a":["流体流动时，在垂直于流动方向上产生单位速度梯度所需的剪应力，是反映流体黏性大小的物性参数，单位为 Pa·s。黏度越大，同样流动条件下产生的内摩擦力越大；液体黏度随温度升高而降低，气体黏度随温度升高而增大。"],"exp":"定义要落到单位速度梯度对应剪应力这一点，并说明它表征内摩擦的大小。黏度是物性，随种类和温度变化：液体升温黏度下降，气体升温黏度上升，这一相反趋势是常考易错点。","ev":"显然，在同样流动情况下,流体的黏度越大，流体流动时产生的内摩擦力越大。","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":4,"n":5,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-term-002","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"流体静力学基本方程","o":[],"a":["描述重力场中静止、连续、同种不可压缩流体内部压力随位置变化关系的方程，可写成 p+ρgz=常数，或 p=p₀+ρgh。它表明静止流体中位能与静压能之和即总势能保持不变，同一水平面上各点压力相等，压力差可用液柱高度表示。"],"exp":"方程的核心是压力随深度线性增加，本质是静止流体的能量守恒：位置降低，位能减小而静压能增大，总势能不变。使用前提是重力场中静止、连续的同种不可压缩流体，气体只有在压力变化不大时才可近似应用。","ev":"流体静力学基本方程是研究流体在重力场中处于静止时的平衡规律，描述静止流体内部的压力与所处位置之间的关系。","keys":[],"ref":"第 11 页","hint":"","score":2},{"i":5,"n":6,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"雷诺数","o":[],"a":["由流速、管径、流体密度和黏度组成的无量纲数群，Re=duρ/μ。它表示流体流动中惯性力与黏性力的对比关系，是判断流型的依据：Re 不大于 2000 为层流，Re 不小于 4000 为湍流，两者之间为过渡区。"],"exp":"要写出组成量、无量纲和物理意义三层。Re 大表示惯性力占优、湍动强烈；Re 小表示黏性力占优、流动分层。判断时注意过渡区只是可能出现层流或湍流，并不是第三种流型。","ev":"雷诺数有明确的物理意义，它表示流体流动中惯性力与黏性力的对比关系","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":6,"n":7,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"流动边界层","o":[],"a":["流体流过固体壁面时，由于壁面阻滞和流体黏性，在壁面附近形成的速度显著降低的薄层，通常把速度降到主体流速 99% 以内的区域称为边界层。边界层内速度梯度大，流动阻力主要集中在这里，并分为层流边界层和湍流边界层。"],"exp":"要点是壁面附近、黏性作用、速度梯度大这三个特征。边界层很薄却集中了大部分流动阻力；湍流边界层内部紧贴壁面仍保留一层作层流流动的层流内层，这一点常被误解为湍流边界层内全是湍流。","ev":"当一股速度均匀的流体与一固体壁面相接触时，由于壁面对流体的阻碍作用，与壁面紧相邻的流体层速度立即降为零。","keys":[],"ref":"第 28 页","hint":"","score":2},{"i":7,"n":8,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"离心泵的特性曲线","o":[],"a":["表示离心泵压头 H、轴功率 N 和效率 η 随流量 qv 变化关系的三条曲线，通常由实验测定。H-qv 曲线在较大流量范围内随流量增大而下降；N-qv 曲线随流量增大而上升，流量为零时轴功率最小，故启动时应关闭出口阀门；η-qv 曲线先升后降，存在最高效率点即设计点，铭牌参数通常对应此点。泵的轴功率 N 与有效功率 Ne 之比即总效率 η，计算时可先由流量、压头和密度求有效功率，再由效率换算轴功率。"],"exp":"三条曲线的变化趋势要分别说清：压头下降、轴功率上升、效率先升后降。由轴功率随流量增大而上升可以推出启动时关出口阀门的操作；由效率存在最高点可以引出设计点和高效率区的概念。还要把轴功率与效率的关系说清：有效功率由流量、压头、密度算出，轴功率等于有效功率除以效率，因此输送密度较大的液体时轴功率会增大。","ev":"开始时泵的效率随流量的增大而上升，达到一最大值后，又随流量的增加而下降。这说明离心泵在一定转速下有一最高效率点，该点称为离心泵的设计点(design point) 。","keys":[],"ref":"第 59 页","hint":"","score":2},{"i":8,"n":9,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"离心泵的工作点","o":[],"a":["离心泵特性曲线与管路特性曲线在同一坐标图上的交点，对应泵在该管路中实际提供的流量和压头。工作点由泵的性能和管路特性共同决定，改变阀门开度或泵的转速都可以使工作点移动，从而实现流量调节。"],"exp":"工作点不是泵单独决定的，也不是管路单独决定的，而是两条特性曲线的交点。读图时要同时看流量和压头两个坐标；若该点落在高效率区，运行才经济，否则应通过调节使其靠近设计点。","ev":"若将泵特性曲线 瑟-dv 与管路特性曲线 五.-gv 绘制在同一坐标图上(图 1-69)，则两条曲线有一个交点 M，称 M 点为离心泵的工作点(duty point) 。","keys":[],"ref":"第 62 页","hint":"","score":2},{"i":9,"n":10,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"离心分离因数","o":[],"a":["同一颗粒在相同流体中离心沉降速度与重力沉降速度之比，其数值等于离心加速度与重力加速度之比，是衡量离心分离设备性能的重要指标，数值越大表示离心沉降效果越好。"],"exp":"它把离心场与重力场作对比，是一个无量纲比值。分离因数越大，同样颗粒获得的离心加速度越大，沉降越快；高速管式离心机的分离因数可达数十万，因此能分离重力沉降难以处理的细颗粒。","ev":"比值 氏. 称为离心分离因数(separation factor)，它是离心分离设备的重要性能指标。","keys":[],"ref":"第 98 页","hint":"","score":2},{"i":10,"n":11,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"临界粒径","o":[],"a":["旋风分离器在规定的简化条件下能够完全分离下来的最小颗粒直径。临界粒径越小，说明该设备能分离的颗粒越细、分离性能越好，是判断旋风分离器分离效率高低的重要依据。"],"exp":"注意它是能完全分离的最小粒径，不是任意分离效率对应的粒径。粒径小于临界粒径的颗粒来不及在停留时间内到达器壁，分离效率下降；因此临界粒径常与粒级效率配合评价设备。","ev":"旋风分离器能够分离出的最小颗粒直径称为临界粒径(critical particle diameter)。","keys":[],"ref":"第 99 页","hint":"","score":2},{"i":11,"n":12,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"过滤","o":[],"a":["利用重力、离心力或人为造成的压强差，使悬浮液通过多孔性过滤介质，固体颗粒被截留、滤液穿过介质流出，从而实现固液混合物分离的单元操作。与沉降分离相比，过滤可使悬浮液分离得更迅速、更彻底。"],"exp":"定义要包含三要素：推动力可以是重力、离心力或压强差；作用是让液体通过多孔介质；结果是颗粒被截留、滤液流出。它处理的对象是悬浮液，属于机械分离操作。","ev":"它是利用重力、离心力或人为造成的压差使悬浮液通过多孔性过滤介质，其中固体颗粒被截留，滤液穿过介质流出以达到固液混合物的分离。","keys":[],"ref":"第 102 页","hint":"","score":2},{"i":12,"n":13,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"助滤剂","o":[],"a":["为减少可压缩滤饼的阻力而加入的刚性颗粒，能形成多孔饼层、增加滤饼刚性并提高过滤速率，常用的有硅藻土、珍珠岩、炭粉和纤维素等。用法有预涂法和掺滤法，当滤饼作为产品时不宜采用掺滤法。"],"exp":"关键词是刚性颗粒和多孔饼层：它不与被过滤的液体反应，而是改变滤饼结构，使可压缩滤饼不易被压密。预涂是把助滤剂先铺在介质上，掺滤是混入料浆一起过滤，若滤饼要作产品则不能混入。","ev":"为了减少可压缩滤饼的阻力，可使用助滤剂(filter aid)改变滤饼结构， 增加滤饼的刚性，提高过滤速率。","keys":[],"ref":"第 103 页","hint":"","score":2},{"i":13,"n":14,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"恒压过滤","o":[],"a":["过滤过程中维持过滤压强差不变的操作方式。随着滤饼逐渐增厚、过滤阻力增大，过滤速率不断下降，过滤时间与所得滤液体积之间的关系可用恒压过滤方程描述。"],"exp":"恒压过滤的推动力恒定，阻力随饼层增厚而增大，所以速率下降而不是恒定。它与恒速过滤相反：恒速过滤要保持速率不变就得不断加压，对可压缩滤饼往往难以持续。","ev":"恒压过滤时维持操作压强差不变，但过滤速率将逐渐下降","keys":[],"ref":"第 104 页","hint":"","score":2},{"i":14,"n":15,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"热导率","o":[],"a":["单位温度梯度下的导热热通量，表示物质的导热能力，是物质的基本物理性质之一。其数值与物质的结构、组成、温度和压强有关，一般金属最大、液体较小、气体最小。"],"exp":"定义要落在单位温度梯度下的热通量上，它反映材料导热的难易，而不是材料厚薄。热导率越大，同样温度梯度下导热越快；气体热导率小，所以常被封闭在软木、玻璃棉的空隙中起保温作用。","ev":"热导率(thermal conductivity)是单位温度梯度下的导热热通量，因而它代表物质的导热能力。","keys":[],"ref":"第 120 页","hint":"","score":2},{"i":15,"n":16,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"对流传热","o":[],"a":["流动着的流体与固体壁面之间的热量传递过程，不同于流体内部的热对流。工程上用牛顿冷却定律把对流传热速率写成对流传热系数、传热面积与壁面和流体主体温差的乘积。"],"exp":"要区分对流传热与热对流：前者是流体与壁面之间的换热，后者是流体内部质点相对运动引起的传热。对流传热系数把流动状况、流体物性和传热面情况等复杂因素集中在一起，通常由实验关联式求取。","ev":"对流传热不同于一般意义上的热对流，而是特指流动着的流体与固体壁面之间的热量传递过程。","keys":[],"ref":"第 126 页","hint":"","score":2},{"i":16,"n":17,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"膜状冷凝","o":[],"a":["冷凝液能润湿壁面、并在壁面上形成一层完整液膜的冷凝方式。液膜在重力作用下向下流动且逐渐增厚，蒸气冷凝放出的相变潜热必须穿过液膜才能到达壁面，所以热阻几乎全部集中在液膜内。"],"exp":"判别依据是冷凝液能否润湿壁面：能润湿成完整液膜即膜状冷凝，不能润湿而成液滴则为滴状冷凝。膜状冷凝的传热系数虽低于滴状，但能持久维持，故工业冷凝器按膜状冷凝设计。","ev":"若壁面能被冷凝液润湿。在壁面上形成一层完整的液膜，则称为膜状冷凝。","keys":[],"ref":"第 137 页","hint":"","score":2},{"i":17,"n":18,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"大容积沸腾","o":[],"a":["将加热面浸入液体中，由壁面加热液体、没有强制对流时发生的沸腾现象。气泡在加热表面的汽化核心处生成、长大并脱离，气泡让位时周围液体冲刷壁面，使贴壁液层受到剧烈扰动。"],"exp":"关键词是加热面浸入液体且无强制流动，以便与管内强制流动沸腾区分。沸腾时气泡的生成和脱离强烈扰动贴壁液层，所以对流传热系数远高于无相变时；工业上一般让沸腾维持在核状沸腾区。","ev":"液体沸腾有两种情况，一种是流体在管内流动过程中受热沸腾，称为管内沸腾，另一种是将加热面浸入液体中，液体被壁面加热而引起的无强制对流的沸腾现象，称为大容积沸腾(pool boiling)。","keys":[],"ref":"第 140 页","hint":"","score":2},{"i":18,"n":19,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"控制热阻","o":[],"a":["在串联的总热阻中，数值远大于其他各项的那一项热阻。此时总热阻近似等于该热阻，总传热系数也近似等于与之对应的传热系数，强化传热应首先设法减小控制热阻。"],"exp":"串联热阻中最大的那一项起决定作用，就像串联电路里最大的电阻限制电流。若污垢热阻是控制热阻，提高流速收效不大，应先清洗或阻垢；若是某一侧的对流传热热阻，则应强化该侧。","ev":"在这些热阻中，如果某项的值远大于其他项，则总热阻值就近似等于该项热阻值，总传热系数也接近于与该热阻对应的传热系数，称该项热阻为控制热阻。","keys":[],"ref":"第 145 页","hint":"","score":2},{"i":19,"n":20,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"克希霍夫定律","o":[],"a":["灰体在一定温度下的辐射能力与吸收率之比恒等于同温度下黑体的辐射能力；其另一表达形式是同一灰体的吸收率与黑度在数值上相等，说明物体的辐射能力越大，吸收能力也越大。"],"exp":"定律把辐射能力和吸收能力联系起来：善于辐射的物体也善于吸收。它只对灰体成立，即假定吸收率不随波长变化；由此得到黑度等于吸收率，为实际物体之间的辐射传热计算提供了依据。","ev":"式(3-102)是克希霍夫定律的另一表达形式，即同一灰体的吸收率与其黑度在数值上相等。","keys":[],"ref":"第 157 页","hint":"","score":2},{"i":20,"n":21,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"蒸发","o":[],"a":["采用加热方法将含有不挥发性溶质的溶液在沸腾状态下浓缩的单元操作称为蒸发。蒸发过程中只有部分溶剂汽化并移出，溶质留在溶液中，因此它是挥发性溶剂与不挥发性溶质的分离过程；其速率取决于传热速率，蒸发设备属于传热设备。"],"exp":"定义要落到“加热、沸腾、浓缩、溶质不挥发”几个要点，并说明蒸发属于传热过程、设备为传热设备。蒸发与蒸馏不同，蒸馏分离的是挥发性不同的组分，而蒸发只汽化部分溶剂、溶质不汽化。","ev":"工程上把采用加热方法将含有不挥发性溶质(通常为固体)的溶液在沸腾状态下使其浓缩的单元操作称为蒸发(Evaporation) 。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":21,"n":22,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"沸点升高","o":[],"a":["在一定压强下，水溶液的沸点比纯水高，两者之差称为溶液的沸点升高。它是由溶质存在使溶液蒸气压低于纯水引起的，主要影响因素是溶液的性质和浓度：一般有机物溶液较小，无机物溶液较大；稀溶液不大，但随浓度增高而显著增大。"],"exp":"要说明比较前提是同一压强，并指出差值方向是溶液沸点高于纯水。原因在于溶质使溶液蒸气压下降，沸点因而上升；影响因素是溶质性质和浓度，浓度越高沸点升高越大，计算有效温度差时必须计入。","ev":"一定压强下水溶液的沸点比纯水高，它们的差值称为溶液的沸点升高(boiling point rise) ，以 4A 表示。","keys":[],"ref":"第 183 页","hint":"","score":2},{"i":22,"n":23,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液柱静压头引起的温度差损失","o":[],"a":["蒸发操作需维持一定液位，液面下的压力高于分离室压力，使液面下溶液的沸点高于液面上的沸点，二者之差称为液柱静压头引起的温度差损失。液层越深、溶液密度越大，该损失越大，计算有效温度差时应予扣除。"],"exp":"要讲清损失的来源：液柱静压使液面下压力升高，沸点随之升高，而蒸发器传热计算以液面或平均压力为基准，两者沸点之差即为该项损失。它与溶液浓度引起的沸点升高、管路阻力引起的损失共同构成总温度差损失。","ev":"通常，蒸发需操作需维持一定液位,这样液面下的压力比液面上的压力(分离室中的压力)高，即液面下的沸点比液面上的高，二者之差称为液柱静压头引起的温度差损失","keys":[],"ref":"第 184 页","hint":"","score":2},{"i":23,"n":24,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"蒸发强度","o":[],"a":["蒸发器的生产强度简称蒸发强度，是指单位时间单位传热面积上所蒸发的水量，单位为kg/(m²·h)。它把蒸发量与传热面积联系起来，能够反映蒸发器的优劣，蒸发强度越大，设备的传热效能越高。"],"exp":"定义的核心是“单位时间、单位传热面积、蒸发水量”三个限定，缺一不可。生产强度与生产能力的区别在于后者只讲单位时间蒸发水量、不考虑设备大小，因此比较设备优劣要用生产强度。","ev":"蒸发器的生产强度简称蒸发强度(Intensity of evaporation) ，是指单位时间单位传热面积上所蒸发的水量","keys":[],"ref":"第 186 页","hint":"","score":2},{"i":24,"n":25,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"大气腿","o":[],"a":["在负压操作的混合冷凝器中，为使冷凝后的水能顺利排出，冷凝器必须设置得足够高，其底部的长管称为大气腿。大气腿起液封作用，管内液柱的静压与系统真空相平衡，使水靠重力排出而外界空气不会漏入系统。"],"exp":"要说明大气腿是冷凝器底部的长管，作用是液封和排液。其原理是液柱静压平衡系统内外压差，因此安装高度必须足够；若高度不够，水排不出或空气漏入，真空度将遭到破坏。","ev":"冷凝器底部的长管称为大气腿，并有液封。","keys":[],"ref":"第 199 页","hint":"","score":2},{"i":25,"n":26,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"亨利定律","o":[],"a":["在一定温度下，当总压不太高、溶液为稀溶液时，气相中溶质的平衡分压与溶质在液相中的摩尔分数成正比，比例系数称为亨利系数，即p*=Ex。亨利系数由实验测定，随温度、溶质和溶剂的性质而变化；温度升高时亨利系数一般增大，气体溶解度减小。亨利定律还有以气相摩尔分数、液相摩尔浓度等表示的其他形式。"],"exp":"表述时要交代适用条件：温度一定、总压不太高、稀溶液；核心是平衡分压与液相摩尔分数成正比，比例系数为亨利系数。亨利系数不是常数，随温度和物系而变，温度升高溶解度下降。亨利定律是吸收相平衡计算的基础，也是判断传质方向和推动力的依据。","ev":"此情况下，稀溶液上方气相中溶质的平衡分压与溶质在液相中的摩尔分数成正比，其比例系数为亨利系数。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":26,"n":27,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"分子扩散","o":[],"a":["在静止或层流流体内部，若某一组分存在浓度梯度，则由于分子无规则的热运动，该组分由浓度较高处传递至浓度较低处，这种现象称为分子扩散。分子扩散是分子微观运动的结果，其推动力是浓度梯度，扩散进行的快慢用扩散通量衡量。"],"exp":"定义要抓住静止或层流、浓度梯度推动、分子无规则热运动三个要点，并说明它是分子微观运动的结果。分子扩散不同于对流传质，后者靠流体质点宏观运动传递组分；工业上分子扩散还可分为等摩尔反向扩散和单向扩散两种形式。","ev":"在静止或层流流体内部，若某一组分存在浓度梯度，则因分子无规则的热运动使该组分由浓度较高处传递至浓度较低处，这种现象称为分子扩散。","keys":[],"ref":"第 216 页","hint":"","score":2},{"i":27,"n":28,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"最小液-气比","o":[],"a":["最小液-气比是针对一定的分离任务、操作条件和吸收物系，当塔内某截面吸收推动力为零、达到规定分离程度所需塔高为无穷大时的液-气比。它是吸收操作液-气比的下限，实际操作的液-气比应大于该值，通常取最小液-气比的1.1至2.0倍。"],"exp":"定义要强调三个限定：一定分离任务和操作条件、某截面推动力为零、所需塔高无穷大。最小液-气比是理论下限，此时操作线与平衡线相交，不能真正实现分离；实际液-气比需大于它，但也不宜过大，否则吸收剂再生费用剧增。","ev":"由此可见，最小液-气比是针对一定的分离任务、操作条件和吸收物系，当塔内某截面吸收推动力为零时，达到分离程度所需塔高为无穷大时的液-气比。","keys":[],"ref":"第 232 页","hint":"","score":2},{"i":28,"n":29,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"传质单元高度","o":[],"a":["传质单元高度的物理意义是完成一个传质单元分离效果所需的填料层高度，常用符号H表示，单位为m。填料层高度等于传质单元高度与传质单元数的乘积；传质单元高度越小，吸收设备的传质效能越高，完成一定分离任务所需的填料层越低。"],"exp":"要讲清它对应传质单元数等于1时的填料层高度，即完成一个传质单元分离效果所需的高度。它由传质系数和填料润湿情况决定，反映设备传质效能：高度越小效能越高。填料层高度按传质单元高度乘以传质单元数计算，两者概念不能混淆。","ev":"故传质单元高度的物理意义为完成一个传质单元分离效果所需的填料层高度。","keys":[],"ref":"第 236 页","hint":"","score":2},{"i":29,"n":30,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"解吸","o":[],"a":["解吸又称脱吸，是吸收的逆过程，即气体溶质从液相向气相转移的过程。其做法是将离开吸收塔的吸收液送入解吸塔，与惰性气体或蒸汽逆流接触，使溶质从溶液中释放出来，吸收剂得到再生后循环使用；解吸的必要条件是气相溶质分压低于液相平衡分压。"],"exp":"定义要指出解吸与吸收方向相反，是溶质由液相向气相转移。其目的：一是获得较纯的气体溶质，二是使吸收剂再生循环使用，因此吸收与解吸联合才构成完整的气体分离流程。解吸的必要条件与吸收相反，推动力为液相平衡分压与实际分压之差。","ev":"解吸过程是吸收的逆过程，是气体溶质从液相向气相转移的过程","keys":[],"ref":"第 244 页","hint":"","score":2},{"i":30,"n":31,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液泛","o":[],"a":["在填料塔中，当气速增大超过某一极限值时，喷淋的液体向下流动严重受阻，液体不能顺利流下而在填料层内积聚，并扩展到整个填料层空间，这种现象称为液泛。发生液泛时的气速称为泛点气速，它是填料塔操作的极限气速。"],"exp":"要说明液泛是气速过大使液体不能顺利下流、在填料层内积聚并扩展到全塔的现象，其对应气速为泛点气速。液泛后塔的正常操作被破坏，因此操作气速必须低于泛点气速，通常取泛点气速的0.6至0.8倍，正常范围在载点与泛点之间。","ev":"若继续加大气体流速，超过某一极限值，喷淋的液体向下流动严重受阻，使得液体不能顺利向下流动，液体积聚，并扩展到整个填料层空间，此现象为液泛。","keys":[],"ref":"第 252 页","hint":"","score":2},{"i":31,"n":32,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"拉乌尔定律","o":[],"a":["一定温度下，理想溶液中任一组分的平衡分压等于该组分纯态在同温度下的饱和蒸气压与其在液相中摩尔分数的乘积，即 pA 等于 pA* 乘 xA。它描述理想溶液的汽液平衡关系，是导出泡点方程和露点方程的基础。"],"exp":"关键词是「理想溶液」「饱和蒸气压」「摩尔分数之积」。定律给出的是分压而不是总压，纯组分饱和蒸气压只随温度变化；对非理想溶液要加活度系数修正，不能直接套用。","ev":"拉乌尔定律指出，在一定温度下,气相中任一组分的平衡分压等于此组分为纯态时在该温度下的饱和蒸气压与其在溶液中的摩尔分数(mol ratio)之积。","keys":[],"ref":"第 265 页","hint":"","score":2},{"i":32,"n":33,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"相对挥发度","o":[],"a":["溶液中两组分挥发度之比，通常以易挥发组分为分子，符号为 α。它也可写成气相中两组分浓度比与液相中两组分浓度比之比，对理想溶液等于同温度下两纯组分饱和蒸气压之比。α 越大越易用精馏分离，α 等于 1 时普通精馏无法分离。"],"exp":"定义里要体现「挥发度之比」，并说明它是衡量分离难易的标志。理想溶液可用饱和蒸气压之比计算；α 随温度变化不大时可取全塔平均相对挥发度，把平衡关系简化为只含一个参数。","ev":"溶液中两组分挥发度之比称为相对挥发度(relative volatility)","keys":[],"ref":"第 268 页","hint":"","score":2},{"i":33,"n":34,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-term-003","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"理论板","o":[],"a":["人为假定的理想化塔板：不论进入该板的气液两相组成如何，离开该板时两相在传热和传质两方面都达到平衡，即离开塔板的气相与液相组成平衡、温度相等。理论板并不实际存在，但可作为衡量实际塔板分离效果的标准，设计时先求理论板数再按板效率折算实际板数。"],"exp":"要强调「离开时达到平衡」和「人为假定」。理论板不是实际安装的塔板，实际板因接触时间有限和非理想流动达不到平衡，所以同样分离任务下实际板数多于理论板数。","ev":"理论板(theoretical plate)是指离开塔板的蒸气和液体呈平衡的塔板。","keys":[],"ref":"第 276 页","hint":"","score":2},{"i":34,"n":35,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"最小回流比","o":[],"a":["在指定进料组成、分离要求和进料热状况下，使两操作线交点恰好落在平衡线上的回流比，记为 Rmin。此时交点附近各板气液组成不再变化，形成恒浓区，达到规定分离所需理论板数为无穷多，因此最小回流比是回流比的下限。"],"exp":"要点是「操作线交点落在平衡线上」「理论板数无穷多」「回流比下限」。最小回流比只对一定的分离要求才有意义，分离要求改变它也随之改变；实际回流比通常取它的 1.1 到 2.0 倍。","ev":"当回流比减到某一数值时，两操作线交点& 点恰好落在平衡线上，相应的回流比称为最小回流比(minimum reflux ratio) ，以Ruan表示。","keys":[],"ref":"第 293 页","hint":"","score":2},{"i":35,"n":36,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"恒沸精馏","o":[],"a":["又称共沸精馏，指向双组分混合液中加入第三组分作为挟带剂，挟带剂与原溶液中一个或多个组分形成新的恒沸物，且新恒沸物沸点比原组分或原恒沸物低得多，从而把分离任务转化为新恒沸物与纯组分的分离。例如在乙醇水溶液中加苯制取无水乙醇。"],"exp":"关键词是「挟带剂」「形成新恒沸物」「沸点更低」。它与萃取精馏不同：萃取精馏加入的萃取剂不形成恒沸物，且沸点比原料组分高得多，靠降低某组分蒸气压来提高相对挥发度。","ev":"恒沸精馏(azeotropic rectification) 又称共沸精馏，其特点是在双组分混合液中加入第三组分(称为挟带剂)，该组分能与原溶液中一个或多个组分形成新的恒沸物","keys":[],"ref":"第 305 页","hint":"","score":2},{"i":36,"n":37,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液泛","o":[],"a":["塔内液体下降受阻、逐板积累直至充满两板间整个空间，使塔无法正常操作的现象，又称淹塔。多由液量或气量过大引起：液量过大使降液管阻力增大，气速过大使板压降增大或液沫夹带增多，两者都会抬高降液管液位。液泛时压降急剧增大、效率急剧下降。"],"exp":"定义要写清「液体下降受阻、板上积累、充满板间空间」。液泛分降液管液泛和液沫夹带液泛两类，前者可由液量过大或气速过大引起；严重漏液则是气速过小造成的另一种不正常操作，方向相反。","ev":"在操作过程中，塔内液体下降受阻并逐渐在塔板上积累直至充满两板间的整个空间，使塔的正常操作遭到破坏，这种现象称为液泛(floading)，又称湾塔。","keys":[],"ref":"第 310 页","hint":"","score":2},{"i":37,"n":38,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"湿度（湿含量）","o":[],"a":["湿空气中所含水蒸气的质量与绝干空气质量之比，又称湿含量或绝对湿度，单位是kg水/kg绝干气。它只表示空气中水汽的绝对数量，不表示空气吸湿能力的大小。"],"exp":"湿度以单位质量绝干空气所带的水汽量来定义，取绝干空气作基准是因为干燥过程中绝干空气量保持不变，便于作物料衡算。它只说明水汽的绝对量，空气还能吸收多少水分要看相对湿度，两者含义不同，不能互相代替。","ev":"湿空气的湿度(humidity)又称湿含量或绝对湿度，定义为湿空气中所含水蒸气质量与绝干空气质量之比","keys":[],"ref":"第 330 页","hint":"","score":2},{"i":38,"n":39,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"平衡水分","o":[],"a":["在一定空气状态下，物料与空气长期接触后含水量不再变化时物料中所含的水分，即该空气状态下物料被干燥的极限含水量。"],"exp":"平衡水分对应物料表面水汽分压与空气水汽分压相等、脱湿与吸湿速率相抵的状态。它随空气状态而变，空气越干燥平衡水分越低；物料含水量中超过平衡水分的部分才是可用干燥除去的自由水分。","ev":"只要空气的状态不变，物料中所含水分不再因与空气接触时间的延长而变化，物料中水分与空气达到平衡，此时物料中所含的水分称为此空气状态下该物料的平衡水分(equilibrium moisture)","keys":[],"ref":"第 338 页","hint":"","score":2},{"i":39,"n":40,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-term-004","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"干燥曲线","o":[],"a":["在恒定干燥条件下测得的物料含水量及物料表面温度随干燥时间变化的关系曲线。"],"exp":"干燥曲线由实验数据绘制，横轴是干燥时间，纵轴是物料含水量和表面温度。曲线斜率的变化反映预热、恒速和降速各段，恒速段含水量随时间近似直线下降，降速段逐渐平缓，据此还可进一步换算成干燥速率曲线。","ev":"用上述实验数据绘出物料含水量 X 及物料表面温度 0 与干燥时间 z 的关系曲线，如图 7-14 所示，此曲线称为干燥曲线(drying curve) 。","keys":[],"ref":"第 346 页","hint":"","score":2},{"i":40,"n":41,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"干燥速率","o":[],"a":["单位时间内单位干燥面积上汽化的水分质量，单位为kg/(m²·s)，一般由恒定干燥条件下的实验测定。"],"exp":"干燥速率以单位干燥面积为基准，便于在不同设备之间比较干燥强度。它随物料含水量而变化，由实验绘出的干燥速率曲线分为恒速段和降速段，两段的控制步骤不同，因此强化干燥的着手点也不同。","ev":"干燥速率(drying rate)是指在单位时间内单位干燥面积上汽化的水分质量","keys":[],"ref":"第 347 页","hint":"","score":2},{"i":41,"n":42,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"流化床干燥器","o":[],"a":["又称沸腾床干燥器，是利用固体流态化技术使颗粒在热气流中悬浮、翻滚并进行干燥的设备。"],"exp":"热空气自下而上穿过床层，气速超过临界流化速度后颗粒被托起，床层呈流态化。气固接触充分，传热传质快，床层温度均匀，物料停留时间可通过出料方式调节，适合处理颗粒状物料。","ev":"流化床干燥器(fluidized bed dryer)又称为沸腾床干燥器，是固体流态化技术在干燥中的应用。","keys":[],"ref":"第 355 页","hint":"","score":2},{"i":42,"n":43,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"结晶","o":[],"a":["固体物质以晶体状态从蒸气、溶液或熔融物中析出的过程，是获得纯净固态物质的一种基本单元操作，能耗较低。工业上最常见的是溶液结晶，可采用冷却、蒸发或真空等方式产生过饱和度。"],"exp":"定义要落在固体以晶体状态析出上，并点明它是获得纯净固体的单元操作；注意结晶与蒸发的区别：蒸发只是把溶剂汽化，结晶则要求溶质形成有规则晶格的固体产品，二者目的不同。","ev":"固体物质以品体状态从节气、溶液或熔融的物质中析出的过程称为结晶","keys":[],"ref":"第 364 页","hint":"","score":2},{"i":43,"n":44,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"过饱和度","o":[],"a":["一定温度下溶液实际浓度超过该温度下溶解度的部分，即溶液浓度与溶解度之差。过饱和度是晶核形成和晶体成长的推动力，达到一定限度后过饱和溶液才开始自发产生晶核。"],"exp":"关键词是浓度超过溶解度的那一部分，它是一个差值而不是浓度本身；过饱和度越大推动力越大，但超过超溶解度曲线就会爆发成核，所以工业结晶常把过饱和度控制在介稳区内。","ev":"这时的溶液浓度与溶解度之差称为过人饱和度。","keys":[],"ref":"第 365 页","hint":"","score":2},{"i":44,"n":45,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"吸附","o":[],"a":["多孔固体与流体接触时，流体中某一组分或几个组分附着在固体表面上的现象。附着在固体表面上的组分称为吸附质，多孔固体称为吸附剂，利用这种选择性附着使混合物分离的操作称为吸附操作。"],"exp":"定义要包含三个要素：多孔固体、流体中的组分附着在固体表面、吸附具有选择性；吸附质是被吸走的目标组分，吸附剂是提供表面的固体，不要与吸收混淆，吸收是组分进入液相主体。","ev":"吸附现象是指多孔固体与流体(气体或液体)接触，流体中某一组分或多个组分附着在固体表面上。附着在固体表面上的组分称为吸附物或吸附质(Cadsorbate) ，多孔固体称为吸附剂(adsorbent) 。","keys":[],"ref":"第 368 页","hint":"","score":2},{"i":45,"n":46,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"吸附平衡","o":[],"a":["一定温度和压力下，吸附剂与流体长时间接触、吸附量不再增加时，吸附相与流体之间达到的平衡状态。此时的吸附量称为平衡吸附量，平衡吸附量随分压或浓度的变化曲线称为吸附等温线。"],"exp":"关键词是吸附量不再增加以及吸附相与流体达到平衡；平衡是动态的，吸附与脱附速率相等而不是停止，平衡吸附量由温度、压力和物系决定，是计算吸附剂用量和设备尺寸的基础。","ev":"当温度、压力一定时，吸附剂与流体长时间接触，吸附量不再增加，吸附相(吸附剂和已吸附的吸附质)与流体达到平衡，此时的吸附量为平衡吸附量。","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":46,"n":47,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"膜分离","o":[],"a":["以选择性透过膜为分离介质，在膜两侧一定推动力（压力差、浓度差、电位差或温度差）作用下，使原料中某组分选择性地透过膜，从而实现混合物分离、提纯或浓缩的过程。"],"exp":"定义要包含三个要素：选择性透过膜、膜两侧推动力、组分选择性透过；膜分离大多不发生相变、可在常温下操作，适合热敏物料，但浓差极化和膜污染会使通量下降，需要预处理和清洗。","ev":"膜分离(membrane separation)是以选择性透过膜为分离介质. 在膜两侧一定推动力的作用下使原料中的某组分选择性地透过膜，从而使混合物得以分离，以达到提纯、浓缩等目的的分离过程 。","keys":[],"ref":"第 379 页","hint":"","score":2},{"i":47,"n":48,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"截留率","o":[],"a":["表示膜对溶质截留程度的参数，对盐溶液又称脱盐率，定义为原料液中溶质浓度与渗透物中溶质浓度之差同原料液溶质浓度之比。截留率为 100% 表示溶质全部被截留，为 0 表示溶质全部透过、没有分离作用。"],"exp":"关键词是被膜截留的程度：算的是原料液与渗透液的浓度差占原料液浓度的比例，数值越高说明膜对溶质的阻挡越强；它常用于评价反渗透膜，与表征超滤膜孔径的截留分子量不是同一个参数。","ev":"对于反渗透过程，通常用截留率表示其分离性能。","keys":[],"ref":"第 381 页","hint":"","score":2}]};</script>
<script>
(function () {
  "use strict";

  const D = window.__QUIZ__ || { meta: {}, questions: [] };
  const META = D.meta || {};
  const Q = Array.isArray(D.questions) ? D.questions : [];
  const N = Q.length;
  const KEY = "pdfquiz:" + (META.id || "deck");
  const TKEY = "pdfquiz:theme";
  const FKEY = "pdfquiz:fs";

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const TYPE_CN = {
    single: "单选题", multiple: "多选题", truefalse: "判断题", fill: "填空题", short: "简答题",
    trans_en_cn: "英译中", trans_cn_en: "中译英", describe: "描述题", qa: "问答题", term: "术语翻译"
  };
  /* 题型固定顺序：侧栏、结果页统计都按这个排，免得随出题顺序抖动 */
  const TYPE_ORDER = ["trans_en_cn", "trans_cn_en", "describe", "qa",
    "single", "multiple", "truefalse", "fill", "short", "term"];
  const typeRank = (t) => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
  /* 从 "UNIT 17 …" 取出单元号，用于稳定排序；取不到排最后 */
  const unitKey = (s) => { const m = String(s || "").match(/UNIT\s*(\d+)/i); return m ? +m[1] : 999; };
  /* 主观题：无法自动判分，一律「作答 → 对照参考答案 → 自评」 */
  const SUBJECTIVE = { short: 1, trans_en_cn: 1, trans_cn_en: 1, describe: 1, qa: 1 };
  /* 术语题有两种：英文术语翻译要精确输入；中文概念释义是长答案，只能自评 */
  function isExplainTerm(q) { return !!q && q.t === "term" && q.mode === "explain"; }
  function isSubjective(q) { return !!q && (SUBJECTIVE[q.t] === 1 || isExplainTerm(q)); }
  if (Q.some(isExplainTerm)) {
    TYPE_CN.term = Q.some((q) => q.t === "term" && !isExplainTerm(q)) ? "术语" : "术语释义";
  }
  /* 可自动判分的填空题型：术语题答案唯一，比对时忽略大小写、空格与连字符 */
  const FILLABLE = { fill: 1, term: 1 };
  /* 需要输入框的作答区提示语 */
  const PLACEHOLDER = {
    short: "写下你的回答，再对照参考答案自评",
    trans_en_cn: "先在此译成中文，再展开参考答案逐句比对",
    trans_cn_en: "用英文写出译文，注意关键词拼写",
    describe: "用英文描述，尽量写全要点",
    qa: "用英文作答，先给结论再展开",
    term: "写出对应的英文术语"
  };
  const DIFF_CN = { easy: "简单", medium: "中等", hard: "困难" };
  const LTR = "ABCDEFGH";

  /* 题目 ID 是稳定身份：答题记录按 ID 存，题库增删或重排后不会把记录套到别的题上。
     老题库没有 ID（如教材卷），退回用下标，行为与之前一致。 */
  const HAS_IDS = Q.length > 0 && Q.every((q) => q.id);
  function hashText(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(36);
  }
  /* 题干、选项、答案共同决定这道题是否还是原来那道题。
     只改解析或难度不算，改了答案就必须让旧作答失效。 */
  function qFingerprint(q) {
    if (!q) return "";
    return hashText([
      q.t || "",
      q.mode || "",
      q.q || "",
      (q.o || []).join("\u0001"),
      (q.a || []).join("\u0001")
    ].join("\u0002"));
  }
  function deckSignature() {
    return hashText(Q.map((q) => q.id).join("|"));
  }
  const SIG = HAS_IDS ? deckSignature() : "";
  let staleNote = "";
  let stateMigrated = false;

  /* ------------------------------------------------------------ state */
  const BLANK = {
    mode: "practice",
    answers: {},
    marked: [],
    cur: 0,
    filter: { scope: "all", type: "all" },
    started: Date.now(),
    submitted: false,
    sig: ""
  };

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || typeof s !== "object") return null;
      const answers = s.answers && typeof s.answers === "object" ? s.answers : {};
      const marked = Array.isArray(s.marked) ? s.marked.map(String) : [];
      const base = {
        answers,
        marked,
        filter: Object.assign({ scope: "all", type: "all" }, s.filter || {}),
        submitted: !!s.submitted,
        sig: s.sig || ""
      };
      /* 带 ID 的题库换了题目集合后，旧版按数组下标存的答案会错位：
         表现为某些题「已经判过」、按钮消失。这里按题目 ID 过滤：
         能对上当前题目的记录保留，下标或已删除题目的记录清掉。
         同一 ID 但题干/选项/答案改过时，旧作答也不再可信，一并清掉。 */
      let keptAnswers = answers;
      let keptMarked = marked;
      let dropped = 0;
      let changed = 0;
      let backfilled = 0;
      const idChanged = !!(SIG && s.sig !== SIG);
      if (HAS_IDS) {
        const current = new Map();
        Q.forEach((q) => { if (q.id) current.set(q.id, qFingerprint(q)); });
        keptAnswers = {};
        Object.keys(answers).forEach((k) => {
          const fp = current.get(k);
          if (fp === undefined) { dropped++; return; }
          const rec = answers[k] && typeof answers[k] === "object" ? answers[k] : {};
          if (rec.fp && rec.fp !== fp) { changed++; return; }
          if (!rec.fp) { rec.fp = fp; backfilled++; }
          keptAnswers[k] = rec;
        });
        keptMarked = [];
        marked.forEach((k) => {
          if (current.has(k)) keptMarked.push(k);
          else dropped++;
        });
      }
      if (backfilled || idChanged || changed) stateMigrated = true;
      if (idChanged || changed) {
        const kept = Object.keys(keptAnswers).length || keptMarked.length;
        if (changed && !idChanged) {
          staleNote = kept
            ? "题库已更新，未变题目的记录已保留，改动题目的作答已清理"
            : "题库已更新，改动题目的作答已清理，请重新作答";
        } else if (dropped) {
          staleNote = kept
            ? "题库已更新，有效答题记录已保留，失效记录已清理"
            : "题库已更新，旧答题记录已清空，请重新作答";
        }
        return Object.assign({}, BLANK, s, base, {
          answers: keptAnswers,
          marked: keptMarked,
          submitted: false,
          sig: SIG
        });
      }
      return Object.assign({}, BLANK, s, base, {
        answers: keptAnswers,
        marked: keptMarked,
        sig: s.sig || SIG
      });
    } catch (e) {
      return null;
    }
  }

  let S = load() || Object.assign({}, BLANK);
  if (SIG) S.sig = SIG;

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 隐私模式 */ }
    }, 120);
  }

  function qkey(i) { const q = Q[i]; return q && q.id ? q.id : String(i); }
  function ans(i) { return S.answers[qkey(i)] || null; }
  function setAns(i, value) {
    const k = qkey(i);
    S.answers[k] = Object.assign({}, value, { fp: qFingerprint(Q[i]) });
    return S.answers[k];
  }
  function updateAns(i, patch) {
    const k = qkey(i);
    S.answers[k] = Object.assign({}, S.answers[k], patch, { fp: qFingerprint(Q[i]) });
    return S.answers[k];
  }
  function isMarked(i) { return S.marked.includes(qkey(i)); }
  function toggleMark(i) {
    const k = qkey(i);
    S.marked = isMarked(i) ? S.marked.filter((x) => x !== k) : S.marked.concat(k);
  }
  function isGraded(i) { const a = ans(i); return !!(a && a.graded); }
  function isCorrect(i) { const a = ans(i); return !!(a && a.correct === true); }

  /* ------------------------------------------------------------ grading */
  function norm(s) {
    return String(s == null ? "" : s)
      .normalize("NFKC")
      .replace(/[\s，。！？、；：""''（）()\[\]【】《》·.,!?;:"'`~…—\-_/\\*#]/g, "")
      .toLowerCase();
  }

  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    const sb = new Set(b);
    return a.every((x) => sb.has(x));
  }

  function gradeChoice(q, picked) {
    return sameSet(picked.slice().sort(), q.a.slice().sort());
  }

  function gradeFill(q, text) {
    const got = norm(text);
    if (!got) return null;
    const alts = String(q.a[0] || "").split(/[\/／|｜；;、]/).map(norm).filter(Boolean);
    if (!alts.length) return null;
    return alts.some((alt) => got === alt || (alt.length >= 2 && (got.includes(alt) || alt.includes(got))));
  }

  /* 术语题答案唯一，不能用「包含」判对，否则 poly 会被判成 polymerization。
     归一化已抹平大小写、连字符与空格，这里再容忍单复数。 */
  function gradeTerm(q, text) {
    const stem = (s) => s.replace(/ies$/, "y").replace(/(es|s)$/, "");
    const alts = String(q.a[0] || "").split(/[\/／|｜；;、]/).map(norm).filter(Boolean);
    if (!alts.length) return null;
    /* 允许多写：polyethylene / PE 全抄回来、只写缩写、只写全称，都算对 */
    const gots = String(text).split(/[\/／|｜；;、]/).map(norm).filter(Boolean);
    if (!gots.length) return null;
    return gots.some((got) => alts.some((alt) => got === alt || stem(got) === stem(alt)));
  }

  /* 需要键入文字的题型统一走这里 */
  function gradeText(q, text) {
    return q.t === "term" ? gradeTerm(q, text) : gradeFill(q, text);
  }

  /* ------------------------------------------------------------ render */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* 上下标：先转义再只放行 sup/sub 两个固定标签，既支持 <sub>2</sub>，
     也支持 CO_{2}、10^{24} 这类写法；标签属性会被当成普通文字，不会执行。 */
  function rich(s) {
    return esc(s)
      .replace(/&lt;(\/?)(sup|sub)&gt;/g, "<$1$2>")
      .replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>")
      .replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>");
  }

  /* 导出错题本时用纯文本，不把上下标标签带进 Markdown */
  function plain(s) {
    return String(s == null ? "" : s)
      .replace(/<\/?(?:sup|sub)>/g, "")
      .replace(/\^\{([^{}]*)\}/g, "$1")
      .replace(/_\{([^{}]*)\}/g, "$1");
  }

  function questionHTML(q) {
    const tags = [
      '<span class="tag t">' + (TYPE_CN[q.t] || "题目") + "</span>",
      q.bloom ? '<span class="tag">' + esc(q.bloom) + "</span>" : "",
      q.diff ? '<span class="tag lv-' + esc(q.diff) + '">' + (DIFF_CN[q.diff] || esc(q.diff)) + "</span>" : ""
    ].join("");

    let body = "";
    if (q.t === "single" || q.t === "multiple") {
      body = '<div class="opts" role="' + (q.t === "single" ? "radiogroup" : "group") + '">' +
        q.o.map((o, k) =>
          '<button class="opt" data-i="' + q.i + '" data-l="' + LTR[k] + '" role="' + (q.t === "single" ? "radio" : "checkbox") + '" aria-checked="false">' +
            '<span class="ltr">' + LTR[k] + "</span>" +
            '<span class="txt">' + rich(o) + "</span>" +
            '<span class="flag"></span>' +
          "</button>").join("") + "</div>";
    } else if (q.t === "truefalse") {
      body = '<div class="opts" role="radiogroup">' +
        [["T", "正确"], ["F", "错误"]].map(([l, t]) =>
          '<button class="opt" data-i="' + q.i + '" data-l="' + l + '" role="radio" aria-checked="false">' +
            '<span class="ltr">' + l + "</span>" +
            '<span class="txt">' + t + "</span>" +
            '<span class="flag"></span>' +
          "</button>").join("") + "</div>";
    } else if (FILLABLE[q.t] && !isExplainTerm(q)) {
      body = '<input class="field" data-i="' + q.i + '" type="text" autocomplete="off" spellcheck="false" ' +
        'placeholder="' + (q.t === "term" ? "写出英文术语，回车确认" : "在此填写答案，回车确认") + '">';
    } else {
      const ph = isExplainTerm(q) ? "用自己的话写出释义，再对照参考答案自评" : (PLACEHOLDER[q.t] || "写下你的回答，再对照参考答案自评");
      const rows = (q.t === "trans_en_cn" || q.t === "describe" || q.t === "qa") ? 5 : 3;
      body = '<textarea class="field" data-i="' + q.i + '" rows="' + rows + '" style="--rows:' + rows + '" placeholder="' + esc(ph) + '"></textarea>' +
        (q.t === "trans_en_cn" || q.t === "trans_cn_en"
          ? '<div class="typeline">' + (q.t === "trans_en_cn"
              ? '译完再点开参考答案，逐句比对是否漏译、误译'
              : '先写关键词，再连成完整句子；拼写错误在考试中同样扣分') + "</div>"
          : "");
    }

    let actions = "";
    if (q.t === "multiple") {
      actions = '<div class="q-actions"><button class="btn primary" data-act="confirm" data-i="' + q.i + '" disabled>确认作答</button>' +
        '<span class="hint">可选多项，选完点确认</span></div>';
    } else if (FILLABLE[q.t] && !isExplainTerm(q)) {
      actions = '<div class="q-actions"><button class="btn primary" data-act="confirm" data-i="' + q.i + '" disabled>确认作答</button>' +
        '<span class="hint">' + (q.t === "term"
          ? "只需写英文术语本身，不区分大小写与连字符"
          : "文字按去空格与标点后比对，近似匹配即算对") + "</span></div>";
    } else if (isSubjective(q)) {
      actions = '<div class="q-actions"><button class="btn ghost" data-act="reveal" data-i="' + q.i + '">对照参考答案</button>' +
        '<span class="hint">' + (q.t === "trans_en_cn" ? "翻译题按要点自评" : isExplainTerm(q) ? "先自己写，再对照参考答案；意思对即可" : "答到要点即算通过") + "</span></div>";
    }

    /* 长答案（描述题/问答题的整段参考答案）不加粗，否则整段发黑难读 */
    const longAns = isSubjective(q) && String(q.a[0] || "").length > 60;

    const answerHTML = q.t === "truefalse"
      ? "<b>" + (q.a[0] === "T" ? "正确" : "错误") + "</b>"
      : q.t === "single"
        ? "<b>" + q.a[0] + (q.o[LTR.indexOf(q.a[0])] ? "　" + rich(q.o[LTR.indexOf(q.a[0])]) : "") + "</b>"
        : q.t === "multiple"
          ? "<b>" + q.a.join(" ") + "</b>" + q.a.map((l) => {
              const k = LTR.indexOf(l);
              return q.o[k] ? '<span class="alt"><i>' + l + "</i>" + rich(q.o[k]) + "</span>" : "";
            }).join("")
          : longAns ? rich(q.a[0]) : "<b>" + rich(q.a[0]) + "</b>";

    const ansLabel = q.t === "trans_en_cn" ? "参考译文"
      : q.t === "trans_cn_en" ? "参考英文"
      : q.t === "term" ? (isExplainTerm(q) ? "参考释义" : "英文术语")
      : q.t === "describe" || q.t === "qa" ? "参考答案"
      : "答案";

    /* 采分点：术语中英对照，翻译题与问答题靠它判断答到几分 */
    const keysHTML = (q.keys && q.keys.length)
      ? '<div class="keys">' +
          '<div class="keys-h">采分点 · 关键词必须会写</div>' +
          q.keys.map((k) =>
            '<div class="key-row"><span class="ke">' + rich(k.en) + "</span>" +
            (k.cn ? '<span class="kc">' + rich(k.cn) + "</span>" : "") + "</div>").join("") +
        "</div>"
      : "";

    return '<article class="q" data-i="' + q.i + '" data-sec="' + esc(q.sec) + '">' +
      '<div class="qhead">' +
        '<span class="num">' + String(q.n).padStart(2, "0") + "</span>" + tags +
        '<button class="mark-btn" data-act="mark" data-i="' + q.i + '" aria-pressed="false" title="标记本题 (M)">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>标记</button>' +
      "</div>" +
      '<div class="stem">' + rich(q.q).replace(/＿{2,}/g, '<span class="blank"></span>') + "</div>" + body + actions +
      '<div class="verdict" aria-live="polite"></div>' +
      '<div class="ans">' +
        '<div class="ans-row"><span class="k">' + ansLabel + '</span><span class="v">' + answerHTML + "</span></div>" +
        keysHTML +
        (q.exp ? '<div class="ans-row"><span class="k">解析</span><span class="v">' + rich(q.exp) + "</span></div>" : "") +
        (q.ev ? '<blockquote class="ev">' + esc(q.ev) + "</blockquote>" : "") +
        (q.ref ? '<div class="src">出处 · ' + esc(q.ref) + "</div>" : "") +
      "</div>" +
    "</article>";
  }

  function buildStage() {
    $("#stage").innerHTML = Q.map(questionHTML).join("") ||
      '<div class="empty"><b>没有题目</b>这份题库是空的，先回到命令行重新生成。</div>';
  }

  function buildSidebar() {
    // 题型筛选
    const counts = {};
    Q.forEach((q) => { counts[q.t] = (counts[q.t] || 0) + 1; });
    const types = TYPE_ORDER.filter((t) => counts[t]);
    Object.keys(counts).forEach((t) => { if (!types.includes(t)) types.push(t); });
    $("#types").innerHTML =
      '<button data-type="all" aria-pressed="' + (S.filter.type === "all") + '">全部 ' + N + "</button>" +
      types.map((t) => '<button data-type="' + t + '" aria-pressed="' + (S.filter.type === t) + '">' +
        (TYPE_CN[t] || t) + " " + counts[t] + "</button>").join("");

    // 章节导航（按单元号排序，否则只有术语题的单元会掉到列表末尾）
    const groups = [];
    Q.forEach((q) => {
      let g = groups.find((x) => x.ch === q.ch);
      if (!g) { g = { ch: q.ch, items: [] }; groups.push(g); }
      let it = g.items.find((x) => x.sec === q.sec);
      if (!it) { it = { sec: q.sec, qs: [] }; g.items.push(it); }
      it.qs.push(q.i);
    });
    groups.sort((a, b) => unitKey(a.ch + " " + a.items[0].sec) - unitKey(b.ch + " " + b.items[0].sec));
    groups.forEach((g) => g.items.sort((a, b) => unitKey(a.sec) - unitKey(b.sec)));
    $("#chapters").innerHTML = groups.map((g) =>
      '<div class="grp"><div class="grp-t">' + esc(g.ch) + "</div>" +
      g.items.map((it) =>
        '<button class="nav-item" data-sec="' + esc(it.sec) + '">' +
          "<span>" + esc(it.sec) + "</span>" +
          '<span class="cnt" data-cnt="' + esc(it.sec) + '">' + it.qs.length + "</span>" +
        "</button>").join("") +
      "</div>").join("");
  }

  /* ------------------------------------------------------------ 题号面板
     手机上侧栏要点两下才到得了某道题，底栏中间的数字点开就是全部题号，
     颜色直接标出对 / 错 / 未做，比翻页快得多。 */
  let sheetScope = "unit";

  function buildSheet() {
    const byType = sheetScope === "type";
    const groups = [];
    Q.forEach((q) => {
      const key = byType ? q.t : q.sec;
      let g = groups.find((x) => x.key === key);
      if (!g) { g = { key: key, items: [] }; groups.push(g); }
      g.items.push(q);
    });

    if (byType) {
      const rank = (k) => { const i = TYPE_ORDER.indexOf(k); return i < 0 ? 99 : i; };
      groups.sort((a, b) => rank(a.key) - rank(b.key));
    } else {
      groups.sort((a, b) => unitKey(a.key) - unitKey(b.key));
    }
    /* 组内按卷面题号排，读起来是 01、02…；题号由题型决定顺序，
       所以跨题型混排时数字会跳，这是卷面本身的结构，不是错乱 */
    groups.forEach((g) => g.items.sort((a, b) => a.n - b.n));

    const title = (g) => byType
      ? (TYPE_CN[g.key] || g.key) + " · " + g.items.length + " 题"
      : g.key + " · " + g.items.length + " 题";

    $("#sheetBody").innerHTML = groups.map((g) =>
      '<div class="qgrid-grp"><div class="qgrid-t">' + esc(title(g)) + "<i></i></div><div class=\"qgrid\">" +
      g.items.map((q) => {
        const a = ans(q.i);
        let cls = "";
        if (a && a.graded) cls = a.pending ? " pending" : (a.correct === true ? " ok" : " bad");
        if (isMarked(q.i)) cls += " marked";
        if (q.i === S.cur) cls += " cur";
        return '<button class="qcell' + cls + '" data-goto="' + q.i + '" ' +
          'aria-label="第 ' + q.n + " 题，" + esc(TYPE_CN[q.t] || "") + '" ' +
          'title="' + esc((TYPE_CN[q.t] || "") + " · " + q.sec) + '">' +
          String(q.n).padStart(2, "0") + "</button>";
      }).join("") +
      "</div></div>").join("");

    $$("[data-sheet-scope]").forEach((b) =>
      b.setAttribute("aria-pressed", b.dataset.sheetScope === sheetScope ? "true" : "false"));
  }

  function openSheet() {
    if (!N) return;
    buildSheet();
    $("#sheet").classList.add("show");
    $("#sheetScrim").classList.add("show");
    const body = $("#sheetBody");
    const cur = body.querySelector(".qcell.cur");
    if (cur) {
      const r = cur.getBoundingClientRect();
      const br = body.getBoundingClientRect();
      body.scrollTop += r.top - br.top - br.height / 2 + r.height / 2;
    }
  }

  function closeSheet() {
    $("#sheet").classList.remove("show");
    $("#sheetScrim").classList.remove("show");
  }

  /* 输入框跟随内容长高：手机上翻译题写三五句，固定 3 行要一直抠着滚 */
  function grow(f) {
    if (!f || f.tagName !== "TEXTAREA" || f.readOnly) return;
    f.style.height = "auto";
    const max = Math.round(window.innerHeight * 0.55);
    f.style.height = Math.min(f.scrollHeight + 2, max) + "px";
    f.style.overflowY = f.scrollHeight > max ? "auto" : "hidden";
  }

  /* ------------------------------------------------------------ filtering */
  function visible() {
    const f = S.filter;
    return Q.filter((q) => {
      if (f.type !== "all" && q.t !== f.type) return false;
      if (f.scope === "todo") return !isGraded(q.i);
      if (f.scope === "wrong") return isGraded(q.i) && !isCorrect(q.i);
      if (f.scope === "marked") return isMarked(q.i);
      return true;
    }).map((q) => q.i);
  }

  let view = [];

  function applyFilter(keepCurrent) {
    view = visible();
    const stage = $("#stage");
    if (!view.length) {
      stage.innerHTML = '<div class="empty"><b>这个筛选下没有题目</b>换一个范围或题型试试。</div>';
      $("#navbar").style.visibility = "hidden";
      $("#posAll").textContent = "0";
      $("#posNow").textContent = "0";
      $("#prevBtn").disabled = true;
      $("#nextBtn").disabled = true;
      return;
    }
    $("#navbar").style.visibility = "";
    if (!stage.querySelector(".q")) buildStage();
    if (!keepCurrent || !view.includes(S.cur)) S.cur = view[0];
    $("#posAll").textContent = view.length;
    paint();
  }

  /* ------------------------------------------------------------ paint */
  function paint() {
    const cur = S.cur;
    $$("#stage .q").forEach((n) => n.classList.toggle("active", Number(n.dataset.i) === cur));

    const q = Q[cur];
    if (q) {
      $("#crumbCh").textContent = q.ch;
      $("#crumbSec").textContent = q.sec;
      const pos = view.indexOf(cur);
      $("#posNow").textContent = pos < 0 ? "–" : pos + 1;
      $("#prevBtn").disabled = pos <= 0;
      $("#nextBtn").disabled = pos < 0 || pos >= view.length - 1;
      $("#nextBtn").textContent = pos >= view.length - 1 ? "完成" : "下一题";

      $$("#chapters .nav-item").forEach((n) =>
        n.setAttribute("aria-current", n.dataset.sec === q.sec ? "true" : "false"));
    }
    refreshStats();
    restoreQuestion(cur);
  }

  function refreshStats() {
    let ok = 0, bad = 0;
    Object.keys(S.answers).forEach((k) => {
      const a = S.answers[k];
      if (!a || !a.graded) return;
      if (a.correct === true) ok++;
      else if (a.correct === false) bad++;
    });
    const done = ok + bad;
    $("#ringNum").textContent = done;
    $("#ringAll").textContent = "/ " + N;
    $("#okNum").textContent = ok;
    $("#badNum").textContent = bad;
    $("#leftNum").textContent = Math.max(0, N - done);
    const C = 2 * Math.PI * 30;
    $("#ringBar").setAttribute("stroke-dashoffset", String(C - (N ? done / N : 0) * C));
    $("#progBar").style.width = (N ? (done / N) * 100 : 0) + "%";

    // 章节计数
    $$("#chapters .nav-item").forEach((n) => {
      const sec = n.dataset.sec;
      const qs = Q.filter((x) => x.sec === sec);
      const d = qs.filter((x) => isGraded(x.i)).length;
      const el = n.querySelector(".cnt");
      if (el) el.textContent = d ? d + "/" + qs.length : String(qs.length);
    });
  }

  function restoreQuestion(i) {
    const q = Q[i];
    const node = $('#stage .q[data-i="' + i + '"]');
    if (!q || !node) return;
    const a = ans(i);

    // 标记
    const markBtn = node.querySelector('[data-act="mark"]');
    if (markBtn) markBtn.setAttribute("aria-pressed", isMarked(i) ? "true" : "false");

    // 选项态
    node.querySelectorAll(".opt").forEach((btn) => {
      btn.classList.remove("is-ok", "is-bad", "locked");
      btn.setAttribute("aria-checked", "false");
      const flag = btn.querySelector(".flag");
      if (flag) flag.textContent = "";
      if (a && Array.isArray(a.picked) && a.picked.includes(btn.dataset.l)) {
        btn.setAttribute("aria-checked", "true");
      }
    });

    if (q.t === "fill" || q.t === "term" || SUBJECTIVE[q.t]) {
      const f = node.querySelector(".field");
      if (f && a && typeof a.text === "string" && f.value !== a.text) f.value = a.text;
      if (f && isGraded(i)) f.readOnly = true;
      if (f) grow(f);
    }

    const confirm = node.querySelector('[data-act="confirm"]');
    if (confirm) confirm.disabled = !(a && ((a.picked && a.picked.length) || (a.text && a.text.trim())));

    if (isGraded(i)) reveal(node, q, a, true);
  }

  /* ------------------------------------------------------------ reveal */
  function reveal(node, q, a, quiet) {
    node.classList.add("graded");
    node.querySelectorAll(".opt").forEach((btn) => btn.classList.add("locked"));
    // 判定后收起作答按钮，避免重复提交
    node.querySelectorAll(".q-actions").forEach((row) => {
      if (!row.classList.contains("self-grade")) row.style.display = "none";
    });

    const v = node.querySelector(".verdict");
    const correctSet = new Set(q.a);

    if (q.t === "single" || q.t === "multiple" || q.t === "truefalse") {
      node.querySelectorAll(".opt").forEach((btn) => {
        const l = btn.dataset.l;
        const flag = btn.querySelector(".flag");
        const picked = a && Array.isArray(a.picked) && a.picked.includes(l);
        if (correctSet.has(l)) {
          btn.classList.add("is-ok");
          if (flag) flag.textContent = picked ? "你的选择 · 正确" : "正确答案";
        } else if (picked) {
          btn.classList.add("is-bad");
          if (flag) flag.textContent = "你的选择";
        }
      });
    }

    if (a && a.pending) {
      v.className = "verdict info";
      v.innerHTML = '<span class="ico">?</span><span>请对照下方参考答案自评<span class="sub"> · 答到要点就选「记住了」</span></span>';
      if (!node.querySelector(".self-grade")) {
        const bar = document.createElement("div");
        bar.className = "q-actions self-grade";
        bar.innerHTML = '<button data-self="yes" data-i="' + q.i + '">记住了</button>' +
                        '<button data-self="no" data-i="' + q.i + '">没答到</button>';
        const anchor = node.querySelector(".ans");
        anchor.parentNode.insertBefore(bar, anchor);
      }
      return;
    }
    const sg = node.querySelector(".self-grade");
    if (sg) sg.remove();

    if (isSubjective(q)) {
      v.className = "verdict " + (a && a.correct ? "ok" : "bad");
      v.innerHTML = '<span class="ico">' + (a && a.correct ? "✓" : "✕") + "</span><span>" +
        (a && a.correct ? "已标记为掌握" : "已标记为未掌握") + "</span>";
      addRedo(v, q);
      return;
    }

    const good = a && a.correct === true;
    v.className = "verdict " + (good ? "ok" : "bad");
    v.innerHTML = '<span class="ico">' + (good ? "✓" : "✕") + "</span><span>" +
      (good ? "回答正确" : "回答错误") +
      (quiet ? "" : '<span class="sub"> · ' + (good ? "继续保持" : "看一下原文依据") + "</span>") + "</span>";
    addRedo(v, q);
  }

  /* 判过就不能再答，想重来只能清空整卷；练习模式给单题一个出口 */
  function addRedo(v, q) {
    if (S.mode !== "practice") return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "redo";
    b.dataset.act = "redo";
    b.dataset.i = q.i;
    b.textContent = "重做本题";
    v.appendChild(b);
  }

  /* ------------------------------------------------------------ actions */
  function pick(i, letter) {
    const q = Q[i];
    if (!q || isGraded(i)) return;
    let picked = (ans(i) && ans(i).picked) ? ans(i).picked.slice() : [];

    if (q.t === "multiple") {
      picked = picked.includes(letter) ? picked.filter((x) => x !== letter) : picked.concat(letter);
    } else {
      picked = [letter];
    }

    const a = updateAns(i, { picked: picked, type: "choice" });

    const node = $('#stage .q[data-i="' + i + '"]');
    node.querySelectorAll(".opt").forEach((b) => b.setAttribute("aria-checked", picked.includes(b.dataset.l) ? "true" : "false"));
    const confirm = node.querySelector('[data-act="confirm"]');
    if (confirm) confirm.disabled = !picked.length;

    if (q.t !== "multiple" && S.mode === "practice") {
      a.correct = gradeChoice(q, picked);
      a.graded = true;
      reveal(node, q, a, false);
      refreshStats();
      paintChapters();
      afterGrade(i);
    } else {
      save();
      refreshStats();
    }
  }

  function confirmAnswer(i) {
    const q = Q[i];
    const a = ans(i);
    if (!q || !a || isGraded(i) || isSubjective(q)) return;
    const node = $('#stage .q[data-i="' + i + '"]');

    if (q.t === "multiple") {
      if (!a.picked || !a.picked.length) return;
      a.correct = gradeChoice(q, a.picked);
    } else if (q.t === "fill" || q.t === "term") {
      const text = (node.querySelector(".field").value || "").trim();
      if (!text) return;
      a.text = text;
      a.correct = gradeText(q, text);
      if (a.correct === null) a.correct = false;
    }
    a.graded = true;
    a.type = "choice";
    save();
    reveal(node, q, a, false);
    refreshStats();
    paintChapters();
    afterGrade(i);
  }

  function afterGrade(i) {
    save();
    const node = $('#stage .q[data-i="' + i + '"]');
    if (node) scrollToVerdict(node);
    if ($("#sheet").classList.contains("show")) buildSheet();
    const pos = view.indexOf(i);
    const next = $("#nextBtn");
    if (pos >= 0 && pos < view.length - 1) next.focus({ preventScroll: true });
  }

  /* 判过之后想重来，不必清空整卷；只重置这一题，标记与其它题不受影响 */
  function redoQuestion(i) {
    const q = Q[i];
    if (!q || S.mode !== "practice") return;
    delete S.answers[qkey(i)];
    if (S.submitted) {
      S.submitted = false;
      $("#submitBtn").textContent = "交卷";
    }
    save();
    const node = $('#stage .q[data-i="' + i + '"]');
    if (node) {
      const holder = document.createElement("div");
      holder.innerHTML = questionHTML(q);
      node.replaceWith(holder.firstElementChild);
    }
    applyFilter(true);
    refreshStats();
    if ($("#sheet").classList.contains("show")) buildSheet();
    toast("已重做本题");
  }

  function paintChapters() {
    // refreshStats 已包含章节计数，这里只是保持接口对称
  }

  function go(delta, dir) {
    const pos = view.indexOf(S.cur);
    const target = pos + delta;
    if (target < 0 || target >= view.length) return;
    S.cur = view[target];
    save();
    $("#stage").dataset.dir = dir || (delta > 0 ? "l" : "r");
    paint();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* 判定后把解析顶到视口上方，省得手机上还能看见半屏空白 */
  function scrollToVerdict(node) {
    if (window.innerWidth > 980) return;
    const v = node.querySelector(".verdict");
    if (!v) return;
    const r = v.getBoundingClientRect();
    if (r.top > window.innerHeight * 0.55) {
      window.scrollTo({ top: r.top + window.scrollY - 72, behavior: "smooth" });
    }
  }

  function jump(i) {
    if (!view.includes(i)) {
      S.filter = { scope: "all", type: "all" };
      syncFilterUI();
      applyFilter(true);
    }
    S.cur = i;
    save();
    paint();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ------------------------------------------------------------ result */
  function showResult() {
    // 交卷时把所有已作答但未判定的题判掉；未作答的保持未做
    Q.forEach((q) => {
      const a = ans(q.i);
      if (!a || a.graded) return;
      if (isSubjective(q)) {
        a.graded = true; a.pending = true; a.correct = null;
      } else if (q.t === "fill" || q.t === "term") {
        if (!String(a.text || "").trim()) return;
        a.correct = gradeText(q, a.text) === true;
        a.graded = true;
      } else {
        if (!a.picked || !a.picked.length) return;
        a.correct = gradeChoice(q, a.picked);
        a.graded = true;
      }
    });
    S.submitted = true;
    save();

    // 让回看时每道题都处于已判定状态
    Q.forEach((q) => {
      const a = ans(q.i);
      const node = document.querySelector('#stage .q[data-i="' + q.i + '"]');
      if (a && a.graded && node) reveal(node, q, a, true);
    });

    const graded = Q.filter((q) => isGraded(q.i));
    const ok = graded.filter((q) => isCorrect(q.i));
    const pending = graded.filter((q) => { const a = ans(q.i); return a && a.pending; });
    const bad = graded.filter((q) => !isCorrect(q.i) && !(ans(q.i) && ans(q.i).pending));
    const unanswered = N - graded.length;
    const base = ok.length + bad.length;
    const rate = base ? Math.round((ok.length / base) * 100) : 0;

    const C = 2 * Math.PI * 54;
    const chapters = [];
    Q.forEach((q) => {
      let c = chapters.find((x) => x.sec === q.sec);
      if (!c) { c = { sec: q.sec, ok: 0, total: 0 }; chapters.push(c); }
      c.total++;
      if (isCorrect(q.i)) c.ok++;
    });
    chapters.sort((a, b) => unitKey(a.sec) - unitKey(b.sec));

    /* 按题型统计：题多的卷子里，章节分布看不出「哪类题弱」，题型更直观 */
    const byType = [];
    Q.forEach((q) => {
      let t = byType.find((x) => x.t === q.t);
      if (!t) { t = { t: q.t, ok: 0, total: 0 }; byType.push(t); }
      t.total++;
      if (isCorrect(q.i)) t.ok++;
    });
    byType.sort((a, b) => typeRank(a.t) - typeRank(b.t));

    const barsHTML = (rows, label) =>
      '<div class="bars">' + rows.map((c) => {
        const p = c.total ? Math.round((c.ok / c.total) * 100) : 0;
        const name = label(c);
        return '<div class="bar-row"><div class="top"><span class="lbl" title="' + esc(name) + '">' + esc(name) + '</span>' +
          '<span class="frac">' + c.ok + "/" + c.total + '</span></div>' +
          '<span class="track"><i class="fill" style="width:' + p + '%"></i></span></div>';
      }).join("") + "</div>";

    const wrongs = bad.concat(pending);

    // 按分值算分：正卷 100 分，术语速记属于附加分，单独注明
    const scored = Q.filter((q) => (q.score || 0) > 0);
    const totalScore = scored.reduce((s, q) => s + q.score, 0);
    const gotScore = scored.reduce((s, q) => s + (isCorrect(q.i) ? q.score : 0), 0);
    const bonusScore = scored.filter((q) => q.t === "term").reduce((s, q) => s + q.score, 0);

    $("#result").innerHTML =
      '<div class="res-head">' +
        '<div class="big-ring"><svg width="132" height="132" viewBox="0 0 132 132">' +
          '<circle cx="66" cy="66" r="54" fill="none" stroke="var(--line2)" stroke-width="9" opacity=".5"/>' +
          '<circle cx="66" cy="66" r="54" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" ' +
            'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C - (rate / 100) * C).toFixed(1) + '"/>' +
        "</svg><div class=\"t\"><b>" + rate + "%</b><span>正确率</span></div></div>" +
        '<div class="res-title"><h2>' + (rate >= 85 ? "掌握得不错" : rate >= 60 ? "还有提升空间" : "需要回头重看这一章") + "</h2>" +
          "<p>得分 <b class=\"sc\">" + gotScore + "</b> / " + totalScore +
          (bonusScore ? "（含术语附加 " + bonusScore + " 分，正卷 " + (totalScore - bonusScore) + " 分）" : "") +
          "</p>" +
          '<p class="res-meta">' + (S.mode === "exam" ? "考试模式" : "练习模式") + " · 用时 " + elapsed() + "</p>" +
          '<div class="res-stats">' +
            "<div><b>" + ok.length + "</b>答对</div>" +
            "<div><b>" + bad.length + "</b>答错</div>" +
            "<div><b>" + pending.length + "</b>待自评</div>" +
            "<div><b>" + unanswered + "</b>未作答</div>" +
          "</div></div>" +
      "</div>" +
      '<div class="res-sec"><h3>分章节表现</h3>' +
        barsHTML(chapters, (c) => c.sec) +
      "</div>" +
      (byType.length > 1
        ? '<div class="res-sec"><h3>分题型表现</h3>' +
          barsHTML(byType, (c) => TYPE_CN[c.t] || c.t) +
          "</div>"
        : "") +
      (wrongs.length
        ? '<div class="res-sec"><h3>需要回看的题（' + wrongs.length + "）</h3><div class=\"wrong-list\">" +
          wrongs.map((q) =>
            '<button class="wrong-item" data-jump="' + q.i + '">' +
              '<span class="n">' + String(q.n).padStart(2, "0") + "</span>" +
              '<span class="qt"><i class="tk">' + (TYPE_CN[q.t] || "") + "</i>" +
                rich(q.t === "term" && !isExplainTerm(q) ? q.q + " → 英文术语" : q.q) + "</span></button>").join("") +
          "</div></div>"
        : '<div class="res-sec"><h3>需要回看的题</h3><div class="empty" style="padding:28px 0"><b>全部正确</b>这一份可以过了。</div></div>') +
      '<div class="res-actions">' +
        (wrongs.length ? '<button class="btn primary" id="redoWrong">只做错题（' + wrongs.length + "）</button>" : "") +
        (wrongs.length ? '<button class="btn ghost" id="exportWrong">导出错题</button>' : "") +
        '<button class="btn ghost" id="reviewAll">回看全部题目</button>' +
        '<button class="btn ghost" id="restart">重新开始</button>' +
      "</div>";

    $("#stage").style.display = "none";
    $("#navbar").style.visibility = "hidden";
    $("#submitBtn").textContent = "查看结果";
    $("#result").classList.add("show");
    window.scrollTo({ top: 0, behavior: "smooth" });

    const redo = $("#redoWrong");
    if (redo) redo.addEventListener("click", () => {
      S.filter = { scope: "wrong", type: "all" };
      syncFilterUI();
      closeResult();
      applyFilter(false);
    });
    $("#reviewAll").addEventListener("click", () => {
      S.filter = { scope: "all", type: "all" };
      syncFilterUI();
      closeResult();
      applyFilter(false);
    });
    $("#restart").addEventListener("click", resetAll);
    const expBtn = $("#exportWrong");
    if (expBtn) expBtn.addEventListener("click", () => exportWrong(wrongs));
    $$("#result [data-jump]").forEach((b) =>
      b.addEventListener("click", () => { closeResult(); jump(Number(b.dataset.jump)); }));
  }

  /* 错题导出成 Markdown：手机上直接存文件，存不了就退回复制到剪贴板。
     内容按「题干 / 你的答案 / 参考答案 / 采分点 / 出处 / 原文依据」排，
     复制到笔记软件里就是一份能背的错题本。 */
  function exportWrong(list) {
    const L = [];
    L.push("# " + (META.title || "题库") + " · 错题整理", "");
    L.push("- 导出时间：" + new Date().toLocaleString());
    L.push("- 模式：" + (S.mode === "exam" ? "考试" : "练习") + "，用时 " + elapsed());
    L.push("- 共 " + list.length + " 题", "");
    list.forEach((q) => {
      const a = ans(q.i) || {};
      L.push("## " + String(q.n).padStart(2, "0") + " · " + (TYPE_CN[q.t] || q.t) + " · " + q.sec, "");
      L.push("**题目** " + plain(q.q), "");
      if (isExplainTerm(q) || SUBJECTIVE[q.t]) {
        L.push("- 你的作答：" + (String(a.text || "").trim() || "（未写）"));
      } else if (q.t === "term" || q.t === "fill") {
        L.push("- 你的答案：" + (a.text || "（未填）"));
      } else {
        L.push("- 你的选择：" + ((a.picked || []).join("") || "（未选）"));
      }
      L.push("- " + (isExplainTerm(q) ? "参考释义" : "参考答案") + "：" + (q.a || []).map(plain).join(" / "));
      if (a && a.pending) L.push("- 状态：待自评");
      if (q.keys && q.keys.length) {
        L.push("- 采分点：" + q.keys.map((k) => plain(k.en) + (k.cn ? "（" + plain(k.cn) + "）" : "")).join("；"));
      }
      if (q.ref) L.push("- 出处：" + q.ref);
      if (q.ev) L.push("- 原文依据：" + q.ev);
      L.push("");
    });
    const text = L.join("\n");
    const fname = "错题-" + (META.id || "deck") + ".md";
    try {
      const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast("已导出 " + list.length + " 道错题");
    } catch (e) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(
          () => toast("已复制到剪贴板"),
          () => toast("导出失败，请用打印功能")
        );
      } else {
        toast("导出失败，请用打印功能");
      }
    }
  }

  function closeResult() {
    $("#result").classList.remove("show");
    $("#stage").style.display = "";
    $("#navbar").style.visibility = "";
    $("#submitBtn").textContent = "交卷";
  }

  function resetAll() {
    if (!confirm("清空所有答题记录并重新开始？")) return;
    S = Object.assign({}, BLANK, { started: Date.now(), filter: S.filter, mode: S.mode, sig: SIG });
    save();
    closeResult();
    $$("#stage .q").forEach((n) => {
      n.classList.remove("graded");
      n.querySelectorAll(".opt").forEach((b) => {
        b.classList.remove("is-ok", "is-bad", "locked");
        b.setAttribute("aria-checked", "false");
        const f = b.querySelector(".flag"); if (f) f.textContent = "";
      });
      const f = n.querySelector(".field");
      if (f) { f.value = ""; f.readOnly = false; f.style.height = ""; }
      const c = n.querySelector('[data-act="confirm"]');
      if (c) c.disabled = true;
      const v = n.querySelector(".verdict"); if (v) v.innerHTML = "";
      const sg = n.querySelector(".self-grade"); if (sg) sg.remove();
    });
    applyFilter(false);
    toast("已清空，从第一题重新开始");
  }

  /* ------------------------------------------------------------ misc ui */
  function elapsed() {
    const s = Math.max(0, Math.floor((Date.now() - (S.started || Date.now())) / 1000));
    const m = Math.floor(s / 60);
    return m ? m + " 分 " + (s % 60) + " 秒" : s + " 秒";
  }

  function tick() {
    const s = Math.max(0, Math.floor((Date.now() - (S.started || Date.now())) / 1000));
    const m = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    $("#timer").textContent = m + ":" + ss;
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function syncFilterUI() {
    $$("#scope button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.scope === S.filter.scope ? "true" : "false"));
    $$("#types button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.type === S.filter.type ? "true" : "false"));
    $$("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === S.mode ? "true" : "false"));
  }

  /* 顶栏与抽屉里各有一套模式切换，统一由这里改状态 */
  function setMode(m) {
    if (S.mode === m) return;
    S.mode = m;
    syncFilterUI();
    save();
    toast(S.mode === "exam" ? "考试模式：作答后不立即判定" : "练习模式：作答后立即判定");
    applyFilter(true);
  }

  /* 正文字号：长英文题干在手机上按默认字号读起来偏累，给三档 */
  function setFs(v) {
    if (v !== "sm" && v !== "md" && v !== "lg") v = "md";
    document.documentElement.setAttribute("data-fs", v);
    try { localStorage.setItem(FKEY, v); } catch (e) {}
    $$("[data-fs-btn]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.fsBtn === v ? "true" : "false"));
    $$("textarea.field").forEach(grow);
  }

  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(TKEY, t); } catch (e) {}
    const tc = $("#tcMeta");
    if (tc) tc.setAttribute("content", t === "dark" ? "#0f1214" : "#f3f1ec");
    $("#themeBtn").innerHTML = t === "dark"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  }

  /* ------------------------------------------------------------ events */
  document.addEventListener("click", (e) => {
    const opt = e.target.closest(".opt");
    if (opt) { pick(Number(opt.dataset.i), opt.dataset.l); return; }

    const act = e.target.closest("[data-act]");
    if (act) {
      const i = Number(act.dataset.i);
      const kind = act.dataset.act;
      if (kind === "confirm") confirmAnswer(i);
      else if (kind === "redo") redoQuestion(i);
      else if (kind === "mark") {
        toggleMark(i);
        save();
        const btn = document.querySelector('[data-act="mark"][data-i="' + i + '"]');
        if (btn) btn.setAttribute("aria-pressed", isMarked(i) ? "true" : "false");
        if (S.filter.scope === "marked") applyFilter(true);
      } else if (kind === "reveal") {
        const a = setAns(i, { picked: [], graded: true, pending: true, correct: null, type: "short" });
        save();
        const node = document.querySelector('#stage .q[data-i="' + i + '"]');
        reveal(node, Q[i], a, false);
        refreshStats();
        scrollToVerdict(node);
      }
      return;
    }

    const self = e.target.closest("[data-self]");
    if (self) {
      const i = Number(self.dataset.i);
      const a = updateAns(i, {
        graded: true, pending: false, correct: self.dataset.self === "yes"
      });
      save();
      const node = document.querySelector('#stage .q[data-i="' + i + '"]');
      reveal(node, Q[i], a, false);
      refreshStats();
      if ($("#sheet").classList.contains("show")) buildSheet();
      return;
    }

    const cell = e.target.closest("[data-goto]");
    if (cell) {
      closeSheet();
      jump(Number(cell.dataset.goto));
      return;
    }

    const sScope = e.target.closest("[data-sheet-scope]");
    if (sScope) {
      sheetScope = sScope.dataset.sheetScope;
      buildSheet();
      return;
    }

    const modeBtn = e.target.closest("[data-mode]");
    if (modeBtn) { setMode(modeBtn.dataset.mode); return; }

    const fsBtn = e.target.closest("[data-fs-btn]");
    if (fsBtn) { setFs(fsBtn.dataset.fsBtn); return; }

    const nav = e.target.closest(".nav-item");
    if (nav) {
      const sec = nav.dataset.sec;
      const first = Q.find((q) => q.sec === sec);
      if (first) {
        closeMobile();
        if (!view.includes(first.i)) { S.filter = { scope: "all", type: "all" }; syncFilterUI(); applyFilter(true); }
        jump(first.i);
      }
      return;
    }
  });

  document.addEventListener("input", (e) => {
    const f = e.target.closest(".field");
    if (!f) return;
    const i = Number(f.dataset.i);
    const q = Q[i];
    if (!q || isGraded(i)) return;
    updateAns(i, { text: f.value });
    const c = document.querySelector('[data-act="confirm"][data-i="' + i + '"]');
    if (c) c.disabled = !f.value.trim();
    if (f.tagName === "TEXTAREA") grow(f);
    save();
  });

  /* 手机软键盘弹出后会盖住固定底栏，聚焦输入时先把它收起来 */
  document.addEventListener("focusin", (e) => {
    if (e.target.closest(".field")) document.body.classList.add("kbd");
  });
  document.addEventListener("focusout", (e) => {
    if (!e.target.closest(".field")) return;
    setTimeout(() => {
      if (!document.activeElement || !document.activeElement.closest(".field")) {
        document.body.classList.remove("kbd");
      }
    }, 90);
  });

  /* 横滑翻页：位移超过 55px 且明显偏水平才认，避免和竖滑滚动打架 */
  (function swipe() {
    const stage = $("#stage");
    let from = null;
    stage.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1 || e.target.closest("input,textarea")) { from = null; return; }
      const t = e.touches[0];
      from = { x: t.clientX, y: t.clientY, at: Date.now() };
    }, { passive: true });
    stage.addEventListener("touchend", (e) => {
      if (!from) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - from.x;
      const dy = t.clientY - from.y;
      const dt = Date.now() - from.at;
      from = null;
      if (dt > 700 || Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
      go(dx < 0 ? 1 : -1, dx < 0 ? "l" : "r");
    }, { passive: true });
    stage.addEventListener("touchcancel", () => { from = null; }, { passive: true });
  })();

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if ($("#sheet").classList.contains("show")) { closeSheet(); return; }
      if ($("#side").classList.contains("open")) { closeMobile(); return; }
    }
    if (e.target.matches("input,textarea")) {
      if (e.key === "Enter" && !e.shiftKey && e.target.dataset.i) {
        const qq = Q[Number(e.target.dataset.i)];
        // 主观题与释义题要能换行，不能把回车当成提交
        if (isSubjective(qq)) return;
        e.preventDefault();
        confirmAnswer(Number(e.target.dataset.i));
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    const cur = S.cur;
    const q = Q[cur];
    if (!q) return;

    if (/^[1-8]$/.test(e.key)) {
      const idx = Number(e.key) - 1;
      if (q.t === "truefalse") { if (idx < 2) pick(cur, idx === 0 ? "T" : "F"); }
      else if (q.o && idx < q.o.length) pick(cur, LTR[idx]);
      e.preventDefault();
      return;
    }
    if (e.key === "ArrowRight" || e.key === "Enter") {
      if (e.key === "Enter" && !isGraded(cur) && (q.t === "multiple" || q.t === "fill" || (q.t === "term" && !isExplainTerm(q)))) { confirmAnswer(cur); e.preventDefault(); return; }
      if (e.key === "Enter" && !isGraded(cur) && (q.t === "short" || isExplainTerm(q))) return;
      go(1); e.preventDefault(); return;
    }
    if (e.key === "ArrowLeft") { go(-1); e.preventDefault(); return; }
    if (e.key.toLowerCase() === "m") {
      const i = cur;
      toggleMark(i);
      save();
      const btn = document.querySelector('[data-act="mark"][data-i="' + i + '"]');
      if (btn) btn.setAttribute("aria-pressed", isMarked(i) ? "true" : "false");
      toast(isMarked(i) ? "已标记" : "已取消标记");
    }
    if (e.key.toLowerCase() === "t") {
      setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    }
  });

  $("#prevBtn").addEventListener("click", () => go(-1));
  $("#nextBtn").addEventListener("click", () => go(1));
  $("#submitBtn").addEventListener("click", () => {
    const done = Q.filter((q) => isGraded(q.i)).length;
    if (done < N && !confirm("还有 " + (N - done) + " 题未作答，确定交卷？")) return;
    showResult();
  });
  $("#themeBtn").addEventListener("click", () =>
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));
  $("#printBtn").addEventListener("click", () => window.print());
  $("#resetBtn").addEventListener("click", resetAll);

  $("#scope").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-scope]");
    if (!b) return;
    S.filter.scope = b.dataset.scope;
    syncFilterUI();
    save();
    applyFilter(false);
  });

  $("#types").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-type]");
    if (!b) return;
    S.filter.type = b.dataset.type;
    syncFilterUI();
    save();
    applyFilter(false);
  });

  $("#posBtn").addEventListener("click", openSheet);
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#sheetScrim").addEventListener("click", closeSheet);

  function closeMobile() { $("#side").classList.remove("open"); $("#scrim").classList.remove("show"); }
  $("#menuBtn").addEventListener("click", () => {
    $("#side").classList.add("open");
    $("#scrim").classList.add("show");
  });
  $("#scrim").addEventListener("click", closeMobile);

  /* ------------------------------------------------------------ boot */
  function boot() {
    const saved = localStorage.getItem(TKEY);
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(saved || (prefersDark ? "dark" : "light"));

    let fs = "md";
    try { fs = localStorage.getItem(FKEY) || "md"; } catch (e) {}
    setFs(fs);

    buildSidebar();
    buildStage();
    syncFilterUI();
    applyFilter(true);

    // 侧栏副标题改短，避免长路径换行挤压标题
    const h1 = document.querySelector(".brand-t h1");
    if (h1) {
      // 标题在 190px 宽的侧栏里会从词语中间折断（“专业英 / 语”），改在“·”处换行
      const parts = h1.textContent.split("·").map((s) => s.trim()).filter(Boolean);
      if (parts.length > 1) h1.innerHTML = parts.map(esc).join("<br>");
    }
    const sub = document.querySelector(".brand-t p");
    if (sub) {
      const secs = new Set(Q.map((q) => q.sec)).size;
      sub.textContent = N + " 题 · " + secs + " 节";
      sub.title = (META.engine || "") + " · " + (META.source || "");
    }

    // 恢复已交卷状态：显示结果页按钮提示
    if (S.submitted) $("#submitBtn").textContent = "查看结果";

    tick();
    setInterval(tick, 1000);

    // 旋屏或改窗口宽度后，行高变了，文本框要重新量一次
    let rz = null;
    window.addEventListener("resize", () => {
      clearTimeout(rz);
      rz = setTimeout(() => $$("textarea.field").forEach(grow), 200);
    });

    // 迁移结果要写回，否则每次打开都拿旧签名重新过滤一遍
    if (stateMigrated) save();
    if (staleNote) setTimeout(() => toast(staleNote), 400);
    if (META.mock) toast("这是离线模式产物，题目由陈述句改写，仅供链路演示");
  }

  boot();
})();
</script>
</body>
</html>
