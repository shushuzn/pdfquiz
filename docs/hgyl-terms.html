<script>window.__QUIZ__ = {"meta":{"id":"化工原理术语与概念","title":"化工原理 · 术语与概念","engine":"教材 OCR 全文 + 逐字回查","source":"《化工原理》（第四版），杨祖荣主编，刘丽英、刘伟副主编，化学工业出版社，2021","generated":"","chunks":9,"accepted":93,"rejected":[],"mock":false},"questions":[{"i":0,"n":1,"ch":"绪论","sec":"绪论","code":"","id":"ch00-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"单元操作","o":[],"a":["按操作原理和特点归纳出来的、在各类化工生产中反复出现的基本物理操作，如流体输送、沉降、过滤、换热、蒸馏、吸收、干燥等。每个单元操作都包含过程原理和相应设备两部分内容。"],"exp":"关键词是「共性」和「基本物理操作」：它不针对某一种产品，而是把不同生产过程中原理相同的步骤抽出来统一研究，因此可以做成通用设备，也才有一门统一的化工原理课。","ev":"工程上将这些具有共性的基本操作称为单元操作(unit operation)。","keys":[],"ref":"第 1 页","hint":"","score":2},{"i":1,"n":2,"ch":"绪论","sec":"绪论","code":"","id":"ch00-term-002","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"物料衡算","o":[],"a":["以质量守恒为基础，对划定的衡算系统列出「输入量减输出量等于积累量」的方程，用来求未知的物料量。计算前要先圈定衡算范围、选定计算基准并统一单位。"],"exp":"要写出三件事：依据是质量守恒，形式是输入减输出等于积累，步骤是先定系统再定基准。基准通常取不再变化的量，连续过程以单位时间为基准，间歇过程以一批为基准。","ev":"根据质量守恒定律，进入与离开某一过程或设备的物料的质量之差应等于积累在该过程或设备中的物料质量，即","keys":[],"ref":"第 3 页","hint":"","score":2},{"i":2,"n":3,"ch":"绪论","sec":"绪论","code":"","id":"ch00-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"过程传递速率","o":[],"a":["过程进行的快慢，用单位时间内过程进行的变化量表示，例如单位时间传递的热量或单位时间单位面积传递的物质量。它等于推动力除以阻力。"],"exp":"定义里要体现「快慢」和「单位时间的变化量」，并给出速率与推动力、阻力的关系。速率越大设备生产能力越大，完成同样产量所需设备越小，所以工程上往往比平衡问题更受关注。","ev":"过程传递速率是指过程进行的快慢，通常用单位时间内过程进行的变化量表示。","keys":[],"ref":"第 4 页","hint":"","score":2},{"i":3,"n":4,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"黏度","o":[],"a":["流体流动时，在垂直于流动方向上产生单位速度梯度所需的剪应力，是反映流体黏性大小的物性参数，单位为 Pa·s。黏度越大，同样流动条件下产生的内摩擦力越大；液体黏度随温度升高而降低，气体黏度随温度升高而增大。"],"exp":"定义要落到单位速度梯度对应剪应力这一点，并说明它表征内摩擦的大小。黏度是物性，随种类和温度变化：液体升温黏度下降，气体升温黏度上升，这一相反趋势是常考易错点。","ev":"显然，在同样流动情况下,流体的黏度越大，流体流动时产生的内摩擦力越大。","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":4,"n":5,"ch":"第1章 流体流动与输送机械","sec":"1.1 流体物性与静力学","code":"1.1","id":"ch01-term-007","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"牛顿黏性定律","o":[],"a":["流体分层流动时，相邻流体层之间的剪应力与垂直于流动方向的速度梯度成正比，比例系数为流体的黏度，即 τ=μ(du/dy)。它说明内摩擦力来源于分子间的黏性作用，只适用于层流，不适用于湍流主体。"],"exp":"回答要抓住三点：剪应力与法向速度梯度成正比、比例系数是黏度、适用前提是分层流动。湍流主体中质点脉动引起的动量传递远大于分子黏性，剪应力需用湍流黏度另行描述，不能直接套用该定律。","ev":"式(1-8) 、式(1-8a)称为牛顿黏性定律， 表明流体层间的剪切力或前应力与法向速度梯度成正比。","keys":[],"ref":"第 10 页","hint":"","score":2},{"i":5,"n":6,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-term-002","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"流体静力学基本方程","o":[],"a":["描述重力场中静止、连续、同种不可压缩流体内部压力随位置变化关系的方程，可写成 p+ρgz=常数，或 p=p₀+ρgh。它表明静止流体中位能与静压能之和即总势能保持不变，同一水平面上各点压力相等，压力差可用液柱高度表示。"],"exp":"方程的核心是压力随深度线性增加，本质是静止流体的能量守恒：位置降低，位能减小而静压能增大，总势能不变。使用前提是重力场中静止、连续的同种不可压缩流体，气体只有在压力变化不大时才可近似应用。","ev":"流体静力学基本方程是研究流体在重力场中处于静止时的平衡规律，描述静止流体内部的压力与所处位置之间的关系。","keys":[],"ref":"第 11 页","hint":"","score":2},{"i":6,"n":7,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-term-009","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"静压能","o":[],"a":["流体因具有一定静压力而具有的能量，又称流动功，单位为 J/kg，单位质量流体的静压能为 p/ρ。在伯努利方程中它与位能、动能一起构成流体的总机械能，三者可以相互转换。"],"exp":"静压能不是流体静止时才有的能量，流动流体同样具有静压能；它来源于压力对流体做功，故又称流动功。理解时要与位能、动能并列为三种机械能，注意其单位与位能、动能相同，都是 J/kg。","ev":"这种能量称为静压能(static energy )或流动功。","keys":[],"ref":"第 18 页","hint":"","score":2},{"i":7,"n":8,"ch":"第1章 流体流动与输送机械","sec":"1.3 连续性方程与机械能衡算","code":"1.3","id":"ch01-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"外加功","o":[],"a":["单位质量流体从流体输送机械获得的能量，又称有效功，用 We 表示，单位为 J/kg。它反映输送机械对流体的能量输入，在伯努利方程中与能量损失一起构成实际流体的机械能衡算。"],"exp":"定义的核心是单位质量流体从输送机械获得的能量，单位为 J/kg。要与轴功率区分：外加功是每千克流体获得的能量，轴功率是机械单位时间消耗的功率。两截面间没有输送机械时外加功为零，不能随意添加。","ev":"将单位质量流体从流体输送机械获得的能量称为外加功","keys":[],"ref":"第 19 页","hint":"","score":2},{"i":8,"n":9,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"雷诺数","o":[],"a":["由流速、管径、流体密度和黏度组成的无量纲数群，Re=duρ/μ。它表示流体流动中惯性力与黏性力的对比关系，是判断流型的依据：Re 不大于 2000 为层流，Re 不小于 4000 为湍流，两者之间为过渡区。"],"exp":"要写出组成量、无量纲和物理意义三层。Re 大表示惯性力占优、湍动强烈；Re 小表示黏性力占优、流动分层。判断时注意过渡区只是可能出现层流或湍流，并不是第三种流型。","ev":"雷诺数有明确的物理意义，它表示流体流动中惯性力与黏性力的对比关系","keys":[],"ref":"第 25 页","hint":"","score":2},{"i":9,"n":10,"ch":"第1章 流体流动与输送机械","sec":"1.4 流动型态与速度分布","code":"1.4","id":"ch01-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"流动边界层","o":[],"a":["流体流过固体壁面时，由于壁面阻滞和流体黏性，在壁面附近形成的速度显著降低的薄层，通常把速度降到主体流速 99% 以内的区域称为边界层。边界层内速度梯度大，流动阻力主要集中在这里，并分为层流边界层和湍流边界层。"],"exp":"要点是壁面附近、黏性作用、速度梯度大这三个特征。边界层很薄却集中了大部分流动阻力；湍流边界层内部紧贴壁面仍保留一层作层流流动的层流内层，这一点常被误解为湍流边界层内全是湍流。","ev":"当一股速度均匀的流体与一固体壁面相接触时，由于壁面对流体的阻碍作用，与壁面紧相邻的流体层速度立即降为零。","keys":[],"ref":"第 28 页","hint":"","score":2},{"i":10,"n":11,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"边界层分离","o":[],"a":["流体绕过曲面时，后半周流道扩大、压力升高形成逆压，边界层内流体在黏性剪应力和逆压共同作用下动能耗尽，速度降为零，边界层脱离壁面并产生旋涡的现象。分离后尾流区旋涡加剧能量损失，但也能强化混合、传热和传质。"],"exp":"要讲清因果链：流道扩大产生逆压，逆压迫使边界层内低速流体停滞、倒流，边界层脱离壁面并形成旋涡。分离既增大机械能损耗，又强化混合与传递过程，因此工程上有时避免、有时利用。","ev":"若将流体中速度为零的各点连成一线，如图中的 CC ，该线与边界层上缘之间的区域即成为脱离了物体的边界层。这一现象称为边界层分离。","keys":[],"ref":"第 30 页","hint":"","score":2},{"i":11,"n":12,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-term-011","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"范宁公式","o":[],"a":["表示流体在直管内流动阻力与动能关系的通式，把单位质量流体的能量损失写成摩擦系数乘以管长与管径之比再乘以动能，即 hf=λ(l/d)(u²/2)。式中摩擦系数为无量纲量，层流和湍流都适用，只是取值方法不同。"],"exp":"范宁公式的实质是把阻力表示为动能的倍数，管长越长、管径越小、摩擦系数越大，阻力越大。它对层流和湍流都成立，区别在摩擦系数的求法：层流时为 64/Re，湍流时查图或经验公式。","ev":"式(1-37)为流体在直管内流动阻力的通式，称为范宁(Fanning)公式。","keys":[],"ref":"第 31 页","hint":"","score":2},{"i":12,"n":13,"ch":"第1章 流体流动与输送机械","sec":"1.5 管路阻力","code":"1.5","id":"ch01-term-012","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"局部阻力系数","o":[],"a":["把局部阻力表示为动能某一倍数的比例系数，用 ζ 表示，即 hf′=ζu²/2。它由管件或阀门的几何形状和流动状况决定，一般由实验测定；计算突然扩大或缩小时，式中的速度应取小管中的流速。"],"exp":"要说明它是阻力系数法中的比例系数，与动能相乘得到局部阻力，而不是一个固定的阻力值。局部阻力系数随管件类型、开度和流型变化，需查表或实验测定；改用当量长度法时就不能再同时乘这个系数。","ev":"式中,5 称为局部阻力系数(local resistance coefficient) 。","keys":[],"ref":"第 38 页","hint":"","score":2},{"i":13,"n":14,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-term-013","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"测速管","o":[],"a":["又称皮托管，由两根弯成直角的同心套管组成，内管正对流动方向测冲压能，外管壁面开测压孔测静压能，两者之差经 U 形压差计反映流体在某点的动能，从而求得点速度。它用于测量管截面上的点速度分布，适合大直径管路中的清洁气体。"],"exp":"结构上要区分内管和外管：内管测的是冲压能，外管测的是静压能，压差对应动能，因此测得的是点速度而不是平均速度。求流量时需先测出速度分布或由管中心最大速度换算平均速度。","ev":"测速管又称皮托管(Pitot tube) ，如图 1-54 所示，系由两根弯成直角的同心套管组成","keys":[],"ref":"第 48 页","hint":"","score":2},{"i":14,"n":15,"ch":"第1章 流体流动与输送机械","sec":"1.7 流量测量","code":"1.7","id":"ch01-term-014","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"流量系数","o":[],"a":["孔板或文丘里流量计流量方程中的校正系数，用 C 表示，用来校正能量损失、缩脉位置不定、取压点与实际截面不一致等因素的影响。它由实验测定，主要取决于雷诺数、孔面积与管截面积之比，也受取压方式和加工精度影响。"],"exp":"流量系数不是理论推导出的常数，而是把理想方程修正到实际工况的综合性系数。对标准孔板，它随雷诺数增大而减小，当雷诺数超过界限值后趋于只与面积比有关的常数；文丘里的流量系数约为 0.98 至 0.99。","ev":"式中 Cu 称为流量系数(flow coefficient)，甚值由实验测定。","keys":[],"ref":"第 51 页","hint":"","score":2},{"i":15,"n":16,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"离心泵的特性曲线","o":[],"a":["表示离心泵压头 H、轴功率 N 和效率 η 随流量 qv 变化关系的三条曲线，通常由实验测定。H-qv 曲线在较大流量范围内随流量增大而下降；N-qv 曲线随流量增大而上升，流量为零时轴功率最小，故启动时应关闭出口阀门；η-qv 曲线先升后降，存在最高效率点即设计点，铭牌参数通常对应此点。泵的轴功率 N 与有效功率 Ne 之比即总效率 η，计算时可先由流量、压头和密度求有效功率，再由效率换算轴功率。"],"exp":"三条曲线的变化趋势要分别说清：压头下降、轴功率上升、效率先升后降。由轴功率随流量增大而上升可以推出启动时关出口阀门的操作；由效率存在最高点可以引出设计点和高效率区的概念。还要把轴功率与效率的关系说清：有效功率由流量、压头、密度算出，轴功率等于有效功率除以效率，因此输送密度较大的液体时轴功率会增大。","ev":"开始时泵的效率随流量的增大而上升，达到一最大值后，又随流量的增加而下降。这说明离心泵在一定转速下有一最高效率点，该点称为离心泵的设计点(design point) 。","keys":[],"ref":"第 59 页","hint":"","score":2},{"i":16,"n":17,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-term-016","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"比例定律","o":[],"a":["离心泵转速改变而效率可视为不变时，流量与转速的一次方成正比、压头与转速的二次方成正比、轴功率与转速的三次方成正比的近似关系。它用于把某一转速下的特性曲线换算为另一转速下的特性曲线，适用于黏度不大且转速变化小于 20% 的场合。"],"exp":"三个比例指数要记清：流量一次方、压头二次方、轴功率三次方，不能都按同一比例变化。使用前提是效率不变，即黏度不大、转速变化小于 20%，超出范围时误差较大。","ev":"式(1-80)称为比例定律。据此式可将某一转速下的特性曲线转换为另一转速下的特性曲线。","keys":[],"ref":"第 61 页","hint":"","score":2},{"i":17,"n":18,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"离心泵的工作点","o":[],"a":["离心泵特性曲线与管路特性曲线在同一坐标图上的交点，对应泵在该管路中实际提供的流量和压头。工作点由泵的性能和管路特性共同决定，改变阀门开度或泵的转速都可以使工作点移动，从而实现流量调节。"],"exp":"工作点不是泵单独决定的，也不是管路单独决定的，而是两条特性曲线的交点。读图时要同时看流量和压头两个坐标；若该点落在高效率区，运行才经济，否则应通过调节使其靠近设计点。","ev":"若将泵特性曲线 瑟-dv 与管路特性曲线 五.-gv 绘制在同一坐标图上(图 1-69)，则两条曲线有一个交点 M，称 M 点为离心泵的工作点(duty point) 。","keys":[],"ref":"第 62 页","hint":"","score":2},{"i":18,"n":19,"ch":"第1章 流体流动与输送机械","sec":"1.8 流体输送机械","code":"1.8","id":"ch01-term-015","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"汽蚀余量","o":[],"a":["为保证离心泵入口处液体不发生汽蚀而留出的压力余量，指泵入口处液体的静压头与动压头之和超过操作温度下液体饱和蒸气压头的部分。它分为有效汽蚀余量、临界汽蚀余量和必需汽蚀余量，有效值只与吸入管路有关，必需值由泵本身决定。"],"exp":"核心是入口静压头与动压头之和比饱和蒸气压头高出的那部分，余量越小越接近汽蚀。有效汽蚀余量由吸入装置决定，必需汽蚀余量由泵决定，运行时要求有效值大于必需值并留 0.5 m 以上安全量。","ev":"为防止发生汽蚀，泵入口处压力不能过低，究竟最低为多少，应留多大余量，每台泵均有各自的标准，这就是汽蚀余量(Net positive suction head) 。","keys":[],"ref":"第 66 页","hint":"","score":2},{"i":19,"n":20,"ch":"第2章 非均相物系分离","sec":"2.1 颗粒与颗粒群特性","code":"2.1","id":"ch02-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"颗粒群","o":[],"a":["由大小不同的颗粒组成的集合体。工业中遇到的固体颗粒大多不是单一粒径，而是具有一定粒径分布的颗粒群，其特性常用粒径分布、平均粒径、密度以及黏附性、散粒性等参数描述。"],"exp":"定义的关键是大小不同和颗粒的集合体，而不是单个颗粒。颗粒群的性质要用统计方法描述，例如用筛分分析测定粒径分布、用平均比表面积直径代表平均大小，这与单个球形颗粒只需一个直径就能说明大小有本质区别。","ev":"工业中遇到的大多数是由大小不同的颗粒组成的集合体，称为颗粒群(granular group ) 。","keys":[],"ref":"第 90 页","hint":"","score":2},{"i":20,"n":21,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-term-007","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"干扰沉降","o":[],"a":["颗粒浓度大、颗粒间距小时，颗粒在沉降过程中因相互影响而不能正常沉降的过程。由于被置换的流体作反向运动使曳力增大，干扰沉降速度小于自由沉降速度，工程上可先按自由沉降计算再按颗粒浓度修正。"],"exp":"判别干扰沉降的关键是颗粒浓度和颗粒间距，而不是颗粒形状或流体性质。颗粒下沉时流体被置换而向上回流，使颗粒受到的曳力增大，所以干扰沉降速度偏低。这与器壁效应不同，后者是容器壁面和底面的阻滞，两者都不属于自由沉降。","ev":"在沉降过程中，因颗粒之间的相互影响而使颗粒不能正常沉降的过程称为干扰沉降(hindered settling) 。","keys":[],"ref":"第 92 页","hint":"","score":2},{"i":21,"n":22,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"离心分离因数","o":[],"a":["同一颗粒在相同流体中离心沉降速度与重力沉降速度之比，其数值等于离心加速度与重力加速度之比，是衡量离心分离设备性能的重要指标，数值越大表示离心沉降效果越好。"],"exp":"它把离心场与重力场作对比，是一个无量纲比值。分离因数越大，同样颗粒获得的离心加速度越大，沉降越快；高速管式离心机的分离因数可达数十万，因此能分离重力沉降难以处理的细颗粒。","ev":"比值 氏. 称为离心分离因数(separation factor)，它是离心分离设备的重要性能指标。","keys":[],"ref":"第 98 页","hint":"","score":2},{"i":22,"n":23,"ch":"第2章 非均相物系分离","sec":"2.2 沉降","code":"2.2","id":"ch02-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"临界粒径","o":[],"a":["旋风分离器在规定的简化条件下能够完全分离下来的最小颗粒直径。临界粒径越小，说明该设备能分离的颗粒越细、分离性能越好，是判断旋风分离器分离效率高低的重要依据。"],"exp":"注意它是能完全分离的最小粒径，不是任意分离效率对应的粒径。粒径小于临界粒径的颗粒来不及在停留时间内到达器壁，分离效率下降；因此临界粒径常与粒级效率配合评价设备。","ev":"旋风分离器能够分离出的最小颗粒直径称为临界粒径(critical particle diameter)。","keys":[],"ref":"第 99 页","hint":"","score":2},{"i":23,"n":24,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"过滤","o":[],"a":["利用重力、离心力或人为造成的压强差，使悬浮液通过多孔性过滤介质，固体颗粒被截留、滤液穿过介质流出，从而实现固液混合物分离的单元操作。与沉降分离相比，过滤可使悬浮液分离得更迅速、更彻底。"],"exp":"定义要包含三要素：推动力可以是重力、离心力或压强差；作用是让液体通过多孔介质；结果是颗粒被截留、滤液流出。它处理的对象是悬浮液，属于机械分离操作。","ev":"它是利用重力、离心力或人为造成的压差使悬浮液通过多孔性过滤介质，其中固体颗粒被截留，滤液穿过介质流出以达到固液混合物的分离。","keys":[],"ref":"第 102 页","hint":"","score":2},{"i":24,"n":25,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"助滤剂","o":[],"a":["为减少可压缩滤饼的阻力而加入的刚性颗粒，能形成多孔饼层、增加滤饼刚性并提高过滤速率，常用的有硅藻土、珍珠岩、炭粉和纤维素等。用法有预涂法和掺滤法，当滤饼作为产品时不宜采用掺滤法。"],"exp":"关键词是刚性颗粒和多孔饼层：它不与被过滤的液体反应，而是改变滤饼结构，使可压缩滤饼不易被压密。预涂是把助滤剂先铺在介质上，掺滤是混入料浆一起过滤，若滤饼要作产品则不能混入。","ev":"为了减少可压缩滤饼的阻力，可使用助滤剂(filter aid)改变滤饼结构， 增加滤饼的刚性，提高过滤速率。","keys":[],"ref":"第 103 页","hint":"","score":2},{"i":25,"n":26,"ch":"第2章 非均相物系分离","sec":"2.3 过滤","code":"2.3","id":"ch02-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"恒压过滤","o":[],"a":["过滤过程中维持过滤压强差不变的操作方式。随着滤饼逐渐增厚、过滤阻力增大，过滤速率不断下降，过滤时间与所得滤液体积之间的关系可用恒压过滤方程描述。"],"exp":"恒压过滤的推动力恒定，阻力随饼层增厚而增大，所以速率下降而不是恒定。它与恒速过滤相反：恒速过滤要保持速率不变就得不断加压，对可压缩滤饼往往难以持续。","ev":"恒压过滤时维持操作压强差不变，但过滤速率将逐渐下降","keys":[],"ref":"第 104 页","hint":"","score":2},{"i":26,"n":27,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"定态传热","o":[],"a":["在定态温度场中进行的传热过程。定态温度场中各点的温度不随时间改变，因此传热过程不随时间变化，本章的导热与传热计算均以此为前提。与之相对，温度随时间变化的传热过程称为非定态传热。"],"exp":"定义的关键是温度场不随时间变化，而不是温度处处相等。定态下没有热量积累，串联各环节的热量传递速率相等，这正是把多层壁和间壁传热写成串联热阻的依据。","ev":"若所研究的传热过程是在定态温度场中进行的，则称为定态传热; 反之，若所研究的传 热过程是在非定态温度场中进行的，则称为非定态传热。","keys":[],"ref":"第 119 页","hint":"","score":2},{"i":27,"n":28,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"热导率","o":[],"a":["单位温度梯度下的导热热通量，表示物质的导热能力，是物质的基本物理性质之一。其数值与物质的结构、组成、温度和压强有关，一般金属最大、液体较小、气体最小。"],"exp":"定义要落在单位温度梯度下的热通量上，它反映材料导热的难易，而不是材料厚薄。热导率越大，同样温度梯度下导热越快；气体热导率小，所以常被封闭在软木、玻璃棉的空隙中起保温作用。","ev":"热导率(thermal conductivity)是单位温度梯度下的导热热通量，因而它代表物质的导热能力。","keys":[],"ref":"第 120 页","hint":"","score":2},{"i":28,"n":29,"ch":"第3章 传热","sec":"3.1-3.2 概述与热传导","code":"3.1","id":"ch03-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"对流传热","o":[],"a":["流动着的流体与固体壁面之间的热量传递过程，不同于流体内部的热对流。工程上用牛顿冷却定律把对流传热速率写成对流传热系数、传热面积与壁面和流体主体温差的乘积。"],"exp":"要区分对流传热与热对流：前者是流体与壁面之间的换热，后者是流体内部质点相对运动引起的传热。对流传热系数把流动状况、流体物性和传热面情况等复杂因素集中在一起，通常由实验关联式求取。","ev":"对流传热不同于一般意义上的热对流，而是特指流动着的流体与固体壁面之间的热量传递过程。","keys":[],"ref":"第 126 页","hint":"","score":2},{"i":29,"n":30,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-term-008","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"牛顿冷却定律","o":[],"a":["工程上把对流传热速率写成对流传热系数、传热面积与流体和壁面温差乘积的关系式，称为牛顿冷却定律。它并非理论推导的结果，而是一种认为对流传热速率与温差成正比的推论，众多影响因素都包含在对流传热系数中，该系数通常只能由实验获取。"],"exp":"要说明它是速率方程而不是物性定律，比例系数就是对流传热系数。正因如此，牛顿冷却定律形式简单却未简化问题，使用关联式求对流传热系数时必须注意其适用条件。","ev":"以上二式给出了计算对流传热速率的方法，称为牛顿冷却定律，它们也可以写成推动力 和阻力之比的形式","keys":[],"ref":"第 127 页","hint":"","score":2},{"i":30,"n":31,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"膜状冷凝","o":[],"a":["冷凝液能润湿壁面、并在壁面上形成一层完整液膜的冷凝方式。液膜在重力作用下向下流动且逐渐增厚，蒸气冷凝放出的相变潜热必须穿过液膜才能到达壁面，所以热阻几乎全部集中在液膜内。"],"exp":"判别依据是冷凝液能否润湿壁面：能润湿成完整液膜即膜状冷凝，不能润湿而成液滴则为滴状冷凝。膜状冷凝的传热系数虽低于滴状，但能持久维持，故工业冷凝器按膜状冷凝设计。","ev":"若壁面能被冷凝液润湿。在壁面上形成一层完整的液膜，则称为膜状冷凝。","keys":[],"ref":"第 137 页","hint":"","score":2},{"i":31,"n":32,"ch":"第3章 传热","sec":"3.3 对流传热","code":"3.3","id":"ch03-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"大容积沸腾","o":[],"a":["将加热面浸入液体中，由壁面加热液体、没有强制对流时发生的沸腾现象。气泡在加热表面的汽化核心处生成、长大并脱离，气泡让位时周围液体冲刷壁面，使贴壁液层受到剧烈扰动。"],"exp":"关键词是加热面浸入液体且无强制流动，以便与管内强制流动沸腾区分。沸腾时气泡的生成和脱离强烈扰动贴壁液层，所以对流传热系数远高于无相变时；工业上一般让沸腾维持在核状沸腾区。","ev":"液体沸腾有两种情况，一种是流体在管内流动过程中受热沸腾，称为管内沸腾，另一种是将加热面浸入液体中，液体被壁面加热而引起的无强制对流的沸腾现象，称为大容积沸腾(pool boiling)。","keys":[],"ref":"第 140 页","hint":"","score":2},{"i":32,"n":33,"ch":"第3章 传热","sec":"3.4 传热计算","code":"3.4","id":"ch03-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"控制热阻","o":[],"a":["在串联的总热阻中，数值远大于其他各项的那一项热阻。此时总热阻近似等于该热阻，总传热系数也近似等于与之对应的传热系数，强化传热应首先设法减小控制热阻。"],"exp":"串联热阻中最大的那一项起决定作用，就像串联电路里最大的电阻限制电流。若污垢热阻是控制热阻，提高流速收效不大，应先清洗或阻垢；若是某一侧的对流传热热阻，则应强化该侧。","ev":"在这些热阻中，如果某项的值远大于其他项，则总热阻值就近似等于该项热阻值，总传热系数也接近于与该热阻对应的传热系数，称该项热阻为控制热阻。","keys":[],"ref":"第 145 页","hint":"","score":2},{"i":33,"n":34,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"黑体","o":[],"a":["吸收率等于1的理想化物体，即能将到达其表面的辐射能全部吸收，此时反射率和透过率均为零。实际物体只能不同程度地接近黑体，引入黑体概念是为了理论研究和比较，黑体的辐射能力服从绝对温度的四次方定律。"],"exp":"定义要抓住吸收率为1、反射率和透过率为零，并指出黑体是理想化物体。实际物体用黑度表示接近黑体的程度，黑度恒小于1；黑体又是定义黑度和比较辐射能力的基准。","ev":"这种物体称 为绝对黑体或黑体(black body)，即黑体能将到达其表面的辐射能全部吸收。","keys":[],"ref":"第 155 页","hint":"","score":2},{"i":34,"n":35,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"克希霍夫定律","o":[],"a":["灰体在一定温度下的辐射能力与吸收率之比恒等于同温度下黑体的辐射能力；其另一表达形式是同一灰体的吸收率与黑度在数值上相等，说明物体的辐射能力越大，吸收能力也越大。"],"exp":"定律把辐射能力和吸收能力联系起来：善于辐射的物体也善于吸收。它只对灰体成立，即假定吸收率不随波长变化；由此得到黑度等于吸收率，为实际物体之间的辐射传热计算提供了依据。","ev":"式(3-102)是克希霍夫定律的另一表达形式，即同一灰体的吸收率与其黑度在数值上相等。","keys":[],"ref":"第 157 页","hint":"","score":2},{"i":35,"n":36,"ch":"第3章 传热","sec":"3.5 热辐射","code":"3.5","id":"ch03-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"灰体","o":[],"a":["假定对各种波长的辐射能具有相同吸收率的理想物体。实际物体在工业常见的波长范围内吸收率随波长变化不大，引入灰体概念后可避开吸收率难以确定的困难，使实际物体的辐射传热计算成为可能。"],"exp":"关键词是吸收率不随波长变化，而不是颜色为灰色。灰体的辐射能力同样可用黑度表征，由克希霍夫定律可得其吸收率与黑度在数值上相等，这是两固体间辐射传热计算的基础。","ev":"把实际 物体设定是对各种波长的辐射能具有相同吸收率的理想物体，称之为灰体(gray body)。","keys":[],"ref":"第 157 页","hint":"","score":2},{"i":36,"n":37,"ch":"第3章 传热","sec":"3.6 换热器","code":"3.6","id":"ch03-term-011","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"热管","o":[],"a":["一种抽去不凝性气体、内壁覆有毛细结构芯网并装有可凝液体的密闭金属管。热端液体吸热汽化，蒸气流向冷端冷凝放热，冷凝液再靠毛细管力回流，热量通过沸腾与冷凝的循环由热端传至冷端。"],"exp":"定义要说明密闭管、芯网和载热介质三个要素，以及沸腾-冷凝的循环机理。由于两端传热系数都很大，热管表观热导率极高，特别适合气-气换热和回收锅炉排烟废热。","ev":"热管是一种新型的换热元件，如图 3-49 所示。它是一根抽去不凝性气体的密闭金属管， 管子的内表面蓝盖一层由毛细结构材料做成的芯网，其中间是空的。","keys":[],"ref":"第 166 页","hint":"","score":2},{"i":37,"n":38,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-term-012","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"夹点技术","o":[],"a":["目前换热网络优化技术的代表，以热力学理论为基础，从宏观角度分析过程系统中能量流沿温度的分布，找出系统用能的瓶颈并给出解决方法。它从最大能量回收率出发建立初始网络，再协调设备费用与能量费用进行修正，最终得到最佳换热网络结构。"],"exp":"要点是能量流沿温度分布、找瓶颈、协调设备费与能量费。它把最大能量回收与夹点温度通过最小温差联系起来，是换热网络优化在理论和工程应用上取得突破的代表方法。","ev":"夹点技术是目前换热网络优化技术的代表，它以热力学理论为基础，从宏观的角度分析 过程系统中能量流沿温度的分布，从中发现系统用能的“瓶颈”","keys":[],"ref":"第 173 页","hint":"","score":2},{"i":38,"n":39,"ch":"第3章 传热","sec":"3.7 强化与优化","code":"3.7","id":"ch03-term-013","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"换热网络","o":[],"a":["工业生产中若干台换热器把多个需要加热或冷却的工艺物流联系起来所组成的系统。其任务是把需要加热的物流加热到指定温度，同时把需要冷却的物流冷却到要求温度，设计时要确定物流与换热器的排布以及各台换热器的传热面积。"],"exp":"定义强调它不是单台换热器，而是由多股物流和多台设备构成的整体。优化的目标是在尽可能少的设备投资和公用工程消耗下充分利用工艺物流自身的能量，夹点技术就是其代表方法。","ev":"工业生产中换热顺并非孤立存在，往往是若干台换热天被香干 个需要加热或冷却的物流联系起来， 组成了一个换热网络。","keys":[],"ref":"第 173 页","hint":"","score":2},{"i":39,"n":40,"ch":"第4章 蒸发","sec":"4.1 概述","code":"4.1","id":"ch04-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"蒸发","o":[],"a":["采用加热方法将含有不挥发性溶质的溶液在沸腾状态下浓缩的单元操作称为蒸发。蒸发过程中只有部分溶剂汽化并移出，溶质留在溶液中，因此它是挥发性溶剂与不挥发性溶质的分离过程；其速率取决于传热速率，蒸发设备属于传热设备。"],"exp":"定义要落到“加热、沸腾、浓缩、溶质不挥发”几个要点，并说明蒸发属于传热过程、设备为传热设备。蒸发与蒸馏不同，蒸馏分离的是挥发性不同的组分，而蒸发只汽化部分溶剂、溶质不汽化。","ev":"工程上把采用加热方法将含有不挥发性溶质(通常为固体)的溶液在沸腾状态下使其浓缩的单元操作称为蒸发(Evaporation) 。","keys":[],"ref":"第 181 页","hint":"","score":2},{"i":40,"n":41,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"沸点升高","o":[],"a":["在一定压强下，水溶液的沸点比纯水高，两者之差称为溶液的沸点升高。它是由溶质存在使溶液蒸气压低于纯水引起的，主要影响因素是溶液的性质和浓度：一般有机物溶液较小，无机物溶液较大；稀溶液不大，但随浓度增高而显著增大。"],"exp":"要说明比较前提是同一压强，并指出差值方向是溶液沸点高于纯水。原因在于溶质使溶液蒸气压下降，沸点因而上升；影响因素是溶质性质和浓度，浓度越高沸点升高越大，计算有效温度差时必须计入。","ev":"一定压强下水溶液的沸点比纯水高，它们的差值称为溶液的沸点升高(boiling point rise) ，以 4A 表示。","keys":[],"ref":"第 183 页","hint":"","score":2},{"i":41,"n":42,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液柱静压头引起的温度差损失","o":[],"a":["蒸发操作需维持一定液位，液面下的压力高于分离室压力，使液面下溶液的沸点高于液面上的沸点，二者之差称为液柱静压头引起的温度差损失。液层越深、溶液密度越大，该损失越大，计算有效温度差时应予扣除。"],"exp":"要讲清损失的来源：液柱静压使液面下压力升高，沸点随之升高，而蒸发器传热计算以液面或平均压力为基准，两者沸点之差即为该项损失。它与溶液浓度引起的沸点升高、管路阻力引起的损失共同构成总温度差损失。","ev":"通常，蒸发需操作需维持一定液位,这样液面下的压力比液面上的压力(分离室中的压力)高，即液面下的沸点比液面上的高，二者之差称为液柱静压头引起的温度差损失","keys":[],"ref":"第 184 页","hint":"","score":2},{"i":42,"n":43,"ch":"第4章 蒸发","sec":"4.2 单效与多效计算","code":"4.2","id":"ch04-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"蒸发强度","o":[],"a":["蒸发器的生产强度简称蒸发强度，是指单位时间单位传热面积上所蒸发的水量，单位为kg/(m²·h)。它把蒸发量与传热面积联系起来，能够反映蒸发器的优劣，蒸发强度越大，设备的传热效能越高。"],"exp":"定义的核心是“单位时间、单位传热面积、蒸发水量”三个限定，缺一不可。生产强度与生产能力的区别在于后者只讲单位时间蒸发水量、不考虑设备大小，因此比较设备优劣要用生产强度。","ev":"蒸发器的生产强度简称蒸发强度(Intensity of evaporation) ，是指单位时间单位传热面积上所蒸发的水量","keys":[],"ref":"第 186 页","hint":"","score":2},{"i":43,"n":44,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"冷凝器","o":[],"a":["蒸发装置中用来冷凝二次蒸汽的附属设备，有间壁式和直接接触式两种。二次蒸汽需要回收或会严重污染水源时采用间壁式，否则通常采用直接接触式；直接接触式一般在负压下操作，需设置足够高度并靠大气腿液封排液。"],"exp":"定义要说明作用与两种型式，以及选型依据。直接接触式冷凝器在负压下操作，排水依靠大气腿的液封和足够的安装高度，这部分常与真空装置的作用一起考查。","ev":"冷凝器的作用是冷凝二次蒸汽。冷凝器有间壁式和直接接触式两种","keys":[],"ref":"第 198 页","hint":"","score":2},{"i":44,"n":45,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"大气腿","o":[],"a":["在负压操作的混合冷凝器中，为使冷凝后的水能顺利排出，冷凝器必须设置得足够高，其底部的长管称为大气腿。大气腿起液封作用，管内液柱的静压与系统真空相平衡，使水靠重力排出而外界空气不会漏入系统。"],"exp":"要说明大气腿是冷凝器底部的长管，作用是液封和排液。其原理是液柱静压平衡系统内外压差，因此安装高度必须足够；若高度不够，水排不出或空气漏入，真空度将遭到破坏。","ev":"冷凝器底部的长管称为大气腿，并有液封。","keys":[],"ref":"第 199 页","hint":"","score":2},{"i":45,"n":46,"ch":"第4章 蒸发","sec":"4.4 蒸发器与附属设备","code":"4.4","id":"ch04-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"真空装置","o":[],"a":["蒸发系统在负压下操作时安装在冷凝器之后的设备，用于抽除系统泄漏的空气、物料和冷却水中溶解的不凝性气体以及冷却水饱和温度下的水蒸气，以维持操作真空度。常用型式有喷射泵、水环式真空泵和往复式或旋转式真空泵等。"],"exp":"要点是安装在冷凝器之后、抽除的是不凝性气体而不是水蒸气主体。系统的负压主要由二次蒸汽冷凝形成，真空装置只是维持真空度，把负压来源说成真空泵抽气是常见错误。","ev":"当攻发句在负压下操作时，无论采用哪一种冷凝器， 均需在冷凝器后安装真空装置 。","keys":[],"ref":"第 199 页","hint":"","score":2},{"i":46,"n":47,"ch":"第5章 气体吸收","sec":"5.1 概述与吸收剂","code":"5.1","id":"ch05-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"物理吸收","o":[],"a":["在吸收过程中溶质与溶剂不发生明显化学反应，主要因溶解度差异而实现分离的吸收操作称为物理吸收。物理吸收中溶质与溶剂的结合力较弱，因此解吸比较容易，吸收剂再生方便。"],"exp":"定义要抓住两点：溶质与溶剂不发生明显化学反应，分离依靠溶解度差异。水吸收二氧化碳、洗油吸收苯等都属于物理吸收。由于结合力弱，物理吸收的解吸比化学吸收容易；化学吸收则依靠可逆反应提高吸收能力，两者不能混淆。","ev":"在吸收过程中溶质与溶剂不发生明显化学反应，主要因洲解度的差异而实现分离的吸收操作称为物理吸收(physical absorption) 。","keys":[],"ref":"第 208 页","hint":"","score":2},{"i":47,"n":48,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"溶解度","o":[],"a":["在一定温度和压力下，使吸收剂与混合气体充分接触，气液两相达到平衡时，溶质在液相中的浓度不再增加，这一饱和浓度称为溶解度。与溶解度对应的气相中溶质分压称为平衡分压。"],"exp":"定义要强调三个条件：一定温度和压力、两相达到平衡、液相中溶质浓度不再增加。溶解度是平衡状态下的饱和浓度，气相一侧对应的是平衡分压，两者由相平衡关系联系起来。溶解度随温度、压力及溶质和溶剂性质而变，不是任意浓度。","ev":"在一定压力和温度下，使一定量的吸收剂与混合气体充分接触，气相中的溶质便向液相溶剂中转移，经长期充分接触之后，液相中溶质组分的浓度不再增加，此时，气液两相达到平衡，此状态为平衡状态，深质在液相中的浓度为饱和浓度(简称溶解度)","keys":[],"ref":"第 209 页","hint":"","score":2},{"i":48,"n":49,"ch":"第5章 气体吸收","sec":"5.2 相平衡与亨利定律","code":"5.2","id":"ch05-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"亨利定律","o":[],"a":["在一定温度下，当总压不太高、溶液为稀溶液时，气相中溶质的平衡分压与溶质在液相中的摩尔分数成正比，比例系数称为亨利系数，即p*=Ex。亨利系数由实验测定，随温度、溶质和溶剂的性质而变化；温度升高时亨利系数一般增大，气体溶解度减小。亨利定律还有以气相摩尔分数、液相摩尔浓度等表示的其他形式。"],"exp":"表述时要交代适用条件：温度一定、总压不太高、稀溶液；核心是平衡分压与液相摩尔分数成正比，比例系数为亨利系数。亨利系数不是常数，随温度和物系而变，温度升高溶解度下降。亨利定律是吸收相平衡计算的基础，也是判断传质方向和推动力的依据。","ev":"此情况下，稀溶液上方气相中溶质的平衡分压与溶质在液相中的摩尔分数成正比，其比例系数为亨利系数。","keys":[],"ref":"第 211 页","hint":"","score":2},{"i":49,"n":50,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-term-002","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"分子扩散","o":[],"a":["在静止或层流流体内部，若某一组分存在浓度梯度，则由于分子无规则的热运动，该组分由浓度较高处传递至浓度较低处，这种现象称为分子扩散。分子扩散是分子微观运动的结果，其推动力是浓度梯度，扩散进行的快慢用扩散通量衡量。"],"exp":"定义要抓住静止或层流、浓度梯度推动、分子无规则热运动三个要点，并说明它是分子微观运动的结果。分子扩散不同于对流传质，后者靠流体质点宏观运动传递组分；工业上分子扩散还可分为等摩尔反向扩散和单向扩散两种形式。","ev":"在静止或层流流体内部，若某一组分存在浓度梯度，则因分子无规则的热运动使该组分由浓度较高处传递至浓度较低处，这种现象称为分子扩散。","keys":[],"ref":"第 216 页","hint":"","score":2},{"i":50,"n":51,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-term-009","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"扩散通量","o":[],"a":["单位时间内通过垂直于扩散方向的单位截面积扩散的物质量称为扩散通量，又称扩散速率，常用符号J表示，单位为kmol·m⁻²·s⁻¹。扩散通量用来衡量分子扩散进行的快慢。"],"exp":"定义要抓住单位时间、单位截面积、物质量三个要素，方向垂直于扩散方向。扩散通量是衡量扩散快慢的物理量，与扩散系数和浓度梯度有关；它不同于传质速率，传质速率还包括总体流动的贡献。","ev":"单位时间内通过垂直于扩散方向的单位截面积扩散的物质量称为扩散通量，又称扩散速率(rate of diffusion)","keys":[],"ref":"第 216 页","hint":"","score":2},{"i":51,"n":52,"ch":"第5章 气体吸收","sec":"5.3 分子扩散与对流传质","code":"5.3","id":"ch05-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"涡流扩散","o":[],"a":["在湍流流体中，由于质点的无规则运动和各方向脉动，造成质点间相互碰撞和混合，溶质在有浓度梯度时会从高浓度向低浓度方向传递，这种现象称为涡流扩散。涡流扩散依靠流体质点的宏观运动，其速率通常借用菲克定律的形式表示。"],"exp":"定义要强调湍流质点的无规则脉动与混合，以及浓度梯度下由高浓度向低浓度的传递。涡流扩散与分子扩散的机理不同，前者靠质点宏观运动，后者靠分子热运动；涡流扩散系数不是物性常数，难以准确测定。","ev":"有浓度梯度的情况下会从高浓度向低浓度方向传递，这种现象称为涡流扩散。","keys":[],"ref":"第 224 页","hint":"","score":2},{"i":52,"n":53,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-003","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"最小液-气比","o":[],"a":["最小液-气比是针对一定的分离任务、操作条件和吸收物系，当塔内某截面吸收推动力为零、达到规定分离程度所需塔高为无穷大时的液-气比。它是吸收操作液-气比的下限，实际操作的液-气比应大于该值，通常取最小液-气比的1.1至2.0倍。"],"exp":"定义要强调三个限定：一定分离任务和操作条件、某截面推动力为零、所需塔高无穷大。最小液-气比是理论下限，此时操作线与平衡线相交，不能真正实现分离；实际液-气比需大于它，但也不宜过大，否则吸收剂再生费用剧增。","ev":"由此可见，最小液-气比是针对一定的分离任务、操作条件和吸收物系，当塔内某截面吸收推动力为零时，达到分离程度所需塔高为无穷大时的液-气比。","keys":[],"ref":"第 232 页","hint":"","score":2},{"i":53,"n":54,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-012","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"体积传质系数","o":[],"a":["体积传质系数是传质系数与单位体积填料层内有效相际传质面积的乘积，如气相总体积传质系数Kya。其物理意义为单位推动力下、单位时间、单位体积填料层内吸收的溶质量，单位常用kmol·m⁻³·s⁻¹。"],"exp":"定义要说明它是传质系数与单位体积有效传质面积a的乘积，所以把难测的a并入系数中。物理意义可从速率方程看出：单位推动力、单位时间、单位体积填料层吸收的溶质量。它随填料类型、润湿情况和流体流量而变，是计算填料层高度的重要参数。","ev":"从中可以看出，体积传质系数的物理意义为: 在单位推动力下，单位时间，单位体积填料层内吸收的溶质量。","keys":[],"ref":"第 235 页","hint":"","score":2},{"i":54,"n":55,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"传质单元高度","o":[],"a":["传质单元高度的物理意义是完成一个传质单元分离效果所需的填料层高度，常用符号H表示，单位为m。填料层高度等于传质单元高度与传质单元数的乘积；传质单元高度越小，吸收设备的传质效能越高，完成一定分离任务所需的填料层越低。"],"exp":"要讲清它对应传质单元数等于1时的填料层高度，即完成一个传质单元分离效果所需的高度。它由传质系数和填料润湿情况决定，反映设备传质效能：高度越小效能越高。填料层高度按传质单元高度乘以传质单元数计算，两者概念不能混淆。","ev":"故传质单元高度的物理意义为完成一个传质单元分离效果所需的填料层高度。","keys":[],"ref":"第 236 页","hint":"","score":2},{"i":55,"n":56,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-011","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"吸收因数","o":[],"a":["吸收因数是吸收操作线斜率与平衡线斜率之比，常用符号A表示，其倒数为解吸因数S。吸收因数越大，操作线离平衡线越远，吸收推动力越大，完成一定分离任务所需的传质单元数越少。"],"exp":"定义要抓住它是操作线斜率与平衡线斜率之比，而不是两线夹角。吸收因数与解吸因数互为倒数：A大意味着液-气比大或平衡线斜率小，推动力大、传质单元数小；但A过大意味着吸收剂用量和再生负荷增加，因此要兼顾经济性。","ev":"吸收因数的意义为吸收操作线的斜率与平衡线斜率的比。","keys":[],"ref":"第 237 页","hint":"","score":2},{"i":56,"n":57,"ch":"第5章 气体吸收","sec":"5.5 吸收塔计算","code":"5.5","id":"ch05-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"解吸","o":[],"a":["解吸又称脱吸，是吸收的逆过程，即气体溶质从液相向气相转移的过程。其做法是将离开吸收塔的吸收液送入解吸塔，与惰性气体或蒸汽逆流接触，使溶质从溶液中释放出来，吸收剂得到再生后循环使用；解吸的必要条件是气相溶质分压低于液相平衡分压。"],"exp":"定义要指出解吸与吸收方向相反，是溶质由液相向气相转移。其目的：一是获得较纯的气体溶质，二是使吸收剂再生循环使用，因此吸收与解吸联合才构成完整的气体分离流程。解吸的必要条件与吸收相反，推动力为液相平衡分压与实际分压之差。","ev":"解吸过程是吸收的逆过程，是气体溶质从液相向气相转移的过程","keys":[],"ref":"第 244 页","hint":"","score":2},{"i":57,"n":58,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-term-013","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"持液量","o":[],"a":["填料层的持液量是指单位体积填料所持有的液体体积，常用m³液体·m⁻³填料表示。持液量由静持液量和动持液量两部分组成：静持液量是气液两相停止进料后靠毛细作用留在填料表面的液体量，动持液量是停止进料后经足够长时间排出的液体量。"],"exp":"定义要强调以单位体积填料为基准，而不是整个塔内的液体总量。静持液量靠毛细作用滞留，动持液量是流动部分。持液量太大使气体流通截面减小、压降增加、生产能力下降；持液量太小则操作不稳定，因此设计时要兼顾传质面积与操作稳定性。","ev":"通常把单位体积填料所持有的液体体积称为填料层的持液量，以 ms液体/ms3填料表示。","keys":[],"ref":"第 251 页","hint":"","score":2},{"i":58,"n":59,"ch":"第5章 气体吸收","sec":"5.6 填料塔","code":"5.6","id":"ch05-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液泛","o":[],"a":["在填料塔中，当气速增大超过某一极限值时，喷淋的液体向下流动严重受阻，液体不能顺利流下而在填料层内积聚，并扩展到整个填料层空间，这种现象称为液泛。发生液泛时的气速称为泛点气速，它是填料塔操作的极限气速。"],"exp":"要说明液泛是气速过大使液体不能顺利下流、在填料层内积聚并扩展到全塔的现象，其对应气速为泛点气速。液泛后塔的正常操作被破坏，因此操作气速必须低于泛点气速，通常取泛点气速的0.6至0.8倍，正常范围在载点与泛点之间。","ev":"若继续加大气体流速，超过某一极限值，喷淋的液体向下流动严重受阻，使得液体不能顺利向下流动，液体积聚，并扩展到整个填料层空间，此现象为液泛。","keys":[],"ref":"第 252 页","hint":"","score":2},{"i":59,"n":60,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"拉乌尔定律","o":[],"a":["一定温度下，理想溶液中任一组分的平衡分压等于该组分纯态在同温度下的饱和蒸气压与其在液相中摩尔分数的乘积，即 pA 等于 pA* 乘 xA。它描述理想溶液的汽液平衡关系，是导出泡点方程和露点方程的基础。"],"exp":"关键词是「理想溶液」「饱和蒸气压」「摩尔分数之积」。定律给出的是分压而不是总压，纯组分饱和蒸气压只随温度变化；对非理想溶液要加活度系数修正，不能直接套用。","ev":"拉乌尔定律指出，在一定温度下,气相中任一组分的平衡分压等于此组分为纯态时在该温度下的饱和蒸气压与其在溶液中的摩尔分数(mol ratio)之积。","keys":[],"ref":"第 265 页","hint":"","score":2},{"i":60,"n":61,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"泡点","o":[],"a":["一定总压下，液体混合物被加热到刚刚产生第一个气泡时的温度，称为该液体在此压力下的泡点。它也是该组成的混合蒸气全部冷凝成液体时的温度，可由泡点方程确定，随总压和液相组成而改变。"],"exp":"关键词是「出现第一个气泡」和「一定压力」。泡点描述液相开始汽化，露点描述蒸气开始冷凝出现第一滴液滴，两者不能互换；对纯组分两者相等，对混合液一般不相等，泡点高于露点。","ev":"它表示在一定压力下，液体混合物被加热产生第一个气泡时的温度 ，称为液体在此压力下的泡点温度(简称泡点)。","keys":[],"ref":"第 265 页","hint":"","score":2},{"i":61,"n":62,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"相对挥发度","o":[],"a":["溶液中两组分挥发度之比，通常以易挥发组分为分子，符号为 α。它也可写成气相中两组分浓度比与液相中两组分浓度比之比，对理想溶液等于同温度下两纯组分饱和蒸气压之比。α 越大越易用精馏分离，α 等于 1 时普通精馏无法分离。"],"exp":"定义里要体现「挥发度之比」，并说明它是衡量分离难易的标志。理想溶液可用饱和蒸气压之比计算；α 随温度变化不大时可取全塔平均相对挥发度，把平衡关系简化为只含一个参数。","ev":"溶液中两组分挥发度之比称为相对挥发度(relative volatility)","keys":[],"ref":"第 268 页","hint":"","score":2},{"i":62,"n":63,"ch":"第6章 蒸馏","sec":"6.1-6.2 概述与汽液平衡","code":"6.1","id":"ch06-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"挥发度","o":[],"a":["表示物质挥发难易程度的量。对混合液中的组分，定义为气相中该组分的蒸气分压与和它平衡的液相中该组分摩尔分数之比；对理想溶液，其数值等于同温度下该纯组分的饱和蒸气压。两组分挥发度之比即相对挥发度。"],"exp":"定义必须写成「分压与液相摩尔分数之比」，只把挥发度说成饱和蒸气压仅是理想溶液的特例。挥发度越大越易进入气相，但它只反映单个组分；比较两组分分离难易要用相对挥发度。","ev":"把挥发度定义为气相中某一组分的蒸气分压和与之平衡的液相中的该组分摩尔分数之比","keys":[],"ref":"第 268 页","hint":"","score":2},{"i":63,"n":64,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-term-003","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"理论板","o":[],"a":["人为假定的理想化塔板：不论进入该板的气液两相组成如何，离开该板时两相在传热和传质两方面都达到平衡，即离开塔板的气相与液相组成平衡、温度相等。理论板并不实际存在，但可作为衡量实际塔板分离效果的标准，设计时先求理论板数再按板效率折算实际板数。"],"exp":"要强调「离开时达到平衡」和「人为假定」。理论板不是实际安装的塔板，实际板因接触时间有限和非理想流动达不到平衡，所以同样分离任务下实际板数多于理论板数。","ev":"理论板(theoretical plate)是指离开塔板的蒸气和液体呈平衡的塔板。","keys":[],"ref":"第 276 页","hint":"","score":2},{"i":64,"n":65,"ch":"第6章 蒸馏","sec":"6.3-6.4 简单蒸馏与精馏原理","code":"6.3","id":"ch06-term-009","t":"term","mode":"explain","bloom":"理解","diff":"easy","q":"回流比","o":[],"a":["精馏段内下降液体的摩尔流量 L 与塔顶产品流量 D 之比，记为 R，即 R 等于 L 除以 D。它决定精馏段操作线的斜率 R/(R+1) 和液气比，回流比越大，所需理论板数越少，但冷凝器与再沸器负荷越大。"],"exp":"要点是「下降液量与塔顶产品量之比」，不能写成回流液与进料之比。回流比通过物料衡算影响操作线位置：R 增大操作线远离平衡线，板数减少而费用增加；全回流是上限，最小回流比是下限。","ev":"式(6-21b)右边两项的分子、分母同除以D，并令民=L/D，R 称为回流比(reflux ratio ) ，于是上式可写成","keys":[],"ref":"第 278 页","hint":"","score":2},{"i":65,"n":66,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-term-012","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"加料线（q 线）方程","o":[],"a":["精馏段操作线与提馏段操作线交点（q 点）的轨迹方程，又称进料方程。它是一条过对角线上 (xF，xF) 点、斜率为 q/(q−1) 的直线；进料热状态一定时 q 为定值，q 线就确定，用来求两操作线的交点，从而作出提馏段操作线。"],"exp":"要写清「两操作线交点的轨迹」和「过 (xF，xF)、斜率 q/(q−1)」。不同进料热状态下 q 线方位不同：冷液 q 大于 1 斜率为正，饱和液体 q 等于 1 为垂线，气液混合 0 到 1 之间斜率为负，饱和蒸气 q 等于 0 为水平线。常见错误是把 q 线当成平衡线或操作线本身。","ev":"式(6-30)称为9 线方程或进料方程。在进料热状态一定时，9 即为定值，因此式(6-30)为一直线方程。当Z=zrf 时，由式(6-30)得>一zr，则dv 线在zy 图上是过对角线上e(Czr， xzr)点，以g/(do一1)为斜率的直线。","keys":[],"ref":"第 282 页","hint":"","score":2},{"i":66,"n":67,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"全回流","o":[],"a":["塔顶上升蒸气冷凝后全部引回塔顶、塔顶和塔底都不采出产品的操作状态，此时回流比趋于无穷大，进料量也为零。全塔无精馏段与提馏段之分，两条操作线合二为一并与对角线重合，所需理论板数最少，但因没有产品，正常生产中没有实际意义，只用于开工、调试和实验研究。"],"exp":"要写清「冷凝液全部回流」「无产品」「操作线与对角线重合」三点。全回流的回流比最大而不是最小，所需理论板数最少而不是最多，这两处最容易与最小回流比混淆。","ev":"全回流时塔顶产量 D=0，塔底产量 下=0。为了维持物料平衡，不需加料，即 下=0，如图 6-35 所 示。","keys":[],"ref":"第 291 页","hint":"","score":2},{"i":67,"n":68,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"最小回流比","o":[],"a":["在指定进料组成、分离要求和进料热状况下，使两操作线交点恰好落在平衡线上的回流比，记为 Rmin。此时交点附近各板气液组成不再变化，形成恒浓区，达到规定分离所需理论板数为无穷多，因此最小回流比是回流比的下限。"],"exp":"要点是「操作线交点落在平衡线上」「理论板数无穷多」「回流比下限」。最小回流比只对一定的分离要求才有意义，分离要求改变它也随之改变；实际回流比通常取它的 1.1 到 2.0 倍。","ev":"当回流比减到某一数值时，两操作线交点& 点恰好落在平衡线上，相应的回流比称为最小回流比(minimum reflux ratio) ，以Ruan表示。","keys":[],"ref":"第 293 页","hint":"","score":2},{"i":68,"n":69,"ch":"第6章 蒸馏","sec":"6.5 精馏计算","code":"6.5","id":"ch06-term-011","t":"term","mode":"explain","bloom":"理解","diff":"hard","q":"恒浓区","o":[],"a":["在最小回流比条件下操作时，进料板上下附近各板上气液两相的组成不再变化，塔板失去增浓作用，这一区域称为恒浓区，又称挟紧区；操作线与平衡线的交点称为挟紧点。恒浓区出现说明达到规定分离需要无穷多块理论板，因此对应的回流比是最小回流比。"],"exp":"关键词是「组成不再变化」「塔板无增浓作用」。恒浓区只出现在最小回流比附近，正常操作的回流比大于最小回流比时不存在恒浓区；把恒浓区说成正常操作中必然出现的区域是常见错误。","ev":"所以此区称为恒浓区，或称挟紧区，v 点称为挟紧点(pinch point) 。","keys":[],"ref":"第 293 页","hint":"","score":2},{"i":69,"n":70,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"恒沸精馏","o":[],"a":["又称共沸精馏，指向双组分混合液中加入第三组分作为挟带剂，挟带剂与原溶液中一个或多个组分形成新的恒沸物，且新恒沸物沸点比原组分或原恒沸物低得多，从而把分离任务转化为新恒沸物与纯组分的分离。例如在乙醇水溶液中加苯制取无水乙醇。"],"exp":"关键词是「挟带剂」「形成新恒沸物」「沸点更低」。它与萃取精馏不同：萃取精馏加入的萃取剂不形成恒沸物，且沸点比原料组分高得多，靠降低某组分蒸气压来提高相对挥发度。","ev":"恒沸精馏(azeotropic rectification) 又称共沸精馏，其特点是在双组分混合液中加入第三组分(称为挟带剂)，该组分能与原溶液中一个或多个组分形成新的恒沸物","keys":[],"ref":"第 305 页","hint":"","score":2},{"i":70,"n":71,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-term-013","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液沫夹带","o":[],"a":["与液相主体流动方向相反的返混现象，又称雾沫夹带。气体穿过板上液层时产生大量液滴，小液滴因沉降速率小于气流速率而被夹带到上层塔板，部分大液滴也会因板间距不足被气流带上去。液沫夹带使传质推动力下降、塔板效率降低，严重时还会引发液泛。"],"exp":"定义要强调「与液相主体流动方向相反的返混」。它和气泡夹带方向相反：液沫夹带是气体把液体往上带，气泡夹带是液体把气泡往下卷。两者都降低板效率，但成因不同，不能混为一谈。","ev":"与液相主体流动方向相反的返混称为液沫夹带(entrainment)(又称雾沫夹带)。","keys":[],"ref":"第 309 页","hint":"","score":2},{"i":71,"n":72,"ch":"第6章 蒸馏","sec":"6.7-6.8 特殊精馏与板式塔","code":"6.7","id":"ch06-term-005","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"液泛","o":[],"a":["塔内液体下降受阻、逐板积累直至充满两板间整个空间，使塔无法正常操作的现象，又称淹塔。多由液量或气量过大引起：液量过大使降液管阻力增大，气速过大使板压降增大或液沫夹带增多，两者都会抬高降液管液位。液泛时压降急剧增大、效率急剧下降。"],"exp":"定义要写清「液体下降受阻、板上积累、充满板间空间」。液泛分降液管液泛和液沫夹带液泛两类，前者可由液量过大或气速过大引起；严重漏液则是气速过小造成的另一种不正常操作，方向相反。","ev":"在操作过程中，塔内液体下降受阻并逐渐在塔板上积累直至充满两板间的整个空间，使塔的正常操作遭到破坏，这种现象称为液泛(floading)，又称湾塔。","keys":[],"ref":"第 310 页","hint":"","score":2},{"i":72,"n":73,"ch":"第7章 固体干燥","sec":"7.1 概述","code":"7.1","id":"ch07-term-006","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"干燥","o":[],"a":["利用热能除去固体物料中湿分的单元操作。干燥属于热能去湿，去湿彻底但能量消耗较大。化工生产中常先用机械去湿除去大量湿分，再用干燥把湿含量进一步降低到产品要求。"],"exp":"定义有三层含义：以热能为手段，对象是固体物料中的湿分，结果是除去湿分。要与机械去湿、吸附去湿区分开：机械去湿靠过滤或离心分离，吸附去湿靠干燥剂，只有供热使湿分汽化才叫干燥。干燥过程中传热与传质同时进行。","ev":"这种利用热能除去固体物料中湿分的单元操作称为干燥(drying) 。","keys":[],"ref":"第 328 页","hint":"","score":2},{"i":73,"n":74,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"湿度（湿含量）","o":[],"a":["湿空气中所含水蒸气的质量与绝干空气质量之比，又称湿含量或绝对湿度，单位是kg水/kg绝干气。它只表示空气中水汽的绝对数量，不表示空气吸湿能力的大小。"],"exp":"湿度以单位质量绝干空气所带的水汽量来定义，取绝干空气作基准是因为干燥过程中绝干空气量保持不变，便于作物料衡算。它只说明水汽的绝对量，空气还能吸收多少水分要看相对湿度，两者含义不同，不能互相代替。","ev":"湿空气的湿度(humidity)又称湿含量或绝对湿度，定义为湿空气中所含水蒸气质量与绝干空气质量之比","keys":[],"ref":"第 329 页","hint":"","score":2},{"i":74,"n":75,"ch":"第7章 固体干燥","sec":"7.2 湿空气性质与湿度图","code":"7.2","id":"ch07-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"medium","q":"湿比体积","o":[],"a":["1 kg 干空气与其所带的水汽所具有的总体积，单位为 m³·kg⁻¹ 干气。一定压力下，湿比体积随湿空气的温度和湿度而变化，是计算湿空气体积流量的基础。"],"exp":"湿比体积以 1 kg 绝干空气为基准，体积包括干空气和水汽两部分，所以随温度和湿度的增大而增大。它与湿比热容、焓一样都是按单位质量绝干空气定义的湿空气性质，便于在干燥过程中作物料和热量衡算，因为绝干空气的质量始终不变。","ev":"湿比体积(humid volume)是指 1kg 干空气与其所带的 媚kg水汽所具有的总体积","keys":[],"ref":"第 331 页","hint":"","score":2},{"i":75,"n":76,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"平衡水分","o":[],"a":["在一定空气状态下，物料与空气长期接触后含水量不再变化时物料中所含的水分，即该空气状态下物料被干燥的极限含水量。"],"exp":"平衡水分对应物料表面水汽分压与空气水汽分压相等、脱湿与吸湿速率相抵的状态。它随空气状态而变，空气越干燥平衡水分越低；物料含水量中超过平衡水分的部分才是可用干燥除去的自由水分。","ev":"只要空气的状态不变，物料中所含水分不再因与空气接触时间的延长而变化，物料中水分与空气达到平衡，此时物料中所含的水分称为此空气状态下该物料的平衡水分(equilibrium moisture)","keys":[],"ref":"第 338 页","hint":"","score":2},{"i":76,"n":77,"ch":"第7章 固体干燥","sec":"7.3 物料水分与平衡","code":"7.3","id":"ch07-term-008","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"非结合水分","o":[],"a":["存在于物料表面及大孔隙中的水分，与物料的结合较弱，其蒸气压等于同温度下纯水的饱和蒸气压，因此在干燥过程中比结合水分容易去除。"],"exp":"判别非结合水分看两点：存在位置是表面和大孔隙，蒸气压等于纯水的饱和蒸气压。因为结合力弱、蒸气压不受物料影响，干燥时传质推动力大，所以容易除去；结合水分则因蒸气压低于纯水饱和蒸气压而难以去除。这组划分只与物料性质有关。","ev":"非结合水分包括存在于物料表面的附着水分","keys":[],"ref":"第 339 页","hint":"","score":2},{"i":77,"n":78,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-term-004","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"干燥曲线","o":[],"a":["在恒定干燥条件下测得的物料含水量及物料表面温度随干燥时间变化的关系曲线。"],"exp":"干燥曲线由实验数据绘制，横轴是干燥时间，纵轴是物料含水量和表面温度。曲线斜率的变化反映预热、恒速和降速各段，恒速段含水量随时间近似直线下降，降速段逐渐平缓，据此还可进一步换算成干燥速率曲线。","ev":"用上述实验数据绘出物料含水量 X 及物料表面温度 0 与干燥时间 z 的关系曲线，如图 7-14 所示，此曲线称为干燥曲线(drying curve) 。","keys":[],"ref":"第 346 页","hint":"","score":2},{"i":78,"n":79,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"干燥速率","o":[],"a":["单位时间内单位干燥面积上汽化的水分质量，单位为kg/(m²·s)，一般由恒定干燥条件下的实验测定。"],"exp":"干燥速率以单位干燥面积为基准，便于在不同设备之间比较干燥强度。它随物料含水量而变化，由实验绘出的干燥速率曲线分为恒速段和降速段，两段的控制步骤不同，因此强化干燥的着手点也不同。","ev":"干燥速率(drying rate)是指在单位时间内单位干燥面积上汽化的水分质量","keys":[],"ref":"第 347 页","hint":"","score":2},{"i":79,"n":80,"ch":"第7章 固体干燥","sec":"7.4-7.5 干燥计算","code":"7.4","id":"ch07-term-009","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"临界含水量","o":[],"a":["恒速干燥阶段与降速干燥阶段分界点所对应的物料含水量。临界含水量越大，物料越早转入降速阶段，完成同样干燥任务所需时间越长；它随物料性质、厚度和恒速段干燥速率而变。"],"exp":"临界含水量不是平衡含水量，也不是初始含水量，而是干燥速率曲线由水平转为下降的转折点对应的含水量。越过它以后物料表面出现干区，过程转为内部迁移控制。它越大，降速段要除去的水分越多，干燥时间越长，是干燥器设计的重要参数。","ev":"两个干燥阶段之间的分界点 C 称为临界点，相应的物料含水量称为临界含水量","keys":[],"ref":"第 347 页","hint":"","score":2},{"i":80,"n":81,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-term-010","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"洞道式干燥器","o":[],"a":["由厢式干燥器发展而来的连续式干燥设备，也可以视为连续化的厢式干燥器。物料装在小车上沿长通道移动，空气连续加热并强制流过物料，适用于体积大、干燥时间长的物料。"],"exp":"洞道式干燥器保留了厢式干燥器装卸灵活的特点，又把分批操作改成小车在长通道内连续或半连续移动，因而生产能力提高。它的空气流向多采用逆流或错流，适合体积大、干燥时间长的物料；厢式干燥器则更适合小批量、多品种生产。","ev":"洞道干燥器(tunnel dryer)是厢式干燥融的自然发展结果，也可以视为连续化的厢式干燥器","keys":[],"ref":"第 353 页","hint":"","score":2},{"i":81,"n":82,"ch":"第7章 固体干燥","sec":"7.6-7.7 干燥器与强化","code":"7.6","id":"ch07-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"流化床干燥器","o":[],"a":["又称沸腾床干燥器，是利用固体流态化技术使颗粒在热气流中悬浮、翻滚并进行干燥的设备。"],"exp":"热空气自下而上穿过床层，气速超过临界流化速度后颗粒被托起，床层呈流态化。气固接触充分，传热传质快，床层温度均匀，物料停留时间可通过出料方式调节，适合处理颗粒状物料。","ev":"流化床干燥器(fluidized bed dryer)又称为沸腾床干燥器，是固体流态化技术在干燥中的应用。","keys":[],"ref":"第 355 页","hint":"","score":2},{"i":82,"n":83,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-001","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"结晶","o":[],"a":["固体物质以晶体状态从蒸气、溶液或熔融物中析出的过程，是获得纯净固态物质的一种基本单元操作，能耗较低。工业上最常见的是溶液结晶，可采用冷却、蒸发或真空等方式产生过饱和度。"],"exp":"定义要落在固体以晶体状态析出上，并点明它是获得纯净固体的单元操作；注意结晶与蒸发的区别：蒸发只是把溶剂汽化，结晶则要求溶质形成有规则晶格的固体产品，二者目的不同。","ev":"固体物质以品体状态从节气、溶液或熔融的物质中析出的过程称为结晶","keys":[],"ref":"第 364 页","hint":"","score":2},{"i":83,"n":84,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-002","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"过饱和度","o":[],"a":["一定温度下溶液实际浓度超过该温度下溶解度的部分，即溶液浓度与溶解度之差。过饱和度是晶核形成和晶体成长的推动力，达到一定限度后过饱和溶液才开始自发产生晶核。"],"exp":"关键词是浓度超过溶解度的那一部分，它是一个差值而不是浓度本身；过饱和度越大推动力越大，但超过超溶解度曲线就会爆发成核，所以工业结晶常把过饱和度控制在介稳区内。","ev":"这时的溶液浓度与溶解度之差称为过人饱和度。","keys":[],"ref":"第 365 页","hint":"","score":2},{"i":84,"n":85,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-007","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"晶核","o":[],"a":["在饱和溶液中新生成的晶体微粒，是晶体成长的前提。晶核大小通常只有几纳米至几十微米，可由初级均相成核、初级非均相成核或二次成核产生。"],"exp":"定义要落在新生成的晶体微粒上，并说明它是后续晶体长大的起点；三种成核机理要能区分：初级均相是自发成核，初级非均相靠外来固体诱导，二次成核由晶体碰撞破碎产生。","ev":"在饱和洲液中新生成的晶体微粒称为晶核Cnucleus of crystal) ，其大小通常只有几纳米至几十微米。","keys":[],"ref":"第 366 页","hint":"","score":2},{"i":85,"n":86,"ch":"第8章 其他分离技术","sec":"8.1 结晶","code":"8.1","id":"ch08-term-003","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"吸附","o":[],"a":["多孔固体与流体接触时，流体中某一组分或几个组分附着在固体表面上的现象。附着在固体表面上的组分称为吸附质，多孔固体称为吸附剂，利用这种选择性附着使混合物分离的操作称为吸附操作。"],"exp":"定义要包含三个要素：多孔固体、流体中的组分附着在固体表面、吸附具有选择性；吸附质是被吸走的目标组分，吸附剂是提供表面的固体，不要与吸收混淆，吸收是组分进入液相主体。","ev":"吸附现象是指多孔固体与流体(气体或液体)接触，流体中某一组分或多个组分附着在固体表面上。附着在固体表面上的组分称为吸附物或吸附质(Cadsorbate) ，多孔固体称为吸附剂(adsorbent) 。","keys":[],"ref":"第 368 页","hint":"","score":2},{"i":86,"n":87,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-term-004","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"吸附平衡","o":[],"a":["一定温度和压力下，吸附剂与流体长时间接触、吸附量不再增加时，吸附相与流体之间达到的平衡状态。此时的吸附量称为平衡吸附量，平衡吸附量随分压或浓度的变化曲线称为吸附等温线。"],"exp":"关键词是吸附量不再增加以及吸附相与流体达到平衡；平衡是动态的，吸附与脱附速率相等而不是停止，平衡吸附量由温度、压力和物系决定，是计算吸附剂用量和设备尺寸的基础。","ev":"当温度、压力一定时，吸附剂与流体长时间接触，吸附量不再增加，吸附相(吸附剂和已吸附的吸附质)与流体达到平衡，此时的吸附量为平衡吸附量。","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":87,"n":88,"ch":"第8章 其他分离技术","sec":"8.2 吸附","code":"8.2","id":"ch08-term-008","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"吸附容量","o":[],"a":["吸附剂吸满吸附质时的吸附量，即单位质量吸附剂所吸附吸附质的质量，反映吸附剂吸附能力的大小。吸附容量越大，处理同样物料所需的吸附剂越少。"],"exp":"关键词是吸满吸附质时的吸附量和单位质量吸附剂，它是一个容量指标而不是速率指标；吸附容量大只说明能装得多，实际吸附快慢还要看吸附速率，二者不要混淆。","ev":"吸附容量是指吸附剂吸满吸附质时的吸附量(单位质量的吸附剂所吸附吸附质的质量)，它反映了吸附剂吸附能力的大小。","keys":[],"ref":"第 371 页","hint":"","score":2},{"i":88,"n":89,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-005","t":"term","mode":"explain","bloom":"记忆","diff":"easy","q":"膜分离","o":[],"a":["以选择性透过膜为分离介质，在膜两侧一定推动力（压力差、浓度差、电位差或温度差）作用下，使原料中某组分选择性地透过膜，从而实现混合物分离、提纯或浓缩的过程。"],"exp":"定义要包含三个要素：选择性透过膜、膜两侧推动力、组分选择性透过；膜分离大多不发生相变、可在常温下操作，适合热敏物料，但浓差极化和膜污染会使通量下降，需要预处理和清洗。","ev":"膜分离(membrane separation)是以选择性透过膜为分离介质. 在膜两侧一定推动力的作用下使原料中的某组分选择性地透过膜，从而使混合物得以分离，以达到提纯、浓缩等目的的分离过程 。","keys":[],"ref":"第 379 页","hint":"","score":2},{"i":89,"n":90,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-006","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"截留率","o":[],"a":["表示膜对溶质截留程度的参数，对盐溶液又称脱盐率，定义为原料液中溶质浓度与渗透物中溶质浓度之差同原料液溶质浓度之比。截留率为 100% 表示溶质全部被截留，为 0 表示溶质全部透过、没有分离作用。"],"exp":"关键词是被膜截留的程度：算的是原料液与渗透液的浓度差占原料液浓度的比例，数值越高说明膜对溶质的阻挡越强；它常用于评价反渗透膜，与表征超滤膜孔径的截留分子量不是同一个参数。","ev":"对于反渗透过程，通常用截留率表示其分离性能。","keys":[],"ref":"第 381 页","hint":"","score":2},{"i":90,"n":91,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-009","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"截留分子量","o":[],"a":["在超滤和纳滤中用来表示膜分离性能的参数，指截留率达到 90% 时所对应的分子量。截留分子量的高低在一定程度上反映膜孔径的大小，可用一系列不同分子量的标准物质测定。"],"exp":"定义要包含适用对象超滤和纳滤以及判据截留率 90% 对应的分子量，它反映膜孔径大小而不是某个具体溶质的截留率；与反渗透常用的截留率是两个不同参数。","ev":"截留分子量(molecular weight cut-off)是指截留率为90外时所对应的分子量。","keys":[],"ref":"第 382 页","hint":"","score":2},{"i":91,"n":92,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-010","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"浓差极化","o":[],"a":["膜操作中，由于膜的选择透过性，被截留组分在膜的料液侧表面积累形成浓度边界层，其浓度远高于料液主体浓度；在浓度差作用下溶质又从膜面向主体反向扩散，这一现象称为浓差极化。"],"exp":"定义要交代成因、表现和结果：膜的选择透过性使被截留组分积累，膜面浓度高于主体并形成边界层，溶质反向扩散；浓差极化会使渗透压升高、溶剂通量下降和截留率降低，是需要设法减轻的不利因素。","ev":"由于膜的选择透过性，被截留组分在膜料液侧表面都会积累形成浓度边界层，其浓度大大高干料液的主体浓度，在膜表面与主体料液之间浓度差的作用下，将导致溶质从膜表面向主体的反向扩散，这种现象称为浓差极化","keys":[],"ref":"第 386 页","hint":"","score":2},{"i":92,"n":93,"ch":"第8章 其他分离技术","sec":"8.3 膜分离","code":"8.3","id":"ch08-term-011","t":"term","mode":"explain","bloom":"理解","diff":"medium","q":"膜污染","o":[],"a":["料液中的某些组分在膜表面或膜孔中沉积，导致膜透过速率下降的现象。表面沉积形成额外阻力，膜孔沉积使孔径减小甚至堵塞、有效膜面积减小，主要发生在超滤与微滤过程中。"],"exp":"关键词是组分在膜表面或膜孔中沉积以及透过速率下降；它与浓差极化不同，浓差极化是浓度边界层引起的可逆现象，膜污染则有实际沉积物，往往需要清洗才能恢复，二者常同时出现。","ev":"膜污染(membrane fouling)是指料液中的某些组分在膜表面或膜孔中沉积导致膜透过速率下降的现象。","keys":[],"ref":"第 386 页","hint":"","score":2}]};</script>
